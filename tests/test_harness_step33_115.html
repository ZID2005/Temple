<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 33.115 Visual Test Harness</title>
  <style>
    :root {
      --bg: #0f1117;
      --gold: #d4a017;
      --card-bg: rgba(255, 255, 255, 0.58);
      --font-body: 'Manrope', -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0b0e;
      font-family: var(--font-body);
    }

    /* ===================== STEP 33.115: RANGOLI WELCOME SCREEN ===================== */
    #rangoli-welcome {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      z-index: 10000;
      background: #5c1a12;
      overflow: hidden;
      isolation: isolate;
      margin: 0;
      padding: 0;
      opacity: 1;
      visibility: visible;
      transition: opacity 900ms cubic-bezier(.65, 0, .35, 1), visibility 0s linear 900ms;
      will-change: opacity;
      --rgp-floor: #5c1a12;
      --rgp-serif: "Gayathri", "Manjari", "Noto Serif Malayalam", "Kartika", "Nirmala UI", "Instrument Serif", "Iowan Old Style", Georgia, serif;
      --rgp-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    #rangoli-welcome.rgp-hidden,
    #rangoli-welcome[data-phase="open"] {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #rangoli-welcome.rgp-dismissed {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      background: transparent !important;
      z-index: -1 !important;
    }

    #rangoli-welcome.rgp-dismissed * {
      display: none !important;
    }

    #rangoli-welcome .rgp-gate {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      background: var(--rgp-floor);
      -webkit-font-smoothing: antialiased;
    }

    #rangoli-welcome .rgp-gate canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      max-width: none;
    }

    #rangoli-welcome .rgp-corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      font-family: var(--rgp-mono);
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      transition: opacity 600ms ease;
      pointer-events: none;
      user-select: none;
      color: rgba(255, 245, 225, 0.75);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    #rangoli-welcome .rgp-tr {
      right: clamp(18px, 3vw, 40px);
      top: clamp(18px, 3vw, 34px);
      text-align: right;
      opacity: .85;
      font-family: var(--rgp-serif);
      letter-spacing: .08em;
      font-size: 13px;
    }

    #rangoli-welcome .rgp-gate[data-phase="wind"] .rgp-corner,
    #rangoli-welcome .rgp-gate[data-phase="clear"] .rgp-corner {
      opacity: 0;
    }

    /* Centered Welcome Blessing Card - Integrated with Zero White Plate */
    #rangoli-welcome .rgp-close {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      z-index: 10;
      text-align: center;
      opacity: 0;
      transform: translateY(calc(-50% + 14px));
      pointer-events: none;
      transition: opacity 1200ms cubic-bezier(.16, 1, 0.3, 1), transform 1200ms cubic-bezier(.16, 1, 0.3, 1);
      user-select: none;
      padding: 22px 32px;
      margin: 0 auto;
      max-width: fit-content;
      background: transparent;
      box-shadow: none;
    }

    #rangoli-welcome .rgp-close.rgp-visible,
    #rangoli-welcome .rgp-gate[data-phase="hold"] .rgp-close,
    #rangoli-welcome .rgp-gate[data-phase="wind"] .rgp-close,
    #rangoli-welcome .rgp-gate[data-phase="clear"] .rgp-close {
      opacity: 1;
      transform: translateY(-50%);
    }

    #rangoli-welcome .rgp-blessing {
      display: block;
      font-family: var(--rgp-serif);
      font-size: clamp(16px, 2.4vw, 22px);
      font-weight: 600;
      letter-spacing: .08em;
      color: #38140c;
      margin-bottom: 6px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85), 0 0 12px rgba(255, 248, 235, 0.7);
    }

    #rangoli-welcome .rgp-message {
      margin: 0;
      font-family: var(--rgp-serif);
      font-weight: 700;
      font-size: clamp(36px, 6.5vw, 68px);
      line-height: 1.1;
      letter-spacing: .04em;
      color: #260c06;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9), 0 0 16px rgba(255, 248, 235, 0.75), 0 0 28px rgba(247, 207, 42, 0.35);
    }

    #rangoli-welcome .rgp-subnote {
      display: block;
      font-family: var(--rgp-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #3d140b;
      margin-top: 12px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85), 0 0 10px rgba(255, 248, 235, 0.6);
    }

    #rangoli-welcome .rgp-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      #rangoli-welcome {
        transition: opacity 300ms ease;
      }
      #rangoli-welcome .rgp-close,
      #rangoli-welcome .rgp-corner {
        transition: none !important;
        transform: translateY(-50%) !important;
      }
    }

    /* ===================== AUTH & LOGIN EXPERIENCE ===================== */
    #auth-experience {
      position: fixed;
      inset: 0;
      z-index: 9500;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0d0b0e;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-bg-mock {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 65% 20%, rgba(138, 43, 226, 0.35) 0%, rgba(13, 11, 14, 0.95) 70%),
                  radial-gradient(circle at 20% 80%, rgba(75, 0, 130, 0.25) 0%, rgba(13, 11, 14, 1) 100%);
      pointer-events: none;
    }

    .auth-foreground {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-stage {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translate3d(0, 14px, 0) scale3d(0.98, 0.98, 1);
      pointer-events: none;
    }

    .auth-stage.active {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
      pointer-events: auto;
    }

    .auth-stage .login-card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 22px;
      padding: 38px 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22),
                  0 10px 24px rgba(0, 0, 0, 0.10),
                  inset 0 1px 1px rgba(255, 255, 255, 0.85);
      text-align: center;
    }

    .login-brand h1 {
      font-size: 20px;
      color: #1a161d;
      margin: 12px 0 4px;
    }

    .login-brand p {
      font-size: 13px;
      color: #555;
      margin-bottom: 24px;
    }

    .login-form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .login-form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .login-form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }

    #login-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #8b2520;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <!-- ===================== STEP 33.115: RANGOLI WELCOME SCREEN ===================== -->
  <div id="rangoli-welcome" class="rgp-root rgp-welcome-overlay" role="region" aria-label="Welcome to Temple Accounts" tabindex="0">
    <div class="rgp-gate" data-phase="draw">
      <canvas id="rangoli-canvas" aria-hidden="true"></canvas>
      <div class="rgp-corner rgp-tr" aria-hidden="true">
        <span id="rangoli-meta">മറുതാ ചാമുണ്ഡി ദേവി ക്ഷേത്രം</span>
      </div>
      <div class="rgp-close" aria-hidden="true">
        <span class="rgp-blessing" id="rangoli-blessing">മറുതാ ചാമുണ്ഡി ദേവി ക്ഷേത്രം</span>
        <p class="rgp-message">സ്വാഗതം</p>
        <span class="rgp-subnote">TEMPLE ACCOUNTS &amp; MANAGEMENT</span>
      </div>
      <span class="rgp-sr" aria-live="polite">സ്വാഗതം</span>

  <!-- ===================== AUTH EXPERIENCE ===================== -->
  <div id="auth-experience" role="region" aria-label="Temple Accounts Authentication Experience">
    <div class="auth-bg-mock"></div>
    <div class="auth-foreground">
      <div id="login-stage" class="auth-stage" style="display:none;" aria-label="Sign In to Temple Accounts">
        <div class="login-card">
          <div class="login-brand">
            <h1>Welcome Back</h1>
            <p>Sign in to Temple Accounts</p>
          </div>
          <div class="login-form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="Enter your email" />
          </div>
          <div class="login-form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" />
          </div>
          <button id="login-btn">Sign In</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ===================== STEP 33.115: RANGOLI PRELOADER ===================== */
    const RangoliPreloader = (function () {
      const PRESET_OXIDE = {
        floor: "#5c1a12",
        rice: "#f6eedd",
        vermilion: "#e8432a",
        marigold: "#f59e1b",
        turmeric: "#f7cf2a",
        magenta: "#c8246b",
        indigo: "#2c3a92",
        leaf: "#2f8f4e"
      };
      const SLOTS = ["rice", "vermilion", "marigold", "turmeric", "magenta", "indigo", "leaf"];

      // Timing constants (~12–15s experience)
      const DURATION_MS = 5500; // ~5.5s deliberate drawing
      const HOLD_MS = 3500;     // ~3.5s serene appreciation hold
      const WIND_MS = 2200;     // ~2.2s gentle gust lifting powder
      const CLEAR_MS = 800;     // ~0.8s final powder dispersal (wind+clear: 3.0s)
      const OPEN_MS = 900;      // ~0.9s smooth destination fade

      let root = null;
      let gate = null;
      let canvas = null;
      let ctx = null;
      let closeEl = null;
      let raf = 0;
      let resizeObserver = null;
      let resizeHandler = null;
      let clickHandler = null;
      let keyHandler = null;
      let isRunning = false;
      let onReadyCallback = null;
      let rush = false;
      let localPhase = "draw";

      function rgpRandom(seed) {
        let a = (seed >>> 0) || 1;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function rgpSimulated(t) {
        const k = t < 0 ? 0 : t > 1 ? 1 : t;
        const ease = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        const stall = 0.02 * Math.sin(k * Math.PI * 4) * Math.sin(k * Math.PI);
        return Math.max(0, Math.min(100, (ease - stall) * 100));
      }

      function rgpLens(f, w) {
        return f <= 0 || f >= 1 ? 0 : w * Math.pow(Math.sin(Math.PI * f), 0.8);
      }

      function rgpSpike(f, w) {
        return f <= 0 || f >= 1 ? 0 : w * Math.pow(1 - f, 1.25) * (0.6 + 0.4 * Math.sin(Math.PI * Math.min(1, f * 2)));
      }

      function rgpSector(angle, folds) {
        const step = (Math.PI * 2) / folds;
        const a = ((angle % step) + step) % step;
        return a / step;
      }

      function rgpBuild(folds, density, seed) {
        const rand = rgpRandom(seed);
        const n = folds === 6 || folds === 12 ? folds : 8;
        const TAU = Math.PI * 2;
        const out = [];

        const along = (x, y, a) => x * Math.cos(a) + y * Math.sin(a);
        const across = (x, y, a) => -x * Math.sin(a) + y * Math.cos(a);

        const layer = (index, r0, r1, hit) => {
          const area = Math.PI * (r1 * r1 - r0 * r0);
          const tries = Math.round(area * density);
          for (let i = 0; i < tries; i++) {
            const r = Math.sqrt(r0 * r0 + rand() * (r1 * r1 - r0 * r0));
            const a = rand() * TAU;
            const x = r * Math.cos(a);
            const y = r * Math.sin(a);
            const h = hit(x, y, r, a);
            if (!h) continue;
            out.push([index + h[1], x, y, h[0], 0.82 + rand() * 0.3, 0.7 + rand() * 0.6]);
          }
        };

        const petal = (a, count, offset) => {
          const step = TAU / count;
          const k = Math.round((a - offset * step) / step);
          return k * step + offset * step;
        };

        const ring = (a, count, offset, rr, x, y) => {
          const c = petal(a, count, offset);
          return Math.hypot(x - rr * Math.cos(c), y - rr * Math.sin(c));
        };
        const clamp = (f) => Math.max(0, Math.min(0.999, f));

        layer(0, 0, 0.088, (_x, _y, r) => [r < 0.05 ? 3 : r < 0.076 ? 1 : 0, r / 0.088]);
        layer(1, 0.08, 0.205, (x, y, r, a) => {
          const c = petal(a, n, 0);
          const f = (along(x, y, c) - 0.082) / 0.12;
          const v = Math.abs(across(x, y, c));
          const hw = rgpLens(f, 0.052);
          if (v > hw) return null;
          return [hw - v < 0.01 ? 0 : 4, clamp(f)];
        });
        layer(2, 0.1, 0.285, (x, y, r, a) => {
          const c = petal(a, n, 0.5);
          const f = (along(x, y, c) - 0.105) / 0.175;
          const v = Math.abs(across(x, y, c));
          const hw = rgpLens(f, 0.07);
          if (v > hw) return null;
          return [hw - v < 0.011 ? 0 : v < hw * 0.32 && f > 0.25 && f < 0.75 ? 3 : 1, clamp(f)];
        });
        layer(3, 0.282, 0.335, (x, y, r, a) => {
          if (r > 0.286 && r < 0.294) return [0, rgpSector(a, n)];
          return ring(a, n * 2, 0.25, 0.315, x, y) < 0.012 ? [0, rgpSector(a, n)] : null;
        });
        layer(4, 0.33, 0.53, (x, y, r, a) => {
          const c = petal(a, n, 0);
          const f = (along(x, y, c) - 0.335) / 0.19;
          const v = Math.abs(across(x, y, c));
          if (f <= 0 || f >= 1) return null;
          const hw = 0.118 * Math.pow(Math.sin(Math.PI * f), 0.6) * Math.pow(1 - f, 0.35);
          if (v > hw) return null;
          const slot = hw - v < 0.011 ? 0 : v < 0.007 && f < 0.8 ? 3 : f > 0.7 ? 1 : 2;
          return [slot, clamp(f)];
        });
        layer(5, 0.335, 0.53, (x, y, r, a) => {
          const c = petal(a, n, 0.5);
          const bud = Math.hypot(x - 0.355 * Math.cos(c), y - 0.355 * Math.sin(c));
          if (bud < 0.02) return [bud < 0.008 ? 0 : 3, 0];
          const f = (along(x, y, c) - 0.37) / 0.155;
          const v = Math.abs(across(x, y, c));
          const hw = rgpLens(f, 0.05);
          if (v > hw) return null;
          return [hw - v < 0.009 || v < 0.004 ? 0 : 6, clamp(f)];
        });
        layer(6, 0.536, 0.544, (_x, _y, _r, a) => [0, rgpSector(a, n)]);
        layer(7, 0.55, 0.603, (x, y, r, a) => {
          const t = rgpSector(a, n * 6);
          const tri = 1 - Math.abs(t * 2 - 1);
          const zz = 0.556 + tri * 0.041;
          return [Math.abs(r - zz) < 0.0055 ? 0 : 5, rgpSector(a, n)];
        });
        layer(8, 0.603, 0.668, (x, y, r, a) => {
          const step = (Math.PI * 2) / (n * 2);
          const k = Math.round((a - step / 2) / step);
          const c = k * step + step / 2;
          const d = Math.hypot(x - 0.603 * Math.cos(c), y - 0.603 * Math.sin(c));
          if (d > 0.058) return null;
          const dot = Math.hypot(x - 0.636 * Math.cos(c), y - 0.636 * Math.sin(c)) < 0.009;
          return [dot || d > 0.047 ? 0 : ((k % 2) + 2) % 2 === 0 ? 6 : 4, rgpSector(a, n)];
        });
        layer(9, 0.665, 0.975, (x, y, r, a) => {
          const step = (Math.PI * 2) / n;
          const k = Math.round(a / step);
          const c = k * step;
          const f = (along(x, y, c) - 0.67) / 0.3;
          const v = Math.abs(across(x, y, c));
          const hw = rgpSpike(f, 0.088);
          if (v > hw) return null;
          const even = ((k % 2) + 2) % 2 === 0;
          const slot = hw - v < 0.011 ? 0 : v < hw * 0.3 && f < 0.82 ? (even ? 3 : 1) : even ? 1 : 3;
          return [slot, clamp(f)];
        });
        layer(10, 0.76, 0.95, (x, y, r, a) => {
          const d = ring(a, n, 0.5, 0.8, x, y);
          if (d < 0.034) return [d < 0.011 ? 3 : d > 0.027 ? 0 : 2, rgpSector(a, n)];
          return ring(a, n, 0.5, 0.905, x, y) < 0.012 ? [0, rgpSector(a, n)] : null;
        });
        layer(11, 0.99, 1.02, (x, y, r, a) => (ring(a, n * 8, 0, 1.005, x, y) < 0.0075 ? [0, rgpSector(a, n)] : null));

        out.sort((p, q) => p[0] - q[0]);
        const count = out.length;
        const xs = new Float32Array(count);
        const ys = new Float32Array(count);
        const slot = new Uint8Array(count);
        const shade = new Float32Array(count);
        const size = new Float32Array(count);
        for (let i = 0; i < count; i++) {
          const g = out[i];
          xs[i] = g[1];
          ys[i] = g[2];
          slot[i] = g[3];
          shade[i] = g[4];
          size[i] = g[5];
        }
        return { count, xs, ys, slot, shade, size };
      }

      function rgpHex(hex, fallback) {
        const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec((hex || "").trim());
        if (!m) return fallback;
        const h = m[1].length === 3 ? m[1].split("").map((c) => c + c).join("") : m[1];
        return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
      }

      function init(options) {
        onReadyCallback = options && options.onReadyToReveal ? options.onReadyToReveal : null;
        root = document.getElementById('rangoli-welcome');
        if (!root) throw new Error('Rangoli root element #rangoli-welcome not found');
        gate = root.querySelector('.rgp-gate');
        canvas = document.getElementById('rangoli-canvas');
        if (!canvas) throw new Error('Rangoli canvas #rangoli-canvas not found');
        ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('2D Canvas context unavailable');
        closeEl = root.querySelector('.rgp-close');
        if (closeEl) closeEl.classList.remove('rgp-visible');

        const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        const colors = PRESET_OXIDE;
        const folds = 8;
        const seed = 7;

        let w = 1;
        let h = 1;
        let dpr = 1;
        let unit = 1;
        let gpx = 1.6;
        let cx = 0;
        let cy = 0;
        let grains = rgpBuild(folds, 1, seed);
        let drawn = 0;
        let shown = 0;
        let holdAt = -1;
        let windAt = -1;
        let clearAt = -1;
        let started = performance.now();
        let floorTex = null;
        let powder = null;
        localPhase = "draw";

        const rgb = SLOTS.map((s) => rgpHex(colors[s], [255, 255, 255]));
        const floorRgb = rgpHex(colors.floor, [92, 26, 18]);
        const darkFloor = floorRgb[0] * 0.3 + floorRgb[1] * 0.59 + floorRgb[2] * 0.11 < 140;

        function setLocal(p) {
          localPhase = p;
          if (gate) gate.setAttribute('data-phase', p);
        }

        function layout() {
          if (!isRunning || !root || !canvas) return;
          const rect = root.getBoundingClientRect();
          w = Math.max(1, Math.round(rect.width || window.innerWidth));
          h = Math.max(1, Math.round(rect.height || window.innerHeight));
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          cx = w / 2;
          cy = h / 2;
          unit = Math.min(w, h) * 0.46;
          gpx = Math.max(1.6, Math.min(3.2, unit / 190));
          const density = Math.min(60000, ((unit * unit) / (gpx * gpx)) * 1.15);
          grains = rgpBuild(folds, density, seed);

          floorTex = document.createElement('canvas');
          floorTex.width = canvas.width;
          floorTex.height = canvas.height;
          const f = floorTex.getContext('2d');
          if (f) {
            f.setTransform(dpr, 0, 0, dpr, 0, 0);
            f.fillStyle = colors.floor;
            f.fillRect(0, 0, w, h);
            const v = f.createRadialGradient(cx, cy, unit * 0.4, cx, cy, Math.hypot(w, h) * 0.62);
            v.addColorStop(0, "rgba(255,255,255,0.05)");
            v.addColorStop(1, darkFloor ? "rgba(0,0,0,0.42)" : "rgba(60,40,20,0.16)");
            f.fillStyle = v;
            f.fillRect(0, 0, w, h);
            const rand = rgpRandom(seed + 99);
            const dotCount = Math.min(18000, (w * h) / 9);
            for (let i = 0; i < dotCount; i++) {
              f.fillStyle = rand() < 0.5 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.06)";
              f.fillRect(rand() * w, rand() * h, 1, 1);
            }
          }

          powder = document.createElement('canvas');
          powder.width = canvas.width;
          powder.height = canvas.height;
          const target = drawn;
          drawn = 0;
          pour(target);
        }

        function grainColor(i) {
          const c = rgb[grains.slot[i]];
          const s = grains.shade[i];
          return "rgb(" + Math.min(255, Math.round(c[0] * s)) + "," + Math.min(255, Math.round(c[1] * s)) + "," + Math.min(255, Math.round(c[2] * s)) + ")";
        }

        function pour(upto) {
          if (!powder) return;
          const p = powder.getContext('2d');
          if (!p) return;
          p.setTransform(dpr, 0, 0, dpr, 0, 0);
          const end = Math.min(grains.count, upto);
          for (let i = drawn; i < end; i++) {
            const s = gpx * grains.size[i];
            p.fillStyle = grainColor(i);
            p.globalAlpha = 0.9;
            p.fillRect(cx + grains.xs[i] * unit - s / 2, cy + grains.ys[i] * unit - s / 2, s, s);
          }
          p.globalAlpha = 1;
          drawn = Math.max(drawn, end);
        }

        function frame(now) {
          if (!isRunning) return;
          if (localPhase === "open") return;
          raf = requestAnimationFrame(frame);
          const ph = localPhase;

          if (ph === "draw") {
            const t = (now - started) / DURATION_MS;
            let target = rush ? 100 : rgpSimulated(t);
            shown = reduced ? 100 : Math.max(shown, shown + (target - shown) * (rush ? 0.28 : 0.08));
            if (target >= 100 && shown > 99.7) shown = 100;
            pour(Math.floor((grains.count * shown) / 100));

            // Smooth greeting fade-in at blossom (>= 75%)
            if (closeEl && shown >= 75) {
              closeEl.classList.add('rgp-visible');
            }

            if (shown >= 100) {
              pour(grains.count);
              holdAt = now;
              setLocal("hold");
            }
          } else if (ph === "hold" && now - holdAt > (reduced ? 600 : HOLD_MS)) {
            if (reduced) {
              setLocal("clear");
              if (onReadyCallback) {
                const cb = onReadyCallback;
                onReadyCallback = null;
                cb();
              }
            } else {
              windAt = now;
              setLocal("wind");
            }
          } else if (ph === "wind" && now - windAt > WIND_MS) {
            clearAt = now;
            setLocal("clear");
          } else if (ph === "clear" && (reduced || now - clearAt > CLEAR_MS)) {
            setLocal("transition");
            if (onReadyCallback) {
              const cb = onReadyCallback;
              onReadyCallback = null;
              cb();
            }
            // Auto-open fallback: ensure gate opens even if coordinator fails
            setTimeout(() => {
              if (localPhase !== "open") {
                openGate();
              }
            }, 300);
          }

          // Composite to main screen
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          if (floorTex) ctx.drawImage(floorTex, 0, 0);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          if (ph === "wind" || ph === "clear") {
            const k = ph === "wind" ? Math.min(1, (now - windAt) / WIND_MS) : 1;
            const sweep = -w * 0.25 + w * 1.6 * (k * k * (3 - 2 * k));
            const band = w * 0.35;
            if (powder && ph !== "clear") {
              ctx.save();
              ctx.beginPath();
              ctx.rect(sweep, 0, w - sweep + 1, h);
              ctx.clip();
              ctx.drawImage(powder, 0, 0, w, h);
              ctx.restore();
            }
            if (ph === "wind") {
              const rand = rgpRandom(seed + 7);
              for (let i = 0; i < grains.count; i++) {
                const gx = cx + grains.xs[i] * unit;
                const gy = cy + grains.ys[i] * unit;
                const r1 = rand();
                const r2 = rand();
                const local = (sweep - gx) / band;
                if (local <= 0 || local >= 1) continue;
                const e = local * local;
                const dx = e * (w * 0.35 + r1 * w * 0.3);
                const dy = -e * (h * 0.12 + r2 * h * 0.25) + Math.sin(local * 9 + r1 * 6) * 10 * local;
                ctx.globalAlpha = (1 - local) * 0.92;
                ctx.fillStyle = grainColor(i);
                const s = gpx * 0.94 * grains.size[i];
                ctx.fillRect(gx + dx, gy + dy, s, s);
              }
              ctx.globalAlpha = 1;
            }
          } else if (powder) {
            ctx.drawImage(powder, 0, 0, w, h);
          }
        }

        function onActivate() {
          if (localPhase === "draw") {
            rush = true;
          }
        }

        clickHandler = onActivate;
        keyHandler = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            onActivate();
          }
        };
        root.addEventListener('click', clickHandler);
        root.addEventListener('keydown', keyHandler);

        isRunning = true;
        layout();
        started = performance.now();
        raf = requestAnimationFrame(frame);

        resizeHandler = layout;
        if (window.ResizeObserver) {
          resizeObserver = new ResizeObserver(() => layout());
          resizeObserver.observe(root);
        } else {
          window.addEventListener('resize', resizeHandler);
        }
      }

      function openGate(onDone) {
        if (!root) {
          if (typeof onDone === 'function') onDone();
          return;
        }
        if (localPhase === "open") {
          if (typeof onDone === 'function') onDone();
          return;
        }
        setLocal("open");
        root.setAttribute('data-phase', 'open');
        root.classList.add('rgp-hidden');
        root.style.pointerEvents = 'none';

        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
        }

        const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        const duration = reduced ? 300 : OPEN_MS;
        setTimeout(() => {
          if (root) {
            root.style.display = 'none';
            root.style.visibility = 'hidden';
            root.setAttribute('aria-hidden', 'true');
          }
          destroy();
          if (typeof onDone === 'function') onDone();
        }, duration);
      }

      function destroy() {
        isRunning = false;
        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
        }
        if (root && clickHandler) {
          root.removeEventListener('click', clickHandler);
          clickHandler = null;
        }
        if (root && keyHandler) {
          root.removeEventListener('keydown', keyHandler);
          keyHandler = null;
        }
        if (resizeObserver) {
          resizeObserver.disconnect();
          resizeObserver = null;
        }
        if (resizeHandler) {
          window.removeEventListener('resize', resizeHandler);
          resizeHandler = null;
        }
        if (ctx && canvas) {
          try {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.width = 0;
            canvas.height = 0;
          } catch (e) { }
        }
        floorTex = null;
        powder = null;
        if (root) {
          root.style.display = 'none';
          root.style.visibility = 'hidden';
          root.style.opacity = '0';
          root.style.pointerEvents = 'none';
          root.style.background = 'transparent';
          root.style.zIndex = '-1';
          root.classList.add('rgp-hidden', 'rgp-dismissed');
          root.setAttribute('aria-hidden', 'true');
        }
        if (gate) {
          gate.style.display = 'none';
          gate.style.background = 'transparent';
        }
        if (closeEl) {
          closeEl.style.display = 'none';
          closeEl.classList.remove('rgp-visible');
        }
      }

      return {
        init,
        openGate,
        destroy,
        get isRunning() { return isRunning; }
      };
    })();

    /* ===================== AUTH & LIFECYCLE COORDINATOR ===================== */
    const AuthExperience = (function () {
      let authStateResolved = false;
      let resolvedUser = null;
      let currentStage = 'rangoli';
      let rangoliFinished = false;
      let revealCompleted = false;

      function init() {
        // Start Rangoli
        try {
          RangoliPreloader.init({
            onReadyToReveal: () => {
              rangoliFinished = true;
              checkAndProceed();
            }
          });
        } catch (err) {
          RangoliPreloader.destroy();
          rangoliFinished = true;
          checkAndProceed();
        }

        // Safety timeout (16s)
        setTimeout(() => {
          if (!revealCompleted) {
            rangoliFinished = true;
            checkAndProceed();
          }
        }, 16000);
      }

      function onAuthStateChanged(user) {
        authStateResolved = true;
        resolvedUser = user;
        if (rangoliFinished) {
          checkAndProceed();
        }
      }

      function checkAndProceed() {
        if (!rangoliFinished) return;
        if (revealCompleted) return;
        revealCompleted = true;

        if (authStateResolved && resolvedUser) {
          transitionToApp();
        } else {
          transitionToLogin();
        }
      }

      function transitionToApp() {
        currentStage = 'app';
        RangoliPreloader.openGate(() => {
          RangoliPreloader.destroy();
        });
      }

      function transitionToLogin() {
        currentStage = 'login';
        const loginStage = document.getElementById('login-stage');
        if (loginStage) {
          loginStage.style.display = 'flex';
          loginStage.classList.add('active');
        }

        RangoliPreloader.openGate(() => {
          RangoliPreloader.destroy();
        });
      }

      function showLoginOnLogout() {
        currentStage = 'login';
        resolvedUser = null;
        RangoliPreloader.destroy();
        const loginStage = document.getElementById('login-stage');
        if (loginStage) {
          loginStage.style.display = 'flex';
          loginStage.classList.add('active');
        }
      }

      return {
        init,
        onAuthStateChanged,
        showLoginOnLogout,
        get currentStage() { return currentStage; }
      };
    })();

    window.AuthExperience = AuthExperience;
    window.RangoliPreloader = RangoliPreloader;

    // Start immediately
    AuthExperience.init();
    setTimeout(() => {
      AuthExperience.onAuthStateChanged(null);
    }, 200);
  </script>
</body>

</html>
