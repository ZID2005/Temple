    /* ===================== TOOLBAR & BANNERS ===================== */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      align-items: center;
    }

    .toolbar input,
    .toolbar select {
      height: 36px;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      background: #ffffff;
      color: var(--text);
      box-sizing: border-box;
    }

    .toolbar input:focus,
    .toolbar select:focus {
      border-color: var(--primary-red);
      outline: none;
      box-shadow: 0 0 0 3px rgba(155, 44, 44, 0.15);
    }

    .section-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 16px;
      letter-spacing: -0.2px;
    }

    .muted {
      color: var(--text-muted);
      font-size: 13px;
    }

    .balance-banner {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-weight: 500;
      font-size: 13px;
      color: var(--amber);
      box-shadow: var(--shadow-xs);
    }

    .balance-banner.ok {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green);
    }

    .balance-banner.bad {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red);
    }

    /* ===================== MODALS ===================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(47, 42, 39, 0.45);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 180ms ease;
    }

    .modal-box {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow-modal);
      border: 1px solid var(--border);
      animation: scaleUp 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-box h3 {
      margin-top: 0;
      margin-bottom: 14px;
      color: var(--primary-red);
      font-size: 17px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scaleUp {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===================== BILLING & EXPANDED WORKSPACE (STEP 33.24) ===================== */
    .billing-grid {
      display: block;
      width: 100%;
    }

    .billing-expanded-grid {
      width: 100%;
      box-sizing: border-box;
    }

    .billing-form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .billing-form-col {
      display: flex;
      flex-direction: column;
    }

    .billing-bottom-row {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) auto;
      gap: 20px;
      align-items: center;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    @media (max-width: 960px) {
      .billing-form-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .billing-bottom-row {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .billing-bottom-row .billing-form-actions {
        justify-content: flex-start;
      }
    }

    /* ===================== NATIVE RECEIPT PRINTER MODAL (STEP 33.26 REFERENCE-MATCHED) ===================== */
    :root {
      --printer-body: #1e2024;
      --printer-screen: #202020;
      --printer-border: #34363a;
      --printer-paper: #ffffff;
      --printer-paper-text: #202020;
      --printer-led-processing: #f59e0b;
      --printer-led-active: #10b981;
      --printer-led-error: #ef4444;
      --printer-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --printer-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    }

    .receipt-printer-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      /* STEP 33.30C: High-contrast opaque scrim replaces CPU-taxing full-viewport backdrop-filter blur,
     eliminating 25-35ms per-frame raster stalls and achieving sustained 60 FPS compositor throughput */
      background: rgba(15, 17, 21, 0.86);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.24s var(--printer-ease-out), visibility 0.24s;
      box-sizing: border-box;
    }

    .receipt-printer-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .receipt-printer-backdrop {
      position: absolute;
      inset: 0;
      cursor: pointer;
    }

    .receipt-printer-modal-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 6px;
      box-sizing: border-box;
    }

    .receipt-printer-root {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      isolation: isolate;
    }

    /* Printer Hardware Chassis (ReceiptPrinter.Machine) */
    .receipt-printer-chassis {
      position: relative;
      z-index: 30;
      width: 100%;
      max-width: 420px;
      background: var(--printer-body, #1e2024);
      border: 1px solid var(--printer-border, #34363a);
      border-radius: 20px;
      box-shadow: 0 20px 36px -20px rgba(0, 0, 0, 0.75),
        0 6px 14px -8px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      color: #f3f4f6;
      padding: 10px 12px 18px;
      box-sizing: border-box;
      overflow: hidden;
      transform: scale(0.96) translateY(8px);
      opacity: 0.9;
      transition: transform 0.26s var(--printer-ease-out), opacity 0.26s var(--printer-ease-out);
    }

    .receipt-printer-overlay.active .receipt-printer-chassis {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .receipt-printer-chassis.shake {
      animation: printerShake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes printerShake {

      10%,
      90% {
        transform: translate3d(-2px, 0, 0);
      }

      20%,
      80% {
        transform: translate3d(3px, 0, 0);
      }

      30%,
      50%,
      70% {
        transform: translate3d(-4px, 0, 0);
      }

      40%,
      60% {
        transform: translate3d(4px, 0, 0);
      }
    }

    /* Printer Top Bezel & Header Controls (ReceiptPrinter.Header) */
    .printer-top-bezel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      margin-bottom: 8px;
    }

    .printer-brand-strip {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .printer-brand-logo {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .printer-emblem {
      font-size: 15px;
      line-height: 1;
    }

    .printer-brand-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #9ca3af;
      font-family: monospace;
    }

    .printer-bezel-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .printer-mode-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #9ca3af;
      font-size: 10px;
      font-family: monospace;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .printer-mode-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #e5e7eb;
    }

    .printer-replay-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #9ca3af;
      font-size: 11px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
      padding: 0;
    }

    .printer-replay-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: rotate(30deg);
    }

    .printer-close-icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #9ca3af;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.15s ease;
      line-height: 1;
      padding: 0;
    }

    .printer-close-icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    /* Recessed Status Screen (ReceiptPrinter.Screen) */
    .printer-recessed-screen {
      background: var(--printer-screen, #202020);
      border: 1px solid #2d3035;
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8),
        inset 0 0 24px 4px rgba(0, 0, 0, 0.52),
        0 1px 0 rgba(255, 255, 255, 0.04);
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .printer-status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .printer-status-indicator {
      position: relative;
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      flex-shrink: 0;
    }

    .printer-status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
      transition: background 0.25s var(--printer-ease-out), box-shadow 0.25s var(--printer-ease-out);
    }

    .printer-status-led.processing {
      background: var(--printer-led-processing, #f59e0b);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.85);
      animation: ledPulse 1s infinite alternate;
    }

    .printer-status-led.printing {
      background: var(--printer-led-active, #10b981);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.85);
      animation: ledPulse 0.65s infinite alternate;
    }

    .printer-status-led.ready {
      background: var(--printer-led-active, #10b981);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
    }

    .printer-status-led.error {
      background: var(--printer-led-error, #ef4444);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.85);
    }

    @keyframes ledPulse {
      from {
        opacity: 0.55;
        transform: scale(0.92);
      }

      to {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .printer-status-text-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .printer-status-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #e5e7eb;
      font-family: monospace;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .printer-screen-subtext {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.3;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Processing State Subpanel */
    .printer-processing-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 6px 8px 4px;
      margin-top: 4px;
    }

    .printer-spinner-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.2);
      border-top-color: var(--printer-led-processing, #f59e0b);
      animation: printerSpin 0.75s linear infinite;
      margin-bottom: 4px;
    }

    @keyframes printerSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .printer-processing-text-col {
      margin-bottom: 4px;
    }

    .printer-processing-title {
      font-size: 12px;
      font-weight: 700;
      color: #f9fafb;
      letter-spacing: 0.3px;
      margin-bottom: 1px;
    }

    .printer-processing-subtitle {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.25;
    }

    .printer-processing-badge {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .printer-processing-badge .badge-pill {
      font-size: 10px;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #e5e7eb;
    }

    /* Error State Panel */
    .printer-error-panel {
      padding: 14px 12px;
      text-align: center;
      margin-top: 8px;
    }

    .printer-error-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .printer-error-title {
      font-size: 14px;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 6px;
    }

    .printer-error-msg {
      font-size: 12px;
      color: #d1d5db;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 0 auto 12px;
      max-width: 320px;
      line-height: 1.4;
      word-break: break-word;
    }

    .printer-error-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    /* Feed Throat & Cutter Edge Slot */
    .printer-throat-slot {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 6px;
      z-index: 40;
    }

    .printer-mouth-slit {
      height: 8px;
      background: #090a0d;
      border-radius: 4px;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.7);
    }

    .printer-cutter-edge {
      height: 2px;
      background: linear-gradient(90deg, #282a30, #5a6272 50%, #282a30);
      margin-top: 1px;
      border-radius: 1px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .printer-feed-progress {
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
      overflow: hidden;
      margin-top: 2px;
    }

    .printer-progress-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
      background: linear-gradient(90deg, var(--printer-led-processing, #f59e0b), var(--printer-led-active, #10b981));
      border-radius: 1px;
    }

    /* Receipt Paper Output Region (ReceiptPrinter.Output) */
    .printer-paper-ejector {
      position: relative;
      z-index: 20;
      margin-top: -14px;
      width: calc(100% - 24px);
      max-width: 380px;
      overflow: hidden;
      box-sizing: border-box;
      padding: 0 4px 16px;
      contain: paint;
    }

    .printer-throat-ejection-shadow {
      position: absolute;
      left: 12px;
      right: 12px;
      top: -2px;
      height: 8px;
      background: rgba(0, 0, 0, 0.75);
      filter: blur(6px);
      z-index: 25;
      pointer-events: none;
    }

    .printer-receipt-sheet {
      background: var(--printer-paper, #ffffff);
      color: var(--printer-paper-text, #202020);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.4),
        0 4px 12px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(0, 0, 0, 0.08);
      position: relative;
      transform-origin: top center;
      border-radius: 0;
      will-change: transform;
      transform: translateY(calc(-100% + 2px));
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      clip-path: polygon(0% 0%, 100% 0%, 100% calc(100% - 4px),
          98.75% 100%, 97.5% calc(100% - 4px), 96.25% 100%, 95.0% calc(100% - 4px),
          93.75% 100%, 92.5% calc(100% - 4px), 91.25% 100%, 90.0% calc(100% - 4px),
          88.75% 100%, 87.5% calc(100% - 4px), 86.25% 100%, 85.0% calc(100% - 4px),
          83.75% 100%, 82.5% calc(100% - 4px), 81.25% 100%, 80.0% calc(100% - 4px),
          78.75% 100%, 77.5% calc(100% - 4px), 76.25% 100%, 75.0% calc(100% - 4px),
          73.75% 100%, 72.5% calc(100% - 4px), 71.25% 100%, 70.0% calc(100% - 4px),
          68.75% 100%, 67.5% calc(100% - 4px), 66.25% 100%, 65.0% calc(100% - 4px),
          63.75% 100%, 62.5% calc(100% - 4px), 61.25% 100%, 60.0% calc(100% - 4px),
          58.75% 100%, 57.5% calc(100% - 4px), 56.25% 100%, 55.0% calc(100% - 4px),
          53.75% 100%, 52.5% calc(100% - 4px), 51.25% 100%, 50.0% calc(100% - 4px),
          48.75% 100%, 47.5% calc(100% - 4px), 46.25% 100%, 45.0% calc(100% - 4px),
          43.75% 100%, 42.5% calc(100% - 4px), 41.25% 100%, 40.0% calc(100% - 4px),
          38.75% 100%, 37.5% calc(100% - 4px), 36.25% 100%, 35.0% calc(100% - 4px),
          33.75% 100%, 32.5% calc(100% - 4px), 31.25% 100%, 30.0% calc(100% - 4px),
          28.75% 100%, 27.5% calc(100% - 4px), 26.25% 100%, 25.0% calc(100% - 4px),
          23.75% 100%, 22.5% calc(100% - 4px), 21.25% 100%, 20.0% calc(100% - 4px),
          18.75% 100%, 17.5% calc(100% - 4px), 16.25% 100%, 15.0% calc(100% - 4px),
          13.75% 100%, 12.5% calc(100% - 4px), 11.25% 100%, 10.0% calc(100% - 4px),
          8.75% 100%, 7.5% calc(100% - 4px), 6.25% 100%, 5.0% calc(100% - 4px),
          3.75% 100%, 2.5% calc(100% - 4px), 1.25% 100%, 0% calc(100% - 4px));
    }

    /* Stepped Feed: 20 transform keyframes directly derived from the reference component */
    @keyframes receiptPaperFeedStepped {
      0% {
        transform: translateY(calc(-100% + 2px));
        opacity: 0.95;
      }

      7.5% {
        transform: translateY(-91%);
        opacity: 1;
      }

      10.5% {
        transform: translateY(-91%);
      }

      18% {
        transform: translateY(-81%);
      }

      21% {
        transform: translateY(-81%);
      }

      28.5% {
        transform: translateY(-70%);
      }

      31.5% {
        transform: translateY(-70%);
      }

      39% {
        transform: translateY(-58%);
      }

      42% {
        transform: translateY(-58%);
      }

      49.5% {
        transform: translateY(-45%);
      }

      52.5% {
        transform: translateY(-45%);
      }

      60% {
        transform: translateY(-32%);
      }

      63% {
        transform: translateY(-32%);
      }

      70.5% {
        transform: translateY(-20%);
      }

      73.5% {
        transform: translateY(-20%);
      }

      81% {
        transform: translateY(-10%);
      }

      84% {
        transform: translateY(-10%);
      }

      91.5% {
        transform: translateY(-3%);
      }

      94.5% {
        transform: translateY(-3%);
      }

      100% {
        transform: translateY(0%);
        opacity: 1;
      }
    }

    /* Smooth Feed: Continuous fluid feed with natural motor curve */
    @keyframes receiptPaperFeedSmooth {
      0% {
        transform: translateY(calc(-100% + 2px));
      }

      100% {
        transform: translateY(0%);
      }
    }

    .printer-receipt-sheet.feeding.feed-stepped {
      animation: receiptPaperFeedSmooth 2.2s cubic-bezier(0.33, 0.0, 0.2, 1) forwards;
    }

    .printer-receipt-sheet.feeding.feed-smooth {
      animation: receiptPaperFeedSmooth 2.2s cubic-bezier(0.33, 0.0, 0.2, 1) forwards;
    }

    /* Default feeding fallback (STEP 33.76: smooth feed is default and only feed mode) */
    .printer-receipt-sheet.feeding:not(.feed-smooth):not(.feed-stepped) {
      animation: receiptPaperFeedSmooth 2.2s cubic-bezier(0.33, 0.0, 0.2, 1) forwards;
    }

    .printer-receipt-sheet.fed {
      animation: none !important;
      transform: translateY(0) !important;
      opacity: 1 !important;
    }

    .printer-receipt-body {
      padding: 14px 12px 10px;
      max-height: 480px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* Realistic 40-Tooth Serrated Bottom Edge (4px Depth) */
    .printer-serrated-edge {
      width: 100%;
      height: 4px;
      position: relative;
      margin-top: -1px;
      overflow: hidden;
      line-height: 0;
    }

    .printer-serrated-edge .serrated-svg {
      display: block;
      width: 100%;
      height: 4px;
    }

    /* Reduced Motion Overrides */
    @media (prefers-reduced-motion: reduce) {
      .receipt-printer-chassis {
        transform: none !important;
        opacity: 1 !important;
        transition: none !important;
      }

      .printer-receipt-sheet.feeding {
        animation: none !important;
        transform: translateY(0) !important;
        opacity: 1 !important;
      }

      .printer-spinner-ring {
        animation: none !important;
      }

      .printer-status-led.processing,
      .printer-status-led.printing {
        animation: none !important;
      }

      .receipt-printer-overlay {
        transition: none !important;
      }
    }

    /* Print Isolation Overrides */
    @media print {

      .receipt-printer-overlay,
      .receipt-printer-backdrop,
      .receipt-printer-modal-content,
      .receipt-printer-chassis,
      .receipt-printer-root,
      .printer-paper-ejector {
        display: none !important;
        visibility: hidden !important;
      }
    }

    /* Mobile Responsive Proportions */
    @media (max-width: 480px) {
      .receipt-printer-modal-content {
        width: 100% !important;
        max-width: min(355px, calc(100vw - 16px)) !important;
        padding: 8px 4px !important;
      }

      .receipt-printer-root {
        width: 100% !important;
        max-width: min(355px, calc(100vw - 16px)) !important;
      }

      .receipt-printer-chassis {
        width: 100% !important;
        max-width: min(355px, calc(100vw - 16px)) !important;
        border-radius: 16px;
        padding: 8px 10px 16px;
      }

      .printer-paper-ejector {
        width: 100% !important;
        max-width: min(345px, calc(100vw - 20px)) !important;
        padding: 0 2px 14px;
      }
    }

    /* Category Segmented Control */
    .billing-category-segmented {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      width: 100%;
    }

    .billing-cat-pill {
      flex: 1 1 0;
      min-width: 0;
      height: auto;
      min-height: 82px;
      padding: 12px 6px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      transition: all 0.15s ease;
      user-select: none;
      box-sizing: border-box;
      box-shadow: none;
    }

    .billing-cat-pill:hover {
      border-color: var(--primary-red-border);
      background: var(--primary-red-soft);
      color: var(--primary-red-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-xs);
    }

    .billing-cat-pill.active {
      background: #fdf2f0;
      border-color: var(--primary-red);
      color: var(--primary-red-dark);
      box-shadow: 0 2px 6px rgba(155, 44, 44, 0.12), inset 0 0 0 1px var(--primary-red);
      transform: none;
    }

    .cat-pill-icon {
      font-size: 20px;
      line-height: 1;
      display: block;
    }

    .cat-pill-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      color: inherit;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .cat-pill-sub {
      font-size: 11px;
      line-height: 1.2;
      color: var(--text-muted);
      display: block;
      white-space: nowrap;
    }

    .billing-cat-pill.active .cat-pill-sub {
      color: var(--primary-red);
      font-weight: 500;
    }

    /* Item Quick Chips */
    .billing-item-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .billing-item-chip {
      height: auto;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      color: var(--text);
      box-sizing: border-box;
      box-shadow: none;
    }

    .billing-item-chip:hover {
      border-color: var(--gold-border);
      background: var(--gold-soft);
      color: var(--text);
      transform: translateY(-1px);
      box-shadow: var(--shadow-xs);
    }

    .billing-item-chip.active {
      background: var(--primary-red);
      border-color: var(--primary-red-dark);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(155, 44, 44, 0.2);
      transform: none;
    }

    .billing-item-chip .chip-name {
      font-weight: 600;
      line-height: 1.3;
    }

    .billing-item-chip .chip-price {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--gold-soft);
      color: var(--gold-dark);
      border: 1px solid var(--gold-border);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .billing-item-chip.active .chip-price {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    /* Quantity Stepper Control */
    .billing-qty-stepper {
      display: flex;
      align-items: stretch;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: #ffffff;
      overflow: hidden;
      width: 100%;
      height: 38px;
      box-sizing: border-box;
      transition: border-color var(--trans-fast), box-shadow var(--trans-fast);
    }

    .billing-qty-stepper:focus-within {
      border-color: var(--primary-red);
      box-shadow: 0 0 0 3px rgba(155, 44, 44, 0.12);
    }

    .qty-btn {
      width: 38px;
      height: 100%;
      border: none;
      background: var(--surface-subtle);
      color: var(--text);
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.12s ease, color 0.12s ease;
      padding: 0;

    /* ===================== STEP 33.114: RANGOLI WELCOME SCREEN ===================== */
    #rangoli-welcome {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      z-index: 10000;
      background: #5c1a12;
      overflow: hidden;
      isolation: isolate;
      margin: 0;
      padding: 0;
      opacity: 1;
      visibility: visible;
      transition: opacity 900ms cubic-bezier(.65, 0, .35, 1), visibility 0s linear 900ms;
      will-change: opacity;
      --rgp-floor: #5c1a12;
      --rgp-serif: "Gayathri", "Manjari", "Noto Serif Malayalam", "Kartika", "Nirmala UI", "Instrument Serif", "Iowan Old Style", Georgia, serif;
      --rgp-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    #rangoli-welcome.rgp-hidden,
    #rangoli-welcome[data-phase="open"] {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #rangoli-welcome.rgp-dismissed {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      background: transparent !important;
      z-index: -1 !important;
    }

    #rangoli-welcome.rgp-dismissed * {
      display: none !important;
    }

    #rangoli-welcome .rgp-gate {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      background: var(--rgp-floor);
      -webkit-font-smoothing: antialiased;
    }

    #rangoli-welcome .rgp-gate canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      max-width: none;
    }

    #rangoli-welcome .rgp-corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      font-family: var(--rgp-mono);
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      transition: opacity 600ms ease;
      pointer-events: none;
      user-select: none;
      color: rgba(255, 245, 225, 0.75);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    #rangoli-welcome .rgp-tr {
      right: clamp(18px, 3vw, 40px);
      top: clamp(18px, 3vw, 34px);
      text-align: right;
      opacity: .85;
      font-family: var(--rgp-serif);
      letter-spacing: .08em;
      font-size: 13px;
    }

    #rangoli-welcome .rgp-gate[data-phase="wind"] .rgp-corner,
    #rangoli-welcome .rgp-gate[data-phase="clear"] .rgp-corner {
      opacity: 0;
    }

    /* Centered Welcome Blessing Card - Quiet Red-Oxide Backing & Warm Ivory Typography */
    #rangoli-welcome .rgp-close {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      z-index: 10;
      text-align: center;
      opacity: 0;
      transform: translateY(calc(-50% + 14px));
      pointer-events: none;
      transition: opacity 1200ms cubic-bezier(.16, 1, 0.3, 1), transform 1200ms cubic-bezier(.16, 1, 0.3, 1);
      user-select: none;
      padding: clamp(38px, 6vw, 64px) clamp(56px, 9vw, 112px);

      max-width: fit-content;
      background: radial-gradient(ellipse closest-side at center,
        rgba(92, 26, 18, 0.94) 0%,
        rgba(92, 26, 18, 0.82) 35%,
        rgba(92, 26, 18, 0.50) 65%,
        rgba(92, 26, 18, 0.15) 85%,
        rgba(92, 26, 18, 0) 100%);
      box-shadow: none;
    }

    #rangoli-welcome .rgp-close.rgp-visible,
    #rangoli-welcome .rgp-gate[data-phase="hold"] .rgp-close,
    #rangoli-welcome .rgp-gate[data-phase="wind"] .rgp-close,
    #rangoli-welcome .rgp-gate[data-phase="clear"] .rgp-close {

      inset: 0;
      z-index: 9500;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0d0b0e;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #auth-experience.auth-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #auth-webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    /* Fallback static gradient when WebGL is unavailable */
    #auth-experience.auth-fallback-bg {
      background: radial-gradient(circle at 50% 40%, #1e1724 0%, #0c0910 100%) !important;
    }

    /* Foreground container */
    .auth-foreground {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Auth Stage Transitioning (Splash <-> Login) */
    .auth-stage {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translate3d(0, 14px, 0) scale3d(0.98, 0.98, 1);
      pointer-events: none;
    }

    .auth-stage.active {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
      pointer-events: auto;
    }

    .auth-stage.stage-exit {
      opacity: 0;
      transform: translate3d(0, -16px, 0) scale3d(0.98, 0.98, 1);
      pointer-events: none;
    }

    /* --- STAGE 1: BRANDED SPLASH SCREEN --- */
    .splash-composition {
      text-align: center;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .splash-emblem {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.35);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(212, 160, 23, 0.25) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd700;
      margin-bottom: 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .splash-emblem svg {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 0.4));
    }

    .splash-temple-name {
      font-family: 'Noto Sans Malayalam', 'Manrope', -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
      line-height: 1.35;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7), 0 0 2px rgba(0, 0, 0, 0.85);
      margin: 0;
      text-align: center;
      transform: none !important;
    }

    .splash-temple-name .splash-name-line {
      display: block;
      text-align: center;
      white-space: nowrap;
    }

    .splash-temple-name .gradual-char {
      display: inline-block;
      opacity: 0;
      transform: translate3d(-20px, 0, 0);
      will-change: transform, opacity;
      transition-property: opacity, transform;
      transition-duration: 0.5s;
      transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    .splash-temple-name .gradual-char.gradual-space {
      display: inline-block;
      transform: none;
    }

    .splash-temple-name.motion-in-view .gradual-char,
    .splash-temple-name .gradual-char.char-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .splash-app-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #f7e6b5;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75);
      margin-top: 2px;
    }

    .splash-subtitle {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      margin-top: -2px;
    }

    .splash-pulse-indicator {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.65;
    }

    .splash-pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f7e6b5;
      animation: splashPulse 1.6s infinite ease-in-out;
    }

    .splash-pulse-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .splash-pulse-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes splashPulse {

      0%,
      100% {
        transform: scale(0.7);
        opacity: 0.3;
      }

      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* --- STAGE 2: LOGIN CARD OVER WEBGL BACKGROUND (LIQUID GLASS) --- */
    .auth-stage .login-card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 22px;
      padding: 38px 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.22),
        0 10px 24px rgba(0, 0, 0, 0.10),
        inset 0 1px 1px rgba(255, 255, 255, 0.85),
        inset 0 0 16px rgba(255, 255, 255, 0.12);
      box-sizing: border-box;
      isolation: isolate;
    }

    /* Subtle internal specular sheen / liquid glass highlight */
    .auth-stage .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.02) 100%);
      border-radius: 22px 22px 0 0;
      pointer-events: none;
      z-index: 0;
    }

    .login-card>* {
      position: relative;
      z-index: 1;
    }

    .login-card .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-card .login-brand .login-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.70);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--primary-red, #9b2c2c);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(155, 44, 44, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .login-card .login-brand .login-icon svg {
      width: 28px;
      height: 28px;
    }

    .login-card .login-brand h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      color: #18181b;
      letter-spacing: -0.2px;
    }

    .login-card .login-brand p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #524d45;
      font-weight: 500;
    }

    .login-form-group {
      margin-bottom: 16px;
    }

    .login-form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #37332d;
      margin-bottom: 6px;
    }

    .login-form-group input {
      width: 100%;
      height: 42px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      transition: border-color var(--trans-fast, 0.15s), box-shadow var(--trans-fast, 0.15s), background-color var(--trans-fast, 0.15s);
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #1c1917;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .login-form-group input::placeholder {
      color: #78716c;
      opacity: 0.85;
    }

    .login-form-group input:focus {
      background: rgba(255, 255, 255, 0.62);
      border-color: var(--primary-red, #9b2c2c);
      box-shadow: 0 0 0 3px rgba(155, 44, 44, 0.16), inset 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    #login-btn {
      width: 100%;
      height: 44px;
      padding: 10px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 9px;
      background: var(--primary-red, #9b2c2c);
      color: #ffffff;
      border: 1px solid var(--primary-red-dark, #7f1d1d);
      box-shadow: 0 4px 14px rgba(155, 44, 44, 0.28), 0 1px 2px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.18s, box-shadow 0.18s;
    }

    #login-btn:hover {
      background: var(--primary-red-hover, #862020);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(155, 44, 44, 0.38), 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    #login-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 6px rgba(155, 44, 44, 0.25);
    }

    #login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    #login-error {
      margin-top: 12px;
      font-size: 13px;
      color: #b91c1c;
      text-align: center;
      min-height: 18px;
      font-weight: 600;
    }

    /* Fallback loading and login elements */
    #auth-loading-screen,
    #login-screen {
      display: none !important;
    }

    /* Graceful fallback when backdrop-filter is unsupported */
    @supports not ((backdrop-filter: blur(20px)) or (-webkit-backdrop-filter: blur(20px))) {
      .auth-stage .login-card {
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      .login-form-group input {
        background: rgba(255, 255, 255, 0.85);
        border: 1.5px solid #dfd7cc;
      }

      .login-card .login-brand .login-icon {
        background: #fdf2f0;
      }
    }

    /* Responsive queries */
    @media (max-width: 600px) {
      .splash-temple-name {
        font-size: 22px;
      }

      .splash-app-title {
        font-size: 16px;
        letter-spacing: 3.5px;
      }

      .splash-subtitle {
        font-size: 12px;
      }

      .splash-emblem {
        width: 60px;
        height: 60px;
      }

      .splash-emblem svg {

      }

      .auth-stage .login-card {
        padding: 30px 22px 24px;
        max-width: 340px;
        border-radius: 18px;
      }

      .auth-stage .login-card::before {
        border-radius: 18px 18px 0 0;
      }

      .login-card .login-brand h1 {
        font-size: 19px;
      }
    }

    @media (max-width: 480px) {
      .splash-composition {
        padding: 20px 16px;
      }

      .splash-temple-name {
        font-size: 20px;
      }

      .splash-app-title {
        font-size: 15px;
        letter-spacing: 3px;
      }

      .auth-stage .login-card {
        max-width: 320px;
        padding: 26px 18px 22px;
        border-radius: 16px;
      }

      .auth-stage .login-card::before {
        border-radius: 16px 16px 0 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #auth-experience,
      .auth-stage,
      .splash-pulse-dot,
      #login-btn {
        transition: none !important;
        animation: none !important;
        transform: none !important;
      }
    }

    /* ==========================================================================

    /* ===================== DYNAMIC BUTTON SYSTEM (STEP 33.23) ===================== */

    @media (prefers-reduced-motion: reduce) {

        transition: none !important;

    @media print {

        display: none !important;
      }
    }
