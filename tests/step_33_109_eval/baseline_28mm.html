<title>Step 33.109 Test Receipt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff;
    font-family: 'Consolas', 'Courier New', 'Noto Sans Malayalam', 'Segoe UI', monospace;
    font-size: 11.5px;
    line-height: 1.35;
    color: #000;
  }
  #print-area.billing-80mm {
    width: 80mm;
    max-width: 80mm;
    padding: 3mm 4mm 4mm 4mm;
    box-sizing: border-box;
    background: #fff;
    margin: 0 auto;
  }
  .th-receipt {
    width: 100%;
    max-width: 80mm;
    color: #000;
    font-variant-numeric: tabular-nums;
  }
  .th-center { text-align: center; }
  .th-bold { font-weight: bold; }
  .th-logo-wrap {
    text-align: center;
    margin-bottom: 3px;
  }
  .th-top-frame {
    position: relative !important;
    width: 100% !important;
    margin: 0 auto !important;
    line-height: 0 !important;
  }
  .th-top-decor {
    width: 100% !important;
    height: auto !important;
    display: block !important;
    margin: 0 auto !important;
    image-rendering: -webkit-optimize-contrast !important;
    image-rendering: crisp-edges !important;
  }
  .th-top-frame .th-deity-logo {
    position: absolute !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    bottom: 0 !important;
    width: 23.16% !important;
    height: auto !important;
    aspect-ratio: 300 / 450 !important;
    display: block !important;
    margin: 0 !important;
    object-fit: contain !important;
    image-rendering: -webkit-optimize-contrast !important;
    image-rendering: crisp-edges !important;
  }
  .th-deity-logo {
    width: 20mm !important;
    max-width: 20mm !important;
    height: auto !important;
    aspect-ratio: 300 / 450 !important;
    display: block !important;
    margin: 0 auto !important;
    object-fit: contain !important;
    image-rendering: -webkit-optimize-contrast !important;
    image-rendering: crisp-edges !important;
  }
  .th-title {
    font-size: 13.5px;
    font-weight: bold;
    line-height: 1.25;
    margin-bottom: 2px;
  }
  .th-line {
    border-bottom: 1px dashed #000;
    margin: 4px 0;
    width: 100%;
    display: block;
  }
  .th-flex {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    font-variant-numeric: tabular-nums;
  }
  .th-row {
    font-size: 11.5px;
    margin: 2px 0;
    line-height: 1.35;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
  }
  .th-total {
    font-size: 13.5px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  .th-blessing {
    font-size: 10px;
    font-weight: bold;
    margin-top: 5px;
    text-align: center;
  }
  .th-upi-section {
    text-align: center;
    margin-top: 6px;
    padding-top: 2px;
  }
  .th-scan-pay {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
    text-align: center;
  }
  .th-upi-qr {
    width: 28mm !important;
    height: 28mm !important;
    max-width: 28mm !important;
    max-height: 28mm !important;
    aspect-ratio: 1 / 1 !important;
    display: block !important;
    margin: 0 auto !important;
    image-rendering: pixelated !important;
    image-rendering: crisp-edges !important;
  }
  .th-bot-decor {
    width: 100% !important;
    height: auto !important;
    display: block !important;
    margin: 6px auto 2px auto !important;
    image-rendering: -webkit-optimize-contrast !important;
    image-rendering: crisp-edges !important;
  }
  .th-roster-row {
    font-size: 11.5px;
    margin: 2.5px 0;
    line-height: 1.35;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 4px;
  }
  .th-roster-name, .th-roster-star {
    font-size: 13.5px;
  }
  @page {
    size: 80mm 165mm;
    margin: 0;
  }
  @media print {
    html, body {
      width: 80mm !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
    }
  }
</style>
