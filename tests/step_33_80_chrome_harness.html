  <script>
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderThermalReceiptHTML(r, templeName, templeAddress) {
  const qty = (typeof r.quantity === 'number') ? r.quantity : (typeof r.qty === 'number' ? r.qty : 1);
  const unitPrice = (typeof r.unitPrice === 'number') ? r.unitPrice : 0;
  const total = (typeof r.totalAmount === 'number') ? r.totalAmount : (typeof r.total === 'number' ? r.total : 0);
  const category = r.category || r.cat || '';
  const item = r.item || '';
  const receiptNo = r.receiptNo || '';
  const date = r.date || '';
  const time = r.time || '';
  const paymentMode = r.paymentMode || 'Cash';
  const isVoided = !!r.voided;

  // Full Devotee Roster with legacy fallback
  const rawDevotees = (Array.isArray(r.devotees) && r.devotees.length > 0)
    ? r.devotees
    : [{ name: r.devoteeName || r.name || '', star: r.star || '' }];
  const devotees = rawDevotees.filter(d => d && (d.name || d.star));
  const displayDevotees = devotees.length > 0 ? devotees : [{ name: r.devoteeName || r.name || '---', star: r.star || '' }];

  const unitPriceFormatted = unitPrice > 0 
    ? `₹${unitPrice.toFixed(2)}` 
    : (qty > 0 ? `₹${(total / qty).toFixed(2)}` : `₹${total.toFixed(2)}`);
  const totalFormatted = total.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  return `
    <div class="th-receipt ${isVoided ? 'th-voided-receipt' : ''}">
      <div class="th-center th-bold th-title">${esc(templeName)}</div>
      <div class="th-center th-sub">${esc(templeAddress)}</div>
      ${isVoided ? `
        <div style="border: 2px dashed #b91c1c; background: #fff5f5; padding: 5px; margin: 6px 0; text-align: center; color: #b91c1c; font-weight: 900; font-size: 13px; letter-spacing: 1px;">
          *** VOIDED / റദ്ദാക്കിയത് ***
        </div>
        ${r.voidReason ? `<div style="text-align: center; font-size: 10.5px; color: #b91c1c; margin-bottom: 4px; font-weight: 600;">Reason: ${esc(r.voidReason)}</div>` : ''}
      ` : ''}
      <div class="th-line"></div>
      <div class="th-flex">
        <span>No: <b>${esc(receiptNo)}</b> ${isVoided ? '<span style="color:#b91c1c;font-weight:bold;">[VOID]</span>' : ''}</span>
        <span>${esc(date)} ${esc(time)}</span>
      </div>
      <div class="th-line"></div>
      <div class="th-roster-section">
        <div class="th-roster-head" style="display: flex; justify-content: space-between; font-weight: 700; font-size: 10.5px; padding-bottom: 2px; border-bottom: 1px dotted #888; margin-bottom: 4px; color: #333;">
          <span style="width: 24px; text-align: left;">നം.</span>
          <span style="flex: 1; text-align: left; padding: 0 4px;">പേര് (Devotee Name)</span>
          <span style="width: 85px; text-align: right;">നാൾ (Star)</span>
        </div>
        ${displayDevotees.map((d, idx) => `
          <div class="th-roster-row" style="display: flex; justify-content: space-between; align-items: flex-start; margin: 2.5px 0; font-size: 11.5px; line-height: 1.35; gap: 4px;">
            <span style="width: 24px; text-align: left; font-weight: 600; flex-shrink: 0; color: #555;">${idx + 1}.</span>
            <span class="th-roster-name" style="flex: 1; text-align: left; font-weight: 700; font-size: 13px; word-break: break-word; overflow-wrap: break-word; padding: 0 4px;">${esc(d.name || '---')}</span>
            <span class="th-roster-star" style="width: 85px; text-align: right; font-weight: 600; font-size: 13px; flex-shrink: 0; word-break: break-word; color: #222;">${esc(d.star || '---')}</span>
          </div>
        `).join('')}
      </div>
      <div class="th-line"></div>
      <div class="th-row"><span>വിഭാഗം:</span> ${esc(category)}</div>
      <div class="th-row"><span>ഇനം:</span> <b>${esc(item)}</b></div>
      <div class="th-flex" style="margin-top: 2px;">
        <span>Qty: <b>${qty}</b> &times; ${unitPriceFormatted}</span>
        <span>Amt: <b>₹${totalFormatted}</b></span>
      </div>
      <div class="th-line"></div>
      <div class="th-flex th-bold th-total">
        <span>ആകെ (Total):</span>
        <span ${isVoided ? 'style="text-decoration:line-through;color:#991b1b;"' : ''}>₹${totalFormatted}</span>
      </div>
      <div class="th-flex" style="margin-top: 3px;">
        <span>Payment:</span>
        <span><b>${esc(paymentMode)}</b></span>
      </div>
      ${isVoided && r.voidDate ? `
        <div class="th-line"></div>
        <div style="text-align: center; font-size: 10px; color: #b91c1c;">
          Cancelled on: ${esc(r.voidDate)}
        </div>
      ` : ''}
      <div class="th-line"></div>
      <div class="th-center th-blessing">*** അമ്മേ നാരായണ ദേവി നാരായണ ***</div>
    </div>
  `;
}

        totalAmount: 30,
        paymentMode: 'Cash',
        devotees: [{ name: 'അനന്തപദ്മനാഭൻ', star: 'തിരുവോണം' }]
      };

      // 1. Preview Layout Inspection
      const pBox = document.getElementById('previewBox');
      pBox.innerHTML = renderThermalReceiptHTML(sampleRec, templeName, templeAddress);

      const pTitle = pBox.querySelector('.th-title');
      const pName = pBox.querySelector('.th-roster-name');
      const pStar = pBox.querySelector('.th-roster-star');
      const pSNo = pBox.querySelector('.th-roster-row span:first-child');
      const pHead = pBox.querySelector('.th-roster-head');

      const csPTitle = window.getComputedStyle(pTitle);
      const csPName = window.getComputedStyle(pName);
      const csPStar = window.getComputedStyle(pStar);
      const csPSNo = window.getComputedStyle(pSNo);
      const csPHead = window.getComputedStyle(pHead);

      results.preview = {
        titleFontSize: csPTitle.fontSize,
        nameFontSize: csPName.fontSize,
        starFontSize: csPStar.fontSize,
        sNoFontSize: csPSNo.fontSize,
        headFontSize: csPHead.fontSize,
        nameFontWeight: csPName.fontWeight,
        starFontWeight: csPStar.fontWeight,
        nameMatchesTitle: csPName.fontSize === csPTitle.fontSize,
        starMatchesTitle: csPStar.fontSize === csPTitle.fontSize
      };

      // 2. Multi-Devotee & Long Name Overflow Inspection in Preview
      const longRec = {
        receiptNo: 'BILL-889',
        date: '17/10/2026',
        time: '12:05 PM',
        category: 'വഴിപാട്',
        item: 'ഗണപതി ഹോമം',
        qty: 2,
        unitPrice: 150,
        totalAmount: 300,
        paymentMode: 'Cash',
        devotees: [
          { name: 'ഡോ. വെങ്കിട്ടരാമൻ നമ്പൂതിരിപ്പാട് അമ്പലപ്പുഴ', star: 'പൂരുരുട്ടാതി' },
          { name: 'ശ്രീ രാജരാജേശ്വരി മാതാ ഭക്തജന ട്രസ്റ്റ് പ്രതിനിധി ആനന്ദതീർത്ഥൻ', star: 'ഉത്രട്ടാതി' }
        ]
      };
      pBox.innerHTML = renderThermalReceiptHTML(longRec, templeName, templeAddress);
      const pRows = pBox.querySelectorAll('.th-roster-row');
      const boxRect = pBox.getBoundingClientRect();
      let hasOverflow = false;
      pRows.forEach(row => {
        const rRect = row.getBoundingClientRect();
        if (rRect.right > boxRect.right + 2) hasOverflow = true;
      });
      results.previewOverflow = hasOverflow;

      document.getElementById('domResults').textContent = JSON.stringify(results);
    })();
  </script>
</body>
</html>
