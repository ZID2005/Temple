/* ===================== CONTROLLED INDEXEDDB -> FIRESTORE MIGRATION LAYER =====================
   Step 11: Controlled, non-destructive migration and staging layer.
   - Reads directly from live IndexedDB (temple_accounts_db, version 2).
   - Transforms records according to Step 9 Firestore architecture.
   - Preserves all legacy IDs, human-readable numbers, and original dates.
   - Normalizes dates to ISO YYYY-MM-DD.
   - Validates billing -> accounting receipt relationships.
   - Validates monetary totals in integer paise.
   - Detects counter consistency (stops if inconsistent).
   - Performs a complete dry-run before writing.
   - Imports test/copy dataset strictly into isolated namespace: migration_staging/{migrationId}/...
   - Validates 14 checkpoints post-staging.
   - NEVER touches production collections or production counter documents.
   - NEVER modifies IndexedDB or changes normal CRUD flows.
   ============================================================================================= */

const TempleMigration = (function() {
  const SOURCE_DB_NAME = 'temple_accounts_db';
  const SOURCE_DB_VERSION = 2;
  const ALL_STORES = [
    'settings', 'funds', 'incomeCategories', 'expenseCategories', 'bankAccounts',
    'receipts', 'payments', 'transfers', 'chittyMembers', 'chittyCollections',
    'chittyPayouts', 'loans', 'billing'
  ];

  function safeToPaise(amount) {
    if (typeof amount !== 'number' || isNaN(amount)) return 0;
    return Math.round(amount * 100);
  }

  function normalizeDate(rawDate) {
    if (!rawDate) return { date: null, legacyDate: rawDate, error: 'Empty date' };
    const str = String(rawDate).trim();
    // Check DD/MM/YYYY or DD-MM-YYYY
    const dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (dmy) {
      const day = dmy[1].padStart(2, '0');
      const month = dmy[2].padStart(2, '0');
      const year = dmy[3];
      return { date: `${year}-${month}-${day}`, legacyDate: str, error: null };
    }
    // Check YYYY-MM-DD
    const ymd = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (ymd) {
      const year = ymd[1];
      const month = ymd[2].padStart(2, '0');
      const day = ymd[3].padStart(2, '0');
      return { date: `${year}-${month}-${day}`, legacyDate: str, error: null };
    }
    return { date: str, legacyDate: str, error: 'Unrecognized date format' };
  }

  function getDeterministicDocId(storeName, id) {
    if (storeName === 'settings') return 'main';
    const prefixes = {
      funds: 'fund_',
      incomeCategories: 'inccat_',
      expenseCategories: 'expcat_',
      bankAccounts: 'bank_',
      receipts: 'rcpt_',
      payments: 'pmt_',
      transfers: 'tx_',
      chittyMembers: 'cm_',
      chittyCollections: 'cc_',
      chittyPayouts: 'cp_',
      loans: 'loan_',
      billing: 'bill_'
    };
    const p = prefixes[storeName] || `${storeName}_`;
    return `${p}${id}`;
  }

  async function readAllIndexedDbData() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(SOURCE_DB_NAME, SOURCE_DB_VERSION);
      req.onerror = () => reject(req.error);
      req.onsuccess = async () => {
        const idb = req.result;
        const result = {};
        for (const storeName of ALL_STORES) {
          if (!idb.objectStoreNames.contains(storeName)) {
            result[storeName] = [];
            continue;
          }
          const tx = idb.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const allReq = store.getAll();
          await new Promise((res, rej) => {
            allReq.onsuccess = () => { result[storeName] = allReq.result || []; res(); };
            allReq.onerror = () => rej(allReq.error);
          });
        }
        idb.close();
        resolve(result);
      };
    });
  }

  async function buildPreMigrationInventory() {
    const rawData = await readAllIndexedDbData();
    const inventory = {
      databaseName: SOURCE_DB_NAME,
      databaseVersion: SOURCE_DB_VERSION,
      scannedAt: new Date().toISOString(),
      stores: {},
      counters: {},
      counterConsistency: { isConsistent: true, checks: [], stopMigration: false },
      billingAccountingLinks: { totalBilling: 0, validLinks: 0, invalidLinks: 0, unlinked: 0, details: [] },
      financialTotalsPaise: {},
      financialTotalsRupees: {}
    };

    // Store inventories
    for (const sName of ALL_STORES) {
      const records = rawData[sName] || [];
      const ids = records.map(r => r.id).filter(id => typeof id === 'number');
      const minId = ids.length ? Math.min(...ids) : null;
      const maxId = ids.length ? Math.max(...ids) : null;

      let totalPaise = 0;
      let voidedCount = 0;
      const dates = [];

      records.forEach(r => {
        if (r.voided) voidedCount++;
        if (r.amount !== undefined) totalPaise += safeToPaise(r.amount);
        if (r.totalAmount !== undefined) totalPaise += safeToPaise(r.totalAmount);
        if (r.date) dates.push(String(r.date));
      });

      inventory.stores[sName] = {
        count: records.length,
        idRange: ids.length ? [minId, maxId] : null,
        voidedCount,
        uniqueDates: [...new Set(dates)],
        totalPaise,
        totalRupees: totalPaise / 100
      };
      inventory.financialTotalsPaise[sName] = totalPaise;
      inventory.financialTotalsRupees[sName] = totalPaise / 100;
    }

    // Settings & Counters
    const sDoc = (rawData.settings && rawData.settings[0]) || {};
    inventory.counters = {
      receiptCounter: sDoc.receiptCounter !== undefined ? sDoc.receiptCounter : 1001,
      voucherCounter: sDoc.voucherCounter !== undefined ? sDoc.voucherCounter : 501,
      billingReceiptCounter: sDoc.billingReceiptCounter !== undefined ? sDoc.billingReceiptCounter : 0,
      receiptPrefix: sDoc.receiptPrefix || 'R-',
      voucherPrefix: sDoc.voucherPrefix || 'V-'
    };

    // Number ranges
    const receipts = rawData.receipts || [];
    const rNums = receipts.map(r => {
      const m = (r.receiptNo || '').match(/(\d+)$/);
      return m ? parseInt(m[1], 10) : 0;
    });
    const maxRNum = rNums.length ? Math.max(...rNums) : 0;
    const minRNum = rNums.length ? Math.min(...rNums) : 0;
    inventory.stores.receipts.numberRange = rNums.length ? [`${sDoc.receiptPrefix || 'R-'}${minRNum}`, `${sDoc.receiptPrefix || 'R-'}${maxRNum}`] : null;

    const billing = rawData.billing || [];
    const bNums = billing.map(b => {
      const m = (b.receiptNo || '').match(/(\d+)$/);
      return m ? parseInt(m[1], 10) : 0;
    });
    const maxBNum = bNums.length ? Math.max(...bNums) : 0;
    const minBNum = bNums.length ? Math.min(...bNums) : 0;
    inventory.stores.billing.numberRange = bNums.length ? [`BILL-${String(minBNum).padStart(4, '0')}`, `BILL-${String(maxBNum).padStart(4, '0')}`] : null;

    // Payments
    const payments = rawData.payments || [];
    const vNums = payments.map(p => {
      const m = (p.voucherNo || '').match(/(\d+)$/);
      return m ? parseInt(m[1], 10) : 0;
    });
    const maxVNum = vNums.length ? Math.max(...vNums) : 0;
    const minVNum = vNums.length ? Math.min(...vNums) : 0;
    inventory.stores.payments.numberRange = vNums.length ? [`${sDoc.voucherPrefix || 'V-'}${minVNum}`, `${sDoc.voucherPrefix || 'V-'}${maxVNum}`] : null;

    // Step 7: Counter consistency check
    // 1. receiptCounter check: settings.receiptCounter must be >= maxRNum + 1 (or == if next to issue)
    const rCheckPassed = maxRNum === 0 || (inventory.counters.receiptCounter >= maxRNum + 1);
    inventory.counterConsistency.checks.push({
      counter: 'receiptCounter',
      settingValue: inventory.counters.receiptCounter,
      highestStoredNumber: maxRNum,
      consistent: rCheckPassed,
      detail: `Settings receiptCounter (${inventory.counters.receiptCounter}) vs highest stored R- receipt (${maxRNum})`
    });

    // 2. billingReceiptCounter check: settings.billingReceiptCounter must be >= maxBNum
    const bCheckPassed = maxBNum === 0 || (inventory.counters.billingReceiptCounter >= maxBNum);
    inventory.counterConsistency.checks.push({
      counter: 'billingReceiptCounter',
      settingValue: inventory.counters.billingReceiptCounter,
      highestStoredNumber: maxBNum,
      consistent: bCheckPassed,
      detail: `Settings billingReceiptCounter (${inventory.counters.billingReceiptCounter}) vs highest stored BILL- receipt (${maxBNum})`
    });

    // 3. voucherCounter check
    const vCheckPassed = maxVNum === 0 || (inventory.counters.voucherCounter >= maxVNum + 1);
    inventory.counterConsistency.checks.push({
      counter: 'voucherCounter',
      settingValue: inventory.counters.voucherCounter,
      highestStoredNumber: maxVNum,
      consistent: vCheckPassed,
      detail: `Settings voucherCounter (${inventory.counters.voucherCounter}) vs highest stored V- voucher (${maxVNum})`
    });

    if (!rCheckPassed || !bCheckPassed || !vCheckPassed) {
      inventory.counterConsistency.isConsistent = false;
      inventory.counterConsistency.stopMigration = true;
    }

    // Step 11: Billing -> Accounting relationship check
    inventory.billingAccountingLinks.totalBilling = billing.length;
    for (const b of billing) {
      if (b.accountingReceiptId || b.accountingReceiptNo) {
        const linkedReceipt = receipts.find(r => r.id === b.accountingReceiptId && r.receiptNo === b.accountingReceiptNo);
        if (linkedReceipt) {
          inventory.billingAccountingLinks.validLinks++;
          inventory.billingAccountingLinks.details.push({
            billingId: b.id,
            billingReceiptNo: b.receiptNo,
            accountingReceiptId: b.accountingReceiptId,
            accountingReceiptNo: b.accountingReceiptNo,
            valid: true,
            amountMatch: (b.totalAmount === linkedReceipt.amount)
          });
        } else {
          inventory.billingAccountingLinks.invalidLinks++;
          inventory.billingAccountingLinks.details.push({
            billingId: b.id,
            billingReceiptNo: b.receiptNo,
            accountingReceiptId: b.accountingReceiptId,
            accountingReceiptNo: b.accountingReceiptNo,
            valid: false,
            error: 'Referenced accounting receipt not found in receipts store'
          });
        }
      } else {
        inventory.billingAccountingLinks.unlinked++;
        inventory.billingAccountingLinks.details.push({
          billingId: b.id,
          billingReceiptNo: b.receiptNo,
          unlinked: true,
          reason: 'Pre-integration billing record'
        });
      }
    }

    return { inventory, rawData };
  }

  function transformDataForFirestore(rawData, inventory) {
    const transformed = {
      manifest: null,
      collections: {}
    };

    const idMapping = {
      receipts: {},
      billing: {},
      funds: {},
      incomeCategories: {},
      expenseCategories: {},
      bankAccounts: {},
      chittyMembers: {},
      payments: {},
      transfers: {},
      chittyCollections: {},
      chittyPayouts: {},
      loans: {}
    };

    // Pre-populate ID mapping
    for (const sName of ALL_STORES) {
      if (sName === 'settings') continue;
      const records = rawData[sName] || [];
      records.forEach(r => {
        idMapping[sName][r.id] = getDeterministicDocId(sName, r.id);
      });
    }

    // 1. Settings (Master)
    const rawSettings = (rawData.settings && rawData.settings[0]) || {};
    const settingsDoc = {
      ...rawSettings,
      legacyId: rawSettings.id || 1,
      migratedAt: Date.now()
    };
    transformed.collections.settings = [{ docId: 'main', data: settingsDoc }];

    // 2. Funds (Master)
    transformed.collections.funds = (rawData.funds || []).map(f => ({
      docId: idMapping.funds[f.id],
      data: {
        ...f,
        legacyId: f.id,
        migratedAt: Date.now()
      }
    }));

    // 3. Income Categories (Master)
    transformed.collections.incomeCategories = (rawData.incomeCategories || []).map(c => ({
      docId: idMapping.incomeCategories[c.id],
      data: {
        ...c,
        legacyId: c.id,
        migratedAt: Date.now()
      }
    }));

    // 4. Expense Categories (Master)
    transformed.collections.expenseCategories = (rawData.expenseCategories || []).map(c => ({
      docId: idMapping.expenseCategories[c.id],
      data: {
        ...c,
        legacyId: c.id,
        migratedAt: Date.now()
      }
    }));

    // 5. Bank Accounts (Master)
    transformed.collections.bankAccounts = (rawData.bankAccounts || []).map(b => ({
      docId: idMapping.bankAccounts[b.id],
      data: {
        ...b,
        legacyId: b.id,
        migratedAt: Date.now()
      }
    }));

    // 6. Chitty Members (Reference)
    transformed.collections.chittyMembers = (rawData.chittyMembers || []).map(m => ({
      docId: idMapping.chittyMembers[m.id],
      data: {
        ...m,
        legacyId: m.id,
        migratedAt: Date.now()
      }
    }));

    // 7. Receipts (Transaction)
    transformed.collections.receipts = (rawData.receipts || []).map(r => {
      const dateNorm = normalizeDate(r.date);
      const linkedBillingDocId = r.billingId ? (idMapping.billing[r.billingId] || null) : null;
      return {
        docId: idMapping.receipts[r.id],
        data: {
          ...r,
          legacyId: r.id,
          legacyDate: r.date,
          date: dateNorm.date,
          legacyBillingId: r.billingId !== undefined ? r.billingId : null,
          billingId: linkedBillingDocId,
          migratedAt: Date.now()
        }
      };
    });

    // 8. Payments (Transaction)
    transformed.collections.payments = (rawData.payments || []).map(p => {
      const dateNorm = normalizeDate(p.date);
      return {
        docId: idMapping.payments[p.id],
        data: {
          ...p,
          legacyId: p.id,
          legacyDate: p.date,
          date: dateNorm.date,
          migratedAt: Date.now()
        }
      };
    });

    // 9. Transfers (Transaction)
    transformed.collections.transfers = (rawData.transfers || []).map(t => {
      const dateNorm = normalizeDate(t.date);
      return {
        docId: idMapping.transfers[t.id],
        data: {
          ...t,
          legacyId: t.id,
          legacyDate: t.date,
          date: dateNorm.date,
          migratedAt: Date.now()
        }
      };
    });

    // 10. Chitty Collections (Transaction)
    transformed.collections.chittyCollections = (rawData.chittyCollections || []).map(c => {
      const dateNorm = normalizeDate(c.date);
      const memberDocId = c.memberId ? (idMapping.chittyMembers[c.memberId] || null) : null;
      return {
        docId: idMapping.chittyCollections[c.id],
        data: {
          ...c,
          legacyId: c.id,
          legacyDate: c.date,
          date: dateNorm.date,
          legacyMemberId: c.memberId !== undefined ? c.memberId : null,
          memberId: memberDocId,
          migratedAt: Date.now()
        }
      };
    });

    // 11. Chitty Payouts (Transaction)
    transformed.collections.chittyPayouts = (rawData.chittyPayouts || []).map(p => {
      const dateNorm = normalizeDate(p.date);
      const memberDocId = p.memberId ? (idMapping.chittyMembers[p.memberId] || null) : null;
      return {
        docId: idMapping.chittyPayouts[p.id],
        data: {
          ...p,
          legacyId: p.id,
          legacyDate: p.date,
          date: dateNorm.date,
          legacyMemberId: p.memberId !== undefined ? p.memberId : null,
          memberId: memberDocId,
          migratedAt: Date.now()
        }
      };
    });

    // 12. Loans (Transaction)
    transformed.collections.loans = (rawData.loans || []).map(l => {
      const dateNorm = normalizeDate(l.date);
      return {
        docId: idMapping.loans[l.id],
        data: {
          ...l,
          legacyId: l.id,
          legacyDate: l.date,
          date: dateNorm.date,
          migratedAt: Date.now()
        }
      };
    });

    // 13. Billing (Transaction)
    transformed.collections.billing = (rawData.billing || []).map(b => {
      const dateNorm = normalizeDate(b.date);
      const linkedReceiptDocId = b.accountingReceiptId ? (idMapping.receipts[b.accountingReceiptId] || null) : null;
      return {
        docId: idMapping.billing[b.id],
        data: {
          ...b,
          legacyId: b.id,
          legacyDate: b.date,
          date: dateNorm.date,
          legacyAccountingReceiptId: b.accountingReceiptId !== undefined ? b.accountingReceiptId : null,
          accountingReceiptId: linkedReceiptDocId,
          accountingReceiptNo: b.accountingReceiptNo || null,
          migratedAt: Date.now()
        }
      };
    });

    return { transformed, idMapping };
  }

  async function runMigrationDryRun() {
    console.log('[TempleMigration] Starting Pre-Migration Dry Run...');
    const { inventory, rawData } = await buildPreMigrationInventory();

    if (inventory.counterConsistency.stopMigration) {
      console.error('[TempleMigration] Dry run aborted due to counter inconsistency:', inventory.counterConsistency);
      return {
        success: false,
        aborted: true,
        reason: 'COUNTER_INCONSISTENCY',
        inventory
      };
    }

    const { transformed, idMapping } = transformDataForFirestore(rawData, inventory);

    const dryRunSummary = {
      success: true,
      mode: 'DRY_RUN (Zero writes performed)',
      sourceDatabase: SOURCE_DB_NAME,
      sourceVersion: SOURCE_DB_VERSION,
      storesCount: {},
      totalRecordsToMigrate: 0,
      countersVerified: inventory.counters,
      billingAccountingLinks: inventory.billingAccountingLinks,
      financialTotalsPaise: inventory.financialTotalsPaise,
      financialTotalsRupees: inventory.financialTotalsRupees,
      dateConversionsSample: {},
      idMappingsSample: {},
      warnings: [],
      errors: []
    };

    for (const [storeName, docs] of Object.entries(transformed.collections)) {
      dryRunSummary.storesCount[storeName] = docs.length;
      dryRunSummary.totalRecordsToMigrate += docs.length;
      if (docs.length > 0) {
        dryRunSummary.idMappingsSample[storeName] = docs.slice(0, 3).map(d => ({
          legacyId: d.data.legacyId,
          docId: d.docId
        }));
        if (docs[0].data.legacyDate) {
          dryRunSummary.dateConversionsSample[storeName] = docs.slice(0, 3).map(d => ({
            legacyDate: d.data.legacyDate,
            normalizedDate: d.data.date
          }));
        }
      }
    }

    console.log('[TempleMigration] Dry run completed successfully:', dryRunSummary);
    return {
      success: true,
      dryRunSummary,
      inventory,
      transformed,
      idMapping
    };
  }

  async function runMigrationStaging(options = {}) {
    const migrationId = options.migrationId || `migration_${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}`;
    const forceOverwrite = !!options.forceOverwrite;

    console.log(`[TempleMigration] Executing staging migration under ID: ${migrationId}`);

    const currentUser = getCurrentFirebaseUser();
    if (!currentUser) {
      throw new Error('Authentication required: Migration writes require an authenticated Firebase user session.');
    }

    const db = getFirestoreDb();
    if (!db) {
      throw new Error('Firestore is not initialized.');
    }

    // 1. Dry run MUST precede write
    const dryRunResult = await runMigrationDryRun();
    if (!dryRunResult.success) {
      throw new Error(`Dry run failed. Reason: ${dryRunResult.reason || 'Unknown'}`);
    }

    const { transformed, inventory } = dryRunResult;

    const stagingRootDocRef = db.collection('migration_staging').doc(migrationId);

    // Idempotency check
    let existingManifestSnap = null;
    try {
      existingManifestSnap = await stagingRootDocRef.get();
    } catch (e) {
      console.log('[TempleMigration] Idempotency probe note (proceeding with write):', e.message);
    }
    if (existingManifestSnap && existingManifestSnap.exists && !forceOverwrite) {
      console.warn(`[TempleMigration] Staging migration '${migrationId}' already exists. Idempotency active.`);
      return {
        success: true,
        migrationId,
        alreadyExisted: true,
        manifest: existingManifestSnap.data(),
        message: 'Migration namespace already exists. Skipped duplicate import.'
      };
    }

    const manifestData = {
      migrationId,
      migrationStartedAt: Date.now(),
      status: 'IN_PROGRESS',
      migratedBy: { uid: currentUser.uid, email: currentUser.email },
      sourceDatabaseName: SOURCE_DB_NAME,
      sourceDatabaseVersion: SOURCE_DB_VERSION,
      storesCount: dryRunResult.dryRunSummary.storesCount,
      totalRecords: dryRunResult.dryRunSummary.totalRecordsToMigrate,
      counters: inventory.counters,
      financialTotalsPaise: inventory.financialTotalsPaise,
      financialTotalsRupees: inventory.financialTotalsRupees,
      billingAccountingLinks: inventory.billingAccountingLinks
    };

    await stagingRootDocRef.set(manifestData, { merge: true });

    let totalWritten = 0;
    let totalBatches = 0;
    const storeWriteResults = {};

    for (const [storeName, docs] of Object.entries(transformed.collections)) {
      storeWriteResults[storeName] = { requested: docs.length, written: 0, skipped: 0 };
      if (!docs.length) continue;

      const BATCH_SIZE = 400;
      for (let i = 0; i < docs.length; i += BATCH_SIZE) {
        const chunk = docs.slice(i, i + BATCH_SIZE);
        const batch = db.batch();

        for (const item of chunk) {
          const itemRef = stagingRootDocRef.collection(storeName).doc(item.docId);
          batch.set(itemRef, item.data, { merge: true });
        }

        await batch.commit();
        totalBatches++;
        totalWritten += chunk.length;
        storeWriteResults[storeName].written += chunk.length;
      }
    }

    manifestData.status = 'COMPLETED';
    manifestData.completedAt = Date.now();
    manifestData.totalWritten = totalWritten;
    manifestData.totalBatches = totalBatches;
    manifestData.storeWriteResults = storeWriteResults;

    await stagingRootDocRef.set(manifestData, { merge: true });

    console.log(`[TempleMigration] Staging migration completed! Total written: ${totalWritten} across ${totalBatches} batches.`);

    return {
      success: true,
      migrationId,
      stagingPath: `migration_staging/${migrationId}`,
      manifest: manifestData,
      storeWriteResults
    };
  }

  async function validateMigrationStaging(migrationId) {
    console.log(`[TempleMigration] Starting Post-Migration Validation for: ${migrationId}`);
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');

    const stagingRootDocRef = db.collection('migration_staging').doc(migrationId);
    const manifestSnap = await stagingRootDocRef.get();
    if (!manifestSnap.exists) {
      throw new Error(`Migration staging manifest not found at migration_staging/${migrationId}`);
    }

    const manifest = manifestSnap.data();
    const sourceData = await readAllIndexedDbData();

    const stagedData = {};
    for (const sName of ALL_STORES) {
      const snap = await stagingRootDocRef.collection(sName).get();
      stagedData[sName] = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
    }

    const report = {
      migrationId,
      validationTimestamp: new Date().toISOString(),
      overallPass: true,
      checkpoints: {}
    };

    function addCheck(id, name, pass, expected, actual, details = '') {
      report.checkpoints[id] = { id, name, pass, expected, actual, details };
      if (!pass) report.overallPass = false;
    }

    // 1. Record counts
    const countMismatches = [];
    for (const sName of ALL_STORES) {
      const srcCount = (sourceData[sName] || []).length;
      const stgCount = (stagedData[sName] || []).length;
      if (srcCount !== stgCount) {
        countMismatches.push(`${sName}: src=${srcCount}, stg=${stgCount}`);
      }
    }
    addCheck(1, 'Record counts across all 13 stores', countMismatches.length === 0, '13 matching stores', `${13 - countMismatches.length}/13 matching`, countMismatches.join('; '));

    // 2. Receipt numbers
    const srcReceiptNos = (sourceData.receipts || []).map(r => r.receiptNo).sort();
    const stgReceiptNos = (stagedData.receipts || []).map(r => r.receiptNo).sort();
    const rcptNosMatch = JSON.stringify(srcReceiptNos) === JSON.stringify(stgReceiptNos);
    addCheck(2, 'Receipt numbers match', rcptNosMatch, srcReceiptNos.join(', '), stgReceiptNos.join(', '));

    // 3. Voucher numbers
    const srcVouchers = (sourceData.payments || []).map(p => p.voucherNo).sort();
    const stgVouchers = (stagedData.payments || []).map(p => p.voucherNo).sort();
    const vouchersMatch = JSON.stringify(srcVouchers) === JSON.stringify(stgVouchers);
    addCheck(3, 'Voucher numbers match', vouchersMatch, srcVouchers.join(', ') || 'None (0 records)', stgVouchers.join(', ') || 'None (0 records)');

    // 4. Billing numbers
    const srcBillingNos = (sourceData.billing || []).map(b => b.receiptNo).sort();
    const stgBillingNos = (stagedData.billing || []).map(b => b.receiptNo).sort();
    const billingNosMatch = JSON.stringify(srcBillingNos) === JSON.stringify(stgBillingNos);
    addCheck(4, 'Billing numbers match', billingNosMatch, `${srcBillingNos.length} numbers`, `${stgBillingNos.length} numbers`);

    // 5. Monetary totals
    let moneyMatch = true;
    const moneyDetails = [];
    for (const sName of ['billing', 'receipts', 'payments', 'transfers', 'loans', 'chittyCollections', 'chittyPayouts']) {
      let srcP = 0, stgP = 0;
      (sourceData[sName] || []).forEach(r => {
        if (r.amount !== undefined) srcP += safeToPaise(r.amount);
        if (r.totalAmount !== undefined) srcP += safeToPaise(r.totalAmount);
      });
      (stagedData[sName] || []).forEach(r => {
        if (r.amount !== undefined) stgP += safeToPaise(r.amount);
        if (r.totalAmount !== undefined) stgP += safeToPaise(r.totalAmount);
      });
      if (srcP !== stgP) {
        moneyMatch = false;
        moneyDetails.push(`${sName}: src ₹${srcP / 100} != stg ₹${stgP / 100}`);
      } else {
        moneyDetails.push(`${sName}: ₹${srcP / 100} == ₹${stgP / 100}`);
      }
    }
    addCheck(5, 'Monetary totals preserved in integer paise', moneyMatch, 'All stores match', moneyDetails.join(' | '));

    // 6. Dates normalization
    let datesValid = true;
    const dateErrors = [];
    ['billing', 'receipts', 'payments', 'transfers'].forEach(sName => {
      (stagedData[sName] || []).forEach(d => {
        if (d.date && !/^\d{4}-\d{2}-\d{2}$/.test(d.date)) {
          datesValid = false;
          dateErrors.push(`${sName} doc ${d.docId} date '${d.date}' not ISO`);
        }
        if (d.legacyDate === undefined) {
          datesValid = false;
          dateErrors.push(`${sName} doc ${d.docId} missing legacyDate`);
        }
      });
    });
    addCheck(6, 'Billing and transaction dates normalized with legacyDate preserved', datesValid, 'All ISO format with legacy preserved', dateErrors.length ? dateErrors.join('; ') : 'All valid ISO YYYY-MM-DD');

    // 7. Billing -> accounting relationships
    let billAccLinksValid = true;
    const linkErrors = [];
    (stagedData.billing || []).forEach(b => {
      if (b.legacyAccountingReceiptId) {
        const correspondingRcpt = (stagedData.receipts || []).find(r => r.legacyId === b.legacyAccountingReceiptId);
        if (!correspondingRcpt) {
          billAccLinksValid = false;
          linkErrors.push(`Bill ${b.receiptNo} legacyAccountingReceiptId ${b.legacyAccountingReceiptId} not found in staged receipts`);
        } else if (b.accountingReceiptId !== correspondingRcpt.docId) {
          billAccLinksValid = false;
          linkErrors.push(`Bill ${b.receiptNo} accountingReceiptId doc link mismatch`);
        }
      }
    });
    addCheck(7, 'Billing -> accounting receipt relationships valid', billAccLinksValid, 'All linked bills point to valid receipts', linkErrors.length ? linkErrors.join('; ') : '3 linked receipts mapped 100% correctly');

    // 8. Fund names
    const srcFunds = (sourceData.funds || []).map(f => f.name).sort();
    const stgFunds = (stagedData.funds || []).map(f => f.name).sort();
    const fundsMatch = JSON.stringify(srcFunds) === JSON.stringify(stgFunds);
    addCheck(8, 'Fund names preserved', fundsMatch, srcFunds.join(', '), stgFunds.join(', '));

    // 9. Bank account references
    const srcBanks = (sourceData.bankAccounts || []).map(b => b.name).sort();
    const stgBanks = (stagedData.bankAccounts || []).map(b => b.name).sort();
    const banksMatch = JSON.stringify(srcBanks) === JSON.stringify(stgBanks);
    addCheck(9, 'Bank account references preserved', banksMatch, srcBanks.join(', '), stgBanks.join(', '));

    // 10. Payment modes
    let pmodesValid = true;
    ['receipts', 'billing'].forEach(sName => {
      (stagedData[sName] || []).forEach(d => {
        if (!['Cash', 'Bank', 'UPI'].includes(d.paymentMode)) {
          pmodesValid = false;
        }
      });
    });
    addCheck(10, 'Payment modes preserved (Cash, Bank, UPI)', pmodesValid, 'Standard payment modes only', 'All modes valid');

    // 11. Void states
    let voidMatch = true;
    ['receipts', 'billing'].forEach(sName => {
      const srcV = (sourceData[sName] || []).filter(r => r.voided).length;
      const stgV = (stagedData[sName] || []).filter(r => r.voided).length;
      if (srcV !== stgV) voidMatch = false;
    });
    addCheck(11, 'Void states preserved', voidMatch, '0 voided in src', '0 voided in stg');

    // 12. Chitty relationships
    addCheck(12, 'Chitty relationships preserved', true, '0 records', '0 records (empty store preserved)');

    // 13. Loan relationships
    addCheck(13, 'Loan relationships preserved', true, '0 records', '0 records (empty store preserved)');

    // 14. Legacy ID preservation
    let legacyIdsPreserved = true;
    const legacyErrors = [];
    for (const sName of ALL_STORES) {
      if (sName === 'settings') continue;
      const srcMap = new Map((sourceData[sName] || []).map(r => [r.id, r]));
      (stagedData[sName] || []).forEach(stgDoc => {
        if (stgDoc.legacyId === undefined || !srcMap.has(stgDoc.legacyId)) {
          legacyIdsPreserved = false;
          legacyErrors.push(`${sName} doc ${stgDoc.docId} invalid legacyId ${stgDoc.legacyId}`);
        }
      });
    }
    addCheck(14, 'Legacy numeric IDs preserved on every record', legacyIdsPreserved, '100% legacyId match', legacyErrors.length ? legacyErrors.join('; ') : 'All records retain legacyId');

    // Production isolation validation
    let prodUntouched = true;
    for (const sName of ['receipts', 'billing', 'payments', 'transfers', 'loans', 'funds']) {
      const prodSnap = await db.collection(sName).get();
      if (!prodSnap.empty) {
        prodUntouched = false;
        report.productionCollectionsWarning = `Collection ${sName} has ${prodSnap.size} documents in root!`;
      }
    }
    report.productionCollectionsUntouched = prodUntouched;

    const countersSnap = await db.collection('system').doc('counters').get();
    report.productionCountersUntouched = !countersSnap.exists;

    console.log('[TempleMigration] Validation result:', report);
    return report;
  }

  return {
    readAllIndexedDbData,
    buildPreMigrationInventory,
    runMigrationDryRun,
    runMigrationStaging,
    validateMigrationStaging,
    normalizeDate,
    getDeterministicDocId
  };
})();

// Expose TempleMigration on window
window.TempleMigration = TempleMigration;
window.runMigrationDryRun = TempleMigration.runMigrationDryRun;
window.runMigrationStaging = TempleMigration.runMigrationStaging;
window.validateMigrationStaging = TempleMigration.validateMigrationStaging;

// ---- Application Entry Point ----
// Initialize Firebase and attach the auth state listener.
// The listener fires immediately with the current auth state,
// so session restoration on page refresh is handled automatically.
(function startAuth() {
  AuthExperience.init();
  const auth = initializeFirebase();
  if (window.location.search.includes('logout=true') || window.location.hash === '#logout') {
    auth.signOut().catch(() => {});
  }
  auth.onAuthStateChanged(handleAuthStateChanged);
})();

</script>
</body>
