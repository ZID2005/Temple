/* ===================== DARKVEIL WEBGL CONTROLLER ===================== */
const DarkVeilBackground = (function() {
  let canvas = null;
  let animFrameId = null;
  let isRunning = false;
  let resizeHandler = null;
  let renderLoop = null;

  function init(targetCanvas) {
    canvas = targetCanvas || document.getElementById('auth-webgl-canvas');
    if (!canvas) return false;

    const prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    // 1. Try OGL if available
    if (window.OGL && window.OGL.Renderer) {
      try {
        return initWithOGL(window.OGL, prefersReducedMotion);
      } catch (err) {
        console.warn('OGL init failed, trying native WebGL fallback:', err);
      }
    }

    // 2. Try native WebGL
    try {
      return initWithNativeWebGL(prefersReducedMotion);
    } catch (err) {
      console.warn('Native WebGL init failed, applying static CSS fallback:', err);
      applyCssFallback();
      return false;
    }
  }

  function initWithOGL(OGL, reducedMotion) {
    const { Renderer, Program, Mesh, Triangle, Vec2 } = OGL;
    const renderer = new Renderer({
      dpr: Math.min(window.devicePixelRatio || 1, 2),
      canvas: canvas
    });
    const gl = renderer.gl;
    if (!gl) throw new Error('Could not get WebGL context from OGL');

    const geometry = new Triangle(gl);
    const program = new Program(gl, {
      vertex: darkVeilVertex,
      fragment: darkVeilFragment,
      uniforms: {
        uTime: { value: 0 },
        uResolution: { value: new Vec2() },
        uHueShift: { value: 0 },
        uNoise: { value: 0 },
        uScan: { value: 0 },
        uScanFreq: { value: 0 },
        uWarp: { value: 0 },
        uLightMode: { value: 0 }
      }
    });

    const mesh = new Mesh(gl, { geometry, program });

    function resize() {
      if (!canvas || !canvas.parentElement) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      program.uniforms.uResolution.value.set(w, h);
    }

    window.addEventListener('resize', resize);
    resizeHandler = resize;
    resize();

    const startTime = performance.now();
    const speed = reducedMotion ? 0 : 0.5;

    function loop() {
      if (!isRunning) return;
      const now = performance.now();
      program.uniforms.uTime.value = ((now - startTime) / 1000) * speed;
      renderer.render({ scene: mesh });
      if (!reducedMotion) {
        animFrameId = requestAnimationFrame(loop);
      }
    }

    isRunning = true;
    renderLoop = loop;
    loop();
    return true;
  }

  function initWithNativeWebGL(reducedMotion) {
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) throw new Error('WebGL not supported');

    function createShader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const info = gl.getShaderInfoLog(s);
        gl.deleteShader(s);
        throw new Error('Shader compile error: ' + info);
      }
      return s;
    }

    const vs = createShader(gl.VERTEX_SHADER, darkVeilVertex);
    const fs = createShader(gl.FRAGMENT_SHADER, darkVeilFragment);
    const prg = gl.createProgram();
    gl.attachShader(prg, vs);
    gl.attachShader(prg, fs);
    gl.linkProgram(prg);
    if (!gl.getProgramParameter(prg, gl.LINK_STATUS)) {
      throw new Error('Program link error: ' + gl.getProgramInfoLog(prg));
    }
    gl.useProgram(prg);

    // Full screen triangle
    const vertBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       3, -1,
      -1,  3
    ]), gl.STATIC_DRAW);

    const posLoc = gl.getAttribLocation(prg, 'position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    const uTimeLoc = gl.getUniformLocation(prg, 'uTime');
    const uResLoc = gl.getUniformLocation(prg, 'uResolution');
    const uHueLoc = gl.getUniformLocation(prg, 'uHueShift');
    const uNoiseLoc = gl.getUniformLocation(prg, 'uNoise');
    const uScanLoc = gl.getUniformLocation(prg, 'uScan');
    const uScanFreqLoc = gl.getUniformLocation(prg, 'uScanFreq');
    const uWarpLoc = gl.getUniformLocation(prg, 'uWarp');
    const uLightModeLoc = gl.getUniformLocation(prg, 'uLightMode');

    gl.uniform1f(uHueLoc, 0);
    gl.uniform1f(uNoiseLoc, 0);
    gl.uniform1f(uScanLoc, 0);
    gl.uniform1f(uScanFreqLoc, 0);
    gl.uniform1f(uWarpLoc, 0);
    gl.uniform1f(uLightModeLoc, 0);

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(prg);
      gl.uniform2f(uResLoc, w, h);
    }

    window.addEventListener('resize', resize);
    resizeHandler = resize;
    resize();

    const startTime = performance.now();
    const speed = reducedMotion ? 0 : 0.5;

    function loop() {
      if (!isRunning) return;
      const now = performance.now();
      gl.useProgram(prg);
      gl.uniform1f(uTimeLoc, ((now - startTime) / 1000) * speed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!reducedMotion) {
        animFrameId = requestAnimationFrame(loop);
      }
    }

    isRunning = true;
    renderLoop = loop;
    loop();
    return true;
  }

  function applyCssFallback() {
    const authExp = document.getElementById('auth-experience');
    if (authExp) authExp.classList.add('auth-fallback-bg');
    if (canvas) canvas.style.display = 'none';
  }

  function start() {
    if (!isRunning && renderLoop) {
      isRunning = true;
      renderLoop();
    }
  }

  function stop() {
    isRunning = false;
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
  }

  function destroy() {
    stop();
    if (resizeHandler) {
      window.removeEventListener('resize', resizeHandler);
      resizeHandler = null;
    }
  }

  return { init, start, stop, destroy, applyCssFallback, get isRunning() { return isRunning; } };
})();

/* ===================== AUTH & SPLASH EXPERIENCE COORDINATOR ===================== */
const AuthExperience = (function() {
  const SPLASH_TARGET_DURATION = 2500; // ~2.5 seconds branded opening
  let splashStartTime = 0;
  let authStateResolved = false;
  let resolvedUser = null;
  let currentStage = 'splash'; // 'splash' | 'login' | 'app'
  let transitionTimer = null;

  function init() {
    splashStartTime = performance.now();
    
    // Initialize WebGL background
    DarkVeilBackground.init(document.getElementById('auth-webgl-canvas'));

    // If OGL loads asynchronously, re-init to ensure full OGL renderer
    window.addEventListener('ogl-ready', () => {
      if (!DarkVeilBackground.isRunning) {
        DarkVeilBackground.init(document.getElementById('auth-webgl-canvas'));
      }
    });

    // Populate temple name dynamically from IndexedDB settings if customized
    try {
      if (typeof getOne === 'function') {
        getOne('settings', 1).then(s => {
          if (s && s.templeName && s.templeName.trim() !== 'മറുതാ ചാമുണ്ഡി ദേവി ക്ഷേത്രം') {
            renderGradualTempleName(s.templeName);
          }
        }).catch(() => {});
      }
    } catch(e) {}

    // Animate splash text sequence using existing Step 20.2 Motion System
    animateSplashEntrance();

    // Schedule check after approximately 2.5 seconds
    transitionTimer = setTimeout(checkAndProceed, SPLASH_TARGET_DURATION);
  }

  function segmentMalayalamGraphemes(str) {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter('ml', { granularity: 'grapheme' });
        return Array.from(seg.segment(str), s => s.segment);
      } catch (err) {}
    }
    return Array.from(str);
  }

  function renderGradualTempleName(nameText) {
    const container = document.getElementById('splash-temple-name');
    if (!container || !nameText) return;

    let lines = [];
    if (nameText.includes('\n')) {
      lines = nameText.split('\n').filter(Boolean);
    } else if (nameText.includes('ദേവി ക്ഷേത്രം')) {
      const parts = nameText.split('ദേവി');
      lines = [parts[0] + 'ദേവി', parts.slice(1).join('ദേവി').trim()];
    } else {
      lines = [nameText];
    }

    let globalCharIndex = 0;
    const html = lines.map(line => {
      const graphemes = segmentMalayalamGraphemes(line);
      const spans = graphemes.map(g => {
        const delay = (globalCharIndex * 0.04).toFixed(2);
        globalCharIndex++;
        if (g === ' ') {
          return `<span class="gradual-char gradual-space" style="transition-delay: ${delay}s;" aria-hidden="true">&nbsp;</span>`;
        }
        return `<span class="gradual-char" style="transition-delay: ${delay}s;" aria-hidden="true">${g}</span>`;
      }).join('');
      return `<span class="splash-name-line" aria-hidden="true">${spans}</span>`;
    }).join('');

    container.innerHTML = html;
    container.setAttribute('aria-label', nameText.replace(/\n/g, ' '));
    if (container.classList.contains('motion-in-view')) {
      container.querySelectorAll('.gradual-char').forEach(c => c.classList.add('char-visible'));
    }
  }

  function animateSplashEntrance() {
    const isReduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    document.body.classList.add('motion-ready');

    const emblem = document.getElementById('splash-emblem');
    const templeName = document.getElementById('splash-temple-name');
    const appTitle = document.getElementById('splash-app-title');
    const subtitle = document.getElementById('splash-subtitle');

    if (isReduced) {
      if (emblem) emblem.classList.add('motion-in-view');
      if (templeName) templeName.classList.add('motion-in-view');
      if (appTitle) appTitle.classList.add('motion-in-view');
      if (subtitle) subtitle.classList.add('motion-in-view');
      return;
    }

    // Sequence according to Step 22 specification:
    // 0.2–0.4s: Temple emblem appears (rollIn)
    setTimeout(() => { if (emblem) emblem.classList.add('motion-in-view'); }, 250);
    // 0.5–0.8s: Temple name gradual character reveal begins (500ms duration, 40ms stagger)
    setTimeout(() => { if (templeName) templeName.classList.add('motion-in-view'); }, 550);
    // 0.9–1.3s: TEMPLE ACCOUNTS appears (fadeInUp)
    setTimeout(() => { if (appTitle) appTitle.classList.add('motion-in-view'); }, 950);
    // 1.2–1.6s: Subtitle appears (calmInUp)
    setTimeout(() => { if (subtitle) subtitle.classList.add('motion-in-view'); }, 1300);
  }

  function onAuthStateChanged(user) {
    authStateResolved = true;
    resolvedUser = user;

    // If splash duration has already elapsed or if already at login stage, proceed
    const elapsed = performance.now() - splashStartTime;
    if (elapsed >= SPLASH_TARGET_DURATION || currentStage === 'login') {
      checkAndProceed();
    }
  }

  function checkAndProceed() {
    // If auth state is still pending resolution, wait safely until Firebase responds
    if (!authStateResolved) {
      return;
    }

    if (resolvedUser) {
      // User IS authenticated: Transition straight to App Shell without showing login
      transitionSplashToApp();
    } else {
      // User is NOT authenticated: Transition from Splash to Login
      if (currentStage === 'splash') {
        transitionSplashToLogin();
      }
    }
  }

  function transitionSplashToLogin() {
    currentStage = 'login';
    const splashStage = document.getElementById('splash-stage');
    const loginStage = document.getElementById('login-stage');
    if (!splashStage || !loginStage) return;

    // Splash fades & slides out (350ms)
    splashStage.classList.remove('active');
    splashStage.classList.add('stage-exit');

    setTimeout(() => {
      splashStage.style.display = 'none';
      loginStage.style.display = 'flex';
      void loginStage.offsetWidth; // Force reflow
      loginStage.classList.add('active');

      // Trigger login card motion entrance
      const loginCard = loginStage.querySelector('.login-card');
      if (loginCard) {
        loginCard.classList.add('motion-in-view');
        loginCard.querySelectorAll('[data-motion]').forEach(el => el.classList.add('motion-in-view'));
      }

      // Focus email input if not on mobile touch device
      const emailInput = document.getElementById('login-email');
      if (emailInput && !('ontouchstart' in window)) {
        setTimeout(() => emailInput.focus(), 150);
      }
    }, 350);
  }

  function transitionSplashToApp() {
    currentStage = 'app';
    const authExp = document.getElementById('auth-experience');
    const appShell = document.getElementById('app-shell');
    if (!authExp || !appShell) return;

    // Smooth fade out of auth experience
    authExp.classList.add('auth-hidden');

    // Show app shell
    appShell.style.display = 'flex';

    // Update topbar email
    const emailEl = document.getElementById('auth-user-email');
    if (emailEl && resolvedUser) emailEl.textContent = resolvedUser.email || '';

    setTimeout(() => {
      authExp.style.display = 'none';
      DarkVeilBackground.stop(); // Stop render loop to preserve system resources
    }, 450);

    // Boot application once per session
    if (!window._appBooted) {
      window._appBooted = true;
      if (typeof boot === 'function') {
        boot();
      }
    }
  }

  function transitionLoginToApp(user) {
    resolvedUser = user;
    currentStage = 'app';
    const authExp = document.getElementById('auth-experience');
    const appShell = document.getElementById('app-shell');
    if (!authExp || !appShell) return;

    authExp.classList.add('auth-hidden');
    appShell.style.display = 'flex';

    const emailEl = document.getElementById('auth-user-email');
    if (emailEl && resolvedUser) emailEl.textContent = resolvedUser.email || '';

    setTimeout(() => {
      authExp.style.display = 'none';
      DarkVeilBackground.stop();
    }, 450);

    if (!window._appBooted) {
      window._appBooted = true;
      if (typeof boot === 'function') {
        boot();
      }
    }
  }

  function showLoginOnLogout() {
    currentStage = 'login';
    resolvedUser = null;
    window._appBooted = false;

    const authExp = document.getElementById('auth-experience');
    const splashStage = document.getElementById('splash-stage');
    const loginStage = document.getElementById('login-stage');
    const appShell = document.getElementById('app-shell');

    // Hide app shell
    if (appShell) appShell.style.display = 'none';

    // Show auth experience in login stage immediately
    if (authExp) {
      authExp.style.display = 'flex';
      authExp.classList.remove('auth-hidden');
    }

    if (splashStage) {
      splashStage.style.display = 'none';
      splashStage.classList.remove('active', 'stage-exit');
    }

    if (loginStage) {
      loginStage.style.display = 'flex';
      loginStage.classList.add('active');
    }

    // Clear password & error for security
    const passInput = document.getElementById('login-password');
    if (passInput) passInput.value = '';
    const errEl = document.getElementById('login-error');
    if (errEl) errEl.textContent = '';

    // Wake up WebGL background loop
    DarkVeilBackground.start();

    const loginCard = loginStage ? loginStage.querySelector('.login-card') : null;
    if (loginCard) {
      loginCard.classList.add('motion-in-view');
      loginCard.querySelectorAll('[data-motion]').forEach(el => el.classList.add('motion-in-view'));
    }
  }

  return {
    init,
    onAuthStateChanged,
    transitionLoginToApp,
    showLoginOnLogout,
    get currentStage() { return currentStage; }
  };
})();

// Firebase auth state listener — called whenever auth state changes
async function handleAuthStateChanged(user) {
  if (user) {
    if (AuthExperience.currentStage === 'login') {
      AuthExperience.transitionLoginToApp(user);
    } else {
      AuthExperience.onAuthStateChanged(user);
    }
  } else {
    if (AuthExperience.currentStage === 'app') {
      AuthExperience.showLoginOnLogout();
    } else {
      AuthExperience.onAuthStateChanged(null);
    }
  }
}

// Handle login form submission
async function handleLogin() {
  const emailInput = document.getElementById('login-email');
  const passwordInput = document.getElementById('login-password');
  const loginBtn = document.getElementById('login-btn');
  const errorEl = document.getElementById('login-error');

  const email = (emailInput.value || '').trim();
  const password = passwordInput.value || '';

  // Basic client-side validation before hitting Firebase
  if (!email) { errorEl.textContent = 'Please enter your email address.'; emailInput.focus(); return; }
  if (!password) { errorEl.textContent = 'Please enter your password.'; passwordInput.focus(); return; }

  // Disable button and clear previous error
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in…';
  errorEl.textContent = '';

  try {
    const auth = firebase.auth();
    await auth.signInWithEmailAndPassword(email, password);
    // On success, onAuthStateChanged fires automatically
    passwordInput.value = '';
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign In';
  } catch (err) {
    // Map Firebase error codes to user-friendly messages
    const code = err.code || '';
    let message;
    if (code === 'auth/invalid-email') {
      message = 'Invalid email address.';
    } else if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
      message = 'Incorrect email or password.';
    } else if (code === 'auth/too-many-requests') {
      message = 'Too many failed attempts. Please try again later.';
    } else if (code === 'auth/network-request-failed') {
      message = 'Network error. Please check your internet connection.';
    } else if (code === 'auth/user-disabled') {
      message = 'This account has been disabled.';
    } else {
      message = 'Authentication failed. Please try again.';
    }
    errorEl.textContent = message;
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign In';
    passwordInput.value = '';
    passwordInput.focus();
  }
}

// Handle logout
async function handleLogout(force) {
  if (!force && typeof confirm === 'function' && !confirm('Sign out of Temple Accounts?')) return;
  try {
    await firebase.auth().signOut();
    // onAuthStateChanged will fire and show the login stage
  } catch (err) {
    console.error('Logout error:', err);
    alert('Logout failed. Please try again.');
  }
}

// Check for logout query or hash signal
if (window.location.search.includes('logout=true') || window.location.hash === '#logout') {
  try {
    if (typeof firebase !== 'undefined' && firebase.auth) {
      firebase.auth().signOut();
    }
  } catch(e) {}
}

// Allow pressing Enter in password and email fields
document.getElementById('login-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});
document.getElementById('login-email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('login-password').focus();
});

/* ===================== FIRESTORE INITIALIZATION =====================
   Task 1: Isolated Firestore initialization using existing Firebase app.
   Runs alongside IndexedDB without changing existing IndexedDB behavior.
   No production collections or documents are created automatically.
   ================================================================== */
let firestoreDb = null;

function initializeFirestore() {
  try {
    if (!firebase.apps || !firebase.apps.length) {
      if (typeof initializeFirebase === 'function') {
        initializeFirebase();
      }
    }
    if (!firestoreDb && typeof firebase !== 'undefined' && firebase.firestore) {
      firestoreDb = firebase.firestore();
      console.log('[Firestore] Foundation initialized successfully alongside IndexedDB.');
    }
    return firestoreDb;
  } catch (err) {
    console.error('[Firestore] Initialization error:', err);
    return null;
  }
}

function getFirestoreDb() {
  if (!firestoreDb) {
    initializeFirestore();
  }
  return firestoreDb;
}

/* ===================== AUTHENTICATION CONTEXT =====================
   Task 3: Safe helpers to detect currently authenticated Firebase user.
   Does not change authentication flow, roles, or existing users.
   ================================================================= */
function getCurrentFirebaseUser() {
  try {
    return (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth().currentUser : null;
  } catch (err) {
    console.warn('[Firestore Auth Context] Error retrieving current user:', err);
    return null;
  }
}

function getCurrentUserUid() {
  const user = getCurrentFirebaseUser();
  return user ? user.uid : null;
}

function getCurrentUserEmail() {
  const user = getCurrentFirebaseUser();
  return user ? user.email : null;
}

/* ===================== FIRESTORE PRODUCTION REPOSITORY & DATA ACCESS LAYER (STEP 15) =====================
   Authoritative Cloud Firestore Production Architecture:
   - Primary data store: Cloud Firestore (temple-f4f7d)
   - Cache / safety fallback: IndexedDB (temple_accounts_db, version 2)
   - Security: Authenticated requests only (request.auth != null)
   - Audit trail: createdBy, updatedBy (Firebase user UID), updatedAt (serverTimestamp)
   - Atomic transactions: Multi-user atomic counter & billing+accounting creation
   ======================================================================================================== */

/**
 * Executes a function within an atomic Firestore transaction.
 * @param {Function} transactionFn
 * @returns {Promise<any>}
 */
async function fsTransaction(transactionFn) {
  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');
  return await db.runTransaction(transactionFn);
}

/**
 * Creates a new Firestore write batch.
 * @returns {firebase.firestore.WriteBatch}
 */
function fsBatch() {
  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');
  return db.batch();
}

/**
 * Standard deterministic document ID prefix for stores.
 */
function getDeterministicDocPrefix(storeName) {
  const map = {
    settings: 'set_',
    funds: 'fund_',
    incomeCategories: 'incomeCat_',
    expenseCategories: 'expenseCat_',
    bankAccounts: 'bank_',
    billing: 'bill_',
    receipts: 'rcpt_',
    payments: 'pmt_',
    transfers: 'tx_',
    loans: 'loan_',
    chittyMembers: 'cm_',
    chittyCollections: 'cc_',
    chittyPayouts: 'cp_'
  };
  return map[storeName] || (storeName + '_');
}

/**
 * Fetch a single document by ID from a Firestore collection.
 * @param {string} collectionName
 * @param {string|number} docId
 * @returns {Promise<Object|null>} Document data with id, or null if not found
 */
async function fsGet(collectionName, docId) {
  try {
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');
    if (!collectionName || docId === undefined || docId === null) {
      throw new Error('Both collectionName and docId are required for fsGet.');
    }
    const snap = await db.collection(collectionName).doc(String(docId)).get();
    if (!snap.exists) return null;
    return { id: snap.id, ...snap.data() };
  } catch (err) {
    console.error(`[Firestore fsGet] Error reading ${collectionName}/${docId}:`, err);
    throw err;
  }
}

/**
 * Fetch all documents in a Firestore collection.
 * @param {string} collectionName
 * @returns {Promise<Array<Object>>} Array of document objects with IDs
 */
async function fsGetAll(collectionName) {
  try {
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');
    if (!collectionName) throw new Error('collectionName is required for fsGetAll.');
    const snap = await db.collection(collectionName).get();
    const records = [];
    snap.forEach(doc => {
      records.push({ id: doc.id, ...doc.data() });
    });
    return records;
  } catch (err) {
    console.error(`[Firestore fsGetAll] Error reading collection ${collectionName}:`, err);
    throw err;
  }
}

/**
 * Add a new document with an auto-generated or timestamped Firestore ID, injecting audit metadata.
 * @param {string} collectionName
 * @param {Object} data
 * @returns {Promise<string>} Generated document ID
 */
async function fsAdd(collectionName, data) {
  try {
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');
    if (!collectionName || !data) throw new Error('collectionName and data are required for fsAdd.');
    const user = getCurrentFirebaseUser();
    const uid = user ? user.uid : 'system';
    const payload = {
      ...data,
      source: data.source || 'firestore',
      createdBy: data.createdBy || uid,
      updatedBy: uid,
      createdAt: data.createdAt || Date.now()
    };
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
      payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    } else {
      payload.updatedAt = Date.now();
    }
    const docRef = await db.collection(collectionName).add(payload);
    return docRef.id;
  } catch (err) {
    console.error(`[Firestore fsAdd] Error adding to ${collectionName}:`, err);
    throw err;
  }
}

/**
 * Create or overwrite a document with a specific ID in Firestore, injecting audit metadata.
 * @param {string} collectionName
 * @param {string|number} docId
 * @param {Object} data
 * @param {boolean} [merge=false]
 * @returns {Promise<string>} Document ID
 */
async function fsSet(collectionName, docId, data, merge = false) {
  try {
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');
    if (!collectionName || docId === undefined || docId === null || !data) {
      throw new Error('collectionName, docId, and data are required for fsSet.');
    }
    const user = getCurrentFirebaseUser();
    const uid = user ? user.uid : 'system';
    const payload = {
      ...data,
      source: data.source || 'firestore',
      updatedBy: uid
    };
    if (!merge) {
      payload.createdBy = data.createdBy || uid;
      payload.createdAt = data.createdAt || Date.now();
    }
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
      payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    } else {
      payload.updatedAt = Date.now();
    }
    await db.collection(collectionName).doc(String(docId)).set(payload, { merge });
    return String(docId);
  } catch (err) {
    console.error(`[Firestore fsSet] Error writing ${collectionName}/${docId}:`, err);
    throw err;
  }
}

/**
 * Update specific fields in an existing document.
 * @param {string} collectionName
 * @param {string|number} docId
 * @param {Object} data
 * @returns {Promise<string>} Document ID
 */
async function fsUpdate(collectionName, docId, data) {
  try {
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');
    if (!collectionName || docId === undefined || docId === null || !data) {
      throw new Error('collectionName, docId, and data are required for fsUpdate.');
    }
    const user = getCurrentFirebaseUser();
    const uid = user ? user.uid : 'system';
    const payload = {
      ...data,
      updatedBy: uid
    };
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
      payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    } else {
      payload.updatedAt = Date.now();
    }
    await db.collection(collectionName).doc(String(docId)).update(payload);
    return String(docId);
  } catch (err) {
    console.error(`[Firestore fsUpdate] Error updating ${collectionName}/${docId}:`, err);
    throw err;
  }
}

/**
 * Delete a single document by ID from a Firestore collection.
 * @param {string} collectionName
 * @param {string|number} docId
 * @returns {Promise<boolean>} True on success
 */
async function fsDelete(collectionName, docId) {
  try {
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');
    if (!collectionName || docId === undefined || docId === null) {
      throw new Error('collectionName and docId are required for fsDelete.');
    }
    await db.collection(collectionName).doc(String(docId)).delete();
    return true;
  } catch (err) {
    console.error(`[Firestore fsDelete] Error deleting ${collectionName}/${docId}:`, err);
    throw err;
  }
}

/**
 * Execute a filtered/ordered query on a Firestore collection.
 * @param {string} collectionName
 * @param {Function} queryFn Function that takes a CollectionReference and returns a Query
 * @returns {Promise<Array<Object>>} Array of document objects with IDs
 */
async function fsQuery(collectionName, queryFn) {
  try {
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');
    if (!collectionName) throw new Error('collectionName is required for fsQuery.');
    let q = db.collection(collectionName);
    if (typeof queryFn === 'function') {
      q = queryFn(q) || q;
    }
    const snap = await q.get();
    const records = [];
    snap.forEach(doc => {
      records.push({ id: doc.id, ...doc.data() });
    });
    return records;
  } catch (err) {
    console.error(`[Firestore fsQuery] Error querying ${collectionName}:`, err);
    throw err;
  }
}

/* ===================== FIRESTORE TRANSACTION-SAFE COUNTERS =====================
   Atomic, multi-user transaction-safe counter increments.
   Counter document structure: system/counters
   Fields:
     receiptCounter: number (accounting receipts, e.g. R-1001)
     voucherCounter: number (payment vouchers, e.g. V-501 or V-1001)
     billingReceiptCounter: number (billing receipts, e.g. BILL-0001)
     receiptPrefix: string (default: 'R-')
     voucherPrefix: string (default: 'V-')
     billingPrefix: string (default: 'BILL-')
     updatedAt: timestamp
   ============================================================================== */

const FS_COUNTERS_COLLECTION = 'system';
const FS_COUNTERS_DOC_ID = 'counters';

/**
 * Returns a DocumentReference to the counters document.
 */
function getFsCountersDocRef() {
  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');
  return db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID);
}

/**
 * Core atomic counter allocator using Firestore runTransaction.
 */
async function _fsAllocateCounter(field, defaultInitial, prefixField, defaultPrefix, padDigits = 0) {
  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');
  const counterRef = getFsCountersDocRef();

  return await db.runTransaction(async (tx) => {
    const snap = await tx.get(counterRef);
    const data = snap.exists ? snap.data() : {};

    const rawVal = data[field];
    const currentVal = (typeof rawVal === 'number')
      ? rawVal
      : (rawVal !== undefined && !isNaN(parseInt(rawVal, 10)) ? parseInt(rawVal, 10) : defaultInitial);

    const nextVal = currentVal + 1;
    const prefix = (data[prefixField] !== undefined && data[prefixField] !== null) ? data[prefixField] : defaultPrefix;

    const formattedNo = padDigits > 0
      ? `${prefix}${String(nextVal).padStart(padDigits, '0')}`
      : `${prefix}${nextVal}`;

    const updatePayload = {
      [field]: nextVal
    };
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
      updatePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    } else {
      updatePayload.updatedAt = Date.now();
    }

    tx.set(counterRef, updatePayload, { merge: true });
    return formattedNo;
  });
}

/**
 * Allocates next accounting receipt number atomically in Firestore.
 * Format: R-XXXX (e.g., R-1001, R-1002...)
 */
async function fsNextReceiptNo() {
  try {
    return await _fsAllocateCounter('receiptCounter', 1000, 'receiptPrefix', 'R-', 0);
  } catch (err) {
    console.error('[Firestore fsNextReceiptNo] Transaction allocation failed:', err);
    throw err;
  }
}

/**
 * Allocates next payment voucher number atomically in Firestore.
 * Format: V-XXXX (e.g., V-501, V-502...)
 */
async function fsNextVoucherNo() {
  try {
    return await _fsAllocateCounter('voucherCounter', 500, 'voucherPrefix', 'V-', 0);
  } catch (err) {
    console.error('[Firestore fsNextVoucherNo] Transaction allocation failed:', err);
    throw err;
  }
}

/**
 * Allocates next billing receipt number atomically in Firestore.
 * Format: BILL-XXXX (e.g., BILL-0001, BILL-0002...)
 */
async function fsNextBillingReceiptNo() {
  try {
    return await _fsAllocateCounter('billingReceiptCounter', 0, 'billingPrefix', 'BILL-', 4);
  } catch (err) {
    console.error('[Firestore fsNextBillingReceiptNo] Transaction allocation failed:', err);
    throw err;
  }
}

/**
 * Utility to inspect current Firestore counters document without incrementing.
 */
async function fsGetCounters() {
  try {
    const db = getFirestoreDb();
    if (!db) return null;
    const snap = await getFsCountersDocRef().get();
    return snap.exists ? snap.data() : null;
  } catch (err) {
    console.warn('[Firestore fsGetCounters] Failed to read counters:', err);
    return null;
  }
}

/**
 * Utility to initialize Firestore counters document if needed.
 */
async function fsInitCounters(initialValues = {}, overwrite = false) {
  try {
    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');
    const counterRef = getFsCountersDocRef();
    const snap = await counterRef.get();
    if (snap.exists && !overwrite) {
      console.log('[Firestore fsInitCounters] Counters already initialized:', snap.data());
      return snap.data();
    }
    const defaults = {
      receiptCounter: 1000,
      voucherCounter: 500,
      billingReceiptCounter: 0,
      receiptPrefix: 'R-',
      voucherPrefix: 'V-',
      billingPrefix: 'BILL-',
      ...initialValues
    };
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
      defaults.initializedAt = firebase.firestore.FieldValue.serverTimestamp();
    } else {
      defaults.initializedAt = Date.now();
    }
    await counterRef.set(defaults, { merge: true });
    console.log('[Firestore fsInitCounters] Counters document initialized:', defaults);
    return defaults;
  } catch (err) {
    console.error('[Firestore fsInitCounters] Initialization failed:', err);
    throw err;
  }
}

/* ===================== CACHE-INTEGRATED REPOSITORY FUNCTIONS ===================== */

/**
 * Primary read method for any store/collection.
 * Authoritatively queries Cloud Firestore first; syncs IndexedDB cache; falls back to IndexedDB if offline.
 */
async function fsGetAllSafe(storeName) {
  try {
    const user = getCurrentFirebaseUser();
    if (user) {
      const db = getFirestoreDb();
      if (db) {
        const snap = await db.collection(storeName).get();
        const records = [];
        snap.forEach(doc => {
          const data = doc.data();
          const legacyId = (data.legacyId !== undefined && data.legacyId !== null)
            ? data.legacyId
            : (data.id !== undefined ? data.id : doc.id);
          records.push({
            ...data,
            firestoreId: doc.id,
            id: legacyId
          });
        });

        // Background cache synchronization to IndexedDB: ensure cache mirrors authoritative Firestore
        if (typeof clearStore === 'function' && typeof putRec === 'function') {
          try {
            await clearStore(storeName);
            for (const rec of records) {
              await putRec(storeName, rec);
            }
          } catch (cacheErr) {
            console.warn(`[Repository] Background cache update skipped for ${storeName}:`, cacheErr);
          }
        }

        return records;
      }
    }
  } catch (err) {
    console.warn(`[Repository] Firestore read failed for ${storeName}; using IndexedDB cache fallback:`, err);
  }

  // Fallback to IndexedDB cache
  if (typeof getAll === 'function') {
    return await getAll(storeName);
  }
  return [];
}

/**
 * Primary single-record read method.
 */
async function fsGetOneSafe(storeName, id) {
  try {
    const user = getCurrentFirebaseUser();
    if (user) {
      const db = getFirestoreDb();
      if (db) {
        let docSnap = null;
        if (typeof id === 'string') {
          docSnap = await db.collection(storeName).doc(id).get();
        }
        if (!docSnap || !docSnap.exists) {
          const prefix = getDeterministicDocPrefix(storeName);
          const candidateId = `${prefix}${id}`;
          docSnap = await db.collection(storeName).doc(candidateId).get();
        }
        if (!docSnap || !docSnap.exists) {
          const qSnap = await db.collection(storeName).where('legacyId', '==', id).limit(1).get();
          if (!qSnap.empty) docSnap = qSnap.docs[0];
        }
        if (!docSnap || !docSnap.exists) {
          const qSnap = await db.collection(storeName).where('id', '==', id).limit(1).get();
          if (!qSnap.empty) docSnap = qSnap.docs[0];
        }
        if (docSnap && docSnap.exists) {
          const data = docSnap.data();
          return {
            ...data,
            firestoreId: docSnap.id,
            id: (data.legacyId !== undefined && data.legacyId !== null) ? data.legacyId : (data.id !== undefined ? data.id : docSnap.id)
          };
        }
      }
    }
  } catch (err) {
    console.warn(`[Repository] Firestore getOne failed for ${storeName}/${id}; using IndexedDB cache:`, err);
  }

  if (typeof getOne === 'function') {
    return await getOne(storeName, id);
  }
  return null;
}

/**
 * Primary transactional record write method.
 * Persists to Cloud Firestore FIRST; on success updates local IndexedDB cache.
 * Throws on Firestore error to prevent uncommitted local-only transactions.
 */
async function fsSaveRecordSafe(storeName, record, isEdit = false) {
  const user = getCurrentFirebaseUser();
  if (!user) throw new Error('Authentication required: please log in to record transactions.');

  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');

  const prefix = getDeterministicDocPrefix(storeName);
  let docId = record.firestoreId;
  if (!docId) {
    const rawId = (record.legacyId !== undefined && record.legacyId !== null)
      ? record.legacyId
      : (record.id !== undefined && record.id !== null ? record.id : Date.now());
    docId = `${prefix}${rawId}`;
    record.firestoreId = docId;
  }

  const payload = {
    ...record,
    firestoreId: docId,
    source: 'firestore',
    updatedBy: user.uid
  };
  if (!isEdit) {
    payload.createdBy = record.createdBy || user.uid;
    payload.createdAt = record.createdAt || Date.now();
  }
  if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
    payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  } else {
    payload.updatedAt = Date.now();
  }

  // 1. Write to Firestore FIRST
  await db.collection(storeName).doc(docId).set(payload, { merge: true });

  // 2. On confirmed Firestore success, update IndexedDB cache
  if (typeof putRec === 'function') {
    try {
      await putRec(storeName, { ...payload, id: record.id || record.legacyId || docId });
    } catch (cacheErr) {
      console.warn(`[Repository] Warning caching to IndexedDB (${storeName}):`, cacheErr);
    }
  }

  return docId;
}

/**
 * Primary record update method.
 */
async function fsUpdateRecordSafe(storeName, id, updates) {
  const user = getCurrentFirebaseUser();
  if (!user) throw new Error('Authentication required.');

  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');

  let docId = (typeof id === 'string' && id.includes('_')) ? id : `${getDeterministicDocPrefix(storeName)}${id}`;
  const payload = {
    ...updates,
    updatedBy: user.uid
  };
  if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
    payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  } else {
    payload.updatedAt = Date.now();
  }

  // 1. Update in Firestore
  await db.collection(storeName).doc(docId).set(payload, { merge: true });

  // 2. Update IndexedDB cache
  if (typeof getOne === 'function' && typeof putRec === 'function') {
    try {
      const cached = (await getOne(storeName, id)) || {};
      await putRec(storeName, { ...cached, ...payload, id: id });
    } catch (cacheErr) {
      console.warn(`[Repository] Cache update warning for ${storeName}/${id}:`, cacheErr);
    }
  }

  return docId;
}

/**
 * Primary record delete method (for master items or hard-deleted entries).
 */
async function fsDeleteRecordSafe(storeName, id) {
  const user = getCurrentFirebaseUser();
  if (!user) throw new Error('Authentication required.');

  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');

  let docId = (typeof id === 'string' && id.includes('_')) ? id : `${getDeterministicDocPrefix(storeName)}${id}`;

  // 1. Delete from Firestore FIRST
  await db.collection(storeName).doc(docId).delete();

  // 2. On confirmed success, remove from IndexedDB cache
  if (typeof deleteRec === 'function') {
    try {
      await deleteRec(storeName, id);
      const numId = (typeof id === 'string' && id.includes('_')) ? parseInt(id.split('_')[1], 10) : parseInt(id, 10);
      if (!isNaN(numId) && numId !== id) {
        await deleteRec(storeName, numId);
      }
    } catch (cacheErr) {
      console.warn(`[Repository] Cache delete warning for ${storeName}/${id}:`, cacheErr);
    }
  }

  return true;
}

/**
 * Primary audit-safe void method (preserves document in Firestore with void metadata).
 */
async function fsVoidRecordSafe(storeName, id, voidReason) {
  const user = getCurrentFirebaseUser();
  if (!user) throw new Error('Authentication required.');

  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');

  let docId = (typeof id === 'string' && id.includes('_')) ? id : `${getDeterministicDocPrefix(storeName)}${id}`;
  const voidPayload = {
    voided: true,
    voidReason: voidReason || 'Voided by user',
    voidDate: todayISO(),
    updatedBy: user.uid
  };
  if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
    voidPayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  } else {
    voidPayload.updatedAt = Date.now();
  }

  // 1. Update Firestore document
  await db.collection(storeName).doc(docId).set(voidPayload, { merge: true });

  // 2. Update IndexedDB cache
  if (typeof getOne === 'function' && typeof putRec === 'function') {
    try {
      const numId = (typeof id === 'string' && id.includes('_')) ? parseInt(id.split('_')[1], 10) : parseInt(id, 10);
      const targetId = (!isNaN(numId) && numId > 0) ? numId : id;
      const cached = (await getOne(storeName, targetId)) || (await getOne(storeName, id)) || {};
      await putRec(storeName, { ...cached, ...voidPayload, id: (cached && cached.id !== undefined) ? cached.id : targetId });
      if (typeof id === 'string' && id !== String(targetId) && typeof deleteRec === 'function') {
        await deleteRec(storeName, id).catch(() => {});
      }
    } catch (cacheErr) {
      console.warn(`[Repository] Cache void warning for ${storeName}/${id}:`, cacheErr);
    }
  }

  return true;
}

/**
 * Authoritative master data loader:
 * Reads settings/set_1 and all master configuration collections from Cloud Firestore.
 * Updates runtime memory (window.APP_SETTINGS) and syncs local IndexedDB cache.
 */
async function loadAuthoritativeMasterData() {
  try {
    const db = getFirestoreDb();
    if (!db) {
      console.warn('[MasterData] Firestore not initialized, using local cache.');
      await seedIfNeeded();
      return;
    }

    // 1. Load authoritative settings from settings/set_1
    const fsSettings = await fsGet('settings', 'set_1');
    if (fsSettings) {
      window.APP_SETTINGS = {
        ...fsSettings,
        id: 1,
        legacyId: 1
      };
      if (typeof putRec === 'function') {
        try { await putRec('settings', window.APP_SETTINGS); } catch(e) {}
      }
      console.log('[MasterData] Authoritative settings loaded from Firestore settings/set_1.');
    } else {
      await seedIfNeeded();
    }

    // 2. Load authoritative master configuration collections
    const masterCollections = ['funds', 'incomeCategories', 'expenseCategories', 'bankAccounts'];
    for (const colName of masterCollections) {
      try {
        const snap = await db.collection(colName).get();
        if (!snap.empty && typeof putRec === 'function') {
          for (const doc of snap.docs) {
            const data = doc.data();
            const rec = {
              ...data,
              firestoreId: doc.id,
              id: (data.legacyId !== undefined && data.legacyId !== null) ? data.legacyId : doc.id
            };
            try { await putRec(colName, rec); } catch(e) {}
          }
        }
      } catch(colErr) {
        console.warn(`[MasterData] Warning syncing ${colName} from Firestore:`, colErr);
      }
    }
  } catch (err) {
    console.warn('[MasterData] Master data fetch warning, falling back to local cache:', err);
    await seedIfNeeded();
  }
}

/**
 * Atomic billing creation and accounting link strategy:
 * Executes inside an atomic Cloud Firestore transaction (runTransaction).
 * 1. Atomically reads and increments system/counters (billingReceiptCounter and receiptCounter).
 * 2. Formats BILL-XXXX and R-XXXX sequence numbers.
 * 3. Creates billing document in Firestore.
 * 4. Creates linked accounting receipt in Firestore.
 * 5. Returns both records.
 * Neither document can exist without the other; zero race conditions across concurrent sessions.
 */
async function fsCreateBillingWithAccounting(billingInput) {
  const db = getFirestoreDb();
  if (!db) throw new Error('Firestore is not initialized.');
  const user = getCurrentFirebaseUser();
  if (!user) throw new Error('Authentication required: please log in to record bills.');

  const counterRef = getFsCountersDocRef();

  return await db.runTransaction(async (tx) => {
    // 1. Read counters inside transaction
    const cSnap = await tx.get(counterRef);
    const cData = cSnap.exists ? cSnap.data() : {};

    const curBillCnt = (typeof cData.billingReceiptCounter === 'number')
      ? cData.billingReceiptCounter
      : (window.APP_SETTINGS && typeof window.APP_SETTINGS.billingReceiptCounter === 'number' ? window.APP_SETTINGS.billingReceiptCounter : 0);
    const curRcptCnt = (typeof cData.receiptCounter === 'number')
      ? cData.receiptCounter
      : (window.APP_SETTINGS && typeof window.APP_SETTINGS.receiptCounter === 'number' ? window.APP_SETTINGS.receiptCounter : 1000);

    const nextBillNum = curBillCnt + 1;
    const nextRcptNum = curRcptCnt + 1;

    const billPrefix = cData.billingPrefix || cData.billingReceiptPrefix || 'BILL-';
    const rcptPrefix = cData.receiptPrefix || 'R-';

    const formattedBillNo = `${billPrefix}${String(nextBillNum).padStart(4, '0')}`;
    const formattedRcptNo = `${rcptPrefix}${nextRcptNum}`;

    // 2. Prepare doc refs
    const billDocId = `bill_${nextBillNum}`;
    const rcptDocId = `rcpt_${nextRcptNum}`;
    const billingDocRef = db.collection('billing').doc(billDocId);
    const receiptDocRef = db.collection('receipts').doc(rcptDocId);

    // 3. Resolve fund, category, and date mapping
    const isoDate = getBillingRecordISODate(billingInput) || todayISO();
    const fund = billingCategoryToFund(billingInput.category);
    let incomeCat = 'Vazhipadu Income';
    if (billingInput.category === 'നേർച്ച') incomeCat = 'Donation Income';
    else if (billingInput.category === 'പുനരുദ്ധാരണം') incomeCat = 'Donation Income';

    let description = String(billingInput.item || '');
    if (billingInput.quantity && billingInput.quantity > 1) {
      description += ` (Qty: ${billingInput.quantity})`;
    }
    if (billingInput.star) {
      description += ` | Star: ${billingInput.star}`;
    }

    const nowTimestamp = Date.now();
    const serverTs = (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue)
      ? firebase.firestore.FieldValue.serverTimestamp()
      : nowTimestamp;

    // 4. Construct Billing Payload
    const billingPayload = {
      id: nextBillNum,
      legacyId: nextBillNum,
      firestoreId: billDocId,
      receiptNo: formattedBillNo,
      createdAt: nowTimestamp,
      date: billingInput.date,
      time: billingInput.time,
      category: billingInput.category,
      item: billingInput.item,
      devoteeName: billingInput.devoteeName,
      star: billingInput.star,
      quantity: billingInput.quantity,
      unitPrice: billingInput.unitPrice,
      totalAmount: billingInput.totalAmount,
      paymentMode: billingInput.paymentMode,
      accountingReceiptId: rcptDocId,
      accountingReceiptNo: formattedRcptNo,
      source: 'firestore',
      createdBy: user.uid,
      updatedBy: user.uid,
      updatedAt: serverTs
    };

    // 5. Construct Accounting Receipt Payload
    const receiptPayload = {
      id: nextRcptNum,
      legacyId: nextRcptNum,
      firestoreId: rcptDocId,
      receiptNo: formattedRcptNo,
      date: isoDate,
      name: billingInput.devoteeName || '',
      mobile: '',
      fund: fund,
      category: incomeCat,
      description: description,
      paymentMode: billingInput.paymentMode,
      bankAccount: billingInput.bankAccount || '',
      amount: billingInput.totalAmount,
      remarks: `Billing Receipt: ${formattedBillNo}`,
      voided: false,
      createdAt: nowTimestamp,
      source: 'billing',
      billingId: nextBillNum,
      billingFirestoreId: billDocId,
      billingReceiptNo: formattedBillNo,
      createdBy: user.uid,
      updatedBy: user.uid,
      updatedAt: serverTs
    };

    // 6. Write all 3 within transaction atomically
    tx.set(counterRef, {
      billingReceiptCounter: nextBillNum,
      receiptCounter: nextRcptNum,
      updatedAt: serverTs
    }, { merge: true });

    tx.set(billingDocRef, billingPayload);
    tx.set(receiptDocRef, receiptPayload);

    return {
      billingRecord: billingPayload,
      accountingReceipt: receiptPayload
    };
  });
}

/* ===================== FIRESTORE DIAGNOSTICS & TEST UTILITIES =====================
   Safe connectivity and transaction verification without touching
   production collections (receipts, payments, billing, transfers, loans, etc.).
   Uses temporary document with immediate teardown.
   ================================================================================= */

async function fsRunDiagnostics() {
  const report = {
    sdkLoaded: false,
    initialized: false,
    authDetected: false,
    currentUser: null,
    testDocWriteReadDelete: false,
    counterTransactionTest: false,
    indexedDbIntact: false,
    errors: []
  };

  try {
    // 1. SDK Presence
    if (typeof firebase !== 'undefined' && typeof firebase.firestore === 'function') {
      report.sdkLoaded = true;
    } else {
      report.errors.push('Firebase Firestore SDK is not loaded or missing compat script.');
      return report;
    }

    // 2. Database instance
    const db = getFirestoreDb();
    if (db) {
      report.initialized = true;
    } else {
      report.errors.push('Firestore database failed to initialize.');
      return report;
    }

    // 3. Authenticated user
    const user = getCurrentFirebaseUser();
    if (user) {
      report.authDetected = true;
      report.currentUser = { uid: user.uid, email: user.email };
    }

    // 4. Temporary isolated connectivity test (write, read, delete)
    const testDocId = `test_${Date.now()}`;
    const testRef = db.collection('__system_diagnostics__').doc(testDocId);
    await testRef.set({ test: true, timestamp: Date.now() });
    const snap = await testRef.get();
    if (snap.exists && snap.data().test === true) {
      report.testDocWriteReadDelete = true;
    }
    await testRef.delete();

    // 5. Test isolated atomic transaction on dedicated test document
    const testCounterRef = db.collection('__system_diagnostics__').doc('test_tx_counter');
    const allocated = await db.runTransaction(async (tx) => {
      const cSnap = await tx.get(testCounterRef);
      const cur = cSnap.exists ? (cSnap.data().val || 0) : 0;
      const next = cur + 1;
      tx.set(testCounterRef, { val: next });
      return `DIAG-${String(next).padStart(4, '0')}`;
    });
    if (allocated.startsWith('DIAG-')) {
      report.counterTransactionTest = true;
    }
    await testCounterRef.delete();

    // 6. Verify IndexedDB intact
    if (typeof window.APP_SETTINGS !== 'undefined' && typeof DB_VERSION !== 'undefined') {
      report.indexedDbIntact = (DB_VERSION === 2);
    }

    console.log('[Firestore Diagnostics] Result:', report);
  } catch (err) {
    console.error('[Firestore Diagnostics] Execution error:', err);
    report.errors.push(err.message || String(err));
  }

  return report;
}
