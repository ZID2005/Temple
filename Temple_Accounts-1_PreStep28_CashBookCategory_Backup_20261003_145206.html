}
async function monthIncomeExpense(monthStart, monthEnd) {
  const receipts = (await activeReceipts()).filter(r => r.date >= monthStart && r.date <= monthEnd);
  const payments = (await activePayments()).filter(p => p.date >= monthStart && p.date <= monthEnd);
  return { income: sumField(receipts, 'amount'), expense: sumField(payments, 'amount') };
}

/* ==========================================================================
   REFERENCE-MATCHED MOTION & TEXT ANIMATION ENGINE (STEP 20.2)
   Reproducing React / Motion & Cult UI TextAnimate specifications in vanilla JS
   ========================================================================== */

let motionObserver = null;

function markMotionSettled(el) {
  if (!el || el.classList.contains('motion-settled')) return;
  el.classList.add('motion-settled');
  el.querySelectorAll('.motion-text-char').forEach(ch => ch.classList.add('char-settled'));
}

function activateMotionElement(el) {
  if (!el) return;
  el.classList.remove('motion-settled');
  el.classList.add('motion-in-view');
  el.querySelectorAll('.motion-text-char').forEach(ch => {
    ch.classList.remove('char-settled');
    ch.classList.add('char-in-view');
  });

  // STEP 26.2: Release GPU compositing layer and resting transforms upon entrance completion
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    markMotionSettled(el);
    return;
  }

  let durationMs = 800;
  try {
    const cs = window.getComputedStyle(el);
    const durs = (cs.transitionDuration || '').split(',').map(s => parseFloat(s) || 0);
    const dels = (cs.transitionDelay || '').split(',').map(s => parseFloat(s) || 0);
    const maxDur = Math.max(...durs, 0.65);
    const maxDel = Math.max(...dels, 0);
    durationMs = Math.round((maxDur + maxDel) * 1000) + 60;
  } catch (_) {}

  let settled = false;
  let safetyTimer = null;

  const onTransEnd = (e) => {
    if (e.target === el) {
      if (e.propertyName === 'transform' || el.getAttribute('data-motion') === 'fadeIn') {
        cleanup();
      }
    }
  };

  const cleanup = () => {
    if (settled) return;
    settled = true;
    if (safetyTimer) {
      clearTimeout(safetyTimer);
      safetyTimer = null;
    }
    el.removeEventListener('transitionend', onTransEnd);
    if (el.isConnected) {
      markMotionSettled(el);
    }
  };

  el.addEventListener('transitionend', onTransEnd);
  safetyTimer = setTimeout(cleanup, Math.max(durationMs, 900));
}

function getMotionObserver() {
  if (motionObserver) return motionObserver;
  if (!('IntersectionObserver' in window)) return null;

  motionObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        activateMotionElement(el);
        observer.unobserve(el); // Equivalent to useInView(ref, { once: true })
      }
    });
  }, {
    root: null,
    threshold: 0.06,
    rootMargin: '0px 0px -20px 0px'
  });

  return motionObserver;
}

function initMotionObserver(container) {
  // If reduced motion is preferred, immediately show everything and settle
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('[data-motion]').forEach(el => {
      el.classList.add('motion-in-view');
      markMotionSettled(el);
    });
    return;
  }

  // Ensure body is flagged motion-ready
  document.body.classList.add('motion-ready');

  const root = container || document;
  const obs = getMotionObserver();

  // If IntersectionObserver is not supported, immediately activate
  if (!obs) {
    root.querySelectorAll('[data-motion]').forEach(el => activateMotionElement(el));
    return;
  }

  const targets = root.querySelectorAll('[data-motion]:not(.motion-in-view)');
  const viewHeight = window.innerHeight || document.documentElement.clientHeight;

  targets.forEach(target => {
    // If element is already in initial viewport view, activate directly with stagger
    const rect = target.getBoundingClientRect();
    if (rect.top <= viewHeight && rect.bottom >= 0) {
      requestAnimationFrame(() => {
        activateMotionElement(target);
      });
    } else {
      obs.observe(target);
    }
  });
}

function initTextAnimate(container) {
  const root = container || document;
  const elements = root.querySelectorAll('[data-motion-text]:not(.text-anim-ready)');

  elements.forEach(el => {
    el.classList.add('text-anim-ready');
    const originalText = el.textContent.trim();
    if (!originalText) return;

    // Split words so layout and spacing are 100% preserved
    const words = originalText.split(/\s+/);
    el.innerHTML = words.map((word, wIdx) => {
      const delay = wIdx * 35; // 35ms stagger between words
      return `<span class="motion-text-char" style="transition-delay: ${delay}ms;">${esc(word)}</span>`;
    }).join(' ');

    // If element or parent is already motion-in-view or reduced motion, trigger chars immediately
    const parentMotion = el.closest('[data-motion]');
    const isReduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (isReduced) {
      el.querySelectorAll('.motion-text-char').forEach(ch => {
        ch.classList.add('char-in-view');
        ch.classList.add('char-settled');
      });
    } else if (el.classList.contains('motion-in-view') || (parentMotion && parentMotion.classList.contains('motion-in-view'))) {
      el.querySelectorAll('.motion-text-char').forEach(ch => ch.classList.add('char-in-view'));
      if (el.classList.contains('motion-settled') || (parentMotion && parentMotion.classList.contains('motion-settled'))) {
        el.querySelectorAll('.motion-text-char').forEach(ch => ch.classList.add('char-settled'));
      }
    }
  });
}

/* Helper to immediately trigger popIn or entrance on dynamic elements (like billing success) */
function triggerMotionPop(targetEl) {
  if (!targetEl) return;
  targetEl.classList.remove('motion-settled');
  targetEl.classList.remove('motion-in-view');
  targetEl.setAttribute('data-motion', 'popIn');
  void targetEl.offsetWidth; // reflow
  activateMotionElement(targetEl);
}

const VIEW_TITLES = {

  analytics: 'Analytics',
  trialbalance: 'Trial Balance', settings: 'Settings', backup: 'Backup & Restore'
};
let viewTransitionCleanup = null;
async function navigate(view, ...args) {
  CURRENT_VIEW = view;
  qsa('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  el('topbar-title').textContent = VIEW_TITLES[view] || view;
  const main = el('app-main');
  
  // Page Transition: reset and trigger reference-matched subtle entrance
  if (viewTransitionCleanup) {
    viewTransitionCleanup();
    viewTransitionCleanup = null;
  }
  main.classList.remove('view-enter-active');
  main.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const renderer = VIEW_RENDERERS[view];
    if (renderer) main.innerHTML = await renderer(...args);
    else main.innerHTML = '<div class="loading">Not found</div>';
    
    // Clean up any pending transition before triggering new one
    if (viewTransitionCleanup) {
      viewTransitionCleanup();
      viewTransitionCleanup = null;
    }

    void main.offsetWidth; // trigger reflow for smooth view entrance
    main.classList.add('view-enter-active');
    
    // STEP 26.1: Clean up .view-enter-active after 280ms entrance completes to release GPU compositing layer
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || window.getComputedStyle(main).animationName === 'none') {
      main.classList.remove('view-enter-active');
    } else {
      let safetyTimer = null;
      const onAnimEnd = (e) => {
        if (e.target === main && e.animationName === 'viewEnterKeyframe') {
          cleanup();
        }
      };
      const cleanup = () => {
        if (safetyTimer) {
          clearTimeout(safetyTimer);
          safetyTimer = null;
        }
        main.removeEventListener('animationend', onAnimEnd);
        main.classList.remove('view-enter-active');
        if (viewTransitionCleanup === cleanup) {
          viewTransitionCleanup = null;
        }
      };
      viewTransitionCleanup = cleanup;
      main.addEventListener('animationend', onAnimEnd);
      // Safety fallback: ensure cleanup if animationend is suppressed (e.g. background tab), strictly after 280ms duration
      safetyTimer = setTimeout(cleanup, 320);
    }
    
    wireViewEvents(view);
    initTextAnimate(main);
    initMotionObserver(main);
  } catch (err) {
    console.error(err);
    main.innerHTML = `<div class="loading">Error loading view: ${esc(err.message)}</div>`;
  }
}

async function renameRecord(store, id) {
  const rec = await getOne(store, id) || await fsGetOneSafe(store, id);
  if (!rec) return;
  const v = prompt('Rename to:', rec.name);
  if (v === null) return;
  const trimmed = v.trim();
  if (!trimmed) return;
  const user = getCurrentFirebaseUser();
  if (!user) { alert('Authentication required.'); return; }
  rec.name = trimmed;
  try {
    await fsUpdateRecordSafe(store, id, { name: trimmed });
  } catch (err) {
    alert('Unable to update in the cloud: ' + (err.message || err));
    return;
  }
  await navigate('settings');
}

}
function filterReceiptTable() {
  const q = el('receiptSearch').value.toLowerCase();
  qsa('#receiptTable tbody tr').forEach(tr => { tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none'; });

async function saveReceipt(print) {
  const form = el('receiptForm');
  const fd = new FormData(form);
  const amount = parseFloat(fd.get('amount'));
  const receiptNoInput = (fd.get('receiptNo') || '').trim();
  const editId = fd.get('editId') ? (isNaN(parseInt(fd.get('editId'), 10)) ? fd.get('editId') : parseInt(fd.get('editId'), 10)) : null;
  if (!fd.get('name') || !fd.get('date') || !fd.get('fund') || !amount || amount <= 0) {
    alert('Please fill all required fields with a valid amount.'); return;
  }

  const user = getCurrentFirebaseUser();
  if (!user) {
    alert('Authentication required: please log in to record transactions.');
    return;
  }

  const rec = {
    date: fd.get('date'), name: fd.get('name'), mobile: fd.get('mobile') || '',
    fund: fd.get('fund'), category: fd.get('category') || 'Uncategorized', description: fd.get('description') || '',
    paymentMode: fd.get('paymentMode'), bankAccount: fd.get('bankAccount') || '', amount,
    remarks: fd.get('remarks') || ''
  };

  let savedRec = null;
  try {
    if (editId) {
      const prior = await getOne('receipts', editId) || await fsGetOneSafe('receipts', editId);
      rec.id = editId;
      rec.receiptNo = receiptNoInput || (prior ? prior.receiptNo : '');
      rec.voided = prior ? prior.voided : false;
      rec.voidReason = prior ? prior.voidReason : undefined;
      rec.voidDate = prior ? prior.voidDate : undefined;
      rec.createdAt = prior ? prior.createdAt : Date.now();
      rec.firestoreId = prior ? prior.firestoreId : ('rcpt_' + editId);
      await fsUpdateRecordSafe('receipts', rec.firestoreId || editId, rec);
      savedRec = rec;
    } else {
      // Allocate atomic receipt number from Firestore
      const allocatedNo = await fsNextReceiptNo();
      rec.receiptNo = allocatedNo;
      rec.voided = false;
      rec.createdAt = Date.now();
      const numMatch = allocatedNo.match(/\d+$/);
      if (numMatch) {
        rec.id = parseInt(numMatch[0], 10);
        rec.legacyId = rec.id;
      }
      rec.firestoreId = 'rcpt_' + (rec.id || Date.now());
      await fsSaveRecordSafe('receipts', rec, false);
      savedRec = rec;
    }
  } catch (err) {
    console.error('Error persisting receipt to Firestore:', err);
    alert('Unable to save to the cloud. Please check your connection and try again.\n(' + (err.message || err) + ')');
    return;
  }

  await refreshSettings();
  await navigate('receipts');
  if (print && savedRec) printReceipt(savedRec);
}
/* Step 23.3 — BUG-002 fix: Firestore is the authoritative source for receipt reprint.
   IndexedDB is tried as a fast-path cache but any IDB error is silently suppressed
   so it can never block reprint.  No writes, no counter changes. */
async function reprintReceipt(id) {
  let r = null;

  // 1. Try Firestore first — authoritative source
  try {
    r = await fsGetOneSafe('receipts', id);
  } catch (fsErr) {
    console.warn('[reprintReceipt] Firestore lookup failed:', fsErr);
    // Fall through to IndexedDB cache below
  }

  // 2. If Firestore returned nothing, try IndexedDB cache as fallback
  if (!r) {
    try {
      r = await getOne('receipts', id);
    } catch (idbErr) {
      // IDB NotFoundError or any other IDB error must not prevent reprint
      console.warn('[reprintReceipt] IndexedDB lookup failed (non-fatal):', idbErr);
    }
  }

  if (r) {
    printReceipt(r);
  } else {
    alert('Receipt not found. It may have been deleted or the ID is invalid.');
  }
}
function printReceipt(r) {
  const s = window.APP_SETTINGS;
  el('print-area').className = 'receipt-print';
  el('print-area').innerHTML = `
    <div class="pr-center pr-bold">${esc(s.templeName)}</div>
    <div class="pr-center">${esc(s.address)}</div>
    <div class="pr-line"></div>
    <div class="pr-flex"><span>No: ${esc(r.receiptNo)}</span><span>${fmtDate(r.date)}</span></div>
    <div>Name: <b>${esc(r.name)}</b></div>
    ${r.mobile?`<div>Mobile: ${esc(r.mobile)}</div>`:''}
    <div class="pr-line"></div>
    <div>${esc(r.fund)} — ${esc(r.category)}</div>
    <div>${esc(r.description||'')}</div>
    <div class="pr-flex pr-bold"><span>Amount:</span><span>${fmtMoney(r.amount)}</span></div>
    <div>Mode: ${esc(r.paymentMode)}${r.bankAccount?(' - '+esc(r.bankAccount)):''}</div>
    <div>In words: ${amountInWords(r.amount)}</div>
    <div class="pr-line"></div>
    <div class="pr-flex"><span></span><span>Treasurer / Authorized Person</span></div>
    <div class="pr-center pr-bold" style="margin-top:6px;">*** അമ്മേ നാരായണ ദേവി നാരായണ ***</div>
  `;
  window.print();
}
function amountInWords(n) {
  n = Math.round(parseFloat(n) || 0);
  if (n === 0) return 'Zero Rupees only';
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(x) { if (x < 20) return a[x]; return b[Math.floor(x/10)] + (x%10 ? ' ' + a[x%10] : ''); }
  function three(x) { if (x < 100) return two(x); return a[Math.floor(x/100)] + ' Hundred' + (x%100 ? ' ' + two(x%100) : ''); }
  let str = '';
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh = Math.floor(n / 100000); n %= 100000;
  const thousand = Math.floor(n / 1000); n %= 1000;
  const hundred = n;
  if (crore) str += three(crore) + ' Crore ';
  if (lakh) str += three(lakh) + ' Lakh ';
  if (thousand) str += three(thousand) + ' Thousand ';
  if (hundred) str += three(hundred);
  return (str.trim() || 'Zero') + ' Rupees only';
}
async function refreshSettings() {
  try {
    const fsSettings = await fsGet('settings', 'set_1');
    if (fsSettings) {
      window.APP_SETTINGS = { ...fsSettings, id: 1, legacyId: 1 };
      if (typeof db !== 'undefined' && db) {
        try { await putRec('settings', window.APP_SETTINGS); } catch(e){}
      }
      return window.APP_SETTINGS;
    }
  } catch (e) {
    console.warn('[refreshSettings] Failed to fetch settings from Firestore, using cache:', e);
  }
  window.APP_SETTINGS = await getOne('settings', 1);
  return window.APP_SETTINGS;
}
async function voidRecord(store, id) {
  const reason = prompt('Reason for voiding this entry?');
  if (reason === null) return;
  const user = getCurrentFirebaseUser();
  if (!user) { alert('Authentication required.'); return; }
  try {
    await fsVoidRecordSafe(store, id, reason);
  } catch (err) {
    alert('Unable to void record in the cloud: ' + (err.message || err));
    return;
  }
  await navigate(CURRENT_VIEW);
}

];

async function getNextBillingReceiptNo() {
  try {
    const c = await fsGetCounters();
    const curNum = (c && typeof c.billingReceiptCounter === 'number')
      ? c.billingReceiptCounter
      : (window.APP_SETTINGS && typeof window.APP_SETTINGS.billingReceiptCounter === 'number' ? window.APP_SETTINGS.billingReceiptCounter : 0);
    const prefix = (c && (c.billingPrefix || c.billingReceiptPrefix)) || 'BILL-';
    return `${prefix}${String(curNum + 1).padStart(4, '0')}`;
  } catch (err) {
    console.warn('Error calculating next billing receipt number preview:', err);
    return 'BILL-0001';
  }
}

  const catSel = el('categorySelect');
  if (!catSel) return;

}

function syncCategorySegmentedUI() {
  const catSel = el('categorySelect');
  if (!catSel) return;
  const currentCat = catSel.value;
  document.querySelectorAll('.billing-cat-pill').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === currentCat);
  });
}

function setBillingPaymentMode(mode) {
  const modeSel = el('paymentMode');
  if (!modeSel) return;
  modeSel.value = mode;
  syncPaymentModeUI();
}

function syncPaymentModeUI() {
  const modeSel = el('paymentMode');
  if (!modeSel) return;
  const currentMode = modeSel.value || 'Cash';
  document.querySelectorAll('.payment-mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === currentMode);
  });
}

function billingAdjustQty(delta) {
  const qtyInput = el('qty');
  if (!qtyInput) return;
  let val = parseInt(qtyInput.value, 10);
  if (isNaN(val) || val < 1) val = 1;
  val = Math.max(1, val + delta);
  qtyInput.value = val;
  qtyInput.classList.remove('input-error');
  updatePrice();
}

function syncItemChipsUI() {
  const itemSel = el('itemSelect');
  const chips = document.querySelectorAll('.billing-item-chip');
  if (!itemSel || !chips.length) return;
  chips.forEach((c, idx) => {
    c.classList.toggle('active', idx === itemSel.selectedIndex);
  });
}

function loadCategoryItems() {
  const catSel = el('categorySelect');
  const itemSel = el('itemSelect');
  const chipsContainer = el('billingItemChips');
  if (!catSel || !itemSel) return;
  const cat = catSel.value;
  itemSel.innerHTML = '';
  const filtered = masterItems.filter(i => i.cat === cat);

  if (filtered.length === 0) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.innerText = 'ഇനങ്ങൾ ഒന്നും ചേർത്തിട്ടില്ല (No items found)';
    itemSel.appendChild(opt);
    if (chipsContainer) chipsContainer.innerHTML = '<span class="muted" style="font-size:12px;">No items found</span>';
  } else {
    if (chipsContainer) chipsContainer.innerHTML = '';
    filtered.forEach((i, idx) => {
      const opt = document.createElement('option');
      opt.value = i.price;
      opt.innerText = i.name + (i.price > 0 ? ` — ₹${i.price}` : ' — തുക നൽകുക (Variable)');
      opt.dataset.name = i.name;
      opt.dataset.price = i.price;
      itemSel.appendChild(opt);

      // Render touch-friendly item chips for fast counter billing
      if (chipsContainer) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = `billing-item-chip ${idx === 0 ? 'active' : ''}`;
        chip.dataset.index = idx;
        chip.dataset.name = i.name;
        chip.onclick = () => {
          itemSel.selectedIndex = idx;
          updatePrice();
          syncItemChipsUI();
          if (i.price === 0) {
            const totalInp = el('total');
            if (totalInp) { totalInp.focus(); totalInp.select(); }
          }
        };
        chip.innerHTML = `
          <span class="chip-name">${esc(i.name)}</span>
          <span class="chip-price">${i.price > 0 ? '₹' + i.price : 'സംഭാവന'}</span>
        `;
        chipsContainer.appendChild(chip);
      }
    });
  }
  updatePrice();
  syncCategorySegmentedUI();
}

function updatePrice() {
  const itemSel = el('itemSelect');
  const qtyInput = el('qty');
  const totalInput = el('total');
  const helpText = el('billingAmountHelp');
  const displayTotal = el('billingDisplayTotal');
  const donationRow = el('billingDonationInputRow');
  const qtyGroup = el('billingQtyGroup');
  if (!itemSel || !totalInput) return;

  if (!itemSel.options.length || itemSel.selectedIndex < 0) {
    totalInput.value = '0';
    if (displayTotal) displayTotal.textContent = '₹0.00';
    return;
  }
  const selectedOpt = itemSel.options[itemSel.selectedIndex];
  if (!selectedOpt || !selectedOpt.dataset.name) {
    totalInput.value = '0';
    if (displayTotal) displayTotal.textContent = '₹0.00';
    return;
  }

  const price = parseFloat(selectedOpt.value) || 0;
  const rawQty = parseInt(qtyInput ? qtyInput.value : 1, 10);
  const qty = (!isNaN(rawQty) && rawQty > 0) ? rawQty : 1;

  if (price === 0) {
    // Variable donation mode (e.g. Punarudharanam)
    totalInput.readOnly = false;
    totalInput.style.background = '#ffffff';
    totalInput.placeholder = 'സംഭാവന തുക നൽകുക (Enter donation amount)';
    if (totalInput.dataset.itemMode === 'fixed') {
      totalInput.value = '';
    }
    totalInput.dataset.itemMode = 'donation';
    if (donationRow) donationRow.style.display = 'flex';
    if (qtyGroup) qtyGroup.style.opacity = '0.5';
    const currentVal = parseFloat(totalInput.value) || 0;
    if (helpText) helpText.textContent = '💡 സംഭാവന തുക ടൈപ്പ് ചെയ്യുക (Enter donation amount).';
    if (displayTotal) {
      displayTotal.textContent = '₹' + currentVal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  } else {
    // Fixed price mode (e.g. Archana, Raktapushpanjali, Kadumpayasam)
    totalInput.readOnly = true;
    totalInput.style.background = '#f4f2ec';
    totalInput.placeholder = '';
    const calculatedTotal = price * qty;
    totalInput.value = calculatedTotal;
    totalInput.dataset.itemMode = 'fixed';
    if (donationRow) donationRow.style.display = 'none';
    if (qtyGroup) qtyGroup.style.opacity = '1';
    if (helpText) helpText.textContent = `₹${price} × ${qty} = ₹${calculatedTotal}`;
    if (displayTotal) {
      displayTotal.textContent = '₹' + calculatedTotal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  }
  syncItemChipsUI();
}

  }
  const s = window.APP_SETTINGS || {};
  const templeName = s.templeName || 'മറുതാ ചാമുണ്ഡി ദേവി ക്ഷേത്രം';
  const templeAddress = s.address || 'ആശാരിവിളാകം, കേരളദിത്യപുരം';
  const r = currentBillingReceipt;

  const printArea = el('print-area');
  if (!printArea) return;

  printArea.className = 'billing-58mm';
  printArea.innerHTML = renderThermalReceiptHTML(r, templeName, templeAddress);

  document.body.classList.add('printing-billing-58mm');
  let dynamicStyle = document.getElementById('print-58mm-page-style');
  if (!dynamicStyle) {
    dynamicStyle = document.createElement('style');
    dynamicStyle.id = 'print-58mm-page-style';
    dynamicStyle.textContent = '@page { size: 58mm auto; margin: 0; } @media print { html, body { width: 58mm !important; margin: 0 !important; padding: 0 !important; background: #fff !important; } }';
    document.head.appendChild(dynamicStyle);
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.print();
    });
  });

  const finishPrint = () => {
    document.body.classList.remove('printing-billing-58mm');
    const pageStyle = document.getElementById('print-58mm-page-style');
    if (pageStyle && pageStyle.parentNode) {
      pageStyle.parentNode.removeChild(pageStyle);
    }
    window.removeEventListener('afterprint', finishPrint);
  };
  window.addEventListener('afterprint', finishPrint);
  setTimeout(finishPrint, 2500);
}

/**
 * Maps a billing category to an accounting fund name.
 * Uses existing fund names from the database seeded defaults.
 */
function billingCategoryToFund(cat) {
  if (cat === 'വഴിപാട്') return 'General Temple Fund';
  if (cat === 'നേർച്ച')  return 'General Temple Fund';
  if (cat === 'പുനരുദ്ധാരണം') return 'Punarudharanam Fund';
  return 'General Temple Fund'; // fallback
}

/**
 * Maps a billing category to an accounting income category name.
 * Checks against existing incomeCategories store; uses best match.
 */
async function billingCategoryToIncomeCategory(cat) {
  const incomeCats = await allIncomeCategories();
  const names = incomeCats.map(c => c.name);

  // Preferred exact names
  if (cat === 'വഴിപാട്') {
    if (names.includes('Vazhipadu Income')) return 'Vazhipadu Income';
    if (names.includes('Archana Income')) return 'Archana Income';
    if (names.includes('Pooja Income')) return 'Pooja Income';
  }
  if (cat === 'നേർച്ച' || cat === 'പുനരുദ്ധാരണം') {
    if (names.includes('Donation Income')) return 'Donation Income';
    if (names.includes('General Contribution')) return 'General Contribution';
  }
  // Last resort: first available category
  return names[0] || 'Other Income';
}

/**
 * Creates ONE accounting receipt from a billing record.
 * Implements duplicate prevention: checks billingRecord.accountingReceiptId first.
 * Also scans receipts store for any existing record sourced from same billing ID.
 * Returns { accountingReceiptId, accountingReceiptNo } on success, throws on failure.
 */
async function createAccountingReceiptFromBilling(billingRecord) {
  // Duplicate prevention check 1: already linked
  if (billingRecord.accountingReceiptId && billingRecord.accountingReceiptNo) {
    console.log('[Billing→Accounting] Already linked:', billingRecord.accountingReceiptNo);
    return {
      accountingReceiptId: billingRecord.accountingReceiptId,
      accountingReceiptNo: billingRecord.accountingReceiptNo
    };
  }

  // Duplicate prevention check 2: search receipts store for existing link
  const existingReceipts = await allReceipts();
  const existing = existingReceipts.find(r =>
    r.source === 'billing' && r.billingId === billingRecord.id && !r.voided
  );
  if (existing) {
    console.log('[Billing→Accounting] Found existing accounting receipt:', existing.receiptNo);
    return {
      accountingReceiptId: existing.id,
      accountingReceiptNo: existing.receiptNo
    };
  }

  // Build the ISO date for the accounting receipt from billing record date
  const isoDate = getBillingRecordISODate(billingRecord) || todayISO();

  // Resolve fund and income category
  const fund = billingCategoryToFund(billingRecord.category);
  const incomeCat = await billingCategoryToIncomeCategory(billingRecord.category);

  // Build description from item + qty + star
  let description = String(billingRecord.item || '');
  if (billingRecord.quantity && billingRecord.quantity > 1) {
    description += ` (Qty: ${billingRecord.quantity})`;
  }
  if (billingRecord.star) {
    description += ` | Star: ${billingRecord.star}`;
  }

  // Resolve bank account for UPI payments
  let bankAccount = '';
  if (billingRecord.paymentMode === 'UPI') {
    const bankAccts = await allBankAccounts();
    const defaultBank = bankAccts.find(b => b.isDefault) || bankAccts[0];
    bankAccount = defaultBank ? defaultBank.name : '';
  }

  // Generate the next accounting receipt number
  await refreshSettings();
  const accReceiptNo = await nextReceiptNo();

  // Construct accounting receipt record (same schema as receipts store)
  const accReceipt = {
    receiptNo: accReceiptNo,
    date: isoDate,
    name: billingRecord.devoteeName || '',
    mobile: '',
    fund: fund,
    category: incomeCat,
    description: description,
    paymentMode: billingRecord.paymentMode,
    bankAccount: bankAccount,
    amount: billingRecord.totalAmount,
    remarks: `Billing Receipt: ${billingRecord.receiptNo}`,
    voided: false,
    createdAt: billingRecord.createdAt || Date.now(),
    source: 'billing',
    billingId: billingRecord.id
  };

  // Save to receipts store and bump counter
  const accId = await addRec('receipts', accReceipt);
  await bumpReceiptCounter();
  await refreshSettings();

  console.log('[Billing→Accounting] Created accounting receipt:', accReceiptNo, 'ID:', accId);
  return {
    accountingReceiptId: accId,
    accountingReceiptNo: accReceiptNo
  };
}

/* Helper to extract YYYY-MM-DD from a billing record */
function getBillingRecordISODate(r) {
  if (r.createdAt) {
    const d = new Date(r.createdAt);
    if (!isNaN(d.getTime())) {
      const yr = d.getFullYear();
      const mo = String(d.getMonth() + 1).padStart(2, '0');
      const da = String(d.getDate()).padStart(2, '0');
      return `${yr}-${mo}-${da}`;
    }
  }
  if (r.date) {
    const s = String(r.date).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const parts = s.split('/');
    if (parts.length === 3) {
      return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
    }
    const dashParts = s.split('-');
    if (dashParts.length === 3 && dashParts[0].length <= 2) {
      return `${dashParts[2]}-${dashParts[1].padStart(2, '0')}-${dashParts[0].padStart(2, '0')}`;
    }
  }
  return '';
}

/* Date Preset shortcuts for Billing History */
function setBillingDatePreset(preset) {
  const fromInput = el('billingDateFrom');
  const toInput = el('billingDateTo');
  if (!fromInput || !toInput) return;

  const now = new Date();
  const formatISO = (d) => {
    const yr = d.getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const da = String(d.getDate()).padStart(2, '0');
    return `${yr}-${mo}-${da}`;
  };

  const todayStr = formatISO(now);

  if (preset === 'today') {
    fromInput.value = todayStr;
    toInput.value = todayStr;
  } else if (preset === 'yesterday') {
    const yest = new Date(now);
    yest.setDate(yest.getDate() - 1);
    const yestStr = formatISO(yest);
    fromInput.value = yestStr;
    toInput.value = yestStr;
  } else if (preset === 'this_week') {
    const d = new Date(now);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(d.setDate(diff));
    fromInput.value = formatISO(monday);
    toInput.value = todayStr;
  } else if (preset === 'this_month') {
    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
    fromInput.value = formatISO(firstDay);
    toInput.value = todayStr;
  }

  document.querySelectorAll('.date-preset-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.preset === preset);
  });

  applyBillingFilters();
}

  const fromDate = fromInput ? fromInput.value : '';

  const catFilter = catInput ? catInput.value : 'all';
  const modeFilter = modeInput ? modeInput.value : 'all';

  const filtered = all.filter(r => {
    // 1. Search text filter (receiptNo, devoteeName, item, category, star)
    if (q) {
      const haystack = [
        r.receiptNo || '',
        r.devoteeName || r.name || '',
        r.item || '',
        r.category || r.cat || '',
        r.star || ''
      ].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }

    // 2. Date range filter
    if (fromDate || toDate) {
      const rDate = getBillingRecordISODate(r);
      if (fromDate && rDate && rDate < fromDate) return false;
      if (toDate && rDate && rDate > toDate) return false;
      if (!rDate && (fromDate || toDate)) return false;
    }

    // 3. Category filter
    if (catFilter && catFilter !== 'all') {
      const rCat = r.category || r.cat || '';
      if (rCat !== catFilter) return false;
    }

    // 4. Payment mode filter
    if (modeFilter && modeFilter !== 'all') {
      const rMode = (r.paymentMode || 'Cash').toLowerCase();
      if (rMode !== modeFilter.toLowerCase()) return false;
    }

    return true;
  });

  // Update Result Count Badge
  const countBadge = el('billingResultCountBadge');
  if (countBadge) {
    countBadge.textContent = `Showing ${filtered.length} of ${all.length} bills`;
  }

  // Update Filtered Totals Summary
  let totalAmount = 0;
  let cashTotal = 0;
  let upiTotal = 0;
  filtered.forEach(r => {
    const amt = (typeof r.totalAmount === 'number') ? r.totalAmount : (parseFloat(r.totalAmount || r.total) || 0);
    totalAmount += amt;
    const mode = (r.paymentMode || 'Cash').toLowerCase();
    if (mode === 'cash') cashTotal += amt;
    else if (mode === 'upi') upiTotal += amt;
  });

  if (el('billingTotalBillsVal')) el('billingTotalBillsVal').textContent = filtered.length;
  if (el('billingTotalAmountVal')) el('billingTotalAmountVal').textContent = '₹' + totalAmount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (el('billingCashTotalVal')) el('billingCashTotalVal').textContent = '₹' + cashTotal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (el('billingUpiTotalVal')) el('billingUpiTotalVal').textContent = '₹' + upiTotal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Update Billing History Table
  const wrap = el('billingHistoryTableWrap');
  if (!wrap) return;

  if (filtered.length === 0) {
    if (all.length === 0) {
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🧾</div>
          <div class="empty-state-title">No records found</div>

              🔄 Clear Filters
            </button>
          </div>
        </div>
      `;
    }
    return;
  }

  wrap.innerHTML = `
    <table id="billingHistoryTable">
      <thead>
        <tr>
          <th>Receipt No</th>
          <th>Date</th>
          <th>Time</th>
          <th>Category</th>

        </tr>
      </thead>
      <tbody>
        ${filtered.map(r => {
          const qty = (typeof r.quantity === 'number') ? r.quantity : (parseInt(r.qty, 10) || 1);
          const total = (typeof r.totalAmount === 'number') ? r.totalAmount : (parseFloat(r.total) || 0);
          const mode = r.paymentMode || 'Cash';
          const modeBadge = (mode.toLowerCase() === 'upi')

/* Export Filtered Billing Records to CSV with UTF-8 BOM */
function exportBillingReportCSV() {
  const records = window.billingReportFilteredRecords || [];
  if (records.length === 0) {
    alert('No billing records match the current report filters to export.');
    return;
  }

  const headers = [
    'Receipt No',
    'Date',
    'Time',
    'Category',
    'Item',
    'Devotee Name',
    'Star',
    'Quantity',
    'Unit Price',
    'Total Amount',
    'Payment Mode'
  ];

  const rows = records.map(r => {
    const qty = (typeof r.quantity === 'number') ? r.quantity : (parseInt(r.qty, 10) || 1);
    const rawUnitPrice = (typeof r.unitPrice === 'number') ? r.unitPrice : 0;
    const rawTotal = (typeof r.totalAmount === 'number') ? r.totalAmount : (parseFloat(r.totalAmount || r.total) || 0);
    const unitPrice = rawUnitPrice > 0 ? rawUnitPrice : (qty > 0 ? parseFloat((rawTotal / qty).toFixed(2)) : rawTotal);
    return [
      r.receiptNo || '',
      r.date || '',
      r.time || '',
      r.category || r.cat || '',
      r.item || '',
      r.devoteeName || r.name || '',
      r.star || '',
      qty,
      unitPrice,
      rawTotal,
      r.paymentMode || 'Cash'
    ];
  });

  function escapeCSVCell(val) {
    if (val === null || val === undefined) return '';
    const str = String(val);
    if (str.includes('"') || str.includes(',') || str.includes('\n') || str.includes('\r')) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  const csvContent = [
    headers.map(escapeCSVCell).join(','),
    ...rows.map(row => row.map(escapeCSVCell).join(','))
  ].join('\r\n');

  // UTF-8 BOM (\uFEFF) ensures Excel and spreadsheets open Malayalam properly without garbled characters
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const fromInput = el('billingReportDateFrom');
  const toInput = el('billingReportDateTo');
  const fromDate = fromInput ? fromInput.value.trim() : '';
  const toDate = toInput ? toInput.value.trim() : '';

  let filename = '';
  if (fromDate && toDate && fromDate === toDate) {
    filename = `temple-billing-${fromDate}.csv`;
  } else if (fromDate && toDate) {
    filename = `temple-billing-${fromDate}-to-${toDate}.csv`;
  } else if (fromDate) {
    filename = `temple-billing-from-${fromDate}.csv`;
  } else if (toDate) {
    filename = `temple-billing-to-${toDate}.csv`;
  } else {
    filename = `temple-billing-export-${todayISO()}.csv`;
  }

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

          <button type="button" class="btn" onclick="closeModal(); reprintBillingRecord(${r.id});" style="display: inline-flex; align-items: center; gap: 6px;">

  `;
}

/* Reprint existing billing record without creating a new bill or incrementing counter */
async function reprintBillingRecord(id) {
  const r = await getBillingRecord(id);
  if (!r) {
    alert('Billing record not found!');
    return;
  }
  currentBillingReceipt = r;
  renderBillingReceiptPreview(r);
  printBillingReceipt();
}

/* Delete / Void billing record with audit-safe accounting linkage handling */
async function deleteBillingRecord(id, receiptNo) {
  const billingRec = await getBillingRecord(id);
  if (!billingRec) {
    alert('Billing record not found.');
    return;
  }

  const hasAccounting = billingRec.accountingReceiptId && billingRec.accountingReceiptNo;

  let confirmMsg;
  if (hasAccounting) {
    confirmMsg = `Delete billing record ${receiptNo || id}?\n\nThis bill is linked to accounting receipt ${billingRec.accountingReceiptNo}.\nThe accounting receipt will be VOIDED (not deleted) to preserve audit history.\n\nContinue?`;
  } else {
    confirmMsg = `Delete ${receiptNo || 'this bill'}? This cannot be undone.`;
  }

  if (!confirm(confirmMsg)) return;

  const user = getCurrentFirebaseUser();
  if (!user) {
    alert('Authentication required: please sign in to perform this action.');
    return;
  }

  // 1. If linked to accounting receipt, void it in Firestore (and update cache)
  if (hasAccounting) {
    try {
      await fsVoidRecordSafe('receipts', billingRec.accountingReceiptId, `Source Billing Receipt ${billingRec.receiptNo} was deleted/voided`);
      console.log('[Billing→Accounting] Voided accounting receipt in Firestore:', billingRec.accountingReceiptNo);
    } catch (voidErr) {
      console.warn('[Billing→Accounting] Could not void accounting receipt in Firestore:', voidErr);
      alert('Unable to void linked accounting receipt in the cloud: ' + (voidErr.message || voidErr) + '\nDelete aborted.');
      return;
    }
  }

  // 2. Delete billing record from Firestore first, then IndexedDB cache
  try {
    await fsDeleteRecordSafe('billing', billingRec.firestoreId || id);
  } catch (delErr) {
    console.error('Failed to delete billing record from Firestore:', delErr);
    alert('Unable to delete billing record from the cloud: ' + (delErr.message || delErr));
    return;
  }

  if (currentBillingReceipt && (currentBillingReceipt.id === id || currentBillingReceipt.firestoreId === id)) {
    currentBillingReceipt = null;
    renderBillingReceiptPreview(null);
  }
  await refreshBillingHistory();
}

async function savePayment(print) {
  const form = el('paymentForm');
  const fd = new FormData(form);
  const amount = parseFloat(fd.get('amount'));
  const voucherNoInput = (fd.get('voucherNo') || '').trim();
  const editId = fd.get('editId') ? (isNaN(parseInt(fd.get('editId'), 10)) ? fd.get('editId') : parseInt(fd.get('editId'), 10)) : null;
  if (!fd.get('paidTo') || !fd.get('date') || !fd.get('fund') || !fd.get('category') || !amount || amount <= 0) {
    alert('Please fill all required fields with a valid amount.'); return;
  }

  const user = getCurrentFirebaseUser();
  if (!user) {
    alert('Authentication required: please log in to record transactions.');
    return;
  }

  const rec = {
    date: fd.get('date'), fund: fd.get('fund'), category: fd.get('category'),
    description: fd.get('description') || '', paidTo: fd.get('paidTo'), paymentMode: fd.get('paymentMode'),
    bankAccount: fd.get('bankAccount') || '', amount, billNo: fd.get('billNo') || '', remarks: fd.get('remarks') || ''
  };

  let savedRec = null;
  try {
    if (editId) {
      const prior = await getOne('payments', editId) || await fsGetOneSafe('payments', editId);
      rec.id = editId;
      rec.voucherNo = voucherNoInput || (prior ? prior.voucherNo : '');
      rec.voided = prior ? prior.voided : false;
      rec.voidReason = prior ? prior.voidReason : undefined;
      rec.voidDate = prior ? prior.voidDate : undefined;
      rec.createdAt = prior ? prior.createdAt : Date.now();
      rec.firestoreId = prior ? prior.firestoreId : ('pmt_' + editId);
      await fsUpdateRecordSafe('payments', rec.firestoreId || editId, rec);
      savedRec = rec;
    } else {
      // Allocate atomic voucher number from Firestore
      const allocatedNo = await fsNextVoucherNo();
      rec.voucherNo = allocatedNo;
      rec.voided = false;
      rec.createdAt = Date.now();
      const numMatch = allocatedNo.match(/\d+$/);
      if (numMatch) {
        rec.id = parseInt(numMatch[0], 10);
        rec.legacyId = rec.id;
      }
      rec.firestoreId = 'pmt_' + (rec.id || Date.now());
      await fsSaveRecordSafe('payments', rec, false);
      savedRec = rec;
    }
  } catch (err) {
    console.error('Error persisting payment to Firestore:', err);
    alert('Unable to save to the cloud. Please check your connection and try again.\n(' + (err.message || err) + ')');
    return;
  }

  await refreshSettings();
  await navigate('payments');
  if (print && savedRec) printVoucher(savedRec);
}

  const p = await getOne('payments', id) || await fsGetOneSafe('payments', id);
  if (p) printVoucher(p);

async function buildCashBookRows() {
  const s = window.APP_SETTINGS;
  const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
    activeReceipts(), activePayments(), allTransfers(), allLoans(), allChittyCollections(), allChittyPayouts()
  ]);
  const rows = [];
  receipts.filter(r=>r.paymentMode==='Cash').forEach(r => rows.push({ date:r.date, particulars:`Receipt ${r.receiptNo} - ${r.name}`, receipt:r.amount, payment:0 }));
  payments.filter(p=>p.paymentMode==='Cash').forEach(p => rows.push({ date:p.date, particulars:`Payment ${p.voucherNo} - ${p.paidTo}`, receipt:0, payment:p.amount }));
  loans.filter(l=>l.paymentMode==='Cash').forEach(l => { if (l.loanReceived) rows.push({ date:l.date, particulars:`Loan Received - ${l.person}`, receipt:l.loanReceived, payment:0 }); if (l.repayment) rows.push({ date:l.date, particulars:`Loan Repayment - ${l.person}`, receipt:0, payment:l.repayment }); });
  collections.filter(c=>c.paymentMode==='Cash').forEach(c => rows.push({ date:c.date, particulars:`Chitty Collection - ${c.memberName||''}`, receipt:c.amountReceived, payment:0 }));
  payouts.filter(p=>p.paymentMode==='Cash').forEach(p => rows.push({ date:p.date, particulars:`Chitty Payout - ${p.memberName||''}`, receipt:0, payment:p.amount }));
  transfers.forEach(t => {
    if (t.fromAcc==='Cash') rows.push({ date:t.date, particulars:`Transfer to Bank via ${t.mode||'Cash'}${t.reason?' ('+t.reason+')':''}`, receipt:0, payment:t.amount });
    if (t.toAcc==='Cash') rows.push({ date:t.date, particulars:`Transfer from Bank via ${t.mode||'Cash'}${t.reason?' ('+t.reason+')':''}`, receipt:t.amount, payment:0 });
  });
  rows.sort((a,b) => a.date.localeCompare(b.date));
  let bal = parseFloat(s.openingCash) || 0;
  return rows.map(r => { bal += r.receipt - r.payment; return { ...r, balance: bal }; });
}
async function buildBankBookRows() {
  const s = window.APP_SETTINGS;
  const isBankMode = (m) => m === 'Bank' || m === 'UPI';
  const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
    activeReceipts(), activePayments(), allTransfers(), allLoans(), allChittyCollections(), allChittyPayouts()
  ]);
  const rows = [];
  receipts.filter(r=>isBankMode(r.paymentMode)).forEach(r => rows.push({ date:r.date, particulars:`Receipt ${r.receiptNo} - ${r.name} (${r.paymentMode})`, deposit:r.amount, withdrawal:0 }));
  payments.filter(p=>isBankMode(p.paymentMode)).forEach(p => rows.push({ date:p.date, particulars:`Payment ${p.voucherNo} - ${p.paidTo} (${p.paymentMode})`, deposit:0, withdrawal:p.amount }));
  loans.filter(l=>isBankMode(l.paymentMode)).forEach(l => { if (l.loanReceived) rows.push({ date:l.date, particulars:`Loan Received - ${l.person}`, deposit:l.loanReceived, withdrawal:0 }); if (l.repayment) rows.push({ date:l.date, particulars:`Loan Repayment - ${l.person}`, deposit:0, withdrawal:l.repayment }); });
  collections.filter(c=>isBankMode(c.paymentMode)).forEach(c => rows.push({ date:c.date, particulars:`Chitty Collection - ${c.memberName||''}`, deposit:c.amountReceived, withdrawal:0 }));
  payouts.filter(p=>isBankMode(p.paymentMode)).forEach(p => rows.push({ date:p.date, particulars:`Chitty Payout - ${p.memberName||''}`, deposit:0, withdrawal:p.amount }));
  transfers.forEach(t => {
    if (t.fromAcc==='Bank') rows.push({ date:t.date, particulars:`Withdrawal to Cash via ${t.mode||'Cash'}${t.reason?' ('+t.reason+')':''}${t.refNo?' - Ref '+t.refNo:''}`, deposit:0, withdrawal:t.amount });
    if (t.toAcc==='Bank') rows.push({ date:t.date, particulars:`Deposit from Cash via ${t.mode||'Cash'}${t.reason?' ('+t.reason+')':''}${t.refNo?' - Ref '+t.refNo:''}`, deposit:t.amount, withdrawal:0 });
  });
  rows.sort((a,b) => a.date.localeCompare(b.date));
  let bal = parseFloat(s.openingBank) || 0;
  return rows.map(r => { bal += r.deposit - r.withdrawal; return { ...r, balance: bal }; });
}

async function saveTransfer() {
  const fd = new FormData(el('transferForm'));
  const amount = parseFloat(fd.get('amount'));
  const editId = fd.get('editId') ? (isNaN(parseInt(fd.get('editId'), 10)) ? fd.get('editId') : parseInt(fd.get('editId'), 10)) : null;
  if (fd.get('fromAcc') === fd.get('toAcc')) { alert('From and To accounts must be different.'); return; }
  if (!amount || amount <= 0) { alert('Enter a valid amount.'); return; }
  const user = getCurrentFirebaseUser();
  if (!user) { alert('Authentication required: please log in to record transactions.'); return; }

  const rec = { date: fd.get('date'), fromAcc: fd.get('fromAcc'), toAcc: fd.get('toAcc'), mode: fd.get('mode') || 'Cash', amount, reason: fd.get('reason')||'', refNo: fd.get('refNo')||'' };
  try {
    if (editId) {
      const prior = await getOne('transfers', editId) || await fsGetOneSafe('transfers', editId);
      rec.createdAt = prior ? prior.createdAt : Date.now();
      rec.id = editId;
      rec.firestoreId = prior ? prior.firestoreId : ('tx_' + editId);
      await fsUpdateRecordSafe('transfers', rec.firestoreId || editId, rec);
    } else {
      rec.createdAt = Date.now();
      rec.firestoreId = 'tx_' + Date.now();
      await fsSaveRecordSafe('transfers', rec, false);
    }
  } catch (err) {
    alert('Unable to save to the cloud. Please check your connection and try again.\n(' + (err.message || err) + ')');
    return;
  }
  await navigate('transfers');
}

function getAnalyticsPeriodRange(preset, customFrom, customTo) {
  const now = new Date();
  const formatISO = (d) => {
    const yr = d.getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const da = String(d.getDate()).padStart(2, '0');
    return `${yr}-${mo}-${da}`;
  };
  const todayStr = formatISO(now);

  if (preset === 'today') {
    return { from: todayStr, to: todayStr, preset: 'today' };
  } else if (preset === 'this_week') {
    const d = new Date(now);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(d.setDate(diff));
    return { from: formatISO(monday), to: todayStr, preset: 'this_week' };
  } else if (preset === 'this_month') {
    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
    return { from: formatISO(firstDay), to: todayStr, preset: 'this_month' };
  } else if (preset === 'last_month') {
    const firstDayLastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const lastDayLastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    return { from: formatISO(firstDayLastMonth), to: formatISO(lastDayLastMonth), preset: 'last_month' };
  } else if (preset === 'this_year') {
    const firstDayYear = new Date(now.getFullYear(), 0, 1);
    return { from: formatISO(firstDayYear), to: todayStr, preset: 'this_year' };
  } else if (preset === 'custom') {
    const from = (customFrom || todayStr).trim();
    const to = (customTo || todayStr).trim();
    return { from, to, preset: 'custom' };
  }
  return { from: todayStr, to: todayStr, preset: 'today' };
}

function formatAnalyticsPeriodDisplay(from, to) {
  if (!from || !to) return '-';
  const opt = { day: '2-digit', month: 'short', year: 'numeric' };
  const f = new Date(from + 'T00:00:00');
  const t = new Date(to + 'T00:00:00');
  const fStr = isNaN(f.getTime()) ? fmtDate(from) : f.toLocaleDateString('en-IN', opt);
  const tStr = isNaN(t.getTime()) ? fmtDate(to) : t.toLocaleDateString('en-IN', opt);
  return `${fStr} → ${tStr}`;
}

function renderTrendChartSVG(buckets) {
  const hasData = buckets.some(b => b.income > 0 || b.expense > 0);
  if (!hasData) {
    return renderAnalyticsEmptyState('📈', 'No transactions available for this period.', 'Accounting records for this timeframe will automatically generate trend visualization.');
  }

  const svgW = 720;
  const svgH = 260;
  const padLeft = 70;
  const padRight = 20;
  const padTop = 30;
  const padBottom = 45;
  const plotW = svgW - padLeft - padRight;
  const plotH = svgH - padTop - padBottom;

  const rawMax = Math.max(...buckets.map(b => Math.max(b.income, b.expense)), 100);
  const p = Math.pow(10, Math.floor(Math.log10(rawMax)));
  const yMax = Math.ceil((rawMax * 1.15) / p) * p;

  let gridLinesHTML = '';
  for (let i = 0; i <= 4; i++) {
    const yVal = (yMax / 4) * i;
    const yPos = padTop + plotH - (i / 4) * plotH;
    gridLinesHTML += `
      <line x1="${padLeft}" y1="${yPos}" x2="${svgW - padRight}" y2="${yPos}" stroke="#eee6dc" stroke-dasharray="${i === 0 ? 'none' : '3,3'}" stroke-width="1" />
      <text x="${padLeft - 8}" y="${yPos + 4}" font-size="10" fill="#766d66" text-anchor="end" font-family="system-ui, sans-serif">₹${Math.round(yVal).toLocaleString('en-IN')}</text>
    `;
  }

  const n = buckets.length;
  const colW = plotW / Math.max(n, 1);
  const barW = Math.max(Math.min(colW * 0.35, 18), 3);
  let barsHTML = '';
  let labelsHTML = '';
  const labelStep = n > 14 ? Math.ceil(n / 7) : 1;

  buckets.forEach((b, idx) => {
    const centerX = padLeft + (idx + 0.5) * colW;
    const incH = (b.income / yMax) * plotH;
    const expH = (b.expense / yMax) * plotH;
    const incY = padTop + plotH - incH;
    const expY = padTop + plotH - expH;

    if (b.income > 0) {
      barsHTML += `
        <rect x="${centerX - barW - 1.5}" y="${incY}" width="${barW}" height="${incH}" fill="#2f7d4a" rx="2" ry="2" opacity="0.9">
          <title>${esc(b.label)}: Income ₹${b.income.toLocaleString('en-IN')} (${b.countRcpt} rcpts)</title>
        </rect>
      `;
    }

    if (b.expense > 0) {
      barsHTML += `
        <rect x="${centerX + 1.5}" y="${expY}" width="${barW}" height="${expH}" fill="#9b2c2c" rx="2" ry="2" opacity="0.9">
          <title>${esc(b.label)}: Expense ₹${b.expense.toLocaleString('en-IN')} (${b.countPmt} pmts)</title>
        </rect>
      `;
    }

    if (idx % labelStep === 0 || idx === n - 1) {
      labelsHTML += `
        <text x="${centerX}" y="${padTop + plotH + 18}" font-size="11" fill="#574e47" text-anchor="middle" font-family="system-ui, sans-serif">${esc(b.label)}</text>
      `;
    }
  });

  return `
    <div class="analytics-chart-wrap">
      <svg class="analytics-chart-svg" viewBox="0 0 ${svgW} ${svgH}" preserveAspectRatio="xMidYMid meet">
        ${gridLinesHTML}
        ${barsHTML}
        ${labelsHTML}
      </svg>
      <div class="analytics-legend">
        <span class="analytics-legend-item"><span class="analytics-legend-dot" style="background:#2f7d4a;"></span> <b>Income</b></span>
        <span class="analytics-legend-item"><span class="analytics-legend-dot" style="background:#9b2c2c;"></span> <b>Expense</b></span>
      </div>
    </div>
  `;
}

function renderDonutChartSVG(slices, total) {
  if (!slices || slices.length === 0 || total <= 0) {
    return renderAnalyticsEmptyState('💳', 'No collection data available for this period.', 'Payment mode breakdown will display when receipts are recorded.');
  }

  const svgSize = 220;
  const cx = 110;
  const cy = 110;
  const r = 70;
  const strokeW = 28;
  const circ = 2 * Math.PI * r;
  // Quarter-circumference offset so the first segment starts at 12 o'clock
  // (SVG circles start at 3 o'clock; subtracting circ/4 shifts the origin to 12 o'clock)
  const startOffset = circ / 4;

  let accumulated = 0;
  let pathsHTML = '';
  const colors = ['#2f7d4a', '#b88a2b', '#1e5ba8', '#6d28d9', '#9b2c2c', '#92540c'];

  slices.forEach((s, idx) => {
    const frac = s.amount / total;
    const strokeDash = frac * circ;
    const strokeSpace = circ - strokeDash;
    const strokeColor = s.color || colors[idx % colors.length];
    s.color = strokeColor;
    const pct = Math.round(frac * 100);
    // dashoffset: positive value shifts the dash start clockwise
    // startOffset positions 1st segment at 12 o'clock; accumulated moves each next segment
    const dashOffset = startOffset - accumulated;

    pathsHTML += `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"
        stroke-dasharray="${strokeDash} ${strokeSpace}" stroke-dashoffset="${dashOffset}" opacity="0.92">
        <title>${esc(s.mode)}: ₹${s.amount.toLocaleString('en-IN')} (${pct}%, ${s.count} txns)</title>
      </circle>
    `;
    accumulated += strokeDash;
  });

  // Center text rendered directly — no counter-rotation needed
  const centerText = `
    <text x="${cx}" y="${cy - 6}" font-size="11" font-weight="600" fill="#766d66" text-anchor="middle" font-family="system-ui, sans-serif">TOTAL</text>
    <text x="${cx}" y="${cy + 14}" font-size="14" font-weight="700" fill="#2f2a27" text-anchor="middle" font-family="system-ui, sans-serif">₹${Math.round(total).toLocaleString('en-IN')}</text>
  `;

  const legendHTML = slices.map(s => {
    const pct = Math.round((s.amount / total) * 100);
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:6px 0; border-bottom:1px solid var(--border-subtle);">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:10px; height:10px; border-radius:2px; background:${s.color}; display:inline-block;"></span>
          <span style="font-weight:600; color:var(--text);">${esc(s.mode)}</span>
          <span style="color:var(--text-muted); font-size:11px;">(${s.count} txns)</span>
        </div>
        <div>
          <b style="color:var(--maroon);">${fmtMoney(s.amount)}</b>
          <span style="color:var(--text-muted); font-size:11px; margin-left:4px;">(${pct}%)</span>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; justify-content:center; align-items:center;">
        <svg viewBox="0 0 ${svgSize} ${svgSize}" width="${svgSize}" height="${svgSize}" style="max-width: 100%;">
          ${pathsHTML}
          ${centerText}
        </svg>
      </div>
      <div>${legendHTML}</div>
    </div>
  `;
}

function renderHorizontalBarChartSVG(items, maxVal, color) {
  if (!items || items.length === 0) return '';
  const safeMax = maxVal > 0 ? maxVal : 1;

  return `
    <div style="display:flex; flex-direction:column; gap:10px; width:100%;">

              <div style="width:${pct}%; height:100%; background:${color || 'var(--maroon)'}; border-radius:4px; transition: width 0.3s ease;"></div>
            </div>
          </div>
        `;
      }).join('')}

  `;
}
