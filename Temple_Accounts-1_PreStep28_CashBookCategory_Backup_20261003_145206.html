async function refreshAnalyticsData() {
  const [receiptsAll, paymentsAll, billingAll, funds] = await Promise.all([
    allReceipts(),
    allPayments(),
    allBillingRecords(),
    allFunds()
  ]);
  if (!window.analyticsCache) window.analyticsCache = {};
  window.analyticsCache.receiptsAll = receiptsAll;
  window.analyticsCache.paymentsAll = paymentsAll;
  window.analyticsCache.billingAll = billingAll;
  window.analyticsCache.funds = funds;
  renderAnalyticsDashboardContent();
}

function setAnalyticsPreset(preset) {
  if (!window.analyticsCache) return;
  window.analyticsCache.preset = preset;
  const customRow = el('analyticsCustomRow');
  if (customRow) {
    customRow.style.display = preset === 'custom' ? 'flex' : 'none';
  }
  if (preset === 'custom') {
    const fromInput = el('analyticsCustomFrom');
    const toInput = el('analyticsCustomTo');
    if (fromInput && !fromInput.value) fromInput.value = window.analyticsCache.customFrom || todayISO();
    if (toInput && !toInput.value) toInput.value = window.analyticsCache.customTo || todayISO();
    window.analyticsCache.customFrom = fromInput ? fromInput.value : '';
    window.analyticsCache.customTo = toInput ? toInput.value : '';
  }
  renderAnalyticsDashboardContent();
}

function onAnalyticsCustomDateChange() {
  if (!window.analyticsCache) return;
  const fromInput = el('analyticsCustomFrom');
  const toInput = el('analyticsCustomTo');
  if (fromInput && toInput && fromInput.value && toInput.value) {
    window.analyticsCache.customFrom = fromInput.value;
    window.analyticsCache.customTo = toInput.value;
    renderAnalyticsDashboardContent();
  }
}

function applyAnalyticsCustomDate() {
  onAnalyticsCustomDateChange();
}

function renderAnalyticsDashboardContent() {
  const cache = window.analyticsCache;
  if (!cache) return;

  const { from, to, preset } = getAnalyticsPeriodRange(cache.preset, cache.customFrom, cache.customTo);
  cache.from = from;
  cache.to = to;

  // 1. Update Period badge
  const periodText = formatAnalyticsPeriodDisplay(from, to);
  const periodEl = el('analyticsPeriodRangeText');
  if (periodEl) periodEl.textContent = periodText;

  // 2. Update active preset button
  qsa('.analytics-preset-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.preset === preset);
  });

  const customRow = el('analyticsCustomRow');
  if (customRow) {
    customRow.style.display = preset === 'custom' ? 'flex' : 'none';
    const fromInput = el('analyticsCustomFrom');
    const toInput = el('analyticsCustomTo');
    if (fromInput && !fromInput.value) fromInput.value = from;
    if (toInput && !toInput.value) toInput.value = to;
  }

  // 3. Filter authoritative active receipts & payments
  const receiptsAll = cache.receiptsAll || [];
  const paymentsAll = cache.paymentsAll || [];
  const billingAll = cache.billingAll || [];
  const funds = cache.funds || [];

  const activePeriodReceipts = receiptsAll.filter(r => !r.voided && r.date >= from && r.date <= to);
  const activePeriodPayments = paymentsAll.filter(p => !p.voided && p.date >= from && p.date <= to);

  // Exclude voided / deleted billing records
  const voidedReceiptIds = new Set(receiptsAll.filter(r => r.voided).map(r => r.id));
  const activePeriodBills = billingAll.filter(b => {
    if (b.deleted || b.voided) return false;
    if (b.accountingReceiptId && voidedReceiptIds.has(b.accountingReceiptId)) return false;
    const bDate = getBillingRecordISODate(b);
    return bDate && bDate >= from && bDate <= to;
  });

  // 4. Calculate Top Summary Statistics
  const totalIncome = sumField(activePeriodReceipts, 'amount');
  const totalExpense = sumField(activePeriodPayments, 'amount');
  const net = totalIncome - totalExpense;
  const totalReceiptsCount = activePeriodReceipts.length;
  const totalPaymentsCount = activePeriodPayments.length;

  if (el('statTotalIncome')) el('statTotalIncome').textContent = fmtMoney(totalIncome);
  if (el('statIncomeSub')) el('statIncomeSub').textContent = `${totalReceiptsCount} active receipt${totalReceiptsCount === 1 ? '' : 's'}`;
  if (el('statTotalExpense')) el('statTotalExpense').textContent = fmtMoney(totalExpense);
  if (el('statExpenseSub')) el('statExpenseSub').textContent = `${totalPaymentsCount} active payment${totalPaymentsCount === 1 ? '' : 's'}`;

  const netCard = el('statNetCard');
  const isSurplus = net >= 0;
  if (netCard) {
    netCard.className = `stat-card ${isSurplus ? 'accent-green' : 'accent-red'}`;
    el('statNetLabel').textContent = isSurplus ? 'NET SURPLUS' : 'NET DEFICIT';
    el('statNetValue').textContent = fmtMoney(Math.abs(net));
    el('statNetSub').textContent = isSurplus
      ? (totalIncome === 0 && totalExpense === 0 ? 'Balanced period' : 'Income exceeds expenses')
      : 'Expenses exceed income';
  }
  if (el('statTotalReceipts')) el('statTotalReceipts').textContent = String(totalReceiptsCount);
  if (el('statTotalPayments')) el('statTotalPayments').textContent = String(totalPaymentsCount);

  // 5. Income vs Expense Trend Chart
  const trendWrap = el('trendChartWrap');
  const trendMeta = el('trendGroupingMeta');
  if (trendWrap) {
    if (totalReceiptsCount === 0 && totalPaymentsCount === 0) {
      trendWrap.innerHTML = renderAnalyticsEmptyState('📈', 'No transactions available for this period.', 'Accounting records for this timeframe will automatically generate trend visualization.');
      if (trendMeta) trendMeta.textContent = 'Empty State';
    } else {
      const fromDateObj = new Date(from + 'T00:00:00');
      const toDateObj = new Date(to + 'T00:00:00');
      const daysDiff = Math.max(Math.round((toDateObj - fromDateObj) / (1000 * 60 * 60 * 24)) + 1, 1);

      let buckets = [];
      if (preset === 'today' || from === to) {
        if (trendMeta) trendMeta.textContent = 'Hourly Breakdown';
        const hourMap = {};
        for (let h = 6; h <= 21; h++) {
          hourMap[h] = { label: `${String(h).padStart(2, '0')}:00`, income: 0, expense: 0, countRcpt: 0, countPmt: 0 };
        }
        activePeriodReceipts.forEach(r => {
          const dt = r.createdAt ? new Date(r.createdAt) : null;
          const h = dt && !isNaN(dt.getTime()) ? dt.getHours() : 10;
          if (!hourMap[h]) hourMap[h] = { label: `${String(h).padStart(2, '0')}:00`, income: 0, expense: 0, countRcpt: 0, countPmt: 0 };
          hourMap[h].income += (parseFloat(r.amount) || 0);
          hourMap[h].countRcpt += 1;
        });
        activePeriodPayments.forEach(p => {
          const dt = p.createdAt ? new Date(p.createdAt) : null;
          const h = dt && !isNaN(dt.getTime()) ? dt.getHours() : 10;
          if (!hourMap[h]) hourMap[h] = { label: `${String(h).padStart(2, '0')}:00`, income: 0, expense: 0, countRcpt: 0, countPmt: 0 };
          hourMap[h].expense += (parseFloat(p.amount) || 0);
          hourMap[h].countPmt += 1;
        });
        buckets = Object.keys(hourMap).map(k => Number(k)).sort((a,b) => a - b).map(k => hourMap[k]);
      } else if (daysDiff <= 31) {
        if (trendMeta) trendMeta.textContent = 'Daily Breakdown';
        const cur = new Date(from + 'T00:00:00');
        const end = new Date(to + 'T00:00:00');
        while (cur <= end) {
          const yr = cur.getFullYear();
          const mo = String(cur.getMonth() + 1).padStart(2, '0');
          const da = String(cur.getDate()).padStart(2, '0');
          const iso = `${yr}-${mo}-${da}`;
          const dayRcpts = activePeriodReceipts.filter(r => r.date === iso);
          const dayPmts = activePeriodPayments.filter(p => p.date === iso);
          buckets.push({
            iso,
            label: cur.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
            income: sumField(dayRcpts, 'amount'),
            expense: sumField(dayPmts, 'amount'),
            countRcpt: dayRcpts.length,
            countPmt: dayPmts.length
          });
          cur.setDate(cur.getDate() + 1);
        }
      } else {
        if (trendMeta) trendMeta.textContent = 'Monthly Breakdown';
        const monthMap = {};
        const cur = new Date(from + 'T00:00:00');
        const end = new Date(to + 'T00:00:00');
        while (cur <= end) {
          const ym = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`;
          if (!monthMap[ym]) {
            monthMap[ym] = {
              iso: ym,
              label: cur.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' }),
              income: 0,
              expense: 0,
              countRcpt: 0,
              countPmt: 0
            };
          }
          cur.setDate(cur.getDate() + 1);
        }
        activePeriodReceipts.forEach(r => {
          const ym = String(r.date || '').slice(0, 7);
          if (monthMap[ym]) {
            monthMap[ym].income += (parseFloat(r.amount) || 0);
            monthMap[ym].countRcpt += 1;
          }
        });
        activePeriodPayments.forEach(p => {
          const ym = String(p.date || '').slice(0, 7);
          if (monthMap[ym]) {
            monthMap[ym].expense += (parseFloat(p.amount) || 0);
            monthMap[ym].countPmt += 1;
          }
        });
        buckets = Object.values(monthMap);
      }
      trendWrap.innerHTML = renderTrendChartSVG(buckets);
    }
  }

  // 6. Section 5: Pooja & Vazhipadu Analytics
  const poojaWrap = el('poojaSectionContent');
  const poojaMeta = el('poojaTotalMeta');
  if (poojaWrap) {
    if (activePeriodBills.length === 0) {
      poojaWrap.innerHTML = renderAnalyticsEmptyState('🪔', 'No pooja/billing data available for this period.', 'Pooja bookings and vazhipadu receipts for this timeframe will be analyzed here.');
      if (poojaMeta) poojaMeta.textContent = '0 Bookings';
    } else {
      if (poojaMeta) poojaMeta.textContent = `${activePeriodBills.length} Bill${activePeriodBills.length === 1 ? '' : 's'}`;

      const itemStats = {};
      let totalPoojaAmount = 0;
      let totalPoojaQty = 0;

      activePeriodBills.forEach(b => {
        const item = (b.item || b.category || 'General Pooja').trim();
        if (!itemStats[item]) {
          itemStats[item] = {
            name: item,
            category: b.category || 'Pooja',
            txCount: 0,
            totalQty: 0,
            totalAmount: 0
          };
        }
        itemStats[item].txCount += 1;
        const q = parseInt(b.quantity, 10) || 1;
        itemStats[item].totalQty += q;
        totalPoojaQty += q;
        const amt = parseFloat(b.totalAmount || b.total) || 0;
        itemStats[item].totalAmount += amt;
        totalPoojaAmount += amt;
      });

      const itemList = Object.values(itemStats);
      const topByAmount = itemList.slice().sort((a, b) => b.totalAmount - a.totalAmount);
      const topByCount = itemList.slice().sort((a, b) => b.txCount - a.txCount || b.totalQty - a.totalQty);
      const highestItem = topByAmount[0];
      const mostFrequentItem = topByCount[0];

      const chartItems = topByAmount.slice(0, 8).map(i => ({
        name: i.name,
        amount: i.totalAmount,
        sub: `${i.txCount} txns · ${i.totalQty} qty`
      }));
      const maxItemAmt = chartItems[0] ? chartItems[0].amount : 1;

      poojaWrap.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <!-- Highlight Cards -->
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px;">
            <div class="analytics-highlight-card">
              <div>
                <div style="font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Highest Collection Pooja</div>
                <div style="font-size:14px; font-weight:700; color:var(--maroon); margin-top:2px;">${esc(highestItem ? highestItem.name : '-')}</div>
                <div style="font-size:12px; color:var(--text-muted);">${highestItem ? `${highestItem.txCount} txns · ${highestItem.totalQty} qty` : '-'}</div>
              </div>
              <div style="font-size:16px; font-weight:700; color:var(--maroon);">${fmtMoney(highestItem ? highestItem.totalAmount : 0)}</div>
            </div>
            <div class="analytics-highlight-card" style="border-left-color: var(--green);">
              <div>
                <div style="font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Most Frequent Pooja</div>
                <div style="font-size:14px; font-weight:700; color:var(--green); margin-top:2px;">${esc(mostFrequentItem ? mostFrequentItem.name : '-')}</div>
                <div style="font-size:12px; color:var(--text-muted);">${mostFrequentItem ? `${mostFrequentItem.totalQty} total quantity` : '-'}</div>
              </div>
              <div style="font-size:16px; font-weight:700; color:var(--green);">${mostFrequentItem ? mostFrequentItem.txCount : 0} txns</div>
            </div>
          </div>

          <!-- Visual Bar Chart & Breakdown Table -->
          <div class="panel-row">
            <div>
              <h4 style="margin:0 0 10px; font-size:13px; color:var(--text-secondary);">Collection by Pooja Item</h4>
              ${renderHorizontalBarChartSVG(chartItems, maxItemAmt, 'var(--primary-red)')}
            </div>
            <div>
              <h4 style="margin:0 0 10px; font-size:13px; color:var(--text-secondary);">Item-Wise Collection Breakdown</h4>
              <div class="table-wrap" style="max-height:280px; overflow-y:auto;">
                <table>
                  <thead>
                    <tr>
                      <th>Pooja / Item</th>
                      <th style="text-align:right;">Txns</th>
                      <th style="text-align:right;">Quantity</th>
                      <th style="text-align:right;">Total Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${itemList.sort((a,b) => b.totalAmount - a.totalAmount).map(item => `
                      <tr>
                        <td><b>${esc(item.name)}</b></td>
                        <td style="text-align:right;">${item.txCount}</td>
                        <td style="text-align:right;">${item.totalQty}</td>
                        <td style="text-align:right;"><b style="color:var(--maroon);">${fmtMoney(item.totalAmount)}</b></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }
  }

  // 7. Section 6: Devotee Activity
  const devoteeWrap = el('devoteeSectionContent');
  if (devoteeWrap) {
    if (activePeriodReceipts.length === 0) {
      devoteeWrap.innerHTML = renderAnalyticsEmptyState('🙏', 'No devotee activity recorded for this period.', 'Devotee contribution summaries will appear when active receipts are recorded.');
    } else {
      const devoteeMap = {};
      activePeriodReceipts.forEach(r => {
        let name = (r.name || '').trim();
        if (!name) name = 'Unnamed / Walk-in';
        if (!devoteeMap[name]) devoteeMap[name] = { name, count: 0, amount: 0 };
        devoteeMap[name].count += 1;
        devoteeMap[name].amount += (parseFloat(r.amount) || 0);
      });

      const devoteeList = Object.values(devoteeMap);
      const topByAmount = devoteeList.slice().sort((a, b) => b.amount - a.amount).slice(0, 5);
      const topByCount = devoteeList.slice().sort((a, b) => b.count - a.count || b.amount - a.amount).slice(0, 5);

      devoteeWrap.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div>
            <div style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">
              Top Devotees by Total Contribution
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Devotee Name</th>
                    <th style="text-align:right;">Txns</th>
                    <th style="text-align:right;">Total Amount</th>
                  </tr>
                </thead>
                <tbody>
                  ${topByAmount.map(d => `
                    <tr>
                      <td><b>${esc(d.name)}</b></td>
                      <td style="text-align:right;">${d.count}</td>
                      <td style="text-align:right;"><b style="color:var(--green);">${fmtMoney(d.amount)}</b></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div>
            <div style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">
              Most Frequent Devotees
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Devotee Name</th>
                    <th style="text-align:right;">Transactions</th>
                    <th style="text-align:right;">Total Contributed</th>
                  </tr>
                </thead>
                <tbody>
                  ${topByCount.map(d => `
                    <tr>
                      <td><b>${esc(d.name)}</b></td>
                      <td style="text-align:right;">${d.count}</td>
                      <td style="text-align:right;"><b style="color:var(--maroon);">${fmtMoney(d.amount)}</b></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }
  }

  // 8. Section 7: Expense Analysis
  const expenseWrap = el('expenseSectionContent');
  if (expenseWrap) {
    if (activePeriodPayments.length === 0) {
      expenseWrap.innerHTML = renderAnalyticsEmptyState('💸', 'No expense data available for this period.', 'Categorized expenses and spending patterns will display here.');
    } else {
      const expenseCatMap = {};
      activePeriodPayments.forEach(p => {
        const cat = (p.category || 'Uncategorized').trim();
        if (!expenseCatMap[cat]) expenseCatMap[cat] = { category: cat, count: 0, amount: 0 };
        expenseCatMap[cat].count += 1;
        expenseCatMap[cat].amount += (parseFloat(p.amount) || 0);
      });

      const expenseCatList = Object.values(expenseCatMap).sort((a, b) => b.amount - a.amount);
      const highestCat = expenseCatList[0];
      const maxExpense = highestCat ? highestCat.amount : 1;

      const chartItems = expenseCatList.map(c => ({
        name: c.category,
        amount: c.amount,
        sub: `${c.count} voucher${c.count === 1 ? '' : 's'}`
      }));

      expenseWrap.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          ${highestCat ? `
            <div class="analytics-highlight-card" style="border-left-color: var(--primary-red);">
              <div>
                <div style="font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Highest Expense Category</div>
                <div style="font-size:14px; font-weight:700; color:var(--primary-red); margin-top:2px;">${esc(highestCat.category)}</div>
                <div style="font-size:12px; color:var(--text-muted);">${highestCat.count} payments recorded</div>
              </div>
              <div style="font-size:16px; font-weight:700; color:var(--primary-red);">${fmtMoney(highestCat.amount)}</div>
            </div>
          ` : ''}

          <div>
            <div style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase;">Expense by Category</div>
            ${renderHorizontalBarChartSVG(chartItems, maxExpense, 'var(--primary-red)')}
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Expense Category</th>
                  <th style="text-align:right;">Payments</th>
                  <th style="text-align:right;">Total Amount</th>
                </tr>
              </thead>
              <tbody>
                ${expenseCatList.map(c => `
                  <tr>
                    <td><b>${esc(c.category)}</b></td>
                    <td style="text-align:right;">${c.count}</td>
                    <td style="text-align:right;"><b style="color:var(--primary-red);">${fmtMoney(c.amount)}</b></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
  }

  // 9. Section 8: Payment Mode Analysis
  const paymentModeWrap = el('paymentModeSectionContent');
  if (paymentModeWrap) {
    if (activePeriodReceipts.length === 0) {
      paymentModeWrap.innerHTML = renderAnalyticsEmptyState('💳', 'No collection data available for this period.', 'Cash, UPI, and Bank collection channels will be visualised here.');
    } else {
      const modeMap = {};
      activePeriodReceipts.forEach(r => {
        const mode = (r.paymentMode || 'Cash').trim();
        if (!modeMap[mode]) modeMap[mode] = { mode, count: 0, amount: 0 };
        modeMap[mode].count += 1;
        modeMap[mode].amount += (parseFloat(r.amount) || 0);
      });

      const modeList = Object.values(modeMap).sort((a, b) => b.amount - a.amount);
      paymentModeWrap.innerHTML = renderDonutChartSVG(modeList, totalIncome);
    }
  }

  // 10. Section 9: Fund Performance
  const fundWrap = el('fundPerformanceContent');
  if (fundWrap) {
    const fundList = funds.map(f => {
      const fName = f.name;
      const fIncome = sumField(activePeriodReceipts.filter(r => r.fund === fName), 'amount');
      const fExpense = sumField(activePeriodPayments.filter(p => p.fund === fName), 'amount');
      const fNet = fIncome - fExpense;
      return { name: fName, income: fIncome, expense: fExpense, net: fNet };
    });

    if (fundList.length === 0) {
      fundWrap.innerHTML = renderAnalyticsEmptyState('🏦', 'No funds registered in the database.', 'Register temple funds to track individual fund performance.');
    } else {
      const fundCardsHTML = fundList.map(f => {
        const isFundSurplus = f.net >= 0;
        return `
          <div class="analytics-fund-card">
            <div class="analytics-fund-name">${esc(f.name)}</div>
            <div class="analytics-fund-row">
              <span>Income:</span>
              <b style="color:var(--green);">${fmtMoney(f.income)}</b>
            </div>
            <div class="analytics-fund-row">
              <span>Expense:</span>
              <b style="color:var(--primary-red);">${fmtMoney(f.expense)}</b>
            </div>
            <div class="analytics-fund-row analytics-fund-net">
              <span>Net Movement:</span>
              <b style="color:${isFundSurplus ? 'var(--green)' : 'var(--primary-red)'};">${(f.net > 0 ? '+' : '') + fmtMoney(f.net)}</b>
            </div>
          </div>
        `;
      }).join('');
      fundWrap.innerHTML = `<div class="analytics-funds-grid">${fundCardsHTML}</div>`;
    }
  }

  // Initialize motions on newly rendered elements
  initMotionObserver(el('app-main'));
}

/* ===================== TRIAL BALANCE ===================== */
VIEW_RENDERERS.trialbalance = async function() {
  const [receipts, payments, cash, bank, funds, loanOut] = await Promise.all([
    activeReceipts(), activePayments(), getCashBalance(), getBankBalance(), getAllFundBalances(), getLoanOutstanding()
  ]);
  const incomeByCategory = {};
  receipts.forEach(r => { const cat = r.category || 'Uncategorized'; incomeByCategory[cat] = (incomeByCategory[cat]||0) + r.amount; });
  const expenseByCategory = {};
  payments.forEach(p => { const cat = p.category || 'Uncategorized'; expenseByCategory[cat] = (expenseByCategory[cat]||0) + p.amount; });

  /* Balance-sheet style rows only (Cash/Bank/Funds/Loans). Income & Expense category
     totals are NOT added here as separate rows: every receipt/payment amount is already
     reflected inside Cash/Bank (asset) and its Fund (equity) balance, so also listing the
     category amount as its own debit/credit would count the same amount twice ("multiplied")
     and throw the trial balance out of balance. Category-wise figures are shown below instead,
     as a reference-only Income & Expenditure summary that is not part of this balance check. */
  const rows = [];
  rows.push({ account: 'Cash in Hand', debit: cash, credit: 0 });
  rows.push({ account: 'Bank Account', debit: bank, credit: 0 });
  funds.forEach(f => rows.push({ account: f.name + ' (Fund)', debit: 0, credit: f.balance }));
  if (loanOut) rows.push({ account: 'Loans Payable', debit: 0, credit: loanOut });

  const totalDebit = sumField(rows, 'debit'), totalCredit = sumField(rows, 'credit');
  const balanced = Math.abs(totalDebit - totalCredit) < 0.01;

  const totalIncome = Object.values(incomeByCategory).reduce((a,b)=>a+b,0);
  const totalExpense = Object.values(expenseByCategory).reduce((a,b)=>a+b,0);

  return `
    <div class="balance-banner ${balanced?'ok':'bad'}" data-motion="fadeInUp">${balanced ? '✅ Accounts Balanced' : `⚠️ Difference Found: ${fmtMoney(Math.abs(totalDebit-totalCredit))}`}</div>
    <p class="muted">This is a simplified trial balance built from cash/bank, fund and loan balances — a full double-entry journal is planned for a future update.</p>
    <div class="table-wrap" data-motion="fadeIn"><table>
      <thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr><td>${esc(r.account)}</td><td>${r.debit?fmtMoney(r.debit):'-'}</td><td>${r.credit?fmtMoney(r.credit):'-'}</td></tr>`).join('')}
        <tr class="pr-bold"><td><b>TOTAL</b></td><td><b>${fmtMoney(totalDebit)}</b></td><td><b>${fmtMoney(totalCredit)}</b></td></tr>
      </tbody>
    </table></div>

    <h3 style="margin-top:20px;color:var(--maroon);">Income &amp; Expenditure by Category (reference only)</h3>
    <p class="muted">Shown for information — already included inside the Fund and Cash/Bank balances above, so not added into the Trial Balance totals.</p>
    <div class="panel-row" data-motion="calmInUp">
      <div class="panel">
        <h3>Income</h3>
        <div class="table-wrap"><table>
          <tbody>
            ${Object.entries(incomeByCategory).map(([cat,amt])=>`<tr><td>${esc(cat)}</td><td>${fmtMoney(amt)}</td></tr>`).join('') || '<tr><td class="muted">No income recorded</td><td></td></tr>'}
            <tr class="pr-bold"><td><b>Total Income</b></td><td><b>${fmtMoney(totalIncome)}</b></td></tr>
          </tbody>
        </table></div>
      </div>
      <div class="panel">
        <h3>Expense</h3>
        <div class="table-wrap"><table>
          <tbody>
            ${Object.entries(expenseByCategory).map(([cat,amt])=>`<tr><td>${esc(cat)}</td><td>${fmtMoney(amt)}</td></tr>`).join('') || '<tr><td class="muted">No expense recorded</td><td></td></tr>'}
            <tr class="pr-bold"><td><b>Total Expense</b></td><td><b>${fmtMoney(totalExpense)}</b></td></tr>
          </tbody>
        </table></div>
      </div>
    </div>
  `;
};

async function saveTempleSettings() {
  const fd = new FormData(el('templeSettingsForm'));
  const s = window.APP_SETTINGS || {};
  ['templeName','address','phone','email','receiptPrefix','voucherPrefix','financialYear','currencySymbol','startDate'].forEach(k => s[k] = fd.get(k));
  
  // 1. Write to authoritative Firestore settings/set_1 first
  const user = getCurrentFirebaseUser();
  if (!user) { alert('Authentication required to modify settings.'); return; }
  try {
    await fsSet('settings', 'set_1', {
      ...s,
      updatedAt: new Date().toISOString(),
      updatedBy: user.uid
    }, { merge: true });
  } catch (err) {
    console.error('[saveTempleSettings] Failed to save to Firestore:', err);
    alert('Unable to save settings to the cloud. Please check your connection and try again.');
    return;
  }
  // 2. Update local IndexedDB cache
  await putRec('settings', s);
  await refreshSettings();
  applyBrand();
  alert('Temple details saved.');
}

/**
 * Serialize a Firestore Timestamp (or any value) to a JSON-safe, deterministic representation.
 * Firestore Timestamps have .seconds and .nanoseconds; plain numbers are kept as-is.
 * Returns an object { __type: 'Timestamp', seconds, nanoseconds, iso } for Timestamp objects,
 * so that a future restore can reconstruct the original value.
 */
function _serializeTimestamp(value) {
  if (value === null || value === undefined) return value;
  // Firestore compat SDK Timestamp: has seconds + nanoseconds
  if (typeof value === 'object' && typeof value.seconds === 'number' && typeof value.nanoseconds === 'number') {
    return {
      __type: 'Timestamp',
      seconds: value.seconds,
      nanoseconds: value.nanoseconds,
      iso: new Date(value.seconds * 1000 + Math.floor(value.nanoseconds / 1e6)).toISOString()
    };
  }
  // Plain Date object
  if (value instanceof Date) {
    return { __type: 'Date', iso: value.toISOString(), ms: value.getTime() };
  }
  return value;
}

/**
 * Recursively walk a document object and serialize any Firestore Timestamp fields.
 */
function _serializeDoc(doc) {
  if (doc === null || doc === undefined) return doc;
  if (Array.isArray(doc)) return doc.map(_serializeDoc);
  if (typeof doc === 'object') {
    const out = {};
    for (const [k, v] of Object.entries(doc)) {
      if (typeof v === 'object' && v !== null &&
          typeof v.seconds === 'number' && typeof v.nanoseconds === 'number') {
        out[k] = _serializeTimestamp(v);
      } else if (typeof v === 'object' && v !== null) {
        out[k] = _serializeDoc(v);
      } else {
        out[k] = v;
      }
    }
    return out;
  }
  return doc;
}

/**
 * STEP 23.1 — FIRESTORE-AWARE PRODUCTION BACKUP (BUG-003 FIX)
 *
 * Reads ALL production data directly from Firestore (authoritative source).
 * Does NOT read from IndexedDB — eliminates stale-cache dependency entirely.
 * All-or-nothing: if any collection read fails, the backup is aborted.
 * Reads are READ-ONLY — no set(), add(), update(), delete(), runTransaction().
 */
async function downloadBackup() {
  const btn = document.getElementById('backup-download-btn');
  const originalLabel = btn ? btn.textContent : '';

  // --- Guard: prevent duplicate clicks ---
  if (btn && btn.disabled) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Reading from Firestore…'; }

  try {
    // --- Pre-flight: verify authentication ---
    const user = getCurrentFirebaseUser();
    if (!user) throw new Error('Not authenticated. Please log in before creating a backup.');

    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized. Cannot create backup.');

    console.log('[Backup] Starting Firestore-authoritative backup. Source: Firestore (NOT IndexedDB).');
    console.log('[Backup] Authenticated user:', user.email || user.uid);

    // --- Define ALL production collections to export ---
    const BACKUP_COLLECTIONS = [
      'settings',
      'funds',
      'incomeCategories',
      'expenseCategories',
      'bankAccounts',
      'billing',
      'receipts',
      'payments',
      'transfers',
      'chittyMembers',
      'chittyCollections',
      'chittyPayouts',
      'loans'
    ];

    const exportTimestamp = new Date().toISOString();
    const collections = {};
    let totalDocCount = 0;

    // --- Read every collection directly from Firestore ---
    // Use Promise.all for parallel reads; capture all errors.
    const results = await Promise.allSettled(
      BACKUP_COLLECTIONS.map(async (colName) => {
        const snap = await db.collection(colName).get();
        const docs = [];
        snap.forEach(docSnap => {
          const data = docSnap.data();
          // Preserve the Firestore document ID as the primary identifier
          docs.push(_serializeDoc({ _firestoreId: docSnap.id, ...data }));
        });
        console.log(`[Backup] ${colName}: ${docs.length} document(s) read from Firestore.`);
        return { colName, docs };
      })
    );

    // --- All-or-nothing: check every collection succeeded ---
    const failures = [];
    for (let i = 0; i < results.length; i++) {
      if (results[i].status === 'rejected') {
        failures.push({ collection: BACKUP_COLLECTIONS[i], error: results[i].reason });
        console.error(`[Backup] FAILED to read collection '${BACKUP_COLLECTIONS[i]}':`, results[i].reason);
      } else {
        const { colName, docs } = results[i].value;
        collections[colName] = docs;
        totalDocCount += docs.length;
      }
    }

    if (failures.length > 0) {
      const failNames = failures.map(f => f.collection).join(', ');
      throw new Error(`Backup aborted: failed to read collection(s): ${failNames}. No backup file was created.`);
    }

    // --- Read Firestore counters document (system/counters) ---
    if (btn) btn.textContent = 'Reading counters…';
    let countersData = null;
    try {
      const counterSnap = await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).get();
      if (counterSnap.exists) {
        countersData = _serializeDoc(counterSnap.data());
        countersData._firestoreId = FS_COUNTERS_DOC_ID;
        countersData._firestoreCollection = FS_COUNTERS_COLLECTION;
      } else {
        console.warn('[Backup] system/counters document does not exist in Firestore.');
        countersData = null;
      }
    } catch (counterErr) {
      throw new Error(`Backup aborted: failed to read Firestore counters (system/counters): ${counterErr.message}`);
    }

    console.log('[Backup] Counters read from Firestore:', countersData);

    // --- Internal validation ---
    const missingCollections = BACKUP_COLLECTIONS.filter(c => !(c in collections));
    if (missingCollections.length > 0) {
      throw new Error(`Backup validation failed: missing collections in export: ${missingCollections.join(', ')}`);
    }

    // --- Verify document IDs are preserved ---
    let idPreservationOk = true;
    for (const colName of BACKUP_COLLECTIONS) {
      for (const doc of collections[colName]) {
        if (!doc._firestoreId) {
          console.warn(`[Backup] Document in '${colName}' missing _firestoreId — ID preservation issue.`);
          idPreservationOk = false;
        }
      }
    }
    if (!idPreservationOk) {
      console.warn('[Backup] Some documents may have missing Firestore IDs. Proceeding with partial ID data.');
    }

    // --- Build the final backup object ---
    const backupObj = {
      metadata: {
        source: 'firestore',
        firestoreProject: 'temple-f4f7d',
        exportedAt: exportTimestamp,
        exportedBy: user.email || user.uid,
        exportedByUid: user.uid,
        schemaVersion: '23.1',
        backupVersion: '2',
        note: 'Authoritative Firestore export. Does NOT depend on IndexedDB cache. BUG-003 fix (Step 23.1).'
      },
      collections,
      counters: countersData,
      summary: {
        totalDocuments: totalDocCount,
        collectionCounts: Object.fromEntries(
          BACKUP_COLLECTIONS.map(c => [c, (collections[c] || []).length])
        )
      }
    };

    // --- Serialize to JSON and validate ---
    let jsonStr;
    try {
      jsonStr = JSON.stringify(backupObj, null, 2);
    } catch (serErr) {
      throw new Error(`Backup aborted: JSON serialization failed: ${serErr.message}`);
    }

    // Quick parse-back validation
    try {
      JSON.parse(jsonStr);
    } catch (parseErr) {
      throw new Error(`Backup aborted: output JSON is invalid (parse-back failed): ${parseErr.message}`);
    }

    // --- Generate deterministic filename (no colons or slashes, Windows-safe) ---
    const fileTs = exportTimestamp.replace(/:/g, '-').replace(/\..+$/, '');
    const filename = `Temple_Accounts_Backup_${fileTs}.json`;

    // --- Trigger download ---
    if (btn) btn.textContent = 'Preparing download…';
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    console.log(`[Backup] SUCCESS. File: ${filename}`);
    console.log(`[Backup] Total documents: ${totalDocCount}`);
    console.log('[Backup] Collection counts:', backupObj.summary.collectionCounts);
    console.log('[Backup] Counters:', countersData);
    console.log('[Backup] Source: Firestore authoritative data. Backup does not depend on IndexedDB cache contents.');

  } catch (err) {
    console.error('[Backup] BACKUP FAILED:', err);
    alert(`Backup failed: ${err.message}\n\nNo backup file was downloaded.`);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
  }
}
/* ============================================================
 * STEP 23.2 — FIRESTORE-AWARE RESTORE (BUG-004 + BUG-005 FIX)
 *
 * RESTORE SEMANTICS: FULL REPLACEMENT
 *   - All documents in the backup are written to Firestore
 *     using their original _firestoreId.
 *   - Documents currently in Firestore that are NOT present
 *     in the backup are deleted (full replacement, not merge).
 *   - system/counters is overwritten with the backup values.
 *   - IndexedDB is re-synchronized via fsGetAllSafe() after
 *     a successful Firestore restore.
 *
 * SUPPORTED BACKUP FORMATS:
 *   Schema v23.1 — { metadata, collections, counters, summary }
 *   Legacy IndexedDB — { settings:[], funds:[], receipts:[], ... }
 *     (legacy format is detected and rejected with a clear message
 *      because it does not carry Firestore document IDs or counters)
 *
 * ATOMICITY NOTE:
 *   Firestore does not support single transactions spanning
 *   multiple collections or more than 500 documents. This
 *   implementation uses controlled batched writes (<=450 ops/batch)
 *   with explicit progress tracking. A pre-restore safety snapshot
 *   is always created BEFORE the first destructive Firestore write.
 *   If a batch fails mid-restore, the operation stops and the
 *   safety snapshot filename is displayed for manual recovery.
 * ============================================================ */
async function restoreBackup() {
  // ── Helpers ──────────────────────────────────────────────────────
  const logEl = document.getElementById('restore-progress-log');
  const restoreBtn = document.getElementById('restore-btn');

  function rlog(msg, type) {
    console.log('[Restore]', msg);
    if (!logEl) return;
    const line = document.createElement('div');
    line.style.color = type === 'error' ? '#ff6b6b'
                     : type === 'warn'  ? '#ffd93d'
                     : type === 'ok'    ? '#6bcb77'
                     : '#cdd6f4';
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function rlogSection(msg) {
    if (!logEl) return;
    const line = document.createElement('div');
    line.style.cssText = 'color:#89b4fa;font-weight:bold;margin-top:6px;border-top:1px solid #313244;padding-top:4px;';
    line.textContent = '▶ ' + msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function showLog() {
    if (logEl) { logEl.style.display = 'block'; logEl.innerHTML = ''; }
  }

  function disableRestoreBtn() {
    if (restoreBtn) { restoreBtn.disabled = true; restoreBtn.textContent = 'Restoring…'; }
  }

  function enableRestoreBtn() {
    if (restoreBtn) { restoreBtn.disabled = false; restoreBtn.textContent = 'RESTORE FROM FILE'; }
  }

  /** Deserialize a serialized Firestore Timestamp back to a real Timestamp. */
  function _deserializeTimestamp(val) {
    if (val && typeof val === 'object' && val.__type === 'Timestamp' &&
        typeof val.seconds === 'number' && typeof val.nanoseconds === 'number') {
      if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.Timestamp) {
        return new firebase.firestore.Timestamp(val.seconds, val.nanoseconds);
      }
      // Fallback: return a plain Date if Timestamp constructor not available
      return new Date(val.seconds * 1000 + Math.floor(val.nanoseconds / 1e6));
    }
    if (val && typeof val === 'object' && val.__type === 'Date' && val.iso) {
      return new Date(val.iso);
    }
    return val;
  }

  /** Recursively walk a document and deserialize all serialized timestamps. */
  function _deserializeDoc(doc) {
    if (doc === null || doc === undefined) return doc;
    if (Array.isArray(doc)) return doc.map(_deserializeDoc);
    if (typeof doc === 'object') {
      // If this object IS a serialized timestamp, return the timestamp
      if (doc.__type === 'Timestamp' || doc.__type === 'Date') {
        return _deserializeTimestamp(doc);
      }
      const out = {};
      for (const [k, v] of Object.entries(doc)) {
        out[k] = _deserializeDoc(v);
      }
      return out;
    }
    return doc;
  }

  /** Download a JSON object as a file (for safety snapshot). */
  function _downloadJson(obj, filename) {
    try {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch(e) {
      console.warn('[Restore] Could not auto-download safety snapshot:', e);
    }
  }

  /** Write a batch of {docId, data} pairs to a Firestore collection (set/replace). */
  async function _batchSetCollection(db, collectionName, docPairs) {
    const BATCH_LIMIT = 450; // Firestore limit is 500; stay safe
    for (let i = 0; i < docPairs.length; i += BATCH_LIMIT) {
      const chunk = docPairs.slice(i, i + BATCH_LIMIT);
      const batch = db.batch();
      for (const { docId, data } of chunk) {
        const ref = db.collection(collectionName).doc(docId);
        batch.set(ref, data);
      }
      await batch.commit();
    }
  }

  /** Delete a list of Firestore document IDs from a collection using batched deletes. */
  async function _batchDeleteCollection(db, collectionName, docIds) {
    const BATCH_LIMIT = 450;
    for (let i = 0; i < docIds.length; i += BATCH_LIMIT) {
      const chunk = docIds.slice(i, i + BATCH_LIMIT);
      const batch = db.batch();
      for (const docId of chunk) {
        batch.delete(db.collection(collectionName).doc(docId));
      }
      await batch.commit();
    }
  }

  // ── PRODUCTION COLLECTIONS ───────────────────────────────────────
  const RESTORE_COLLECTIONS = [
    'settings', 'funds', 'incomeCategories', 'expenseCategories', 'bankAccounts',
    'billing', 'receipts', 'payments', 'transfers',
    'chittyMembers', 'chittyCollections', 'chittyPayouts', 'loans'
  ];

  // ── SENSITIVE KEY PATTERNS ──────────────────────────────────────
  const SENSITIVE_PATTERNS = [
    /password/i, /passwd/i, /secret/i, /privateKey/i, /private_key/i,
    /accessToken/i, /access_token/i, /refreshToken/i, /refresh_token/i,
    /serviceAccount/i, /service_account/i, /adminSdk/i, /admin_sdk/i,
    /apiKey/i, /api_key/i, /authToken/i, /auth_token/i,
    /credentials/i, /client_secret/i, /clientSecret/i
  ];

  // ── VALIDATE MONETARY VALUE ──────────────────────────────────────
  function isValidMonetary(v) {
    if (v === undefined || v === null || v === '') return true; // optional
    const n = parseFloat(v);
    return !isNaN(n) && isFinite(n) && n >= 0;
  }

  // ── SCAN FOR SENSITIVE FIELDS (recursive) ────────────────────────
  function hasSensitiveFields(obj, path) {
    if (obj === null || typeof obj !== 'object') return false;
    for (const [k, v] of Object.entries(obj)) {
      const fullKey = path ? `${path}.${k}` : k;
      if (SENSITIVE_PATTERNS.some(p => p.test(k))) return fullKey;
      if (typeof v === 'object' && v !== null) {
        const found = hasSensitiveFields(v, fullKey);
        if (found) return found;
      }
    }
    return false;
  }

  // ── ENTRY POINT ──────────────────────────────────────────────────
  const fileInput = el('restoreFile');
  if (!fileInput || !fileInput.files || !fileInput.files[0]) {
    alert('Choose a backup JSON file first.');
    return;
  }
  const file = fileInput.files[0];

  showLog();
  disableRestoreBtn();

  try {
    // ════════════════════════════════════════════════════════
    // PHASE 1 — AUTHENTICATION CHECK
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 1 — Authentication');
    const user = getCurrentFirebaseUser();
    if (!user) {
      rlog('ERROR: No authenticated user. Please log in before restoring.', 'error');
      throw new Error('Authentication required. Please log in before restoring.');
    }
    rlog(`Authenticated as: ${user.email || user.uid}`, 'ok');

    const db = getFirestoreDb();
    if (!db) throw new Error('Firestore is not initialized.');

    // ════════════════════════════════════════════════════════
    // PHASE 2 — PARSE & SCHEMA DETECTION
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 2 — Parse & Schema Detection');
    rlog('Reading backup file…');

    let rawText;
    try {
      rawText = await file.text();
    } catch(e) {
      throw new Error('Failed to read file: ' + e.message);
    }

    let parsed;
    try {
      parsed = JSON.parse(rawText);
    } catch(e) {
      throw new Error('Invalid JSON: ' + e.message);
    }
    rlog('JSON parse: OK');

    if (typeof parsed !== 'object' || Array.isArray(parsed) || parsed === null) {
      throw new Error('Backup root must be a JSON object.');
    }

    // Detect schema: v23.1 Firestore-aware vs. legacy IndexedDB
    const isFirestoreSchema = !!(parsed.metadata && parsed.collections && parsed.counters !== undefined);
    const isLegacySchema = !isFirestoreSchema && Array.isArray(parsed.settings || parsed.receipts || []);

    if (!isFirestoreSchema) {
      if (isLegacySchema || parsed.settings || parsed.receipts) {
        throw new Error(
          'Legacy IndexedDB backup format detected (schema version < 23.1). ' +
          'This backup does not contain Firestore document IDs or a counters section. ' +
          'Restore is only supported for Firestore-authoritative backups (schema v23.1+). ' +
          'Please create a new backup using the Download Backup button first.'
        );
      }
      throw new Error('Unknown backup format. Expected { metadata, collections, counters }.');
    }

    const meta = parsed.metadata || {};
    rlog(`Schema: v${meta.schemaVersion || '?'} | Source: ${meta.source || '?'} | Exported: ${meta.exportedAt || '?'}`);
    rlog(`Exported by: ${meta.exportedBy || 'unknown'}`);

    if (meta.source !== 'firestore') {
      throw new Error(`Backup source is '${meta.source}' — only 'firestore' source backups are supported for Firestore restore.`);
    }

    // ════════════════════════════════════════════════════════
    // PHASE 3 — FULL BACKUP VALIDATION (before any write)
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 3 — Backup Validation');
    const collections = parsed.collections;
    const countersRaw = parsed.counters;
    const validationErrors = [];

    // A. All required collections present
    for (const col of RESTORE_COLLECTIONS) {
      if (!(col in collections)) {
        validationErrors.push(`Missing collection: '${col}'`);
      } else if (!Array.isArray(collections[col])) {
        validationErrors.push(`Collection '${col}' is not an array`);
      }
    }

    // B. Validate all documents
    const seenIds = {};
    for (const col of RESTORE_COLLECTIONS) {
      if (!Array.isArray(collections[col])) continue;
      seenIds[col] = new Set();
      for (let i = 0; i < collections[col].length; i++) {
        const doc = collections[col][i];
        if (typeof doc !== 'object' || doc === null || Array.isArray(doc)) {
          validationErrors.push(`${col}[${i}]: not an object`);
          continue;
        }
        // F. Document ID required
        if (!doc._firestoreId || typeof doc._firestoreId !== 'string' || !doc._firestoreId.trim()) {
          validationErrors.push(`${col}[${i}]: missing or invalid _firestoreId`);
        } else {
          // G. Duplicate IDs
          if (seenIds[col].has(doc._firestoreId)) {
            validationErrors.push(`${col}: duplicate _firestoreId '${doc._firestoreId}'`);
          }
          seenIds[col].add(doc._firestoreId);
        }
        // H. Timestamps: validate serialized form
        for (const [k, v] of Object.entries(doc)) {
          if (v && typeof v === 'object' && v.__type === 'Timestamp') {
            if (typeof v.seconds !== 'number' || typeof v.nanoseconds !== 'number') {
              validationErrors.push(`${col}[${i}].${k}: invalid serialized Timestamp (missing seconds/nanoseconds)`);
            }
          }
        }
        // I. Monetary values
        for (const mf of ['amount', 'totalAmount', 'unitPrice', 'loanReceived', 'repayment', 'amountReceived']) {
          if (mf in doc && !isValidMonetary(doc[mf])) {
            validationErrors.push(`${col}[${i}].${mf}: invalid monetary value '${doc[mf]}'`);
          }
        }
        // L. Security scan
        const sensitiveKey = hasSensitiveFields(doc, `${col}[${i}]`);
        if (sensitiveKey) {
          validationErrors.push(`SECURITY: sensitive field detected at '${sensitiveKey}' — backup rejected`);
        }
      }
    }

    // J. Billing/accounting structural integrity
    if (Array.isArray(collections.billing) && Array.isArray(collections.receipts)) {
      const receiptById = new Map();
      for (const r of collections.receipts) {
        if (r._firestoreId) receiptById.set(r._firestoreId, r);
        if (r.id !== undefined) receiptById.set(String(r.id), r);
      }
      for (const bill of collections.billing) {
        if (bill.accountingReceiptId !== undefined && bill.accountingReceiptId !== null) {
          const rcptId = bill.accountingReceiptId;
          const hasReceipt = receiptById.has(String(rcptId)) ||
            collections.receipts.some(r => r.billingId === bill.id || r.billingId === bill._firestoreId);
          if (!hasReceipt) {
            validationErrors.push(
              `billing '${bill._firestoreId}': accountingReceiptId '${rcptId}' has no matching receipt`);
          }
        }
      }
    }

    // K. Counters validation
    if (!countersRaw || typeof countersRaw !== 'object') {
      validationErrors.push('counters section is missing or invalid');
    } else {
      const REQUIRED_COUNTER_FIELDS = ['billingReceiptCounter', 'receiptCounter', 'voucherCounter'];
      for (const f of REQUIRED_COUNTER_FIELDS) {
        const raw = countersRaw[f];
        const num = typeof raw === 'number' ? raw : parseFloat(raw);
        if (isNaN(num) || !isFinite(num) || num < 0) {
          validationErrors.push(`counters.${f}: invalid value '${raw}' (expected non-negative number)`);
        }
      }
    }

    if (validationErrors.length > 0) {
      rlog(`VALIDATION FAILED — ${validationErrors.length} error(s):`, 'error');
      for (const e of validationErrors) rlog('  ✗ ' + e, 'error');
      throw new Error(`Backup validation failed with ${validationErrors.length} error(s). No data was written to Firestore. See log above.`);
    }
    rlog(`Validation: PASSED — all ${RESTORE_COLLECTIONS.length} collections valid`, 'ok');

    // ════════════════════════════════════════════════════════
    // PHASE 4 — RESTORE PREVIEW & USER CONFIRMATION
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 4 — Restore Preview');

    const counts = {};
    for (const col of RESTORE_COLLECTIONS) counts[col] = (collections[col] || []).length;

    const previewLines = [
      `Backup source:    ${meta.source}`,
      `Backup timestamp: ${meta.exportedAt}`,
      `Schema version:   ${meta.schemaVersion || 'unknown'}`,
      `Exported by:      ${meta.exportedBy || 'unknown'}`,
      ``,
      `Collection counts in backup:`,
      `  settings:          ${counts.settings}`,
      `  funds:             ${counts.funds}`,
      `  incomeCategories:  ${counts.incomeCategories}`,
      `  expenseCategories: ${counts.expenseCategories}`,
      `  bankAccounts:      ${counts.bankAccounts}`,
      `  billing:           ${counts.billing}`,
      `  receipts:          ${counts.receipts}`,
      `  payments:          ${counts.payments}`,
      `  transfers:         ${counts.transfers}`,
      `  chittyMembers:     ${counts.chittyMembers}`,
      `  chittyCollections: ${counts.chittyCollections}`,
      `  chittyPayouts:     ${counts.chittyPayouts}`,
      `  loans:             ${counts.loans}`,
      ``,
      `Counters in backup:`,
      `  billingReceiptCounter: ${countersRaw.billingReceiptCounter}`,
      `  receiptCounter:        ${countersRaw.receiptCounter}`,
      `  voucherCounter:        ${countersRaw.voucherCounter}`,
      ``,
      `This restore will REPLACE the current Firestore production data.`,
      `Documents in Firestore but absent from the backup will be DELETED.`,
      `A safety snapshot of the current Firestore state will be`,
      `downloaded to your computer before any changes are made.`
    ].join('\n');

    const confirmed = window.confirm(
      `RESTORE PREVIEW\n\n${previewLines}\n\nProceed with restore?`
    );
    if (!confirmed) {
      rlog('Restore cancelled by user.', 'warn');
      enableRestoreBtn();
      return;
    }
    rlog('User confirmed restore.');

    // ════════════════════════════════════════════════════════
    // PHASE 5 — PRE-RESTORE SAFETY SNAPSHOT (Firestore)
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 5 — Pre-Restore Safety Snapshot');
    rlog('Reading current Firestore state for safety snapshot…');

    const snapshotTs = new Date().toISOString();
    const snapshotCollections = {};
    let snapshotCounters = null;
    let snapshotTotalDocs = 0;

    for (const col of RESTORE_COLLECTIONS) {
      try {
        const snap = await db.collection(col).get();
        const docs = [];
        snap.forEach(docSnap => docs.push({ _firestoreId: docSnap.id, ...docSnap.data() }));
        snapshotCollections[col] = docs;
        snapshotTotalDocs += docs.length;
      } catch(snapErr) {
        rlog(`WARN: Could not snapshot '${col}': ${snapErr.message}`, 'warn');
        snapshotCollections[col] = [];
      }
    }
    try {
      const cSnap = await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).get();
      snapshotCounters = cSnap.exists ? { _firestoreId: FS_COUNTERS_DOC_ID, ...cSnap.data() } : null;
    } catch(cErr) {
      rlog(`WARN: Could not snapshot counters: ${cErr.message}`, 'warn');
    }

    const safetySnapshotObj = {
      metadata: {
        source: 'firestore',
        type: 'PreRestoreSafetySnapshot',
        snapshotAt: snapshotTs,
        snapshotBy: user.email || user.uid,
        snapshotByUid: user.uid,
        note: 'Automatically created by restoreBackup() immediately before destructive restore writes (Step 23.2).'
      },
      collections: snapshotCollections,
      counters: snapshotCounters,
      summary: {
        totalDocuments: snapshotTotalDocs,
        collectionCounts: Object.fromEntries(
          RESTORE_COLLECTIONS.map(c => [c, (snapshotCollections[c] || []).length])
        )
      }
    };

    const safetyFileTs = snapshotTs.replace(/:/g, '-').replace(/\.\S+$/, '');
    const safetyFilename = `Temple_Accounts_PreRestore_SafetyBackup_${safetyFileTs}.json`;
    _downloadJson(safetySnapshotObj, safetyFilename);
    rlog(`Safety snapshot downloaded: ${safetyFilename}`, 'ok');
    rlog(`  Documents in current Firestore: ${snapshotTotalDocs}`);

    // Keep track of safety filename for failure messages
    let _safetyFilename = safetyFilename;

    // ════════════════════════════════════════════════════════
    // PHASE 6 — FIRESTORE RESTORE (COLLECTION BY COLLECTION)
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 6 — Firestore Restore');
    rlog('Starting Firestore restore. DO NOT close this tab.');
    let failedStage = null;

    for (const col of RESTORE_COLLECTIONS) {
      rlog(`Restoring ${col}…`);
      try {
        // 1. Build document pairs from backup (deserialize timestamps)
        const backupDocs = collections[col] || [];
        const docPairs = backupDocs.map(rawDoc => {
          const docId = rawDoc._firestoreId;
          // Remove internal backup metadata fields before writing to Firestore
          const { _firestoreId, _firestoreCollection, ...rest } = rawDoc;
          // Deserialize serialized timestamps recursively
          const data = _deserializeDoc(rest);
          // Stamp with restore audit metadata (does not alter document content)
          data._restoredAt = new Date().toISOString();
          data._restoredBy = user.uid;
          return { docId, data };
        });

        // 2. Find Firestore IDs currently in this collection (for deletion of extras)
        const currentSnap = await db.collection(col).get();
        const currentIds = new Set();
        currentSnap.forEach(d => currentIds.add(d.id));
        const backupIds = new Set(docPairs.map(p => p.docId));

        // 3. Delete documents in Firestore that are NOT in the backup
        const idsToDelete = [...currentIds].filter(id => !backupIds.has(id));
        if (idsToDelete.length > 0) {
          rlog(`  Deleting ${idsToDelete.length} extra Firestore doc(s) not in backup…`);
          await _batchDeleteCollection(db, col, idsToDelete);
        }

        // 4. Write all backup documents to Firestore (set = full replace)
        if (docPairs.length > 0) {
          await _batchSetCollection(db, col, docPairs);
        }

        rlog(`  ${col}: ${docPairs.length} written, ${idsToDelete.length} deleted`, 'ok');
      } catch(colErr) {
        failedStage = `Restoring collection '${col}'`;
        rlog(`ERROR restoring '${col}': ${colErr.message}`, 'error');
        throw new Error(
          `Restore failed at stage: ${failedStage}.\n` +
          `Error: ${colErr.message}\n\n` +
          `The restore was STOPPED. Some collections may have been partially updated.\n` +
          `Safety snapshot for recovery: ${_safetyFilename}`
        );
      }
    }

    // ════════════════════════════════════════════════════════
    // PHASE 7 — RESTORE system/counters (BUG-005)
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 7 — Restoring system/counters');
    rlog('Restoring system/counters document…');
    try {
      // Build the counter payload from backup — exclude backup-internal fields
      const { _firestoreId: _cId, _firestoreCollection: _cCol, ...restCounters } = countersRaw;
      const counterPayload = _deserializeDoc(restCounters);
      // Stamp restore audit fields
      counterPayload._restoredAt = new Date().toISOString();
      counterPayload._restoredBy = user.uid;
      // Write using set (full replace) — preserves exact field names
      await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).set(counterPayload);
      rlog(`system/counters written:`, 'ok');
      rlog(`  billingReceiptCounter = ${counterPayload.billingReceiptCounter}`);
      rlog(`  receiptCounter        = ${counterPayload.receiptCounter}`);
      rlog(`  voucherCounter        = ${counterPayload.voucherCounter}`);
    } catch(cErr) {
      failedStage = 'Restoring system/counters';
      rlog(`ERROR restoring counters: ${cErr.message}`, 'error');
      throw new Error(
        `Restore failed at stage: ${failedStage}.\n` +
        `Error: ${cErr.message}\n\n` +
        `Collection data was restored but counters could not be written.\n` +
        `Safety snapshot for recovery: ${_safetyFilename}`
      );
    }

    // ════════════════════════════════════════════════════════
    // PHASE 8 — POST-RESTORE FIRESTORE VALIDATION
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 8 — Post-Restore Validation');
    rlog('Re-reading Firestore to verify restore…');

    let allValid = true;
    for (const col of RESTORE_COLLECTIONS) {
      const expected = (collections[col] || []).length;
      try {
        const vSnap = await db.collection(col).get();
        const actual = vSnap.size;
        if (actual !== expected) {
          rlog(`WARN: ${col}: expected ${expected} docs, got ${actual}`, 'warn');
          allValid = false;
        } else {
          rlog(`  ${col}: ${actual}/${expected} ✓`, 'ok');
        }
      } catch(vErr) {
        rlog(`WARN: Could not verify '${col}': ${vErr.message}`, 'warn');
        allValid = false;
      }
    }

    // Verify counters
    try {
      const verSnap = await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).get();
      if (verSnap.exists) {
        const vData = verSnap.data();
        const brc = vData.billingReceiptCounter;
        const rc  = vData.receiptCounter;
        const vc  = vData.voucherCounter;
        const expectedBrc = countersRaw.billingReceiptCounter;
        const expectedRc  = countersRaw.receiptCounter;
        const expectedVc  = countersRaw.voucherCounter;
        if (brc !== expectedBrc || rc !== expectedRc || vc !== expectedVc) {
          rlog(`WARN: Counter mismatch! Got brc=${brc} rc=${rc} vc=${vc}; expected brc=${expectedBrc} rc=${expectedRc} vc=${expectedVc}`, 'warn');
          allValid = false;
        } else {
          rlog(`  system/counters: billingReceiptCounter=${brc} receiptCounter=${rc} voucherCounter=${vc} ✓`, 'ok');
        }
      } else {
        rlog('WARN: system/counters document not found after restore!', 'warn');
        allValid = false;
      }
    } catch(vCErr) {
      rlog(`WARN: Counter verification failed: ${vCErr.message}`, 'warn');
    }

    if (!allValid) {
      rlog('Post-restore validation detected discrepancies (see warnings above).', 'warn');
    } else {
      rlog('Post-restore validation: ALL PASSED', 'ok');
    }

    // ════════════════════════════════════════════════════════
    // PHASE 9 — INDEXEDDB CACHE SYNCHRONIZATION
    // ════════════════════════════════════════════════════════
    rlogSection('Phase 9 — IndexedDB Cache Synchronization');
    rlog('Synchronizing IndexedDB cache via existing fsGetAllSafe() layer…');

    // fsGetAllSafe reads Firestore and automatically writes to IndexedDB cache.
    // This is the application's existing Firestore → IDB sync mechanism.
    let idbSyncErrors = 0;
    for (const col of RESTORE_COLLECTIONS) {
      try {
        await fsGetAllSafe(col);
        rlog(`  ${col}: IDB cache synchronized`, 'ok');
      } catch(idbErr) {
        rlog(`  WARN: IDB sync skipped for '${col}': ${idbErr.message}`, 'warn');
        idbSyncErrors++;
      }
    }

    // Sync settings into APP_SETTINGS
    try {
      await refreshSettings();
      rlog('  APP_SETTINGS refreshed from Firestore.', 'ok');
    } catch(sErr) {
      rlog(`  WARN: refreshSettings failed: ${sErr.message}`, 'warn');
    }

    if (idbSyncErrors === 0) {
      rlog('IndexedDB cache synchronization: COMPLETE', 'ok');
    } else {
      rlog(`IndexedDB cache synchronization: ${idbSyncErrors} collection(s) had warnings.`, 'warn');
    }

    // ════════════════════════════════════════════════════════
    // PHASE 10 — COMPLETE
    // ════════════════════════════════════════════════════════
    rlogSection('Restore Complete');
    rlog('✓ Firestore restore completed successfully.', 'ok');
    rlog(`  Safety snapshot: ${safetyFilename}`, 'ok');
    rlog('  Navigating to Dashboard…');

    if (typeof applyBrand === 'function') applyBrand();

    setTimeout(async () => {
      await navigate('dashboard');
    }, 1800);

  } catch(err) {
    console.error('[Restore] RESTORE FAILED:', err);
    rlog('', 'error');
    rlog('━━━ RESTORE FAILED ━━━', 'error');
    rlog(err.message, 'error');
    rlog('No further writes were attempted after this failure.', 'error');
    rlog('Check the safety snapshot file (if downloaded) for recovery.', 'warn');
    alert('Restore failed:\n\n' + err.message);
    enableRestoreBtn();
  }
}

/* ===================== CSV EXPORT ===================== */
function downloadCSV(rows, filenamePrefix) {
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  // UTF-8 BOM (\uFEFF) ensures Excel and spreadsheets open Malayalam properly without garbled characters
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filenamePrefix}_${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function exportCSV(type) {
  if (type === 'receipts') {
    const list = await allReceipts();
    const rows = [['ReceiptNo','Date','Name','Mobile','Fund','Category','Description','PaymentMode','BankAccount','Amount','Remarks','Status']];
    list.forEach(r => rows.push([r.receiptNo, r.date, r.name, r.mobile, r.fund, r.category, r.description, r.paymentMode, r.bankAccount, r.amount, r.remarks, r.voided?'Voided':'Active']));
    downloadCSV(rows, 'Receipts');
  } else if (type === 'payments') {
    const list = await allPayments();
    const rows = [['VoucherNo','Date','PaidTo','Fund','Category','Description','PaymentMode','BankAccount','Amount','BillNo','Remarks','Status']];
    list.forEach(p => rows.push([p.voucherNo, p.date, p.paidTo, p.fund, p.category, p.description, p.paymentMode, p.bankAccount, p.amount, p.billNo, p.remarks, p.voided?'Voided':'Active']));
    downloadCSV(rows, 'Payments');
  }
}

/* ===================== GLOBAL SEARCH ===================== */
async function runGlobalSearch() {
  const q = el('globalSearch').value.trim().toLowerCase();
  if (!q) return;
  const [receipts, payments] = await Promise.all([allReceipts(), allPayments()]);
  const rMatches = receipts.filter(r => [r.receiptNo,r.name,r.mobile,r.category,r.fund,r.description,String(r.amount)].join(' ').toLowerCase().includes(q));
  const pMatches = payments.filter(p => [p.voucherNo,p.paidTo,p.category,p.fund,p.description,p.billNo,String(p.amount)].join(' ').toLowerCase().includes(q));
  const main = el('app-main');
  el('topbar-title').textContent = 'Search Results';
  qsa('.nav-item').forEach(b => b.classList.remove('active'));
  main.innerHTML = `
    <button class="btn-outline btn-sm" onclick="navigate('dashboard')">← Back to Dashboard</button>
    <div class="panel-row" style="margin-top:14px;">
      <div class="panel"><h3>Receipts (${rMatches.length})</h3>${simpleList(rMatches.map(r=>`${esc(r.receiptNo)} · ${fmtDate(r.date)} · ${esc(r.name)} — ${fmtMoney(r.amount)}`))}</div>
      <div class="panel"><h3>Payments (${pMatches.length})</h3>${simpleList(pMatches.map(p=>`${esc(p.voucherNo)} · ${fmtDate(p.date)} · ${esc(p.paidTo)} — ${fmtMoney(p.amount)}`))}</div>
    </div>
  `;
}

/* ===================== NAV WIRING & SIDEBAR STATE (STEP 20.1) ===================== */
function toggleSidebarCollapse() {
  const sidebar = el('sidebar');
  if (!sidebar) return;
  const isCollapsed = sidebar.classList.toggle('collapsed');
  try {
    localStorage.setItem('temple_nav_collapsed', isCollapsed ? 'true' : 'false');
  } catch (e) {}
  updateCollapseButtons(isCollapsed);
  const tooltip = el('nav-rail-tooltip');
  if (tooltip) tooltip.classList.remove('visible');
}

function updateCollapseButtons(isCollapsed) {
  const topBtn = el('sidebar-collapse-btn');
  const footerBtn = el('rail-expand-btn');
  const footerLabel = document.querySelector('.footer-btn-label');
  const collapseIcon = topBtn ? topBtn.querySelector('.collapse-toggle-icon') : null;
  const footerIcon = footerBtn ? footerBtn.querySelector('.expand-footer-icon') : null;
  
  const titleText = isCollapsed ? 'Expand sidebar' : 'Collapse sidebar';
  if (topBtn) {
    topBtn.setAttribute('title', titleText);
    topBtn.setAttribute('aria-label', titleText);
  }
  if (footerBtn) {
    footerBtn.setAttribute('title', titleText);
    footerBtn.setAttribute('aria-label', titleText);
  }
  if (footerLabel) {
    footerLabel.textContent = isCollapsed ? 'Expand' : 'Collapse Menu';
  }
  if (collapseIcon) {
    collapseIcon.innerHTML = isCollapsed 
      ? '<polyline points="9 18 15 12 9 6"></polyline>'

function openMobileNav() {
  const sidebar = el('sidebar');
  const backdrop = el('sidebar-backdrop');
  if (sidebar) sidebar.classList.add('mobile-open');
  if (backdrop) backdrop.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeMobileNav() {
  const sidebar = el('sidebar');
  const backdrop = el('sidebar-backdrop');
  if (sidebar) sidebar.classList.remove('mobile-open');
  if (backdrop) backdrop.classList.remove('active');
  document.body.style.overflow = '';
}

function initNavTooltips() {
  const tooltip = el('nav-rail-tooltip');
  if (!tooltip) return;
  
  const showTooltip = (btn) => {
    const sidebar = el('sidebar');
    if (!sidebar || !sidebar.classList.contains('collapsed')) return;
    if (window.innerWidth <= 768) return;
    
    const text = btn.dataset.tooltip || btn.getAttribute('aria-label');
    if (!text) return;
    
    tooltip.textContent = text;
    tooltip.classList.add('visible');
    
    const rect = btn.getBoundingClientRect();
    const tooltipRect = tooltip.getBoundingClientRect();
    const top = rect.top + (rect.height - tooltipRect.height) / 2;
    const left = rect.right + 10;
    
    tooltip.style.top = `${Math.max(8, top)}px`;
    tooltip.style.left = `${left}px`;
  };
  
  const hideTooltip = () => {
    tooltip.classList.remove('visible');
  };
  
  document.addEventListener('mouseover', (e) => {
    const btn = e.target.closest('#sidebar .nav-item[data-tooltip], #sidebar [data-tooltip]');
    if (btn) showTooltip(btn);
    else hideTooltip();
  });
  
  document.addEventListener('focusin', (e) => {
    const btn = e.target.closest('#sidebar .nav-item[data-tooltip], #sidebar [data-tooltip]');
    if (btn) showTooltip(btn);
  });
  
  document.addEventListener('focusout', hideTooltip);
  window.addEventListener('scroll', hideTooltip, true);
}

function initSidebarState() {
  const sidebar = el('sidebar');
  if (!sidebar) return;
  let stored = null;
  try {
    stored = localStorage.getItem('temple_nav_collapsed');
  } catch (e) {}
  
  const isTablet = window.innerWidth <= 1024 && window.innerWidth > 768;
  const shouldCollapse = stored !== null ? stored === 'true' : isTablet;
  if (shouldCollapse && window.innerWidth > 768) {
    sidebar.classList.add('collapsed');
  } else {
    sidebar.classList.remove('collapsed');
  }
  updateCollapseButtons(sidebar.classList.contains('collapsed'));
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-item');
  if (btn) {
    navigate(btn.dataset.view);
    if (window.innerWidth <= 768) {
      closeMobileNav();
    }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && window.innerWidth <= 768) {
    closeMobileNav();
  }
});

window.navigate = navigate;
window.toggleSidebarCollapse = toggleSidebarCollapse;
window.openMobileNav = openMobileNav;
window.closeMobileNav = closeMobileNav;

async function boot() {
  await openDB();
  await loadAuthoritativeMasterData();
  applyBrand();
  initSidebarState();
  initNavTooltips();
  initMotionObserver();
  await navigate('dashboard');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    initSidebarState();
    initNavTooltips();
    initMotionObserver();
  });
} else {
  initSidebarState();
  initNavTooltips();
  initMotionObserver();
}

void mainImage(out vec4 fragColor,in vec2 fragCoord){
    vec2 uv=fragCoord/uResolution.xy*2.-1.;
    uv.x *= uResolution.x / uResolution.y;
    uv.y*=-1.;
    uv+=uWarp*vec2(sin(uv.y*6.283+uTime*0.5),cos(uv.x*6.283+uTime*0.5))*0.05;
    fragColor=cppn_fn(uv,0.1*sin(0.3*uTime),0.1*sin(0.69*uTime),0.1*sin(0.44*uTime));
}

void main(){
    vec4 col;mainImage(col,gl_FragCoord.xy);
    col.rgb=hueShiftRGB(col.rgb,uHueShift);
    float scanline_val=sin(gl_FragCoord.y*uScanFreq)*0.5+0.5;
    col.rgb*=1.-(scanline_val*scanline_val)*uScan;
    col.rgb+=(rand(gl_FragCoord.xy+uTime)-0.5)*uNoise;
    vec3 result=clamp(col.rgb,0.0,1.0);
    if(uLightMode>0.5){
      float energy=max(result.r,max(result.g,result.b));
      vec3 hue=result/max(energy,0.001);
      float coverage=smoothstep(0.08,0.82,energy);
      vec3 ink=mix(hue*0.32,hue*0.78,smoothstep(0.0,1.0,energy));
      result=mix(vec3(1.0),ink,coverage*0.82);
    }
    gl_FragColor=vec4(result,1.0);
}
