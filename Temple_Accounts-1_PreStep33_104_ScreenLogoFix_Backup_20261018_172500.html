    #ledgerTable td:nth-child(4) {
      white-space: normal;
      min-width: 150px;
      max-width: 280px;
      word-break: break-word;
    }

    /* Step 33.69: Physical Receipt Visual Identification */
    .row-physical-p {
      background-color: rgba(33, 150, 243, 0.05) !important;
    }

    .row-physical-p:hover {
      background-color: rgba(33, 150, 243, 0.10) !important;
    }

    .row-physical-pu {
      background-color: rgba(156, 39, 176, 0.05) !important;
    }

    .row-physical-pu:hover {
      background-color: rgba(156, 39, 176, 0.10) !important;
    }

    .badge-physical-p {
      background: rgba(33, 150, 243, 0.15);
      color: #1976d2;
      border: 1px solid rgba(33, 150, 243, 0.35);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 6px;
      display: inline-block;
      vertical-align: middle;
    }

    .badge-physical-pu {
      background: rgba(156, 39, 176, 0.15);
      color: #7b1fa2;
      border: 1px solid rgba(156, 39, 176, 0.35);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 6px;
      display: inline-block;
      vertical-align: middle;
    }

    /* ===================== TOOLBAR & BANNERS ===================== */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      align-items: center;
    }

    .toolbar input,
    .toolbar select {
      height: 36px;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      background: #ffffff;
      color: var(--text);
      box-sizing: border-box;
    }

    .toolbar input:focus,
    .toolbar select:focus {
      border-color: var(--primary-red);
      outline: none;
      box-shadow: 0 0 0 3px rgba(155, 44, 44, 0.15);
    }

    .section-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 16px;
      letter-spacing: -0.2px;
    }

    .muted {
      color: var(--text-muted);
      font-size: 13px;
    }

    .balance-banner {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-weight: 500;
      font-size: 13px;
      color: var(--amber);
      box-shadow: var(--shadow-xs);
    }

    .balance-banner.ok {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green);
    }

    .balance-banner.bad {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red);
    }

    /* ===================== MODALS ===================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(47, 42, 39, 0.45);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 180ms ease;
    }

    .modal-box {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow-modal);
      border: 1px solid var(--border);
      animation: scaleUp 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-box h3 {
      margin-top: 0;
      margin-bottom: 14px;
      color: var(--primary-red);
      font-size: 17px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scaleUp {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ===================== BILLING & EXPANDED WORKSPACE (STEP 33.24) ===================== */
    .billing-grid {
      display: block;
      width: 100%;
    }

    .billing-expanded-grid {
      width: 100%;
      box-sizing: border-box;
    }

    .billing-form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .billing-form-col {
      display: flex;
      flex-direction: column;
    }

    .billing-bottom-row {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) auto;
      gap: 20px;
      align-items: center;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    @media (max-width: 960px) {
      .billing-form-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .billing-bottom-row {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .billing-bottom-row .billing-form-actions {
        justify-content: flex-start;
      }
    }

    /* ===================== NATIVE RECEIPT PRINTER MODAL (STEP 33.26 REFERENCE-MATCHED) ===================== */
    :root {
      --printer-body: #1e2024;
      --printer-screen: #202020;
      --printer-border: #34363a;
      --printer-paper: #ffffff;
      --printer-paper-text: #202020;
      --printer-led-processing: #f59e0b;
      --printer-led-active: #10b981;
      --printer-led-error: #ef4444;
      --printer-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --printer-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    }

    .receipt-printer-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      /* STEP 33.30C: High-contrast opaque scrim replaces CPU-taxing full-viewport backdrop-filter blur,
     eliminating 25-35ms per-frame raster stalls and achieving sustained 60 FPS compositor throughput */
      background: rgba(15, 17, 21, 0.86);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.24s var(--printer-ease-out), visibility 0.24s;
      box-sizing: border-box;
    }

    .receipt-printer-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .receipt-printer-backdrop {
      position: absolute;
      inset: 0;
      cursor: pointer;
    }

    .receipt-printer-modal-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 6px;
      box-sizing: border-box;
    }

    .receipt-printer-root {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      isolation: isolate;
    }

    /* Printer Hardware Chassis (ReceiptPrinter.Machine) */
    .receipt-printer-chassis {
      position: relative;
      z-index: 30;
      width: 100%;
      max-width: 420px;
      background: var(--printer-body, #1e2024);
      border: 1px solid var(--printer-border, #34363a);
      border-radius: 20px;
      box-shadow: 0 20px 36px -20px rgba(0, 0, 0, 0.75),
        0 6px 14px -8px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 rgba(0, 0, 0, 0.55);
      color: #f3f4f6;
      padding: 10px 12px 18px;
      box-sizing: border-box;
      overflow: hidden;
      transform: scale(0.96) translateY(8px);
      opacity: 0.9;
      transition: transform 0.26s var(--printer-ease-out), opacity 0.26s var(--printer-ease-out);
    }

    .receipt-printer-overlay.active .receipt-printer-chassis {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .receipt-printer-chassis.shake {
      animation: printerShake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes printerShake {

      10%,
      90% {
        transform: translate3d(-2px, 0, 0);
      }

      20%,
      80% {
        transform: translate3d(3px, 0, 0);
      }

      30%,
      50%,
      70% {
        transform: translate3d(-4px, 0, 0);
      }

      40%,
      60% {
        transform: translate3d(4px, 0, 0);
      }
    }

    /* Printer Top Bezel & Header Controls (ReceiptPrinter.Header) */
    .printer-top-bezel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      margin-bottom: 8px;
    }

    .printer-brand-strip {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .printer-brand-logo {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .printer-emblem {
      font-size: 15px;
      line-height: 1;
    }

    .printer-brand-name {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #9ca3af;
      font-family: monospace;
    }

    .printer-bezel-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .printer-mode-toggle-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #9ca3af;
      font-size: 10px;
      font-family: monospace;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
    }

    .printer-mode-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #e5e7eb;
    }

    .printer-replay-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #9ca3af;
      font-size: 11px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1;
      padding: 0;
    }

    .printer-replay-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: rotate(30deg);
    }

    .printer-close-icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #9ca3af;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.15s ease;
      line-height: 1;
      padding: 0;
    }

    .printer-close-icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    /* Recessed Status Screen (ReceiptPrinter.Screen) */
    .printer-recessed-screen {
      background: var(--printer-screen, #202020);
      border: 1px solid #2d3035;
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8),
        inset 0 0 24px 4px rgba(0, 0, 0, 0.52),
        0 1px 0 rgba(255, 255, 255, 0.04);
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .printer-status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .printer-status-indicator {
      position: relative;
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      flex-shrink: 0;
    }

    .printer-status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
      transition: background 0.25s var(--printer-ease-out), box-shadow 0.25s var(--printer-ease-out);
    }

    .printer-status-led.processing {
      background: var(--printer-led-processing, #f59e0b);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.85);
      animation: ledPulse 1s infinite alternate;
    }

    .printer-status-led.printing {
      background: var(--printer-led-active, #10b981);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.85);
      animation: ledPulse 0.65s infinite alternate;
    }

    .printer-status-led.ready {
      background: var(--printer-led-active, #10b981);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
    }

    .printer-status-led.error {
      background: var(--printer-led-error, #ef4444);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.85);
    }

    @keyframes ledPulse {
      from {
        opacity: 0.55;
        transform: scale(0.92);
      }

      to {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .printer-status-text-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .printer-status-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #e5e7eb;
      font-family: monospace;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .printer-screen-subtext {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.3;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Processing State Subpanel */
    .printer-processing-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 6px 8px 4px;
      margin-top: 4px;
    }

    .printer-spinner-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.2);
      border-top-color: var(--printer-led-processing, #f59e0b);
      animation: printerSpin 0.75s linear infinite;
      margin-bottom: 4px;
    }

    @keyframes printerSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .printer-processing-text-col {
      margin-bottom: 4px;
    }

    .printer-processing-title {
      font-size: 12px;
      font-weight: 700;
      color: #f9fafb;
      letter-spacing: 0.3px;
      margin-bottom: 1px;
    }

    .printer-processing-subtitle {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.25;
    }

    .printer-processing-badge {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .printer-processing-badge .badge-pill {
      font-size: 10px;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #e5e7eb;
    }

    /* Error State Panel */
    .printer-error-panel {
      padding: 14px 12px;
      text-align: center;
      margin-top: 8px;
    }

    .printer-error-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .printer-error-title {
      font-size: 14px;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 6px;
    }

    .printer-error-msg {
      font-size: 12px;
      color: #d1d5db;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 0 auto 12px;
      max-width: 320px;
      line-height: 1.4;
      word-break: break-word;
    }

    .printer-error-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    /* Feed Throat & Cutter Edge Slot */
    .printer-throat-slot {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 6px;
      z-index: 40;
    }

    .printer-mouth-slit {
      height: 8px;
      background: #090a0d;
      border-radius: 4px;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.7);
    }

    .printer-cutter-edge {
      height: 2px;
      background: linear-gradient(90deg, #282a30, #5a6272 50%, #282a30);
      margin-top: 1px;
      border-radius: 1px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .printer-feed-progress {
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1px;
      overflow: hidden;
      margin-top: 2px;
    }

    .printer-progress-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
      background: linear-gradient(90deg, var(--printer-led-processing, #f59e0b), var(--printer-led-active, #10b981));
      border-radius: 1px;
    }

    /* Receipt Paper Output Region (ReceiptPrinter.Output) */
    .printer-paper-ejector {
      position: relative;
      z-index: 20;
      margin-top: -14px;
      width: calc(100% - 24px);
      max-width: 380px;
      overflow: hidden;
      box-sizing: border-box;
      padding: 0 4px 16px;
      contain: paint;
    }

    .printer-throat-ejection-shadow {
      position: absolute;
      left: 12px;
      right: 12px;
      top: -2px;
      height: 8px;
      background: rgba(0, 0, 0, 0.75);
      filter: blur(6px);
      z-index: 25;
      pointer-events: none;
    }

    .printer-receipt-sheet {
      background: var(--printer-paper, #ffffff);
      color: var(--printer-paper-text, #202020);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.4),
        0 4px 12px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(0, 0, 0, 0.08);
      position: relative;
      transform-origin: top center;
      border-radius: 0;
      will-change: transform;
      transform: translateY(calc(-100% + 2px));
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      clip-path: polygon(0% 0%, 100% 0%, 100% calc(100% - 4px),
          98.75% 100%, 97.5% calc(100% - 4px), 96.25% 100%, 95.0% calc(100% - 4px),
          93.75% 100%, 92.5% calc(100% - 4px), 91.25% 100%, 90.0% calc(100% - 4px),
          88.75% 100%, 87.5% calc(100% - 4px), 86.25% 100%, 85.0% calc(100% - 4px),
          83.75% 100%, 82.5% calc(100% - 4px), 81.25% 100%, 80.0% calc(100% - 4px),
          78.75% 100%, 77.5% calc(100% - 4px), 76.25% 100%, 75.0% calc(100% - 4px),
          73.75% 100%, 72.5% calc(100% - 4px), 71.25% 100%, 70.0% calc(100% - 4px),
          68.75% 100%, 67.5% calc(100% - 4px), 66.25% 100%, 65.0% calc(100% - 4px),
          63.75% 100%, 62.5% calc(100% - 4px), 61.25% 100%, 60.0% calc(100% - 4px),
          58.75% 100%, 57.5% calc(100% - 4px), 56.25% 100%, 55.0% calc(100% - 4px),
          53.75% 100%, 52.5% calc(100% - 4px), 51.25% 100%, 50.0% calc(100% - 4px),
          48.75% 100%, 47.5% calc(100% - 4px), 46.25% 100%, 45.0% calc(100% - 4px),
          43.75% 100%, 42.5% calc(100% - 4px), 41.25% 100%, 40.0% calc(100% - 4px),
          38.75% 100%, 37.5% calc(100% - 4px), 36.25% 100%, 35.0% calc(100% - 4px),
          33.75% 100%, 32.5% calc(100% - 4px), 31.25% 100%, 30.0% calc(100% - 4px),
          28.75% 100%, 27.5% calc(100% - 4px), 26.25% 100%, 25.0% calc(100% - 4px),
          23.75% 100%, 22.5% calc(100% - 4px), 21.25% 100%, 20.0% calc(100% - 4px),
          18.75% 100%, 17.5% calc(100% - 4px), 16.25% 100%, 15.0% calc(100% - 4px),
          13.75% 100%, 12.5% calc(100% - 4px), 11.25% 100%, 10.0% calc(100% - 4px),
          8.75% 100%, 7.5% calc(100% - 4px), 6.25% 100%, 5.0% calc(100% - 4px),
          3.75% 100%, 2.5% calc(100% - 4px), 1.25% 100%, 0% calc(100% - 4px));
    }

    /* Stepped Feed: 20 transform keyframes directly derived from the reference component */
    @keyframes receiptPaperFeedStepped {
      0% {
        transform: translateY(calc(-100% + 2px));
        opacity: 0.95;
      }

      7.5% {
        transform: translateY(-91%);
        opacity: 1;
      }

      10.5% {
        transform: translateY(-91%);
      }

      18% {
        transform: translateY(-81%);
      }

      21% {
        transform: translateY(-81%);
      }

      28.5% {
        transform: translateY(-70%);
      }

      31.5% {
        transform: translateY(-70%);
      }

      39% {
        transform: translateY(-58%);
      }

      42% {
        transform: translateY(-58%);
      }

      49.5% {
        transform: translateY(-45%);
      }

      52.5% {
        transform: translateY(-45%);
      }

      60% {
        transform: translateY(-32%);
      }

      63% {
        transform: translateY(-32%);
      }

      70.5% {
        transform: translateY(-20%);
      }

      73.5% {
        transform: translateY(-20%);
      }

      81% {
        transform: translateY(-10%);
      }

      84% {
        transform: translateY(-10%);
      }

      91.5% {
        transform: translateY(-3%);
      }

      94.5% {
        transform: translateY(-3%);
      }

      100% {
        transform: translateY(0%);
        opacity: 1;
      }
    }

    /* Smooth Feed: Continuous fluid feed with natural motor curve */
    @keyframes receiptPaperFeedSmooth {
      0% {
        transform: translateY(calc(-100% + 2px));
      }

      100% {
        transform: translateY(0%);
      }
    }

    .printer-receipt-sheet.feeding.feed-stepped {
      animation: receiptPaperFeedSmooth 2.2s cubic-bezier(0.33, 0.0, 0.2, 1) forwards;
    }

    .printer-receipt-sheet.feeding.feed-smooth {
      animation: receiptPaperFeedSmooth 2.2s cubic-bezier(0.33, 0.0, 0.2, 1) forwards;
    }

    /* Default feeding fallback (STEP 33.76: smooth feed is default and only feed mode) */
    .printer-receipt-sheet.feeding:not(.feed-smooth):not(.feed-stepped) {
      animation: receiptPaperFeedSmooth 2.2s cubic-bezier(0.33, 0.0, 0.2, 1) forwards;
    }

    .printer-receipt-sheet.fed {
      animation: none !important;
      transform: translateY(0) !important;
      opacity: 1 !important;
    }

    .printer-receipt-body {
      padding: 14px 12px 10px;
      max-height: 480px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    /* Realistic 40-Tooth Serrated Bottom Edge (4px Depth) */
    .printer-serrated-edge {
      width: 100%;
      height: 4px;
      position: relative;
      margin-top: -1px;
      overflow: hidden;
      line-height: 0;
    }

    .printer-serrated-edge .serrated-svg {
      display: block;
      width: 100%;
      height: 4px;
    }

    /* Reduced Motion Overrides */
    @media (prefers-reduced-motion: reduce) {
      .receipt-printer-chassis {
        transform: none !important;
        opacity: 1 !important;
        transition: none !important;
      }

      .printer-receipt-sheet.feeding {
        animation: none !important;
        transform: translateY(0) !important;
        opacity: 1 !important;
      }

      .printer-spinner-ring {
        animation: none !important;
      }

      .printer-status-led.processing,
      .printer-status-led.printing {
        animation: none !important;
      }

      .receipt-printer-overlay {
        transition: none !important;
      }
    }

    /* Print Isolation Overrides */
    @media print {

      .receipt-printer-overlay,
      .receipt-printer-backdrop,
      .receipt-printer-modal-content,
      .receipt-printer-chassis,
      .receipt-printer-root,
      .printer-paper-ejector {
        display: none !important;
        visibility: hidden !important;
      }
    }

    /* Mobile Responsive Proportions */
    @media (max-width: 480px) {
      .receipt-printer-modal-content {
        width: 100% !important;
        max-width: min(355px, calc(100vw - 16px)) !important;
        padding: 8px 4px !important;
      }

      .receipt-printer-root {
        width: 100% !important;
        max-width: min(355px, calc(100vw - 16px)) !important;
      }

      .receipt-printer-chassis {
        width: 100% !important;
        max-width: min(355px, calc(100vw - 16px)) !important;
        border-radius: 16px;
        padding: 8px 10px 16px;
      }

      .printer-paper-ejector {
        width: 100% !important;
        max-width: min(345px, calc(100vw - 20px)) !important;
        padding: 0 2px 14px;
      }
    }

    /* Category Segmented Control */
    .billing-category-segmented {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      width: 100%;
    }

    .billing-cat-pill {
      flex: 1 1 0;
      min-width: 0;
      height: auto;
      min-height: 82px;
      padding: 12px 6px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      transition: all 0.15s ease;
      user-select: none;
      box-sizing: border-box;
      box-shadow: none;
    }

    .billing-cat-pill:hover {
      border-color: var(--primary-red-border);
      background: var(--primary-red-soft);
      color: var(--primary-red-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-xs);
    }

    .billing-cat-pill.active {
      background: #fdf2f0;
      border-color: var(--primary-red);
      color: var(--primary-red-dark);
      box-shadow: 0 2px 6px rgba(155, 44, 44, 0.12), inset 0 0 0 1px var(--primary-red);
      transform: none;
    }

    .cat-pill-icon {
      font-size: 20px;
      line-height: 1;
      display: block;
    }

    .cat-pill-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      color: inherit;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .cat-pill-sub {
      font-size: 11px;
      line-height: 1.2;
      color: var(--text-muted);
      display: block;
      white-space: nowrap;
    }

    .billing-cat-pill.active .cat-pill-sub {
      color: var(--primary-red);
      font-weight: 500;
    }

    /* Item Quick Chips */
    .billing-item-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .billing-item-chip {
      height: auto;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      color: var(--text);
      box-sizing: border-box;
      box-shadow: none;
    }

    .billing-item-chip:hover {
      border-color: var(--gold-border);
      background: var(--gold-soft);
      color: var(--text);
      transform: translateY(-1px);
      box-shadow: var(--shadow-xs);
    }

    .billing-item-chip.active {
      background: var(--primary-red);
      border-color: var(--primary-red-dark);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(155, 44, 44, 0.2);
      transform: none;
    }

    .billing-item-chip .chip-name {
      font-weight: 600;
      line-height: 1.3;
    }

    .billing-item-chip .chip-price {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--gold-soft);
      color: var(--gold-dark);
      border: 1px solid var(--gold-border);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .billing-item-chip.active .chip-price {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    /* Quantity Stepper Control */
    .billing-qty-stepper {
      display: flex;
      align-items: stretch;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: #ffffff;
      overflow: hidden;
      width: 100%;
      height: 38px;
      box-sizing: border-box;
      transition: border-color var(--trans-fast), box-shadow var(--trans-fast);
    }

    .billing-qty-stepper:focus-within {
      border-color: var(--primary-red);
      box-shadow: 0 0 0 3px rgba(155, 44, 44, 0.12);
    }

    .qty-btn {
      width: 38px;
      height: 100%;
      border: none;
      background: var(--surface-subtle);
      color: var(--text);
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.12s ease, color 0.12s ease;
      padding: 0;
      flex-shrink: 0;
      box-shadow: none;
      border-radius: 0;
    }

    .qty-btn:hover {
      background: #f0e9df;
      color: var(--primary-red);
      transform: none;
      box-shadow: none;
    }

    .qty-btn:active {
      background: #e5ded2;
    }

    .billing-qty-stepper input[type="number"] {
      flex: 1;
      border: none;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      padding: 0 4px;
      height: 100%;
      outline: none;
      background: transparent;
      -moz-appearance: textfield;
    }

    .billing-qty-stepper input[type="number"]::-webkit-outer-spin-button,
    .billing-qty-stepper input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Payment Mode Buttons */
    .billing-payment-modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .payment-mode-btn {
      height: auto;
      min-height: 48px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
      user-select: none;
      box-sizing: border-box;
      box-shadow: none;
    }

    .payment-mode-btn:hover {
      border-color: var(--primary-red-border);
      background: var(--primary-red-soft);
      transform: translateY(-1px);
      box-shadow: var(--shadow-xs);
    }

    .payment-mode-btn.active {
      border-color: var(--primary-red);
      background: #fdf2f0;
      box-shadow: 0 2px 6px rgba(155, 44, 44, 0.12), inset 0 0 0 1px var(--primary-red);
      transform: none;
    }

    .payment-mode-btn .pm-icon {
      font-size: 18px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .payment-mode-btn .pm-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
    }

    .payment-mode-btn.active .pm-text {
      color: var(--primary-red-dark);
    }

    .payment-mode-btn .pm-symbol {
      margin-left: auto;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .payment-mode-btn.active .pm-symbol {
      color: var(--primary-red);
      background: rgba(155, 44, 44, 0.1);
      border-color: var(--primary-red-border);
      font-weight: 700;
    }

    /* Prominent Light Total Display Banner */
    .billing-total-banner {
      background: linear-gradient(135deg, #fdfaf4 0%, #f7f0e1 100%);
      border: 1.5px solid #decda5;
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(184, 138, 43, 0.08);
    }

    .total-banner-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .total-banner-calc {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    .total-banner-amount {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary-red);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    /* Billing Form Action Buttons */
    .billing-form-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .billing-submit-btn {
      flex: 1;
      height: 46px;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary-red);
      color: #ffffff;
      cursor: pointer;
      border: 1px solid var(--primary-red-dark);
      border-radius: var(--radius-sm);
      box-shadow: 0 2px 6px rgba(155, 44, 44, 0.22);
      transition: all 0.15s ease;
    }

    .billing-submit-btn:hover:not(:disabled) {
      background: var(--primary-red-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(155, 44, 44, 0.3);
    }

    .billing-submit-btn:active:not(:disabled) {
      background: var(--primary-red-dark);
      transform: translateY(0);
    }

    .billing-submit-btn:disabled,
    .billing-submit-btn.saving {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
    }

    .billing-reset-btn {
      height: 46px;
      padding: 0 18px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-xs);
    }

    .billing-reset-btn:hover {
      background: var(--surface-alt);
      color: var(--text);
      border-color: #d1c8bd;
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* Field Validation Error State */
    .input-error {
      border-color: #dc2626 !important;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important;
    }

    /* Thermal Receipt Paper Card (80mm Realistic View) */
    .receipt-paper-box {
      background: #ffffff;
      border: 1px dashed #c4bcb0;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.04);
      padding: 16px 14px 14px;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      font-family: 'Consolas', 'Courier New', 'Noto Sans Malayalam', 'Segoe UI', monospace;
      font-size: 12px;
      line-height: 1.42;
      color: #0f1115;
      box-sizing: border-box;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .th-receipt {
      width: 100%;
      font-family: 'Consolas', 'Courier New', 'Noto Sans Malayalam', 'Segoe UI', monospace;
      color: #0f1115;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-variant-numeric: tabular-nums;
    }

    .th-center {
      text-align: center;
    }

    .th-bold {
      font-weight: 700;
      color: #000000;
    }

    .th-logo-wrap {
      text-align: center;
      margin-bottom: 4px;
    }

    .th-deity-logo {
      width: 20mm;
      max-width: 20mm;
      height: auto;
      aspect-ratio: 300 / 450;
      display: block;
      margin: 0 auto;
      object-fit: contain;
      image-rendering: auto;
    }

    .th-title {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.32;
      margin-bottom: 2px;
      letter-spacing: 0.15px;
      color: #000000;
    }

    .th-sub {
      font-size: 10.5px;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 4px;
      color: #374151;
    }

    .th-line {
      border-bottom: 1px dashed #4b5563;
      margin: 5px 0;
      width: 100%;
      display: block;
    }

    .th-flex {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      font-variant-numeric: tabular-nums;
      line-height: 1.38;
    }

    .th-row {
      margin: 2px 0;
      font-size: 11.5px;
      line-height: 1.38;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      word-break: break-word;
    }

    .th-row>span:first-child {
      color: #374151;
      flex-shrink: 0;
    }

    .th-row>b,
    .th-row>span:last-child {
      color: #000000;
      text-align: right;
      word-break: break-word;
    }

    .th-total {
      font-size: 13.5px;
      font-weight: 800;
      margin-top: 3px;
      letter-spacing: 0.2px;
      color: #000000;
      font-variant-numeric: tabular-nums;
    }

    .th-blessing {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 6px;
      text-align: center;
      color: #1f2937;
    }

    .th-upi-section {
      text-align: center;
      margin-top: 6px;
      padding-top: 2px;
    }

    .th-scan-pay {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      margin-bottom: 4px;
      color: #000000;
    }

    .th-upi-qr {
      width: 28mm;
      height: 28mm;
      max-width: 28mm;
      max-height: 28mm;
      aspect-ratio: 1 / 1;
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .th-roster-name,
    .th-roster-star {
      font-size: 13px;
    }

    /* ===================== BILL SUCCESS CARD ===================== */
    @keyframes checkmarkPop {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .bill-success-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 4px 0;
    }

    .bill-success-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bill-success-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--green);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 17px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(47, 125, 74, 0.25);
      animation: checkmarkPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @media (prefers-reduced-motion: reduce) {
      .bill-success-icon {
        animation: none !important;
      }
    }

    .bill-success-meta {
      display: flex;
      flex-direction: column;
    }

    .bill-success-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--green);
    }

    .bill-success-datetime {
      font-size: 12px;
      color: var(--text-muted);
    }

    .bill-success-banner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 10px 14px;
      background: #f0f8f3;
      border-radius: var(--radius);
      border: 1px solid var(--green-border);
    }

    .bill-success-num {
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.3px;
    }

    .bill-success-amt {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .bill-success-details {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .bill-success-acc {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .bill-success-acc-num {
      font-weight: 700;
      color: var(--text);
    }

    .bill-success-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    /* History Toolbar Date Shortcuts & Search Box */
    .billing-date-shortcuts {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .date-preset-btn {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      box-shadow: none;
    }

    .date-preset-btn:hover {
      border-color: var(--primary-red-border);
      background: var(--primary-red-soft);
      color: var(--primary-red-dark);
      transform: none;
      box-shadow: none;
    }

    .date-preset-btn.active {
      background: #fdf2f0;
      border-color: var(--primary-red);
      color: var(--primary-red-dark);
      font-weight: 700;
      box-shadow: none;
      transform: none;
    }

    .billing-search-box {
      position: relative;
      width: 100%;
    }

    .billing-search-box input {
      padding-left: 32px !important;
      padding-right: 28px !important;
      width: 100%;
      box-sizing: border-box;
    }

    .search-box-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 13px;
      opacity: 0.6;
    }

    .search-box-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      padding: 0;
      line-height: 1;
      box-shadow: none;
    }

    .search-box-clear:hover {
      background: rgba(0, 0, 0, 0.18);
      color: var(--text);
      transform: translateY(-50%);
      box-shadow: none;
    }

    /* History Table Badges */
    .badge-cash {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fbf5e8;
      color: #8c6712;
      border: 1px solid #ebd9b0;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-upi {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f3f0fb;
      color: #5b21b6;
      border: 1px solid #ddd6fe;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
    }

    .cat-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* ===================== EMPTY & LOADING STATES ===================== */
    .empty-state {
      text-align: center;
      padding: 42px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 34px;
      margin-bottom: 8px;
      opacity: 0.75;
    }

    .empty-state-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .empty-state-desc {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 320px;
      margin: 0 auto;
      line-height: 1.4;
    }

    .empty-state-sm {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--surface-subtle);
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border);
    }

    /* ===================== STEP 22: BRANDED AUTH & WEBGL EXPERIENCE ===================== */

    #auth-experience {
      position: fixed;
      inset: 0;
      z-index: 9500;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0d0b0e;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #auth-experience.auth-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #auth-webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    /* Fallback static gradient when WebGL is unavailable */
    #auth-experience.auth-fallback-bg {
      background: radial-gradient(circle at 50% 40%, #1e1724 0%, #0c0910 100%) !important;
    }

    /* Foreground container */
    .auth-foreground {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Auth Stage Transitioning (Splash <-> Login) */
    .auth-stage {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translate3d(0, 14px, 0) scale3d(0.98, 0.98, 1);
      pointer-events: none;
    }

    .auth-stage.active {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
      pointer-events: auto;
    }

    .auth-stage.stage-exit {
      opacity: 0;
      transform: translate3d(0, -16px, 0) scale3d(0.98, 0.98, 1);
      pointer-events: none;
    }

    /* --- STAGE 1: BRANDED SPLASH SCREEN --- */
    .splash-composition {
      text-align: center;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .splash-emblem {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.35);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(212, 160, 23, 0.25) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd700;
      margin-bottom: 6px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .splash-emblem svg {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 0.4));
    }

    .splash-temple-name {
      font-family: 'Noto Sans Malayalam', 'Manrope', -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
      line-height: 1.35;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7), 0 0 2px rgba(0, 0, 0, 0.85);
      margin: 0;
      text-align: center;
      transform: none !important;
    }

    .splash-temple-name .splash-name-line {
      display: block;
      text-align: center;
      white-space: nowrap;
    }

    .splash-temple-name .gradual-char {
      display: inline-block;
      opacity: 0;
      transform: translate3d(-20px, 0, 0);
      will-change: transform, opacity;
      transition-property: opacity, transform;
      transition-duration: 0.5s;
      transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    .splash-temple-name .gradual-char.gradual-space {
      display: inline-block;
      transform: none;
    }

    .splash-temple-name.motion-in-view .gradual-char,
    .splash-temple-name .gradual-char.char-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .splash-app-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #f7e6b5;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75);
      margin-top: 2px;
    }

    .splash-subtitle {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
      margin-top: -2px;
    }

    .splash-pulse-indicator {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.65;
    }

    .splash-pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f7e6b5;
      animation: splashPulse 1.6s infinite ease-in-out;
    }

    .splash-pulse-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .splash-pulse-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* --- STAGE 2: LOGIN CARD OVER WEBGL BACKGROUND (LIQUID GLASS) --- */
    .auth-stage .login-card {

      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(24px) saturate(150%);

      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 22px;
      padding: 38px 36px 32px;

      box-sizing: border-box;
      isolation: isolate;

    .auth-stage .login-card::before {

      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.02) 100%);

      z-index: 0;

    .dynamic-btn {

      gap: 6px !important;

      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      pointer-events: none;
      height: 100%;
      min-width: 0 !important;
      max-width: 100% !important;
    }

    .dynamic-btn-icon-slot {
      position: relative;
      display: inline-grid;
      width: 15px;
      height: 15px;
      min-width: 15px;
      min-height: 15px;

    .dynamic-btn-label-slot {
      position: relative;

    .dynamic-btn-icon-item,

      grid-area: 1 / 1;

      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .dynamic-btn-icon-item svg,
    .dynamic-btn-icon-item img {
      width: 15px;
      height: 15px;
      display: block;
    }

    /* Measurement Element (Hidden from layout and accessibility trees) */
    .dynamic-btn-measure {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      z-index: -9999 !important;

    /* Fallback CSS Keyframes */
    @keyframes dynamicBtnEnterNormal {
      from {

  <script>
    /* ===========================================================
       TEMPLE ACCOUNTING & FUND MANAGEMENT — app.js
       Offline-first, IndexedDB-backed. No server, no internet needed.
       =========================================================== */

    /* ---------- ENVIRONMENT & ISOLATION HELPERS ---------- */
    function isLocalEnvironment() {
      if (typeof window === 'undefined' || !window.location) return false;
      const host = window.location.hostname || '';
      const proto = window.location.protocol || '';
      return host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host === '' || proto === 'file:';
    }

    function isEmulatorModeActive() {
      if (typeof window === 'undefined' || !window.location) return false;
      const search = window.location.search || '';
      if (!search.includes('emulator=true')) return false;
      if (!isLocalEnvironment()) {
        console.warn('[Security] Emulator mode via ?emulator=true is strictly disabled in production / non-localhost environments.');
        return false;
      }
      return true;
    }

    const DB_NAME = isEmulatorModeActive() ? 'temple_accounts_test_db' : 'temple_accounts_db';
    const DB_VERSION = 3;
    const STORES = ['settings', 'funds', 'incomeCategories', 'expenseCategories', 'bankAccounts',
      'receipts', 'payments', 'transfers', 'chittyMembers', 'chittyCollections', 'chittyPayouts', 'loans', 'billing'];

    let db = null;
    let CURRENT_VIEW = 'dashboard';

    /* ---------- DB LAYER ---------- */
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'id' });
          ['funds', 'incomeCategories', 'expenseCategories', 'bankAccounts', 'receipts', 'payments',
            'transfers', 'chittyMembers', 'chittyCollections', 'chittyPayouts', 'loans', 'billing'].forEach(name => {
              if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, { keyPath: 'id', autoIncrement: true });
            });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e.target.error);
      });
    }
    function storeTx(name, mode = 'readonly') { return db.transaction(name, mode).objectStore(name); }
    function getAll(name) { return new Promise((res, rej) => { try { const r = storeTx(name).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (err) { rej(err); } }); }
    function getOne(name, id) { return new Promise((res, rej) => { try { const r = storeTx(name).get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (err) { rej(err); } }); }
    function addRec(name, obj) { return new Promise((res, rej) => { try { const r = storeTx(name, 'readwrite').add(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (err) { rej(err); } }); }
    function putRec(name, obj) { return new Promise((res, rej) => { try { const r = storeTx(name, 'readwrite').put(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (err) { rej(err); } }); }
    function deleteRec(name, id) { return new Promise((res, rej) => { try { const r = storeTx(name, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); } catch (err) { rej(err); } }); }
    function clearStore(name) { return new Promise((res, rej) => { try { const r = storeTx(name, 'readwrite').clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); } catch (err) { rej(err); } }); }

    /* ---------- DEFAULTS / SEED ---------- */
    const DEFAULT_EXPENSE_CATEGORIES = [
      'Flower', 'Oil', 'Camphor', 'Incense', 'Pooja Materials', 'Milk', 'Fruits', 'Vegetables', 'Payasam', 'Food', 'Water',
      'Electricity', 'Gas', 'Cleaning Materials', 'Cleaning Charges',
      'Building Repair', 'Roof Repair', 'Electrical Repair', 'Plumbing Repair', 'Painting', 'Carpentry', 'Mason Work',
      'General Maintenance', 'Equipment Repair', 'Garden Maintenance',
      'Salary', 'Priest Payment', 'Cleaning Staff', 'Security', 'Festival Labour', 'Other Service Charges',
      'Chenda', 'Melam', 'Decoration', 'Lighting', 'Sound System', 'Printing', 'Advertisement', 'Annadanam',
      'Transportation', 'Temporary Labour', 'Festival Materials',
      'Stationery', 'Receipt Books', 'Registers', 'Computer Expense', 'Internet', 'Telephone', 'Bank Charges', 'Postage', 'Travel', 'Office Expense',
      'Archana Materials', 'Garland', 'Naivedyam', 'Special Pooja Expense',
      'Cement', 'Sand', 'Stone', 'Bricks', 'Tiles', 'Wood', 'Roofing', 'Doors', 'Windows', 'Labour', 'Contractor', 'Equipment Hire',
      'Emergency Expense', 'Miscellaneous', 'Other'
    ];
    const DEFAULT_INCOME_CATEGORIES = ['Pooja Income', 'Archana Income', 'Vazhipadu Income', 'Donation Income', 'Festival Collection', 'General Contribution', 'Other Income'];
    const DEFAULT_FUNDS = ['General Temple Fund', 'Punarudharanam Fund', 'Chitty Fund', 'Festival Fund', 'Donation / Restricted Fund', 'Other Fund'];

    async function seedIfNeeded() {
      const existing = await getOne('settings', 1);
      if (existing) { window.APP_SETTINGS = existing; return; }
      const settings = {
        id: 1,
        templeName: 'മറുതാ ചാമുണ്ഡി ദേവി ക്ഷേത്രം',
        address: 'ആശാരിവിളാകം കേരളദിത്യപുരം',
        phone: '', email: '',
        receiptPrefix: 'R-', voucherPrefix: 'V-',
        financialYear: financialYearLabel(new Date()),
        currencySymbol: '₹',
        receiptCounter: 1000,
        voucherCounter: 500,
        billingReceiptCounter: 0,
        globalSequenceCounter: 0,
        startDate: new Date().toISOString().slice(0, 10),
        openingCash: 0, openingBank: 0,
        openingGeneralFund: 0, openingPunarudharanamFund: 0,
        openingChittyBalance: 0, openingLoans: 0
      };
      await putRec('settings', settings);
      window.APP_SETTINGS = settings;
      for (const name of DEFAULT_FUNDS) await addRec('funds', { name });
      for (const name of DEFAULT_INCOME_CATEGORIES) await addRec('incomeCategories', { name });
      for (const name of DEFAULT_EXPENSE_CATEGORIES) await addRec('expenseCategories', { name });
      await addRec('bankAccounts', { name: 'Canara Bank', isDefault: true });
    }

    /* ---------- SMALL HELPERS ---------- */
    function fmtMoney(n) { const s = window.APP_SETTINGS; const sym = (s && s.currencySymbol) || '₹'; const v = parseFloat(n) || 0; return sym + v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function fmtDate(iso) { if (!iso) return '-'; const [y, m, d] = iso.split('-'); return `${d}-${m}-${y}`; }
    function todayISO() { return new Date().toISOString().slice(0, 10); }
    function financialYearLabel(d) { const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return `${y}-${String((y + 1)).slice(2)}`; }
    function sumField(arr, field) { return arr.reduce((s, x) => s + (parseFloat(x[field]) || 0), 0); }
    function notVoided(arr) { return arr.filter(x => !x.voided); }
    function esc(str) { return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function el(id) { return document.getElementById(id); }
    function qs(sel, root) { return (root || document).querySelector(sel); }
    function qsa(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
    function optsFromNames(arr, selected) { return arr.map(x => `<option value="${esc(x.name)}" ${x.name === selected ? 'selected' : ''}>${esc(x.name)}</option>`).join(''); }
    function optSel(value, selected) { return `<option value="${esc(value)}" ${value === selected ? 'selected' : ''}>${esc(value)}</option>`; }
    /* ===================== STEP 33.88: MASTER DATA REFERENCE INTEGRITY & CORE IMMUTABILITY ===================== */
    const CORE_MASTER_DATA = {
      funds: [
        'General Temple Fund',
        'Punarudharanam Fund',
        'Chitty Fund'
      ],
      incomeCategories: [
        'Vazhipadu Income',
        'Donation Income'
      ]
    };

    function normalizeMasterEntityName(str) {
      return String(str || '').trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function getMasterStoreLabel(store) {
      const map = {
        funds: 'fund',
        bankAccounts: 'bank account',
        incomeCategories: 'income category',
        expenseCategories: 'expense category'
      };
      return map[store] || store;
    }

    function isCoreMasterEntity(store, name) {
      if (!CORE_MASTER_DATA[store]) return false;
      const targetNorm = normalizeMasterEntityName(name);
      if (!targetNorm) return false;
      return CORE_MASTER_DATA[store].some(coreName => normalizeMasterEntityName(coreName) === targetNorm);
    }

    async function checkMasterDataReferences(store, entityName, entityDoc = null) {
      const norm = normalizeMasterEntityName(entityName);
      if (!norm) return { safe: true, count: 0, details: {} };

      try {
        let count = 0;
        const details = {
          receipts: 0,
          payments: 0,
          billing: 0,
          isDefaultBank: false
        };

        if (store === 'funds') {
          const [receipts, payments, billing] = await Promise.all([
            (typeof allReceipts === 'function' ? allReceipts() : fsGetAllSafe('receipts')),
            (typeof allPayments === 'function' ? allPayments() : fsGetAllSafe('payments')),
            (typeof allBillingRecords === 'function' ? allBillingRecords() : fsGetAllSafe('billing'))
          ]);
          const rCount = (receipts || []).filter(r => r && r.fund && normalizeMasterEntityName(r.fund) === norm).length;
          const pCount = (payments || []).filter(p => p && p.fund && normalizeMasterEntityName(p.fund) === norm).length;
          const bCount = (billing || []).filter(b => b && b.fund && normalizeMasterEntityName(b.fund) === norm).length;
          details.receipts = rCount;
          details.payments = pCount;
          details.billing = bCount;
          count = rCount + pCount + bCount;
        } else if (store === 'bankAccounts') {
          const [receipts, payments, billing] = await Promise.all([
            (typeof allReceipts === 'function' ? allReceipts() : fsGetAllSafe('receipts')),
            (typeof allPayments === 'function' ? allPayments() : fsGetAllSafe('payments')),
            (typeof allBillingRecords === 'function' ? allBillingRecords() : fsGetAllSafe('billing'))
          ]);
          const rCount = (receipts || []).filter(r => r && r.bankAccount && normalizeMasterEntityName(r.bankAccount) === norm).length;
          const pCount = (payments || []).filter(p => p && p.bankAccount && normalizeMasterEntityName(p.bankAccount) === norm).length;
          const bCount = (billing || []).filter(b => b && b.bankAccount && normalizeMasterEntityName(b.bankAccount) === norm).length;
          details.receipts = rCount;
          details.payments = pCount;
          details.billing = bCount;
          count = rCount + pCount + bCount;

          if (entityDoc && entityDoc.isDefault) {
            details.isDefaultBank = true;
            count++;
          }
        } else if (store === 'incomeCategories') {
          const [receipts, billing] = await Promise.all([
            (typeof allReceipts === 'function' ? allReceipts() : fsGetAllSafe('receipts')),
            (typeof allBillingRecords === 'function' ? allBillingRecords() : fsGetAllSafe('billing'))
          ]);
          const rCount = (receipts || []).filter(r => r && r.category && normalizeMasterEntityName(r.category) === norm).length;
          const bCount = (billing || []).filter(b => b && (
            (b.incomeCategory && normalizeMasterEntityName(b.incomeCategory) === norm) ||
            (b.category && normalizeMasterEntityName(b.category) === norm) ||
            (b.item && normalizeMasterEntityName(b.item) === norm)
          )).length;
          details.receipts = rCount;
          details.billing = bCount;
          count = rCount + bCount;
        } else if (store === 'expenseCategories') {
          const payments = (typeof allPayments === 'function' ? await allPayments() : await fsGetAllSafe('payments'));
          const pCount = (payments || []).filter(p => p && p.category && normalizeMasterEntityName(p.category) === norm).length;
          details.payments = pCount;
          count = pCount;
        }

        return {
          safe: count === 0,
          count: count,
          details: details
        };
      } catch (err) {
        console.error('[checkMasterDataReferences] Failed to verify references:', err);
        return {
          safe: false,
          count: -1,
          error: err.message || String(err),
          details: {}
        };
      }
    }

    /* Generic hard-delete used by entry types. Deletes from Firestore first, then IndexedDB cache.
       Ordinary financial records (receipts, billing) are strictly protected from permanent deletion. */
    async function deleteRecord(store, id, viewName, ...args) {
      if (store === 'transfers') {
        return await deleteTransfer(id);
      }
      if (store === 'chittyCollections') {
        return await deleteChittyCollection(id);
      }
      if (store === 'chittyPayouts') {
        return await deleteChittyPayout(id);
      }
      if (store === 'chittyMembers') {
        return await deleteChittyMember(id);
      }
      if (store === 'receipts' || store === 'billing') {
        alert('Permanent deletion of financial records is prohibited to preserve audit history.\nPlease use the Void action instead.');
        return;
      }

      const isMasterStore = ['funds', 'bankAccounts', 'incomeCategories', 'expenseCategories'].includes(store);
      if (isMasterStore) {
        let rec = await fsGetOneSafe(store, id);
        if (!rec && !isNaN(Number(id))) {
          rec = await fsGetOneSafe(store, Number(id));
        }
        if (!rec) {
          alert('Unable to retrieve record details. Deletion blocked to protect reference integrity.');
          return;
        }
        if (isCoreMasterEntity(store, rec.name)) {
          const storeLabel = getMasterStoreLabel(store);
          alert(`Deletion blocked: "${rec.name}" is a protected system core ${storeLabel} required for core accounting and billing operations.`);
          return;
        }
        const refCheck = await checkMasterDataReferences(store, rec.name, rec);
        if (!refCheck.safe) {
          if (refCheck.error) {
            alert(`Unable to verify transaction references for "${rec.name}". Deletion blocked to protect accounting data integrity.\n(${refCheck.error})`);
            return;
          }
          const storeLabel = getMasterStoreLabel(store);
          alert(`Deletion blocked: Cannot delete ${storeLabel} "${rec.name}" because it is referenced by ${refCheck.count} transaction(s) in accounting records. Destructive deletion is prohibited to preserve audit history and financial report integrity.`);
          return;
        }
        if (!confirm(`Delete ${getMasterStoreLabel(store)} "${rec.name}" permanently? This cannot be undone.`)) return;
      } else {
        if (!confirm('Delete this entry permanently? This cannot be undone.')) return;
      }

      const user = getCurrentFirebaseUser();
      if (!user) { alert('Authentication required.'); return; }
      try {
        await fsDeleteRecordSafe(store, id);
        const storeToScope = {
          transfers: 'transfers',
          loans: 'loans',
          chittyMembers: 'chitty_member',
          chittyCollections: 'chitty_collection',
          chittyPayouts: 'chitty_payout',
          funds: 'settings_funds',
          bankAccounts: 'settings_bankAccounts',
          incomeCategories: 'settings_incomeCategories',
          expenseCategories: 'settings_expenseCategories'
        };
        const sc = storeToScope[store];
        if (sc && window.GlobalEditState) window.GlobalEditState.clearEditing(sc);
      } catch (err) {
        alert('Unable to delete from the cloud: ' + (err.message || err));
        return;
      }
      await navigate(viewName || CURRENT_VIEW, ...args);
    }

    function formatGlobalNumber(num, prefix = '') {
      const pad = String(num).padStart(3, '0');
      return prefix ? `${prefix}${pad}` : pad;
    }

    function parseGlobalNumber(str) {
      if (typeof str === 'number') return (Number.isInteger(str) && str > 0) ? str : null;
      if (!str || typeof str !== 'string') return null;
      const match = str.trim().match(/^(?:BILL-|R-)?0*([1-9]\d*)$/i);
      return match ? parseInt(match[1], 10) : null;
    }

    async function getNextGlobalSequenceNo() {
      try {
        const c = await fsGetCounters();
        const cur = (c && typeof c.globalSequenceCounter === 'number')
          ? c.globalSequenceCounter
          : (window.APP_SETTINGS && typeof window.APP_SETTINGS.globalSequenceCounter === 'number' ? window.APP_SETTINGS.globalSequenceCounter : 0);
        return cur + 1;
      } catch (err) {
        const s = window.APP_SETTINGS || {};
        const cur = typeof s.globalSequenceCounter === 'number' ? s.globalSequenceCounter : 0;
        return cur + 1;
      }
    }

    async function nextReceiptNo() {
      try {
        const nextVal = await getNextGlobalSequenceNo();
        const c = await fsGetCounters();
        const prefix = (c && c.receiptPrefix) || (window.APP_SETTINGS && window.APP_SETTINGS.receiptPrefix) || 'R-';
        return prefix + String(nextVal).padStart(3, '0');
      } catch (e) {
        const s = window.APP_SETTINGS || {};
        const cur = typeof s.globalSequenceCounter === 'number' ? s.globalSequenceCounter : 0;
        return (s.receiptPrefix || 'R-') + String(cur + 1).padStart(3, '0');
      }
    }
    async function bumpReceiptCounter() {

      if (window.APP_SETTINGS) {
        window.APP_SETTINGS.globalSequenceCounter = (parseInt(window.APP_SETTINGS.globalSequenceCounter, 10) || 0) + 1;
      }
    }

    /* ---------- BALANCE ENGINE ---------- */
    async function getCashBalance(uptoDate) {
      const s = window.APP_SETTINGS || {};
      const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
        activeReceipts(), activePayments(), activeTransfers(), allLoans(), activeChittyCollections(), activeChittyPayouts()
      ]);
      const inRange = (arr) => uptoDate ? arr.filter(x => x.date <= uptoDate) : arr;
      let bal = parseFloat(s.openingCash) || 0;
      bal += sumField(inRange(receipts).filter(r => r.paymentMode === 'Cash'), 'amount');
      bal -= sumField(inRange(payments).filter(p => p.paymentMode === 'Cash'), 'amount');
      bal += sumField(inRange(loans).filter(l => l.paymentMode === 'Cash'), 'loanReceived');
      bal -= sumField(inRange(loans).filter(l => l.paymentMode === 'Cash'), 'repayment');
      bal += sumField(inRange(collections).filter(c => c.paymentMode === 'Cash'), 'amountReceived');
      bal -= sumField(inRange(payouts).filter(p => p.paymentMode === 'Cash'), 'amount');
      inRange(transfers).forEach(t => {
        if (t.fromAcc === 'Cash') bal -= parseFloat(t.amount) || 0;
        if (t.toAcc === 'Cash') bal += parseFloat(t.amount) || 0;
      });
      return bal;
    }
    async function getBankBalance(uptoDate) {
      const s = window.APP_SETTINGS || {};
      const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
        activeReceipts(), activePayments(), activeTransfers(), allLoans(), activeChittyCollections(), activeChittyPayouts()
      ]);
      const inRange = (arr) => uptoDate ? arr.filter(x => x.date <= uptoDate) : arr;
      const isBankMode = (mode) => mode === 'Bank' || mode === 'UPI';
      let bal = parseFloat(s.openingBank) || 0;
      bal += sumField(inRange(receipts).filter(r => isBankMode(r.paymentMode)), 'amount');
      bal -= sumField(inRange(payments).filter(p => isBankMode(p.paymentMode)), 'amount');
      bal += sumField(inRange(loans).filter(l => isBankMode(l.paymentMode)), 'loanReceived');
      bal -= sumField(inRange(loans).filter(l => isBankMode(l.paymentMode)), 'repayment');
      bal += sumField(inRange(collections).filter(c => isBankMode(c.paymentMode)), 'amountReceived');
      bal -= sumField(inRange(payouts).filter(p => isBankMode(p.paymentMode)), 'amount');
      inRange(transfers).forEach(t => {
        if (t.fromAcc === 'Bank') bal -= parseFloat(t.amount) || 0;
        if (t.toAcc === 'Bank') bal += parseFloat(t.amount) || 0;
      });
      return bal;
    }
    async function getFundBalance(fundName, uptoDate) {
      const s = window.APP_SETTINGS;
      const [receipts, payments, collections, payouts] = await Promise.all([
        activeReceipts(), activePayments(), activeChittyCollections(), activeChittyPayouts()
      ]);
      const inRange = (arr) => uptoDate ? arr.filter(x => x.date <= uptoDate) : arr;
      let opening = 0;
      if (fundName === 'General Temple Fund') opening = parseFloat(s.openingGeneralFund) || 0;
      if (fundName === 'Punarudharanam Fund') opening = parseFloat(s.openingPunarudharanamFund) || 0;
      if (fundName === 'Chitty Fund') opening = parseFloat(s.openingChittyBalance) || 0;
      let bal = opening;
      bal += sumField(inRange(receipts).filter(r => r.fund === fundName), 'amount');
      bal -= sumField(inRange(payments).filter(p => p.fund === fundName), 'amount');
      if (fundName === 'Chitty Fund') {
        bal += sumField(inRange(collections), 'amountReceived');
        bal -= sumField(inRange(payouts), 'amount');
      }
      return bal;
    }
    async function getAllFundBalances(uptoDate) {
      const funds = await allFunds();
      const out = [];
      for (const f of funds) out.push({ name: f.name, balance: await getFundBalance(f.name, uptoDate) });
      return out;

    async function monthIncomeExpense(monthStart, monthEnd) {

      const payments = (await activePayments()).filter(p => p.date >= monthStart && p.date <= monthEnd);
      return { income: sumField(receipts, 'amount'), expense: sumField(payments, 'amount') };
    }

    /* ==========================================================================
       REFERENCE-MATCHED MOTION & TEXT ANIMATION ENGINE (STEP 20.2)
       Reproducing React / Motion & Cult UI TextAnimate specifications in vanilla JS
       ========================================================================== */

    let motionObserver = null;

    function markMotionSettled(el) {
      if (!el || el.classList.contains('motion-settled')) return;
      el.classList.add('motion-settled');
      el.querySelectorAll('.motion-text-char').forEach(ch => ch.classList.add('char-settled'));
    }

    function activateMotionElement(el) {
      if (!el) return;
      el.classList.remove('motion-settled');
      el.classList.add('motion-in-view');
      el.querySelectorAll('.motion-text-char').forEach(ch => {
        ch.classList.remove('char-settled');
        ch.classList.add('char-in-view');
      });

      // STEP 26.2: Release GPU compositing layer and resting transforms upon entrance completion
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        markMotionSettled(el);
        return;
      }

      let durationMs = 800;
      try {
        const cs = window.getComputedStyle(el);
        const durs = (cs.transitionDuration || '').split(',').map(s => parseFloat(s) || 0);
        const dels = (cs.transitionDelay || '').split(',').map(s => parseFloat(s) || 0);
        const maxDur = Math.max(...durs, 0.65);
        const maxDel = Math.max(...dels, 0);
        durationMs = Math.round((maxDur + maxDel) * 1000) + 60;
      } catch (_) { }

      let settled = false;
      let safetyTimer = null;

      const onTransEnd = (e) => {
        if (e.target === el) {
          if (e.propertyName === 'transform' || el.getAttribute('data-motion') === 'fadeIn') {
            cleanup();
          }
        }
      };

      const cleanup = () => {
        if (settled) return;
        settled = true;
        if (safetyTimer) {
          clearTimeout(safetyTimer);
          safetyTimer = null;
        }
        el.removeEventListener('transitionend', onTransEnd);
        if (el.isConnected) {
          markMotionSettled(el);
        }
      };

      el.addEventListener('transitionend', onTransEnd);
      safetyTimer = setTimeout(cleanup, Math.max(durationMs, 900));
    }

    function getMotionObserver() {
      if (motionObserver) return motionObserver;
      if (!('IntersectionObserver' in window)) return null;

      motionObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const el = entry.target;
            activateMotionElement(el);
            observer.unobserve(el); // Equivalent to useInView(ref, { once: true })
          }

        root: null,
        threshold: 0.06,
        rootMargin: '0px 0px -20px 0px'
      });

      return motionObserver;
    }

    function initMotionObserver(container) {
      // If reduced motion is preferred, immediately show everything and settle
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.querySelectorAll('[data-motion]').forEach(el => {
          el.classList.add('motion-in-view');
          markMotionSettled(el);
        });
        return;
      }

      // Ensure body is flagged motion-ready
      document.body.classList.add('motion-ready');

      const root = container || document;
      const obs = getMotionObserver();

      // If IntersectionObserver is not supported, immediately activate
      if (!obs) {
        root.querySelectorAll('[data-motion]').forEach(el => activateMotionElement(el));
        return;
      }

      const targets = root.querySelectorAll('[data-motion]:not(.motion-in-view)');
      const viewHeight = window.innerHeight || document.documentElement.clientHeight;

      targets.forEach(target => {
        // If element is already in initial viewport view, activate directly with stagger
        const rect = target.getBoundingClientRect();
        if (rect.top <= viewHeight && rect.bottom >= 0) {
          requestAnimationFrame(() => {
            activateMotionElement(target);
          });
        } else {
          obs.observe(target);
        }
      });
    }

    function initTextAnimate(container) {
      const root = container || document;
      const elements = root.querySelectorAll('[data-motion-text]:not(.text-anim-ready)');

      elements.forEach(el => {
        el.classList.add('text-anim-ready');
        const originalText = el.textContent.trim();
        if (!originalText) return;

        // Split words so layout and spacing are 100% preserved
        const words = originalText.split(/\s+/);
        el.innerHTML = words.map((word, wIdx) => {
          const delay = wIdx * 35; // 35ms stagger between words
          return `<span class="motion-text-char" style="transition-delay: ${delay}ms;">${esc(word)}</span>`;
        }).join(' ');

        // If element or parent is already motion-in-view or reduced motion, trigger chars immediately
        const parentMotion = el.closest('[data-motion]');
        const isReduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (isReduced) {
          el.querySelectorAll('.motion-text-char').forEach(ch => {
            ch.classList.add('char-in-view');
            ch.classList.add('char-settled');
          });
        } else if (el.classList.contains('motion-in-view') || (parentMotion && parentMotion.classList.contains('motion-in-view'))) {
          el.querySelectorAll('.motion-text-char').forEach(ch => ch.classList.add('char-in-view'));
          if (el.classList.contains('motion-settled') || (parentMotion && parentMotion.classList.contains('motion-settled'))) {
            el.querySelectorAll('.motion-text-char').forEach(ch => ch.classList.add('char-settled'));
          }
        }
      });
    }

    /* Helper to immediately trigger popIn or entrance on dynamic elements (like billing success) */
    function triggerMotionPop(targetEl) {

      targetEl.classList.remove('motion-settled');

      targetEl.setAttribute('data-motion', 'popIn');

    /* ---------- ROUTER ---------- */
    const VIEW_TITLES = {
      dashboard: 'Dashboard', receipts: 'Receipts', payments: 'Payments', cashbook: 'Cash Book',
      bankbook: 'Bank Book', ledger: 'Ledger', billing: 'Billing', punarudharanam: 'Punarudharanam Fund',
