    /* ===================== CASH BOOK / BANK BOOK ===================== */
    function resolvePaymentType(item, fallback) {
      if (!item) return fallback || '—';
      const val = item.paymentType || item.paymentMode || item.mode || fallback;
      if (!val || !String(val).trim()) return '—';
      const str = String(val).trim();
      if (str.toLowerCase() === 'bank') return 'Bank Transfer';
      return str;
    }
    async function buildCashBookRows() {
      const s = window.APP_SETTINGS || {};
      const txFetcher = (typeof activeTransfers === 'function') ? activeTransfers() : allTransfers();
      const colFetcher = (typeof activeChittyCollections === 'function') ? activeChittyCollections() : allChittyCollections();
      const payFetcher = (typeof activeChittyPayouts === 'function') ? activeChittyPayouts() : allChittyPayouts();
      const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
        activeReceipts(), activePayments(), txFetcher, allLoans(), colFetcher, payFetcher
      ]);
      const rows = [];
      receipts.filter(r => r.paymentMode === 'Cash' && !r.voided).forEach(r => {
        const desc = r.description && String(r.description).trim();
        rows.push({
          date: r.date,
          particulars: `Receipt ${r.receiptNo} - ${r.name}`,
          description: desc || '',
          category: (r.category && String(r.category).trim()) ? r.category : '',
          paymentType: resolvePaymentType(r, 'Cash'),
          receipt: r.amount,
          payment: 0
        });
      });
      payments.filter(p => p.paymentMode === 'Cash' && !p.voided).forEach(p => rows.push({
        date: p.date,
        particulars: `Payment ${p.voucherNo} - ${p.paidTo}`,
        category: p.category || 'Uncategorized',
        paymentType: resolvePaymentType(p, 'Cash'),
        receipt: 0,
        payment: p.amount
      }));
      loans.filter(l => l.paymentMode === 'Cash' && !l.voided).forEach(l => {
        if (l.loanReceived) rows.push({
          date: l.date,
          particulars: `Loan Received - ${l.person}`,
          category: 'Loan',
          paymentType: resolvePaymentType(l, 'Cash'),
          receipt: l.loanReceived,
          payment: 0
        });
        if (l.repayment) rows.push({
          date: l.date,
          particulars: `Loan Repayment - ${l.person}`,
          category: 'Loan',
          paymentType: resolvePaymentType(l, 'Cash'),
          receipt: 0,
          payment: l.repayment
        });
      });
      collections.filter(c => c.paymentMode === 'Cash' && !c.voided).forEach(c => rows.push({
        date: c.date,
        particulars: `Chitty Collection - ${c.memberName || ''}`,
        category: 'Chitty',
        paymentType: resolvePaymentType(c, 'Cash'),
        receipt: c.amountReceived,
        payment: 0
      }));
      payouts.filter(p => p.paymentMode === 'Cash' && !p.voided).forEach(p => rows.push({
        date: p.date,
        particulars: `Chitty Payout - ${p.memberName || ''}`,
        category: 'Chitty',
        paymentType: resolvePaymentType(p, 'Cash'),
        receipt: 0,
        payment: p.amount
      }));
      transfers.filter(t => !t.voided).forEach(t => {
        const tType = resolvePaymentType(t, 'Bank Transfer');
        if (t.fromAcc === 'Cash') rows.push({
          date: t.date,
          particulars: `Transfer to Bank via ${t.mode || 'Cash'}${t.reason ? ' (' + t.reason + ')' : ''}`,
          category: 'Bank Transfer',
          paymentType: tType,
          receipt: 0,
          payment: t.amount
        });
        if (t.toAcc === 'Cash') rows.push({
          date: t.date,
          particulars: `Transfer from Bank via ${t.mode || 'Cash'}${t.reason ? ' (' + t.reason + ')' : ''}`,
          category: 'Bank Transfer',
          paymentType: tType,
          receipt: t.amount,
          payment: 0
        });
      });
      rows.sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
      let bal = parseFloat(s.openingCash) || 0;
      return rows.map(r => { bal += r.receipt - r.payment; return { ...r, balance: bal }; });
    }
    async function buildBankBookRows() {
      const s = window.APP_SETTINGS || {};
      const isBankMode = (m) => m === 'Bank' || m === 'UPI';
      const txFetcher = (typeof activeTransfers === 'function') ? activeTransfers() : allTransfers();
      const colFetcher = (typeof activeChittyCollections === 'function') ? activeChittyCollections() : allChittyCollections();
      const payFetcher = (typeof activeChittyPayouts === 'function') ? activeChittyPayouts() : allChittyPayouts();
      const [receipts, payments, transfers, loans, collections, payouts] = await Promise.all([
        activeReceipts(), activePayments(), txFetcher, allLoans(), colFetcher, payFetcher
      ]);
      const rows = [];
      receipts.filter(r => isBankMode(r.paymentMode) && !r.voided).forEach(r => rows.push({ date: r.date, particulars: `Receipt ${r.receiptNo} - ${r.name} (${r.paymentMode})`, deposit: r.amount, withdrawal: 0 }));
      payments.filter(p => isBankMode(p.paymentMode) && !p.voided).forEach(p => rows.push({ date: p.date, particulars: `Payment ${p.voucherNo} - ${p.paidTo} (${p.paymentMode})`, deposit: 0, withdrawal: p.amount }));
      loans.filter(l => isBankMode(l.paymentMode) && !l.voided).forEach(l => { if (l.loanReceived) rows.push({ date: l.date, particulars: `Loan Received - ${l.person}`, deposit: l.loanReceived, withdrawal: 0 }); if (l.repayment) rows.push({ date: l.date, particulars: `Loan Repayment - ${l.person}`, deposit: 0, withdrawal: l.repayment }); });
      collections.filter(c => isBankMode(c.paymentMode) && !c.voided).forEach(c => rows.push({ date: c.date, particulars: `Chitty Collection - ${c.memberName || ''}`, deposit: c.amountReceived, withdrawal: 0 }));
      payouts.filter(p => isBankMode(p.paymentMode) && !p.voided).forEach(p => rows.push({ date: p.date, particulars: `Chitty Payout - ${p.memberName || ''}`, deposit: 0, withdrawal: p.amount }));
      transfers.filter(t => !t.voided).forEach(t => {
        if (t.fromAcc === 'Bank') rows.push({ date: t.date, particulars: `Cash Withdrawal${t.reason ? ' (' + t.reason + ')' : ''}${t.refNo ? ' - Ref ' + t.refNo : ''}`, deposit: 0, withdrawal: t.amount });

      });
      rows.sort((a, b) => a.date.localeCompare(b.date));
      let bal = parseFloat(s.openingBank) || 0;
      return rows.map(r => { bal += r.deposit - r.withdrawal; return { ...r, balance: bal }; });
    }

    /* Step 28 / Step 33.6A — Cash Book category filter: shows/hides rows by category
       and recalculates the totals row for currently displayed rows.
       Balance column retains the original chronological running balance
       (not recalculated) so users see the true cash position context. */
    function applyCashBookCategoryFilter() {
      const cat = el('cashBookCategoryFilter').value;
      qsa('#cashBookTable tbody tr').forEach(tr => {
        if (!cat) { tr.style.display = ''; return; }
        tr.style.display = (tr.dataset.category === cat) ? '' : 'none';
      });
      updateCashBookTotals();
    }
    function updateCashBookTotals() {
      const cat = el('cashBookCategoryFilter') ? el('cashBookCategoryFilter').value : '';
      const dataRows = window._cashBookRows || [];
      let totReceipt = 0;
      let totPayment = 0;
      dataRows.forEach(r => {
        if (cat && r.category !== cat) return;
        totReceipt += (parseFloat(r.receipt) || 0);
        totPayment += (parseFloat(r.payment) || 0);
      });
      const recEl = el('cashBookTotalReceipt');
      const payEl = el('cashBookTotalPayment');
      if (recEl) recEl.innerHTML = `<b>${fmtMoney(totReceipt)}</b>`;
      if (payEl) payEl.innerHTML = `<b>${fmtMoney(totPayment)}</b>`;
    }
    /* Step 28 / Step 33.6A — Cash Book CSV export using existing downloadCSV utility,
       including Payment Type column and final totals row. */
    function exportCashBookCSV() {
      const csvRows = [['Date', 'Particulars', 'Description', 'Category', 'Payment Type', 'Receipt', 'Payment', 'Balance']];
      const cat = el('cashBookCategoryFilter') ? el('cashBookCategoryFilter').value : '';
      /* Opening balance row */
      if (!cat || cat === 'Opening Balance') {
        csvRows.push([fmtDate(window.APP_SETTINGS.startDate), 'Opening Balance', '', 'Opening Balance', '—', '-', '-', fmtMoney(window.APP_SETTINGS.openingCash)]);
      }
      /* Apply current filter if active */
      const dataRows = window._cashBookRows || [];
      let totReceipt = 0;
      let totPayment = 0;
      dataRows.forEach(r => {
        if (cat && r.category !== cat) return;
        totReceipt += (parseFloat(r.receipt) || 0);
        totPayment += (parseFloat(r.payment) || 0);
        csvRows.push([fmtDate(r.date), r.particulars, r.description || '', r.category, r.paymentType || '—', r.receipt ? fmtMoney(r.receipt) : '-', r.payment ? fmtMoney(r.payment) : '-', fmtMoney(r.balance)]);
      });
      /* Final totals row */
      csvRows.push(['TOTAL', '—', '—', '—', '—', fmtMoney(totReceipt), fmtMoney(totPayment), '—']);
      downloadCSV(csvRows, 'CashBook');
    }

    /* Step 33.7A — Recalculate Bank Book totals on dynamic view updates or DOM filtering */
    function updateBankBookTotals() {

      let totWithdrawal = 0;

    /* ===================== LEDGER ===================== */
    VIEW_RENDERERS.ledger = async function () {
      const [funds, receipts, payments] = await Promise.all([allFunds(), activeReceipts(), activePayments()]);
      const combined = [
        ...receipts.map(r => {
          const desc = r.description && String(r.description).trim();
          return { date: r.date, voucher: r.receiptNo, particulars: `${r.name} - ${r.category}`, description: desc || '', fund: r.fund, debit: 0, credit: r.amount };
        }),
        ...payments.map(p => ({ date: p.date, voucher: p.voucherNo, particulars: p.paidTo + ' - ' + p.category, description: (p.description && String(p.description).trim()) || '', fund: p.fund, debit: p.amount, credit: 0 }))
      ].sort((a, b) => a.date.localeCompare(b.date));
      window._ledgerRows = combined; /* Cache for dynamic recalculation and testing */

      const totalDebit = combined.reduce((s, x) => s + (parseFloat(x.debit) || 0), 0);
      const totalCredit = combined.reduce((s, x) => s + (parseFloat(x.credit) || 0), 0);

      return `
    <div class="toolbar" data-motion="calmInUp">
      <label class="muted">From <input type="date" id="ledgerFrom" onchange="applyLedgerFilter()"></label>
      <label class="muted">To <input type="date" id="ledgerTo" onchange="applyLedgerFilter()"></label>

      <button class="btn-sec btn-sm" onclick="applyLedgerFilter()">Filter</button>
      <button class="btn-sec btn-sm" onclick="clearLedgerFilter()">Clear</button>
      <button class="btn-sec btn-sm" id="ledgerExportPdfBtn" onclick="exportLedgerPDF()">Export PDF</button>
    </div>
    <div class="table-wrap" data-motion="fadeIn"><table id="ledgerTable">
      <thead><tr><th>Date</th><th>Voucher/Receipt No.</th><th>Particulars</th><th>Description</th><th>Fund</th><th>Debit</th><th>Credit</th></tr></thead>
      <tbody>
        ${combined.map(x => `<tr data-date="${x.date}" data-fund="${esc(x.fund)}" data-debit="${x.debit || 0}" data-credit="${x.credit || 0}"><td>${fmtDate(x.date)}</td><td>${esc(x.voucher)}</td><td>${esc(x.particulars)}</td><td>${x.description && String(x.description).trim() ? esc(String(x.description).trim()) : ''}</td><td>${esc(x.fund)}</td><td>${x.debit ? fmtMoney(x.debit) : '-'}</td><td>${x.credit ? fmtMoney(x.credit) : '-'}</td></tr>`).join('')}
      </tbody>
      <tfoot id="ledgerTFoot">
        <tr id="ledgerTotalRow" class="ledger-total-row" style="font-weight: bold; background: var(--surface, #fafafa); border-top: 2px solid var(--border, #333);">
          <td></td>
          <td></td>
          <td><b>TOTAL</b></td>
          <td></td>
          <td></td>
          <td id="ledgerTotalDebit" style="text-align: right;"><b>${fmtMoney(totalDebit)}</b></td>
          <td id="ledgerTotalCredit" style="text-align: right;"><b>${fmtMoney(totalCredit)}</b></td>
        </tr>
      </tfoot>
    </table></div>
  `;
    };
    function applyLedgerFilter() {
      const from = el('ledgerFrom') ? el('ledgerFrom').value : '';
      const to = el('ledgerTo') ? el('ledgerTo').value : '';
      const fund = el('ledgerFundFilter') ? el('ledgerFundFilter').value : '';
      qsa('#ledgerTable tbody tr').forEach(tr => {
        let show = true;
        if (from && tr.dataset.date < from) show = false;
        if (to && tr.dataset.date > to) show = false;
        if (fund && tr.dataset.fund !== fund) show = false;
        tr.style.display = show ? '' : 'none';
      });
      updateLedgerTotals();
    }
    function clearLedgerFilter() {
      if (el('ledgerFrom')) el('ledgerFrom').value = '';
      if (el('ledgerTo')) el('ledgerTo').value = '';
      if (el('ledgerFundFilter')) el('ledgerFundFilter').value = '';
      applyLedgerFilter();
    }
    /* STEP 33.32A: Recalculate Ledger totals on dynamic filter change or view updates */
    function updateLedgerTotals() {
      const trs = qsa('#ledgerTable tbody tr');
      let totDebit = 0;
      let totCredit = 0;
      trs.forEach(tr => {
        if (tr.style.display === 'none') return;
        if (tr.dataset.debit !== undefined) {
          totDebit += (parseFloat(tr.dataset.debit) || 0);
        } else {
          const tds = qsa('td', tr);
          const debitIdx = tds.length >= 7 ? 5 : 4;
          if (tds.length > debitIdx) {
            const dText = tds[debitIdx].textContent.trim();
            const dVal = (dText === '-' || dText === '—') ? 0 : parseFloat(dText.replace(/[^0-9.-]/g, '')) || 0;
            totDebit += dVal;
          }
        }
        if (tr.dataset.credit !== undefined) {
          totCredit += (parseFloat(tr.dataset.credit) || 0);
        } else {
          const tds = qsa('td', tr);
          const creditIdx = tds.length >= 7 ? 6 : 5;
          if (tds.length > creditIdx) {
            const cText = tds[creditIdx].textContent.trim();
            const cVal = (cText === '-' || cText === '—') ? 0 : parseFloat(cText.replace(/[^0-9.-]/g, '')) || 0;
            totCredit += cVal;
          }
        }
      });
      const debEl = el('ledgerTotalDebit');
      const crdEl = el('ledgerTotalCredit');
      if (debEl) debEl.innerHTML = `<b>${fmtMoney(totDebit)}</b>`;
      if (crdEl) crdEl.innerHTML = `<b>${fmtMoney(totCredit)}</b>`;
      return { debit: totDebit, credit: totCredit };
    }
    function exportLedgerCSV() {
      const rows = [['Date', 'Voucher/Receipt No.', 'Particulars', 'Description', 'Fund', 'Debit', 'Credit']];
      qsa('#ledgerTable tbody tr').forEach(tr => { if (tr.style.display !== 'none') rows.push(qsa('td', tr).map(td => td.textContent)); });
      downloadCSV(rows, 'Ledger');
    }

    /* STEP 33.34B: Ledger PDF Export Functions */
    function getFilteredLedgerRecords() {
      const from = el('ledgerFrom') ? el('ledgerFrom').value : '';
      const to = el('ledgerTo') ? el('ledgerTo').value : '';
      const fund = el('ledgerFundFilter') ? el('ledgerFundFilter').value : '';

      // 1. If window._ledgerRows exists and has items, filter from source data
      if (window._ledgerRows && Array.isArray(window._ledgerRows) && window._ledgerRows.length > 0) {
        return window._ledgerRows.filter(r => {
          if (from && r.date < from) return false;
          if (to && r.date > to) return false;
          if (fund && r.fund !== fund) return false;
          return true;
        });
      }

      // 2. Fallback to table DOM inspection if _ledgerRows is not populated
      const rows = [];
      const trs = qsa('#ledgerTable tbody tr');
      trs.forEach(tr => {
        if (tr.style.display === 'none') return;
        const tds = qsa('td', tr);
        if (tds.length >= 7) {
          const dText = tds[5].textContent.trim();
          const cText = tds[6].textContent.trim();
          const debitVal = (dText === '-' || dText === '—' || !dText) ? 0 : (parseFloat(tr.dataset.debit) || parseFloat(dText.replace(/[^0-9.-]/g, '')) || 0);
          const creditVal = (cText === '-' || cText === '—' || !cText) ? 0 : (parseFloat(tr.dataset.credit) || parseFloat(cText.replace(/[^0-9.-]/g, '')) || 0);
          rows.push({
            date: tr.dataset.date || tds[0].textContent.trim(),
            voucher: tds[1].textContent.trim(),
            particulars: tds[2].textContent.trim(),
            description: tds[3].textContent.trim(),
            fund: tr.dataset.fund || tds[4].textContent.trim(),
            debit: debitVal,
            credit: creditVal
          });
        } else if (tds.length >= 6) {
          const dText = tds[4].textContent.trim();
          const cText = tds[5].textContent.trim();
          const debitVal = (dText === '-' || dText === '—' || !dText) ? 0 : (parseFloat(tr.dataset.debit) || parseFloat(dText.replace(/[^0-9.-]/g, '')) || 0);
          const creditVal = (cText === '-' || cText === '—' || !cText) ? 0 : (parseFloat(tr.dataset.credit) || parseFloat(cText.replace(/[^0-9.-]/g, '')) || 0);
          rows.push({
            date: tr.dataset.date || tds[0].textContent.trim(),
            voucher: tds[1].textContent.trim(),
            particulars: tds[2].textContent.trim(),
            description: '',
            fund: tr.dataset.fund || tds[3].textContent.trim(),
            debit: debitVal,
            credit: creditVal
          });
        }
      });
      return rows;
    }

    function exportLedgerPDF(options = {}) {
      const records = getFilteredLedgerRecords();
      const fromVal = el('ledgerFrom') ? el('ledgerFrom').value : '';
      const toVal = el('ledgerTo') ? el('ledgerTo').value : '';
      const fundVal = el('ledgerFundFilter') ? el('ledgerFundFilter').value : '';
      const s = window.APP_SETTINGS || {};

      const totalDebit = records.reduce((sum, r) => sum + (parseFloat(r.debit) || 0), 0);
      const totalCredit = records.reduce((sum, r) => sum + (parseFloat(r.credit) || 0), 0);

      let dateRangeStr = 'All Dates';
      if (fromVal && toVal) {
        dateRangeStr = `${fmtDate(fromVal)} to ${fmtDate(toVal)}`;
      } else if (fromVal) {
        dateRangeStr = `From ${fmtDate(fromVal)}`;
      } else if (toVal) {
        dateRangeStr = `Up to ${fmtDate(toVal)}`;
      }

      const fundStr = fundVal || 'All Funds';

      const now = new Date();
      const generatedAtStr = `${fmtDate(todayISO())} ${now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}`;

      const reportData = {
        templeName: s.templeName || 'Temple Accounting',
        templeAddress: s.address || '',
        templeContact: [s.phone, s.email].filter(Boolean).join(' | '),
        dateRangeStr,
        fundStr,
        from: fromVal,
        to: toVal,
        fund: fundVal,
        generatedAtStr,
        records,
        totalDebit,
        totalCredit
      };

      window._lastLedgerPdfData = reportData;

      const printArea = el('print-area');
      if (printArea) {
        document.body.classList.remove('printing-billing-58mm');
        document.body.classList.remove('printing-billing-80mm');
        document.body.classList.add('printing-ledger-pdf');
        printArea.className = 'a4-print ledger-pdf-print';
        printArea.innerHTML = renderLedgerPDFReportHTML(reportData);
      }

      // Inject or update landscape print style
      let dynamicStyle = el('ledger-pdf-page-style');
      if (!dynamicStyle) {
        dynamicStyle = document.createElement('style');
        dynamicStyle.id = 'ledger-pdf-page-style';
        document.head.appendChild(dynamicStyle);
      }
      dynamicStyle.textContent = '@page { size: A4 landscape; margin: 10mm 12mm 12mm 12mm; } @media print { html, body { background: #fff !important; } }';

      const originalTitle = document.title;
      const fileDate = (fromVal || toVal) ? `${fromVal || 'start'}_to_${toVal || 'end'}` : todayISO();
      document.title = `Ledger_Report_${fileDate}`;

      const finishPrint = () => {
        if (window.removeEventListener) window.removeEventListener('afterprint', finishPrint);
        if (document.body && document.body.classList) document.body.classList.remove('printing-ledger-pdf');
        if (dynamicStyle && dynamicStyle.parentNode) {
          dynamicStyle.parentNode.removeChild(dynamicStyle);
        }
        if (document.title !== undefined) document.title = originalTitle;
      };
      if (window.addEventListener) window.addEventListener('afterprint', finishPrint);

      if (options && options.skipPrint === true) {
        return reportData;
      }

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          window.print();
        });
      });

      return reportData;
    }
    window.getFilteredLedgerRecords = getFilteredLedgerRecords;

    async function saveTransfer() {
      const fd = new FormData(el('transferForm'));
      const amount = parseFloat(fd.get('amount'));
      const rawEditId = fd.get('editId');
      const editId = rawEditId ? (/^\d+$/.test(rawEditId.trim()) ? parseInt(rawEditId.trim(), 10) : rawEditId.trim()) : null;
      if (fd.get('fromAcc') === fd.get('toAcc')) { alert('From and To accounts must be different.'); return; }
      if (!amount || amount <= 0) { alert('Enter a valid amount.'); return; }
      const user = getCurrentFirebaseUser();
      if (!user) { alert('Authentication required: please log in to record transactions.'); return; }

      const rec = { date: fd.get('date'), fromAcc: fd.get('fromAcc'), toAcc: fd.get('toAcc'), mode: fd.get('mode') || 'Cash', amount, reason: fd.get('reason') || '', refNo: fd.get('refNo') || '' };
      try {
        if (editId) {
          const prior = await fsGetOneSafe('transfers', editId);
          rec.createdAt = prior ? prior.createdAt : Date.now();
          rec.id = editId;
          rec.firestoreId = prior ? prior.firestoreId : ('tx_' + editId);
          await fsUpdateRecordSafe('transfers', rec.firestoreId || editId, rec);
        } else {
          rec.createdAt = Date.now();
          rec.firestoreId = 'tx_' + Date.now();
          await fsSaveRecordSafe('transfers', rec, false);
        }
      } catch (err) {
        alert('Unable to save to the cloud. Please check your connection and try again.\n(' + (err.message || err) + ')');
        return;
      }
      if (window.GlobalEditState) window.GlobalEditState.clearEditing('transfers');
      await navigate('transfers');
    }
    function showDeleteTransferModal(t, id) {
      const modalRoot = el('modal-root');
      const fromLabel = t.fromAcc === 'Cash' ? 'Cash in Hand' : (t.fromAcc === 'Bank' ? 'Bank' : (t.fromAcc || 'Cash'));
      const toLabel = t.toAcc === 'Cash' ? 'Cash in Hand' : (t.toAcc === 'Bank' ? 'Bank' : (t.toAcc || 'Bank'));
      const formattedAmt = typeof fmtMoney === 'function' ? fmtMoney(t.amount) : ('₹' + t.amount);
      const formattedDate = typeof fmtDate === 'function' ? fmtDate(t.date) : t.date;
      const confirmMsg = `Delete fund transfer?\n\nDate: ${formattedDate}\nDirection: ${fromLabel} → ${toLabel}\nAmount: ${formattedAmt}\n\nThis will void the transfer and reverse its effect on Cash and Bank accounts.`;

      if (!modalRoot) {
        if (!confirm(confirmMsg)) return;
        return deleteTransfer(id, true);
      }

      modalRoot.innerHTML = `
    <div class="modal-overlay" id="delete-transfer-modal" onclick="if(event.target===this) closeModal()">
      <div class="modal-box" style="max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);">

          </div>

        </div>

        <div style="background: var(--bg-warm, #fdfbf7); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin-bottom: 14px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">

          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <span style="font-weight: 600; color: var(--text-muted);">Direction:</span>
            <span><strong>${fromLabel}</strong> → <strong>${toLabel}</strong></span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <span style="font-weight: 600; color: var(--text-muted);">Amount:</span>
            <span style="font-weight: 700; color: #b91c1c; font-size: 15px;">${formattedAmt}</span>
          </div>
          ${t.mode ? `<div style="display: flex; justify-content: space-between; margin-bottom: 6px;"><span style="font-weight: 600; color: var(--text-muted);">Mode:</span><span>${esc(t.mode)}</span></div>` : ''}
          ${t.reason ? `<div style="display: flex; justify-content: space-between; margin-bottom: 6px;"><span style="font-weight: 600; color: var(--text-muted);">Reason:</span><span>${esc(t.reason)}</span></div>` : ''}
          ${t.refNo ? `<div style="display: flex; justify-content: space-between;"><span style="font-weight: 600; color: var(--text-muted);">Reference:</span><span>${esc(t.refNo)}</span></div>` : ''}
        </div>
        <p class="muted" style="font-size: 12px; margin: 0 0 16px 0;">This will void the transfer and reverse its effect on Cash and Bank accounts.</p>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" class="btn-outline" id="btn-cancel-delete-transfer" onclick="closeModal()">Cancel</button>
          <button type="button" class="btn btn-danger" id="btn-confirm-delete-transfer" onclick="deleteTransfer('${esc(id)}', true)">Delete Transfer</button>
        </div>
      </div>
    </div>
  `;
    }
    async function deleteTransfer(id) {
      if (window.isTransferDeleting) return;

      const user = getCurrentFirebaseUser();
      if (!user) {
        alert('Authentication required: please log in to perform this action.');
        return;
      }

      const t = await fsGetOneSafe('transfers', id);
      if (!t) {
        alert('Transfer record not found.');
        return;
      }
      if (t.voided) {
        alert('This transfer has already been deleted.');
        return;
      }

      const fromLabel = t.fromAcc === 'Cash' ? 'Cash in Hand' : (t.fromAcc === 'Bank' ? 'Bank' : (t.fromAcc || 'Cash'));
      const toLabel = t.toAcc === 'Cash' ? 'Cash in Hand' : (t.toAcc === 'Bank' ? 'Bank' : (t.toAcc || 'Bank'));
      const formattedAmt = typeof fmtMoney === 'function' ? fmtMoney(t.amount) : ('₹' + t.amount);
      const formattedDate = typeof fmtDate === 'function' ? fmtDate(t.date) : t.date;
      const confirmMsg = `Delete fund transfer?\n\nDate: ${formattedDate}\nDirection: ${fromLabel} → ${toLabel}\nAmount: ${formattedAmt}\n\nThis will void the transfer and reverse its effect on Cash and Bank accounts.`;

      const isConfirmedExplicit = arguments[1] === true;
      if (!isConfirmedExplicit) {
        const isMockedConfirm = typeof window.confirm === 'function' && !window.confirm.toString().includes('[native code]');
        if (isMockedConfirm && isLocalEnvironment()) {
          if (!confirm(confirmMsg)) return;
        } else {
          showDeleteTransferModal(t, id);
          return;
        }
      }

      window.isTransferDeleting = true;
      try {
        const targetDocId = (t && t.firestoreId) ? t.firestoreId : id;
        await fsVoidRecordSafe('transfers', targetDocId, 'Deleted by user');
        if (window.GlobalEditState) {
          window.GlobalEditState.clearEditing('transfers');
        }
        if (typeof closeModal === 'function') closeModal();
        alert('Fund transfer deleted successfully.');
      } catch (err) {
        console.error('[deleteTransfer] Error deleting transfer:', err);
        alert('Unable to delete fund transfer: ' + (err.message || err));
        return;
      } finally {
        window.isTransferDeleting = false;
      }
      await navigate('transfers');
    }

    function onChittyMemberSelect(memberId) {
      if (!memberId) {
        const hint = el('colInstHint');
        if (hint) hint.textContent = '';
        return;
      }
      const members = window._chittyMembers || [];
      const collections = window._chittyCollections || [];
      const member = members.find(m => String(m.id) === String(memberId));
      if (!member) return;

      const amtInput = el('colAmountReceived');
      if (amtInput && (!amtInput.value || parseFloat(amtInput.value) === 0)) {
        if (member.installmentAmount) amtInput.value = member.installmentAmount;
      }

      const memberCols = notVoided(collections).filter(c => String(c.memberId) === String(memberId));
      const paidNumbers = memberCols.map(c => parseInt(c.installmentNo, 10)).filter(n => !isNaN(n) && n > 0);
      const nextNo = paidNumbers.length ? (Math.max(...paidNumbers) + 1) : 1;

      const instInput = el('colInstallmentNo');
      const hint = el('colInstHint');
      if (hint) {
        hint.textContent = `Suggested installment: #${nextNo} (${memberCols.length} paid so far)`;
      }
      if (instInput && !instInput.value) {
        instInput.value = nextNo;
      }
    }

    async function saveChittyMember() {
      if (window.isChittyMemberSaving) return;
      const form = el('chittyMemberForm');
      if (!form) return;
      const fd = new FormData(form);
      const name = (fd.get('name') || '').trim();
      if (!name) { alert('Member name is required.'); return; }

      const rawInstAmt = (fd.get('installmentAmount') || '').trim();
      const instAmt = rawInstAmt !== '' ? parseFloat(rawInstAmt) : 0;
      if (isNaN(instAmt) || instAmt < 0) {
        alert('Installment amount must be 0 or a positive number.');
        return;
      }

      const user = getCurrentFirebaseUser();
      if (!user) { alert('Authentication required: please log in to record members.'); return; }

      const rawEditId = fd.get('editId');
      const editId = rawEditId ? (/^\d+$/.test(rawEditId.trim()) ? parseInt(rawEditId.trim(), 10) : rawEditId.trim()) : null;

      const memberNo = (fd.get('memberNo') || '').trim();
      if (memberNo) {
        const allM = await allChittyMembers();
        const dup = allM.find(m => String(m.id) !== String(editId) && m.memberNo && m.memberNo.trim().toLowerCase() === memberNo.toLowerCase() && !m.voided);
        if (dup) {
          alert(`Member number "${memberNo}" is already assigned to ${dup.name}. Please enter a unique member number.`);
          return;
        }
      }

      const rec = {
        memberNo: memberNo,
        name: name,
        phone: (fd.get('phone') || '').trim(),
        address: (fd.get('address') || '').trim(),
        installmentAmount: isNaN(instAmt) ? 0 : instAmt,
        frequency: fd.get('frequency') || 'Monthly',
        startDate: fd.get('startDate') || todayISO(),
        status: 'Active'
      };

      const btn = el('saveMemberBtn');
      if (btn) btn.disabled = true;
      window.isChittyMemberSaving = true;

      try {
        if (editId) {
          rec.id = editId;
          const prior = await fsGetOneSafe('chittyMembers', editId);
          const targetDocId = (prior && prior.firestoreId)
            ? prior.firestoreId
            : (String(editId).startsWith('cm_') ? String(editId) : ('cm_' + editId));
          rec.firestoreId = targetDocId;
          rec.createdAt = prior ? prior.createdAt : Date.now();
          await fsUpdateRecordSafe('chittyMembers', targetDocId, rec);
        } else {
          const newId = Date.now();
          rec.id = newId;
          rec.createdAt = newId;
          rec.firestoreId = 'cm_' + newId;
          await fsSaveRecordSafe('chittyMembers', rec, false);
        }
      } catch (err) {
        console.error('Error saving Chitty member:', err);
        alert('Unable to save to the cloud. Please check your connection and try again.\n(' + (err.message || err) + ')');
        return;
      } finally {
        window.isChittyMemberSaving = false;
        if (btn) btn.disabled = false;
      }

      if (window.GlobalEditState) window.GlobalEditState.clearEditing('chitty_member');
      await navigate('chitty');
    }

    async function deleteChittyMember(id) {
      const user = getCurrentFirebaseUser();
      if (!user) { alert('Authentication required.'); return; }
      const member = await fsGetOneSafe('chittyMembers', id);
      if (!member) { alert('Member record not found.'); return; }

      const [cols, pays] = await Promise.all([allChittyCollections(), allChittyPayouts()]);
      const hasCols = cols.some(c => String(c.memberId) === String(id));
      const hasPays = pays.some(p => String(p.memberId) === String(id));
      if (hasCols || hasPays) {
        alert(`Cannot delete member "${member.name}": This member has recorded collections or payouts.\nPlease void or remove those financial records first.`);
        return;
      }

      if (!confirm(`Delete member "${member.name}" permanently? This cannot be undone.`)) return;

      const targetDocId = (member && member.firestoreId) ? member.firestoreId : (String(id).startsWith('cm_') ? String(id) : ('cm_' + id));
      try {
        await fsDeleteRecordSafe('chittyMembers', targetDocId);
        if (window.GlobalEditState) window.GlobalEditState.clearEditing('chitty_member');
        alert('Member deleted successfully.');
      } catch (err) {
        alert('Unable to delete member: ' + (err.message || err));
        return;
      }
      await navigate('chitty');
    }

    function getAnalyticsPeriodRange(preset, customFrom, customTo) {
      const now = new Date();
      const formatISO = (d) => {
        const yr = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const da = String(d.getDate()).padStart(2, '0');
        return `${yr}-${mo}-${da}`;
      };
      const todayStr = formatISO(now);

      if (preset === 'today') {
        return { from: todayStr, to: todayStr, preset: 'today' };
      } else if (preset === 'this_week') {
        const d = new Date(now);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(d.setDate(diff));
        return { from: formatISO(monday), to: todayStr, preset: 'this_week' };
      } else if (preset === 'this_month') {
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
        return { from: formatISO(firstDay), to: todayStr, preset: 'this_month' };
      } else if (preset === 'last_month') {
        const firstDayLastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const lastDayLastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        return { from: formatISO(firstDayLastMonth), to: formatISO(lastDayLastMonth), preset: 'last_month' };
      } else if (preset === 'this_year') {
        const firstDayYear = new Date(now.getFullYear(), 0, 1);
        return { from: formatISO(firstDayYear), to: todayStr, preset: 'this_year' };
      } else if (preset === 'custom') {
        const from = (customFrom || todayStr).trim();
        const to = (customTo || todayStr).trim();
        return { from, to, preset: 'custom' };
      }
      return { from: todayStr, to: todayStr, preset: 'today' };
    }

    function formatAnalyticsPeriodDisplay(from, to) {
      if (!from || !to) return '-';
      const opt = { day: '2-digit', month: 'short', year: 'numeric' };
      const f = new Date(from + 'T00:00:00');
      const t = new Date(to + 'T00:00:00');
      const fStr = isNaN(f.getTime()) ? fmtDate(from) : f.toLocaleDateString('en-IN', opt);
      const tStr = isNaN(t.getTime()) ? fmtDate(to) : t.toLocaleDateString('en-IN', opt);
      return `${fStr} → ${tStr}`;
    }

    function renderAnalyticsEmptyState(icon, message, subMessage) {

    function renderTrendChartSVG(buckets) {
      const hasData = buckets.some(b => b.income > 0 || b.expense > 0);
      if (!hasData) {
        return renderAnalyticsEmptyState('📈', 'No transactions available for this period.', 'Accounting records for this timeframe will automatically generate trend visualization.');
      }

      const svgW = 720;
      const svgH = 260;
      const padLeft = 70;
      const padRight = 20;
      const padTop = 30;
      const padBottom = 45;
      const plotW = svgW - padLeft - padRight;
      const plotH = svgH - padTop - padBottom;

      const rawMax = Math.max(...buckets.map(b => Math.max(b.income, b.expense)), 100);
      const p = Math.pow(10, Math.floor(Math.log10(rawMax)));
      const yMax = Math.ceil((rawMax * 1.15) / p) * p;

      let gridLinesHTML = '';
      for (let i = 0; i <= 4; i++) {
        const yVal = (yMax / 4) * i;
        const yPos = padTop + plotH - (i / 4) * plotH;
        gridLinesHTML += `
      <line x1="${padLeft}" y1="${yPos}" x2="${svgW - padRight}" y2="${yPos}" stroke="#eee6dc" stroke-dasharray="${i === 0 ? 'none' : '3,3'}" stroke-width="1" />
      <text x="${padLeft - 8}" y="${yPos + 4}" font-size="10" fill="#766d66" text-anchor="end" font-family="system-ui, sans-serif">₹${Math.round(yVal).toLocaleString('en-IN')}</text>
    `;
      }

      const n = buckets.length;
      const colW = plotW / Math.max(n, 1);
      const barW = Math.max(Math.min(colW * 0.35, 18), 3);
      let barsHTML = '';
      let labelsHTML = '';
      const labelStep = n > 14 ? Math.ceil(n / 7) : 1;

      buckets.forEach((b, idx) => {
        const centerX = padLeft + (idx + 0.5) * colW;
        const incH = (b.income / yMax) * plotH;
        const expH = (b.expense / yMax) * plotH;
        const incY = padTop + plotH - incH;
        const expY = padTop + plotH - expH;

        if (b.income > 0) {
          barsHTML += `
        <rect x="${centerX - barW - 1.5}" y="${incY}" width="${barW}" height="${incH}" fill="#2f7d4a" rx="2" ry="2" opacity="0.9">
          <title>${esc(b.label)}: Income ₹${b.income.toLocaleString('en-IN')} (${b.countRcpt} rcpts)</title>
        </rect>
      `;
        }

        if (b.expense > 0) {
          barsHTML += `
        <rect x="${centerX + 1.5}" y="${expY}" width="${barW}" height="${expH}" fill="#9b2c2c" rx="2" ry="2" opacity="0.9">
          <title>${esc(b.label)}: Expense ₹${b.expense.toLocaleString('en-IN')} (${b.countPmt} pmts)</title>
        </rect>
      `;
        }

        if (idx % labelStep === 0 || idx === n - 1) {
          labelsHTML += `
        <text x="${centerX}" y="${padTop + plotH + 18}" font-size="11" fill="#574e47" text-anchor="middle" font-family="system-ui, sans-serif">${esc(b.label)}</text>
      `;
        }
      });

      return `
    <div class="analytics-chart-wrap">
      <svg class="analytics-chart-svg" viewBox="0 0 ${svgW} ${svgH}" preserveAspectRatio="xMidYMid meet">
        ${gridLinesHTML}
        ${barsHTML}
        ${labelsHTML}
      </svg>
      <div class="analytics-legend">
        <span class="analytics-legend-item"><span class="analytics-legend-dot" style="background:#2f7d4a;"></span> <b>Income</b></span>
        <span class="analytics-legend-item"><span class="analytics-legend-dot" style="background:#9b2c2c;"></span> <b>Expense</b></span>
      </div>
    </div>
  `;
    }

    function renderDonutChartSVG(slices, total) {
      if (!slices || slices.length === 0 || total <= 0) {
        return renderAnalyticsEmptyState('💳', 'No collection data available for this period.', 'Payment mode breakdown will display when receipts are recorded.');
      }

      const svgSize = 220;
      const cx = 110;
      const cy = 110;
      const r = 70;
      const strokeW = 28;
      const circ = 2 * Math.PI * r;
      // Quarter-circumference offset so the first segment starts at 12 o'clock
      // (SVG circles start at 3 o'clock; subtracting circ/4 shifts the origin to 12 o'clock)
      const startOffset = circ / 4;

      let accumulated = 0;
      let pathsHTML = '';
      const colors = ['#2f7d4a', '#b88a2b', '#1e5ba8', '#6d28d9', '#9b2c2c', '#92540c'];

      slices.forEach((s, idx) => {
        const frac = s.amount / total;
        const strokeDash = frac * circ;
        const strokeSpace = circ - strokeDash;
        const strokeColor = s.color || colors[idx % colors.length];
        s.color = strokeColor;
        const pct = Math.round(frac * 100);
        // dashoffset: positive value shifts the dash start clockwise
        // startOffset positions 1st segment at 12 o'clock; accumulated moves each next segment
        const dashOffset = startOffset - accumulated;

        pathsHTML += `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="${strokeW}"
        stroke-dasharray="${strokeDash} ${strokeSpace}" stroke-dashoffset="${dashOffset}" opacity="0.92">
        <title>${esc(s.mode)}: ₹${s.amount.toLocaleString('en-IN')} (${pct}%, ${s.count} txns)</title>
      </circle>
    `;
        accumulated += strokeDash;
      });

      // Center text rendered directly — no counter-rotation needed
      const centerText = `
    <text x="${cx}" y="${cy - 6}" font-size="11" font-weight="600" fill="#766d66" text-anchor="middle" font-family="system-ui, sans-serif">TOTAL</text>
    <text x="${cx}" y="${cy + 14}" font-size="14" font-weight="700" fill="#2f2a27" text-anchor="middle" font-family="system-ui, sans-serif">₹${Math.round(total).toLocaleString('en-IN')}</text>
  `;

      const legendHTML = slices.map(s => {
        const pct = Math.round((s.amount / total) * 100);
        return `
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:6px 0; border-bottom:1px solid var(--border-subtle);">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:10px; height:10px; border-radius:2px; background:${s.color}; display:inline-block;"></span>
          <span style="font-weight:600; color:var(--text);">${esc(s.mode)}</span>
          <span style="color:var(--text-muted); font-size:11px;">(${s.count} txns)</span>
        </div>
        <div>
          <b style="color:var(--maroon);">${fmtMoney(s.amount)}</b>
          <span style="color:var(--text-muted); font-size:11px; margin-left:4px;">(${pct}%)</span>
        </div>
      </div>
    `;
      }).join('');

      return `
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; justify-content:center; align-items:center;">
        <svg viewBox="0 0 ${svgSize} ${svgSize}" width="${svgSize}" height="${svgSize}" style="max-width: 100%;">
          ${pathsHTML}
          ${centerText}
        </svg>
      </div>
      <div>${legendHTML}</div>
    </div>
  `;
    }

    function renderHorizontalBarChartSVG(items, maxVal, color) {
      if (!items || items.length === 0) return '';
      const safeMax = maxVal > 0 ? maxVal : 1;

      return `

    function setAnalyticsPreset(preset) {
      if (!window.analyticsCache) return;
      window.analyticsCache.preset = preset;
      const customRow = el('analyticsCustomRow');
      if (customRow) {
        customRow.style.display = preset === 'custom' ? 'flex' : 'none';

      if (preset === 'custom') {
        const fromInput = el('analyticsCustomFrom');
        const toInput = el('analyticsCustomTo');
        if (fromInput && !fromInput.value) fromInput.value = window.analyticsCache.customFrom || todayISO();
        if (toInput && !toInput.value) toInput.value = window.analyticsCache.customTo || todayISO();
        window.analyticsCache.customFrom = fromInput ? fromInput.value : '';
        window.analyticsCache.customTo = toInput ? toInput.value : '';

      renderAnalyticsDashboardContent();

      if (!window.analyticsCache) return;

        window.analyticsCache.customFrom = fromInput.value;

    }

    function applyAnalyticsCustomDate() {
      onAnalyticsCustomDateChange();
    }

    function renderAnalyticsDashboardContent() {
      const cache = window.analyticsCache;
      if (!cache) return;

      const { from, to, preset } = getAnalyticsPeriodRange(cache.preset, cache.customFrom, cache.customTo);
      cache.from = from;
      cache.to = to;

      // 1. Update Period badge
      const periodText = formatAnalyticsPeriodDisplay(from, to);
      const periodEl = el('analyticsPeriodRangeText');
      if (periodEl) periodEl.textContent = periodText;

      // 2. Update active preset button
      qsa('.analytics-preset-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.preset === preset);
      });

      const customRow = el('analyticsCustomRow');
      if (customRow) {
        customRow.style.display = preset === 'custom' ? 'flex' : 'none';
        const fromInput = el('analyticsCustomFrom');
        const toInput = el('analyticsCustomTo');
        if (fromInput && !fromInput.value) fromInput.value = from;
        if (toInput && !toInput.value) toInput.value = to;
      }

      // 3. Filter authoritative active receipts & payments
      const receiptsAll = cache.receiptsAll || [];
      const paymentsAll = cache.paymentsAll || [];
      const billingAll = cache.billingAll || [];
      const funds = cache.funds || [];

      const activePeriodReceipts = receiptsAll.filter(r => !r.voided && r.date >= from && r.date <= to);
      const activePeriodPayments = paymentsAll.filter(p => !p.voided && p.date >= from && p.date <= to);

      // Exclude voided / deleted billing records
      const voidedReceiptIds = new Set(receiptsAll.filter(r => r.voided).flatMap(r => [r.id, r.firestoreId, String(r.id), 'rcpt_' + r.id].filter(Boolean)));
      const activePeriodBills = billingAll.filter(b => {
        if (b.deleted || b.voided) return false;
        if (b.accountingReceiptId && voidedReceiptIds.has(b.accountingReceiptId)) return false;
        const bDate = getBillingRecordISODate(b);
        return bDate && bDate >= from && bDate <= to;
      });

      // 4. Calculate Top Summary Statistics
      const totalIncome = sumField(activePeriodReceipts, 'amount');
      const totalExpense = sumField(activePeriodPayments, 'amount');
      const net = totalIncome - totalExpense;
      const totalReceiptsCount = activePeriodReceipts.length;
      const totalPaymentsCount = activePeriodPayments.length;

      if (el('statTotalIncome')) el('statTotalIncome').textContent = fmtMoney(totalIncome);
      if (el('statIncomeSub')) el('statIncomeSub').textContent = `${totalReceiptsCount} active receipt${totalReceiptsCount === 1 ? '' : 's'}`;
      if (el('statTotalExpense')) el('statTotalExpense').textContent = fmtMoney(totalExpense);
      if (el('statExpenseSub')) el('statExpenseSub').textContent = `${totalPaymentsCount} active payment${totalPaymentsCount === 1 ? '' : 's'}`;

      const netCard = el('statNetCard');
      const isSurplus = net >= 0;
      if (netCard) {
        netCard.className = `stat-card ${isSurplus ? 'accent-green' : 'accent-red'}`;
        el('statNetLabel').textContent = isSurplus ? 'NET SURPLUS' : 'NET DEFICIT';
        el('statNetValue').textContent = fmtMoney(Math.abs(net));
        el('statNetSub').textContent = isSurplus
          ? (totalIncome === 0 && totalExpense === 0 ? 'Balanced period' : 'Income exceeds expenses')
          : 'Expenses exceed income';
      }
      if (el('statTotalReceipts')) el('statTotalReceipts').textContent = String(totalReceiptsCount);
      if (el('statTotalPayments')) el('statTotalPayments').textContent = String(totalPaymentsCount);

      // 5. Income vs Expense Trend Chart
      const trendWrap = el('trendChartWrap');
      const trendMeta = el('trendGroupingMeta');
      if (trendWrap) {
        if (totalReceiptsCount === 0 && totalPaymentsCount === 0) {
          trendWrap.innerHTML = renderAnalyticsEmptyState('📈', 'No transactions available for this period.', 'Accounting records for this timeframe will automatically generate trend visualization.');
          if (trendMeta) trendMeta.textContent = 'Empty State';
        } else {
          const fromDateObj = new Date(from + 'T00:00:00');
          const toDateObj = new Date(to + 'T00:00:00');
          const daysDiff = Math.max(Math.round((toDateObj - fromDateObj) / (1000 * 60 * 60 * 24)) + 1, 1);

          let buckets = [];
          if (preset === 'today' || from === to) {
            if (trendMeta) trendMeta.textContent = 'Hourly Breakdown';
            const hourMap = {};
            for (let h = 6; h <= 21; h++) {
              hourMap[h] = { label: `${String(h).padStart(2, '0')}:00`, income: 0, expense: 0, countRcpt: 0, countPmt: 0 };
            }
            activePeriodReceipts.forEach(r => {
              const dt = r.createdAt ? new Date(r.createdAt) : null;
              const h = dt && !isNaN(dt.getTime()) ? dt.getHours() : 10;
              if (!hourMap[h]) hourMap[h] = { label: `${String(h).padStart(2, '0')}:00`, income: 0, expense: 0, countRcpt: 0, countPmt: 0 };
              hourMap[h].income += (parseFloat(r.amount) || 0);
              hourMap[h].countRcpt += 1;
            });
            activePeriodPayments.forEach(p => {
              const dt = p.createdAt ? new Date(p.createdAt) : null;
              const h = dt && !isNaN(dt.getTime()) ? dt.getHours() : 10;
              if (!hourMap[h]) hourMap[h] = { label: `${String(h).padStart(2, '0')}:00`, income: 0, expense: 0, countRcpt: 0, countPmt: 0 };
              hourMap[h].expense += (parseFloat(p.amount) || 0);
              hourMap[h].countPmt += 1;
            });
            buckets = Object.keys(hourMap).map(k => Number(k)).sort((a, b) => a - b).map(k => hourMap[k]);
          } else if (daysDiff <= 31) {
            if (trendMeta) trendMeta.textContent = 'Daily Breakdown';
            const cur = new Date(from + 'T00:00:00');
            const end = new Date(to + 'T00:00:00');
            while (cur <= end) {
              const yr = cur.getFullYear();
              const mo = String(cur.getMonth() + 1).padStart(2, '0');
              const da = String(cur.getDate()).padStart(2, '0');
              const iso = `${yr}-${mo}-${da}`;
              const dayRcpts = activePeriodReceipts.filter(r => r.date === iso);
              const dayPmts = activePeriodPayments.filter(p => p.date === iso);
              buckets.push({
                iso,
                label: cur.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }),
                income: sumField(dayRcpts, 'amount'),
                expense: sumField(dayPmts, 'amount'),
                countRcpt: dayRcpts.length,
                countPmt: dayPmts.length
              });
              cur.setDate(cur.getDate() + 1);
            }
          } else {
            if (trendMeta) trendMeta.textContent = 'Monthly Breakdown';
            const monthMap = {};
            const cur = new Date(from + 'T00:00:00');
            const end = new Date(to + 'T00:00:00');
            while (cur <= end) {
              const ym = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`;
              if (!monthMap[ym]) {
                monthMap[ym] = {
                  iso: ym,
                  label: cur.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' }),
                  income: 0,
                  expense: 0,
                  countRcpt: 0,
                  countPmt: 0
                };
              }
              cur.setDate(cur.getDate() + 1);
            }
            activePeriodReceipts.forEach(r => {
              const ym = String(r.date || '').slice(0, 7);
              if (monthMap[ym]) {
                monthMap[ym].income += (parseFloat(r.amount) || 0);
                monthMap[ym].countRcpt += 1;
              }
            });
            activePeriodPayments.forEach(p => {
              const ym = String(p.date || '').slice(0, 7);
              if (monthMap[ym]) {
                monthMap[ym].expense += (parseFloat(p.amount) || 0);
                monthMap[ym].countPmt += 1;
              }
            });
            buckets = Object.values(monthMap);
          }
          trendWrap.innerHTML = renderTrendChartSVG(buckets);
        }
      }

      // 6. Section 5: Pooja & Vazhipadu Analytics
      const poojaWrap = el('poojaSectionContent');
      const poojaMeta = el('poojaTotalMeta');
      if (poojaWrap) {
        if (activePeriodBills.length === 0) {
          poojaWrap.innerHTML = renderAnalyticsEmptyState('🪔', 'No pooja/billing data available for this period.', 'Pooja bookings and vazhipadu receipts for this timeframe will be analyzed here.');
          if (poojaMeta) poojaMeta.textContent = '0 Bookings';
        } else {
          if (poojaMeta) poojaMeta.textContent = `${activePeriodBills.length} Bill${activePeriodBills.length === 1 ? '' : 's'}`;

          const itemStats = {};
          let totalPoojaAmount = 0;
          let totalPoojaQty = 0;

          activePeriodBills.forEach(b => {
            const item = (b.item || b.category || 'General Pooja').trim();
            if (!itemStats[item]) {
              itemStats[item] = {
                name: item,
                category: b.category || 'Pooja',
                txCount: 0,
                totalQty: 0,
                totalAmount: 0
              };
            }
            itemStats[item].txCount += 1;
            const q = parseInt(b.quantity, 10) || 1;
            itemStats[item].totalQty += q;
            totalPoojaQty += q;
            const amt = parseFloat(b.totalAmount || b.total) || 0;
            itemStats[item].totalAmount += amt;
            totalPoojaAmount += amt;
          });

          const itemList = Object.values(itemStats);
          const topByAmount = itemList.slice().sort((a, b) => b.totalAmount - a.totalAmount);
          const topByCount = itemList.slice().sort((a, b) => b.txCount - a.txCount || b.totalQty - a.totalQty);
          const highestItem = topByAmount[0];
          const mostFrequentItem = topByCount[0];

          const chartItems = topByAmount.slice(0, 8).map(i => ({
            name: i.name,
            amount: i.totalAmount,
            sub: `${i.txCount} txns · ${i.totalQty} qty`
          }));
          const maxItemAmt = chartItems[0] ? chartItems[0].amount : 1;

          poojaWrap.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <!-- Highlight Cards -->
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px;">
            <div class="analytics-highlight-card">
              <div>
                <div style="font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Highest Collection Pooja</div>
                <div style="font-size:14px; font-weight:700; color:var(--maroon); margin-top:2px;">${esc(highestItem ? highestItem.name : '-')}</div>
                <div style="font-size:12px; color:var(--text-muted);">${highestItem ? `${highestItem.txCount} txns · ${highestItem.totalQty} qty` : '-'}</div>
              </div>
              <div style="font-size:16px; font-weight:700; color:var(--maroon);">${fmtMoney(highestItem ? highestItem.totalAmount : 0)}</div>
            </div>
            <div class="analytics-highlight-card" style="border-left-color: var(--green);">
              <div>
                <div style="font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Most Frequent Pooja</div>
                <div style="font-size:14px; font-weight:700; color:var(--green); margin-top:2px;">${esc(mostFrequentItem ? mostFrequentItem.name : '-')}</div>
                <div style="font-size:12px; color:var(--text-muted);">${mostFrequentItem ? `${mostFrequentItem.totalQty} total quantity` : '-'}</div>
              </div>
              <div style="font-size:16px; font-weight:700; color:var(--green);">${mostFrequentItem ? mostFrequentItem.txCount : 0} txns</div>
            </div>
          </div>

          <!-- Visual Bar Chart & Breakdown Table -->
          <div class="panel-row">
            <div>
              <h4 style="margin:0 0 10px; font-size:13px; color:var(--text-secondary);">Collection by Pooja Item</h4>
              ${renderHorizontalBarChartSVG(chartItems, maxItemAmt, 'var(--primary-red)')}
            </div>
            <div>
              <h4 style="margin:0 0 10px; font-size:13px; color:var(--text-secondary);">Item-Wise Collection Breakdown</h4>
              <div class="table-wrap" style="max-height:280px; overflow-y:auto;">
                <table>
                  <thead>
                    <tr>
                      <th>Pooja / Item</th>
                      <th style="text-align:right;">Txns</th>
                      <th style="text-align:right;">Quantity</th>
                      <th style="text-align:right;">Total Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${itemList.sort((a, b) => b.totalAmount - a.totalAmount).map(item => `
                      <tr>
                        <td><b>${esc(item.name)}</b></td>
                        <td style="text-align:right;">${item.txCount}</td>
                        <td style="text-align:right;">${item.totalQty}</td>
                        <td style="text-align:right;"><b style="color:var(--maroon);">${fmtMoney(item.totalAmount)}</b></td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
        }
      }

      // 7. Section 6: Devotee Activity
      const devoteeWrap = el('devoteeSectionContent');
      if (devoteeWrap) {
        if (activePeriodReceipts.length === 0) {
          devoteeWrap.innerHTML = renderAnalyticsEmptyState('🙏', 'No devotee activity recorded for this period.', 'Devotee contribution summaries will appear when active receipts are recorded.');
        } else {
          const devoteeMap = {};
          activePeriodReceipts.forEach(r => {
            let name = (r.name || '').trim();
            if (!name) name = 'Unnamed / Walk-in';
            if (!devoteeMap[name]) devoteeMap[name] = { name, count: 0, amount: 0 };
            devoteeMap[name].count += 1;
            devoteeMap[name].amount += (parseFloat(r.amount) || 0);
          });

          const devoteeList = Object.values(devoteeMap);
          const topByAmount = devoteeList.slice().sort((a, b) => b.amount - a.amount).slice(0, 5);
          const topByCount = devoteeList.slice().sort((a, b) => b.count - a.count || b.amount - a.amount).slice(0, 5);

          devoteeWrap.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div>
            <div style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">
              Top Devotees by Total Contribution
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Devotee Name</th>
                    <th style="text-align:right;">Txns</th>
                    <th style="text-align:right;">Total Amount</th>
                  </tr>
                </thead>
                <tbody>
                  ${topByAmount.map(d => `
                    <tr>
                      <td><b>${esc(d.name)}</b></td>
                      <td style="text-align:right;">${d.count}</td>
                      <td style="text-align:right;"><b style="color:var(--green);">${fmtMoney(d.amount)}</b></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div>
            <div style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">
              Most Frequent Devotees
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Devotee Name</th>
                    <th style="text-align:right;">Transactions</th>
                    <th style="text-align:right;">Total Contributed</th>
                  </tr>
                </thead>
                <tbody>
                  ${topByCount.map(d => `
                    <tr>
                      <td><b>${esc(d.name)}</b></td>
                      <td style="text-align:right;">${d.count}</td>
                      <td style="text-align:right;"><b style="color:var(--maroon);">${fmtMoney(d.amount)}</b></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
        }
      }

      // 8. Section 7: Expense Analysis
      const expenseWrap = el('expenseSectionContent');
      if (expenseWrap) {
        if (activePeriodPayments.length === 0) {
          expenseWrap.innerHTML = renderAnalyticsEmptyState('💸', 'No expense data available for this period.', 'Categorized expenses and spending patterns will display here.');
        } else {
          const expenseCatMap = {};
          activePeriodPayments.forEach(p => {
            const cat = (p.category || 'Uncategorized').trim();
            if (!expenseCatMap[cat]) expenseCatMap[cat] = { category: cat, count: 0, amount: 0 };
            expenseCatMap[cat].count += 1;
            expenseCatMap[cat].amount += (parseFloat(p.amount) || 0);
          });

          const expenseCatList = Object.values(expenseCatMap).sort((a, b) => b.amount - a.amount);
          const highestCat = expenseCatList[0];
          const maxExpense = highestCat ? highestCat.amount : 1;

          const chartItems = expenseCatList.map(c => ({
            name: c.category,
            amount: c.amount,
            sub: `${c.count} voucher${c.count === 1 ? '' : 's'}`
          }));

          expenseWrap.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          ${highestCat ? `
            <div class="analytics-highlight-card" style="border-left-color: var(--primary-red);">
              <div>
                <div style="font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Highest Expense Category</div>
                <div style="font-size:14px; font-weight:700; color:var(--primary-red); margin-top:2px;">${esc(highestCat.category)}</div>
                <div style="font-size:12px; color:var(--text-muted);">${highestCat.count} payments recorded</div>
              </div>
              <div style="font-size:16px; font-weight:700; color:var(--primary-red);">${fmtMoney(highestCat.amount)}</div>
            </div>
          ` : ''}

          <div>
            <div style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase;">Expense by Category</div>
            ${renderHorizontalBarChartSVG(chartItems, maxExpense, 'var(--primary-red)')}
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Expense Category</th>
                  <th style="text-align:right;">Payments</th>
                  <th style="text-align:right;">Total Amount</th>
                </tr>
              </thead>
              <tbody>
                ${expenseCatList.map(c => `
                  <tr>
                    <td><b>${esc(c.category)}</b></td>
                    <td style="text-align:right;">${c.count}</td>
                    <td style="text-align:right;"><b style="color:var(--primary-red);">${fmtMoney(c.amount)}</b></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
        }
      }

      // 9. Section 8: Payment Mode Analysis
      const paymentModeWrap = el('paymentModeSectionContent');
      if (paymentModeWrap) {
        if (activePeriodReceipts.length === 0) {
          paymentModeWrap.innerHTML = renderAnalyticsEmptyState('💳', 'No collection data available for this period.', 'Cash, UPI, and Bank collection channels will be visualised here.');
        } else {
          const modeMap = {};
          activePeriodReceipts.forEach(r => {
            const mode = (r.paymentMode || 'Cash').trim();
            if (!modeMap[mode]) modeMap[mode] = { mode, count: 0, amount: 0 };
            modeMap[mode].count += 1;
            modeMap[mode].amount += (parseFloat(r.amount) || 0);
          });

          const modeList = Object.values(modeMap).sort((a, b) => b.amount - a.amount);
          paymentModeWrap.innerHTML = renderDonutChartSVG(modeList, totalIncome);
        }
      }

      // 10. Section 9: Fund Performance
      const fundWrap = el('fundPerformanceContent');
      if (fundWrap) {
        const fundList = funds.map(f => {
          const fName = f.name;
          const fIncome = sumField(activePeriodReceipts.filter(r => r.fund === fName), 'amount');
          const fExpense = sumField(activePeriodPayments.filter(p => p.fund === fName), 'amount');
          const fNet = fIncome - fExpense;
          return { name: fName, income: fIncome, expense: fExpense, net: fNet };
        });

        if (fundList.length === 0) {
          fundWrap.innerHTML = renderAnalyticsEmptyState('🏦', 'No funds registered in the database.', 'Register temple funds to track individual fund performance.');
        } else {
          const fundCardsHTML = fundList.map(f => {
            const isFundSurplus = f.net >= 0;
            return `
          <div class="analytics-fund-card">
            <div class="analytics-fund-name">${esc(f.name)}</div>
            <div class="analytics-fund-row">
              <span>Income:</span>
              <b style="color:var(--green);">${fmtMoney(f.income)}</b>
            </div>
            <div class="analytics-fund-row">
              <span>Expense:</span>
              <b style="color:var(--primary-red);">${fmtMoney(f.expense)}</b>
            </div>
            <div class="analytics-fund-row analytics-fund-net">
              <span>Net Movement:</span>
              <b style="color:${isFundSurplus ? 'var(--green)' : 'var(--primary-red)'};">${(f.net > 0 ? '+' : '') + fmtMoney(f.net)}</b>
            </div>
          </div>
        `;
          }).join('');
          fundWrap.innerHTML = `<div class="analytics-funds-grid">${fundCardsHTML}</div>`;
        }
      }

      // Initialize motions on newly rendered elements
      initMotionObserver(el('app-main'));
    }

    /* ===================== TRIAL BALANCE ===================== */
    VIEW_RENDERERS.trialbalance = async function () {
      const [receipts, payments, cash, bank, funds, loanOut] = await Promise.all([
        activeReceipts(), activePayments(), getCashBalance(), getBankBalance(), getAllFundBalances(), getLoanOutstanding()
      ]);
      const incomeByCategory = {};
      receipts.forEach(r => { const cat = (r.category && String(r.category).trim()) ? r.category.trim() : 'None / General'; incomeByCategory[cat] = (incomeByCategory[cat] || 0) + r.amount; });
      const expenseByCategory = {};
      payments.forEach(p => { const cat = p.category || 'Uncategorized'; expenseByCategory[cat] = (expenseByCategory[cat] || 0) + p.amount; });

      /* Balance-sheet style rows only (Cash/Bank/Funds/Loans). Income & Expense category
         totals are NOT added here as separate rows: every receipt/payment amount is already
         reflected inside Cash/Bank (asset) and its Fund (equity) balance, so also listing the
         category amount as its own debit/credit would count the same amount twice ("multiplied")
         and throw the trial balance out of balance. Category-wise figures are shown below instead,
         as a reference-only Income & Expenditure summary that is not part of this balance check. */
      const rows = [];
      rows.push({ account: 'Cash in Hand', debit: cash, credit: 0 });
      rows.push({ account: 'Bank Account', debit: bank, credit: 0 });
      funds.forEach(f => rows.push({ account: f.name + ' (Fund)', debit: 0, credit: f.balance }));
      if (loanOut) rows.push({ account: 'Loans Payable', debit: 0, credit: loanOut });

      const totalDebit = sumField(rows, 'debit'), totalCredit = sumField(rows, 'credit');
      const balanced = Math.abs(totalDebit - totalCredit) < 0.01;

      const totalIncome = Object.values(incomeByCategory).reduce((a, b) => a + b, 0);
      const totalExpense = Object.values(expenseByCategory).reduce((a, b) => a + b, 0);

      return `
    <div class="balance-banner ${balanced ? 'ok' : 'bad'}" data-motion="fadeInUp">${balanced ? '✅ Accounts Balanced' : `⚠️ Difference Found: ${fmtMoney(Math.abs(totalDebit - totalCredit))}`}</div>
    <p class="muted">This is a simplified trial balance built from cash/bank, fund and loan balances — a full double-entry journal is planned for a future update.</p>
    <div class="table-wrap" data-motion="fadeIn"><table>
      <thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${esc(r.account)}</td><td>${r.debit ? fmtMoney(r.debit) : '-'}</td><td>${r.credit ? fmtMoney(r.credit) : '-'}</td></tr>`).join('')}
        <tr class="pr-bold"><td><b>TOTAL</b></td><td><b>${fmtMoney(totalDebit)}</b></td><td><b>${fmtMoney(totalCredit)}</b></td></tr>
      </tbody>
    </table></div>

    <h3 style="margin-top:20px;color:var(--maroon);">Income &amp; Expenditure by Category (reference only)</h3>

    /**
     * Serialize a Firestore Timestamp (or any value) to a JSON-safe, deterministic representation.
     * Firestore Timestamps have .seconds and .nanoseconds; plain numbers are kept as-is.
     * Returns an object { __type: 'Timestamp', seconds, nanoseconds, iso } for Timestamp objects,
     * so that a future restore can reconstruct the original value.
     */
    function _serializeTimestamp(value) {
      if (value === null || value === undefined) return value;
      // Firestore compat SDK Timestamp: has seconds + nanoseconds
      if (typeof value === 'object' && typeof value.seconds === 'number' && typeof value.nanoseconds === 'number') {
        return {
          __type: 'Timestamp',
          seconds: value.seconds,
          nanoseconds: value.nanoseconds,
          iso: new Date(value.seconds * 1000 + Math.floor(value.nanoseconds / 1e6)).toISOString()
        };
      }
      // Plain Date object
      if (value instanceof Date) {
        return { __type: 'Date', iso: value.toISOString(), ms: value.getTime() };
      }
      return value;
    }

    /**
     * Recursively walk a document object and serialize any Firestore Timestamp fields.
     */
    function _serializeDoc(doc) {
      if (doc === null || doc === undefined) return doc;
      if (Array.isArray(doc)) return doc.map(_serializeDoc);
      if (typeof doc === 'object') {
        const out = {};
        for (const [k, v] of Object.entries(doc)) {
          if (typeof v === 'object' && v !== null &&
            typeof v.seconds === 'number' && typeof v.nanoseconds === 'number') {
            out[k] = _serializeTimestamp(v);
          } else if (typeof v === 'object' && v !== null) {
            out[k] = _serializeDoc(v);
          } else {
            out[k] = v;
          }
        }
        return out;
      }
      return doc;
    }

    /**
     * STEP 33.49 — BACKUP INTEGRITY & RECOVERY HARDENING (W-01, W-02, W-03)
     *
     * Canonical JSON serialization (subset of RFC 8785 JSON Canonicalization Scheme - JCS).
     * Deterministically orders object keys lexicographically and produces a stable string
     * representation for hashing across browser and server environments.
     */
    function _canonicalJsonStringify(val) {
      if (val === null || typeof val !== 'object') {
        return JSON.stringify(val);
      }
      if (Array.isArray(val)) {
        return '[' + val.map(item => (item === undefined || typeof item === 'function') ? 'null' : _canonicalJsonStringify(item)).join(',') + ']';
      }
      const keys = Object.keys(val).sort();
      const entries = [];
      for (const k of keys) {
        const v = val[k];
        if (v !== undefined && typeof v !== 'function') {
          entries.push(JSON.stringify(k) + ':' + _canonicalJsonStringify(v));
        }
      }
      return '{' + entries.join(',') + '}';
    }

    /**
     * Computes SHA-256 hash using the Web Crypto API (SubtleCrypto) where available,
     * falling back to Node.js crypto in test/CLI environments.
     * Returns an uppercase hexadecimal string.
     */
    async function _computeSha256(str) {
      if (typeof crypto !== 'undefined' && crypto.subtle && typeof TextEncoder !== 'undefined') {
        const data = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      } else if (typeof require !== 'undefined') {
        const nodeCrypto = require('crypto');
        return nodeCrypto.createHash('sha256').update(str, 'utf8').digest('hex').toUpperCase();
      }
      throw new Error('No cryptographic provider available for SHA-256 computation.');
    }

    /**
     * Extracts the deterministic payload covered by backup integrity checks.
     * Excludes metadata (which contains the hash itself and timestamps) to prevent circular hashing.
     */
    function _getBackupIntegrityPayload(backupObj) {
      return {
        collections: backupObj.collections || {},
        counters: backupObj.counters || null,
        reservations: backupObj.reservations || [],
        idempotency: backupObj.idempotency || [],
        system: backupObj.system || {}
      };
    }

    // Expose backup crypto utilities globally for isolated test suites
    if (typeof window !== 'undefined') {
      window.TempleBackupCrypto = {
        canonicalJsonStringify: _canonicalJsonStringify,
        computeSha256: _computeSha256,
        getBackupIntegrityPayload: _getBackupIntegrityPayload
      };
    }

    /**
     * STEP 23.1 — FIRESTORE-AWARE PRODUCTION BACKUP (BUG-003 FIX)
     *
     * Reads ALL production data directly from Firestore (authoritative source).
     * Does NOT read from IndexedDB — eliminates stale-cache dependency entirely.
     * All-or-nothing: if any collection read fails, the backup is aborted.
     * Reads are READ-ONLY — no set(), add(), update(), delete(), runTransaction().
     */
    async function downloadBackup() {
      const btn = document.getElementById('backup-download-btn');
      const originalLabel = btn ? btn.textContent : '';

      // --- Guard: prevent duplicate clicks ---
      if (btn && btn.disabled) return;
      if (btn) { btn.disabled = true; btn.textContent = 'Reading from Firestore…'; }

      try {
        // --- Pre-flight: verify authentication ---
        const user = getCurrentFirebaseUser();
        if (!user) throw new Error('Not authenticated. Please log in before creating a backup.');

        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized. Cannot create backup.');

        console.log('[Backup] Starting Firestore-authoritative backup. Source: Firestore (NOT IndexedDB).');
        console.log('[Backup] Authenticated user:', user.email || user.uid);

        // --- Define ALL production collections to export ---
        const BACKUP_COLLECTIONS = [
          'settings',
          'funds',
          'incomeCategories',
          'expenseCategories',
          'bankAccounts',
          'billing',
          'receipts',
          'payments',
          'transfers',
          'chittyMembers',
          'chittyCollections',
          'chittyPayouts',
          'loans'
        ];

        const exportTimestamp = new Date().toISOString();
        const collections = {};
        let totalDocCount = 0;

        // --- Read every collection directly from Firestore ---
        // Use Promise.all for parallel reads; capture all errors.
        const results = await Promise.allSettled(
          BACKUP_COLLECTIONS.map(async (colName) => {
            const snap = await db.collection(colName).get();
            const docs = [];
            snap.forEach(docSnap => {
              const data = docSnap.data();
              // Preserve the Firestore document ID as the primary identifier
              docs.push(_serializeDoc({ _firestoreId: docSnap.id, ...data }));
            });
            console.log(`[Backup] ${colName}: ${docs.length} document(s) read from Firestore.`);
            return { colName, docs };
          })
        );

        // --- All-or-nothing: check every collection succeeded ---
        const failures = [];
        for (let i = 0; i < results.length; i++) {
          if (results[i].status === 'rejected') {
            failures.push({ collection: BACKUP_COLLECTIONS[i], error: results[i].reason });
            console.error(`[Backup] FAILED to read collection '${BACKUP_COLLECTIONS[i]}':`, results[i].reason);
          } else {
            const { colName, docs } = results[i].value;
            collections[colName] = docs;
            totalDocCount += docs.length;
          }
        }

        if (failures.length > 0) {
          const failNames = failures.map(f => f.collection).join(', ');
          throw new Error(`Backup aborted: failed to read collection(s): ${failNames}. No backup file was created.`);
        }

        // --- Read Firestore system records (system/counters, system/res_*, system/op_*) ---
        if (btn) btn.textContent = 'Reading system records…';
        let countersData = null;
        const reservationsList = [];
        const idempotencyList = [];
        const otherSystemDocs = [];

        try {
          const systemSnap = await db.collection(FS_COUNTERS_COLLECTION).get();
          systemSnap.forEach(docSnap => {
            const docId = docSnap.id;
            const serialized = _serializeDoc({ _firestoreId: docId, ...docSnap.data() });
            if (docId === FS_COUNTERS_DOC_ID) {
              countersData = serialized;
              countersData._firestoreCollection = FS_COUNTERS_COLLECTION;
            } else if (docId.startsWith('res_')) {
              reservationsList.push(serialized);
            } else if (docId.startsWith('op_')) {
              idempotencyList.push(serialized);
            } else {
              otherSystemDocs.push(serialized);
            }
          });
        } catch (sysErr) {
          throw new Error(`Backup aborted: failed to read system collection (${FS_COUNTERS_COLLECTION}): ${sysErr.message}`);
        }

        // Fallback: If counters doc wasn't found in system collection scan, attempt direct doc get
        if (!countersData) {
          try {
            const counterSnap = await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).get();
            if (counterSnap.exists) {
              countersData = _serializeDoc(counterSnap.data());
              countersData._firestoreId = FS_COUNTERS_DOC_ID;
              countersData._firestoreCollection = FS_COUNTERS_COLLECTION;
            } else {
              console.warn('[Backup] system/counters document does not exist in Firestore.');
            }
          } catch (counterErr) {
            throw new Error(`Backup aborted: failed to read Firestore counters (${FS_COUNTERS_COLLECTION}/${FS_COUNTERS_DOC_ID}): ${counterErr.message}`);
          }
        }

        // Sort reservations deterministically by sequence number
        reservationsList.sort((a, b) => (Number(a.seqNumber) || 0) - (Number(b.seqNumber) || 0));
        // Sort idempotency records deterministically by sequence number / operationId
