    let viewTransitionCleanup = null;
    async function navigate(view, ...args) {
      const isSameView = (CURRENT_VIEW === view);
      CURRENT_VIEW = view;
      qsa('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      el('topbar-title').textContent = VIEW_TITLES[view] || view;
      const main = el('app-main');

      // Page Transition: reset and trigger reference-matched subtle entrance
      if (viewTransitionCleanup) {
        viewTransitionCleanup();
        viewTransitionCleanup = null;
      }
      if (!isSameView) {
        main.classList.remove('view-enter-active');
        main.innerHTML = '<div class="loading">Loading…</div>';
      }
      try {
        const renderer = VIEW_RENDERERS[view];
        if (renderer) main.innerHTML = await renderer(...args);
        else main.innerHTML = '<div class="loading">Not found</div>';

        // Clean up any pending transition before triggering new one
        if (viewTransitionCleanup) {
          viewTransitionCleanup();
          viewTransitionCleanup = null;
        }

        if (!isSameView) {
          void main.offsetWidth; // trigger reflow for smooth view entrance
          main.classList.add('view-enter-active');

          // STEP 26.1: Clean up .view-enter-active after 280ms entrance completes to release GPU compositing layer
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || window.getComputedStyle(main).animationName === 'none') {
            main.classList.remove('view-enter-active');
          } else {
            let safetyTimer = null;
            const onAnimEnd = (e) => {
              if (e.target === main && e.animationName === 'viewEnterKeyframe') {
                cleanup();
              }
            };
            const cleanup = () => {
              if (safetyTimer) {
                clearTimeout(safetyTimer);
                safetyTimer = null;
              }
              main.removeEventListener('animationend', onAnimEnd);
              main.classList.remove('view-enter-active');
              if (viewTransitionCleanup === cleanup) {
                viewTransitionCleanup = null;
              }
            };
            viewTransitionCleanup = cleanup;
            main.addEventListener('animationend', onAnimEnd);
            // Safety fallback: ensure cleanup if animationend is suppressed (e.g. background tab), strictly after 280ms duration
            safetyTimer = setTimeout(cleanup, 320);
          }
        }

        wireViewEvents(view);
        initTextAnimate(main);
        initMotionObserver(main);
        if (window.GlobalEditState) window.GlobalEditState.syncDOM();
      } catch (err) {

            elem.classList.toggle('row-editing-active', shouldHighlight);

    /* ===================== STEP 33.23: REUSABLE DYNAMIC BUTTON SYSTEM ===================== */
    (function () {
      const EASE = 'cubic-bezier(0.23, 1, 0.32, 1)';
      const DURATION_NORMAL = 180;
      const DURATION_REDUCED = 160;

      function isReducedMotion() {
        return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      }

      function renderSlotItem(content, isIcon) {
        const item = document.createElement('span');
        item.className = isIcon ? 'dynamic-btn-icon-item' : 'dynamic-btn-label-item';
        if (typeof content === 'string') {
          if (content.trim().startsWith('<')) {
            item.innerHTML = content;
          } else {
            item.textContent = content;
          }
        } else if (content instanceof Node) {
          item.appendChild(content.cloneNode(true));
        }
        return item;
      }

      function animateTransition(enteringEl, exitingEl, isReduced) {
        const duration = isReduced ? DURATION_REDUCED : DURATION_NORMAL;
        const enterFromY = isReduced ? '0px' : '8px';
        const exitToY = isReduced ? '0px' : '-8px';

        if (exitingEl) {
          exitingEl.classList.add('dynamic-btn-exiting');
          const safetyTimer = setTimeout(() => {
            if (exitingEl.parentNode) exitingEl.remove();
          }, duration + 40);

          if (typeof exitingEl.animate === 'function') {
            try {
              const anim = exitingEl.animate([
                { opacity: 1, transform: 'translateY(0px)' },
                { opacity: 0, transform: 'translateY(' + exitToY + ')' }
              ], {
                duration: duration,
                easing: EASE,
                fill: 'forwards'
              });
              anim.onfinish = () => {
                clearTimeout(safetyTimer);
                if (exitingEl.parentNode) exitingEl.remove();
              };
            } catch (e) {
              // Fallback if animation throws
            }
          } else {
            exitingEl.classList.add(isReduced ? 'dynamic-btn-anim-exit-reduced' : 'dynamic-btn-anim-exit-normal');
          }
        }

        if (enteringEl) {
          enteringEl.classList.add('dynamic-btn-entering');
          const enterSafetyTimer = setTimeout(() => {
            enteringEl.classList.remove('dynamic-btn-entering', 'dynamic-btn-anim-enter-normal', 'dynamic-btn-anim-enter-reduced');
          }, duration + 40);

          if (typeof enteringEl.animate === 'function') {
            try {
              const anim = enteringEl.animate([
                { opacity: 0, transform: 'translateY(' + enterFromY + ')' },
                { opacity: 1, transform: 'translateY(0px)' }
              ], {
                duration: duration,
                easing: EASE,
                fill: 'forwards'
              });
              anim.onfinish = () => {
                clearTimeout(enterSafetyTimer);
                enteringEl.classList.remove('dynamic-btn-entering');
              };
            } catch (e) {
              // Fallback
            }
          } else {
            enteringEl.classList.add(isReduced ? 'dynamic-btn-anim-enter-reduced' : 'dynamic-btn-anim-enter-normal');
          }
        }
      }

      const DynamicButton = {
        init(btn, options = {}) {
          if (!btn) return null;
          if (btn._dynamicState) {
            this.setState(btn, options);
            return btn;
          }

          const variant = options.variant || (btn.classList.contains('btn-outline') ? 'secondary' : (btn.classList.contains('btn-danger') ? 'danger' : 'primary'));
          const width = options.width || (btn.classList.contains('dynamic-btn-full') || btn.classList.contains('w-full') ? 'full' : 'content');

          let text = options.text;
          if (text === undefined) {
            const spans = btn.querySelectorAll('span:not(.cat-pill-icon)');
            text = spans.length > 0 ? spans[spans.length - 1].textContent.trim() : btn.textContent.trim();
          }

          let icon = options.icon;
          if (icon === undefined) {
            const svg = btn.querySelector('svg');
            if (svg) {
              icon = svg.outerHTML;
            } else {
              const firstSpan = btn.querySelector('span:first-child');
              const allSpans = btn.querySelectorAll('span');
              if (firstSpan && allSpans.length > 1) {
                icon = firstSpan.innerHTML.trim();
              } else {
                icon = null;
              }
            }
          }

          const stateKey = options.stateKey !== undefined ? options.stateKey : text;

          btn.classList.add('dynamic-btn', 'dynamic-btn-' + variant);
          if (width === 'full') {
            btn.classList.add('dynamic-btn-full');
          } else {
            btn.classList.remove('dynamic-btn-full');
          }
          btn.dataset.dynamicWidth = width;

          btn.innerHTML = '<span class="dynamic-btn-visible" aria-hidden="false">' +
            '<span class="dynamic-btn-icon-slot" style="' + (icon ? '' : 'display: none;') + '"></span>' +
            '<span class="dynamic-btn-label-slot"></span>' +
            '</span>' +
            '<span class="dynamic-btn-measure" aria-hidden="true">' +
            '<span class="dynamic-btn-measure-icon" style="' + (icon ? '' : 'display: none;') + '"></span>' +
            '<span class="dynamic-btn-measure-label"></span>' +
            '</span>';

          const iconSlot = btn.querySelector('.dynamic-btn-icon-slot');
          const labelSlot = btn.querySelector('.dynamic-btn-label-slot');
          const measureIcon = btn.querySelector('.dynamic-btn-measure-icon');
          const measureLabel = btn.querySelector('.dynamic-btn-measure-label');

          if (icon) {
            const iconItem = renderSlotItem(icon, true);
            iconSlot.appendChild(iconItem);
            measureIcon.innerHTML = typeof icon === 'string' ? icon : '';
          }
          const labelItem = renderSlotItem(text, false);
          labelSlot.appendChild(labelItem);
          measureLabel.textContent = text;

          btn._dynamicState = {
            text: text,
            icon: icon,
            stateKey: stateKey,
            variant: variant,
            width: width
          };

          this.syncWidth(btn, true);

          if (typeof ResizeObserver !== 'undefined') {
            const ro = new ResizeObserver(() => {
              this.syncWidth(btn, false);
            });
            const measure = btn.querySelector('.dynamic-btn-measure');
            if (measure) ro.observe(measure);
            btn._dynamicRO = ro;
          }

          btn._dynamicResizeHandler = () => this.syncWidth(btn, false);
          window.addEventListener('resize', btn._dynamicResizeHandler);

          return btn;
        },

        setState(btn, nextState = {}) {
          if (!btn || !btn._dynamicState) return;
          const prev = btn._dynamicState;
          const nextText = nextState.text !== undefined ? nextState.text : prev.text;
          const nextIcon = nextState.icon !== undefined ? nextState.icon : prev.icon;
          const nextStateKey = nextState.stateKey !== undefined ? nextState.stateKey : (nextState.text !== undefined ? nextState.text : prev.stateKey);
          const nextVariant = nextState.variant || prev.variant;
          const nextWidth = nextState.width || prev.width;

          const reduced = isReducedMotion();

          if (nextVariant !== prev.variant) {
            btn.classList.remove('dynamic-btn-' + prev.variant);
            btn.classList.add('dynamic-btn-' + nextVariant);
            prev.variant = nextVariant;
          }

          if (nextWidth !== prev.width) {
            if (nextWidth === 'full') {
              btn.classList.add('dynamic-btn-full');
              btn.style.width = '';
              btn.style.maxWidth = '';
            } else {
              btn.classList.remove('dynamic-btn-full');
            }
            btn.dataset.dynamicWidth = nextWidth;
            prev.width = nextWidth;
          }

          const iconSlot = btn.querySelector('.dynamic-btn-icon-slot');
          const labelSlot = btn.querySelector('.dynamic-btn-label-slot');
          const measureIcon = btn.querySelector('.dynamic-btn-measure-icon');
          const measureLabel = btn.querySelector('.dynamic-btn-measure-label');

          const prevIconKey = prev.stateKey !== undefined ? prev.stateKey : prev.text;
          const newIconKey = nextStateKey !== undefined ? nextStateKey : nextText;
          const iconKeyChanged = String(prevIconKey) !== String(newIconKey) || nextIcon !== prev.icon;

          if (iconKeyChanged) {
            if (nextIcon) {
              iconSlot.style.display = '';
              measureIcon.style.display = '';
              measureIcon.innerHTML = typeof nextIcon === 'string' ? nextIcon : '';

              // Purge all earlier children to prevent stale accumulation
              const existingIcons = Array.from(iconSlot.querySelectorAll('.dynamic-btn-icon-item'));
              let currentIcon = null;
              if (existingIcons.length > 0) {
                currentIcon = existingIcons[existingIcons.length - 1];
                for (let i = 0; i < existingIcons.length - 1; i++) {
                  existingIcons[i].remove();
                }
              }

              const newIconEl = renderSlotItem(nextIcon, true);
              iconSlot.appendChild(newIconEl);

              animateTransition(newIconEl, currentIcon, reduced);
            } else {
              measureIcon.style.display = 'none';
              measureIcon.innerHTML = '';
              const currentIcon = iconSlot.querySelector('.dynamic-btn-icon-item:not(.dynamic-btn-exiting)');
              if (currentIcon) {
                animateTransition(null, currentIcon, reduced);
                setTimeout(() => { if (!prev.icon) iconSlot.style.display = 'none'; }, reduced ? DURATION_REDUCED : DURATION_NORMAL);
              } else {
                iconSlot.style.display = 'none';
              }
            }
            prev.icon = nextIcon;
            prev.stateKey = nextStateKey;
          }

          if (nextText !== prev.text) {
            measureLabel.textContent = nextText;

            // Purge all earlier children to prevent stale accumulation
            const existingLabels = Array.from(labelSlot.querySelectorAll('.dynamic-btn-label-item'));
            let currentLabel = null;
            if (existingLabels.length > 0) {
              currentLabel = existingLabels[existingLabels.length - 1];
              for (let i = 0; i < existingLabels.length - 1; i++) {
                existingLabels[i].remove();
              }
            }

            const newLabelEl = renderSlotItem(nextText, false);
            labelSlot.appendChild(newLabelEl);

            animateTransition(newLabelEl, currentLabel, reduced);
            prev.text = nextText;
          }

          if (nextState.disabled !== undefined) {
            btn.disabled = !!nextState.disabled;
          }

          this.syncWidth(btn, false);
        },

        syncWidth(btn, immediate = false) {
          if (!btn || btn.dataset.dynamicWidth === 'full') return;
          const measure = btn.querySelector('.dynamic-btn-measure');
          if (!measure) return;

          const styles = window.getComputedStyle(btn);
          const horizontalPadding =
            parseFloat(styles.paddingLeft || 0) +
            parseFloat(styles.paddingRight || 0) +
            parseFloat(styles.borderLeftWidth || 0) +
            parseFloat(styles.borderRightWidth || 0);

          const contentWidth = measure.scrollWidth;
          const nextWidth = Math.ceil(contentWidth + horizontalPadding);
          if (!nextWidth || nextWidth <= 0) return;

          const reduced = isReducedMotion();

          if (immediate || reduced) {
            btn.style.setProperty('transition', 'none', 'important');
            btn.style.width = nextWidth + 'px';
            btn.style.maxWidth = nextWidth + 'px';
            void btn.offsetWidth;
            btn.style.removeProperty('transition');
          } else {
            btn.style.width = nextWidth + 'px';
            btn.style.maxWidth = nextWidth + 'px';
          }
        },

        getState(btn) {
          return btn && btn._dynamicState ? Object.assign({}, btn._dynamicState) : null;
        },

        destroy(btn) {
          if (!btn || !btn._dynamicState) return;
          if (btn._dynamicRO) {
            btn._dynamicRO.disconnect();
            delete btn._dynamicRO;
          }
          if (btn._dynamicResizeHandler) {
            window.removeEventListener('resize', btn._dynamicResizeHandler);
            delete btn._dynamicResizeHandler;
          }
          btn.style.width = '';
          btn.style.maxWidth = '';
          delete btn._dynamicState;
        }

    async function renameRecord(store, id) {
      const scope = 'settings_' + store;
      if (window.GlobalEditState) window.GlobalEditState.setEditing(scope, id);
      // Yield to allow browser paint of row highlight before blocking prompt modal
      await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 40)));
      let rec = await fsGetOneSafe(store, id);
      if (!rec && !isNaN(Number(id))) {
        rec = await fsGetOneSafe(store, Number(id));
      }
      if (!rec) {
        if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
        alert('Unable to retrieve record details. Renaming blocked to protect reference integrity.');
        return;
      }

      // 1. Guard core entities
      if (isCoreMasterEntity(store, rec.name)) {
        const storeLabel = getMasterStoreLabel(store);
        alert(`Renaming blocked: "${rec.name}" is a protected system core ${storeLabel} required for core accounting and billing operations.`);
        if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
        return;
      }

      // 2. Guard referenced custom entities
      const refCheck = await checkMasterDataReferences(store, rec.name, rec);
      if (!refCheck.safe) {
        if (refCheck.error) {
          alert(`Unable to verify transaction references for "${rec.name}". Renaming blocked to protect accounting data integrity.\n(${refCheck.error})`);
        } else {
          const storeLabel = getMasterStoreLabel(store);
          alert(`Renaming blocked: Cannot rename ${storeLabel} "${rec.name}" because it is referenced by ${refCheck.count} transaction(s) in accounting records. Renaming referenced entities is prohibited to prevent breaking historical records and reports.`);
        }
        if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
        return;
      }

      // 3. Prompt for unreferenced entity
      const v = prompt('Rename to:', rec.name);
      if (v === null || !v.trim()) {
        if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
        return;
      }
      const trimmed = v.trim();
      if (trimmed.toLowerCase() === rec.name.trim().toLowerCase()) {
        if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
        return;
      }

      // 4. Guard renaming to a core entity name (case/whitespace variation)
      if (isCoreMasterEntity(store, trimmed)) {
        alert(`Cannot rename to "${trimmed}" because it is a protected system core entity name.`);
        if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
        return;
      }

      // 5. Guard duplicate names within the same master store
      try {
        const existingList = await fsGetAllSafe(store);
        const targetNorm = normalizeMasterEntityName(trimmed);
        const duplicate = existingList.find(x => x.id !== rec.id && normalizeMasterEntityName(x.name) === targetNorm);
        if (duplicate) {
          alert(`Cannot rename: an entry named "${duplicate.name}" already exists.`);
          if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
          return;
        }
      } catch (collisionErr) {
        console.warn('[renameRecord] Duplicate check warning:', collisionErr);
      }

      const user = getCurrentFirebaseUser();
      if (!user) {
        alert('Authentication required.');
        if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
        return;
      }
      rec.name = trimmed;
      try {
        await fsUpdateRecordSafe(store, id, { name: trimmed });
        if (window.GlobalEditState) window.GlobalEditState.clearEditing(scope);
      } catch (err) {
        alert('Unable to update in the cloud: ' + (err.message || err));
        return;
      }
      await navigate('settings');
    }

    /* ===================== STEP 33.69: PHYSICAL RECEIPT PARSER & NUMBERING ISOLATION ===================== */
    function parsePhysicalReceiptIdentifier(identifier) {
      if (identifier == null) return null;
      const str = String(identifier).trim();
      if (!str) return null;

      // Type B — Physical Punarudharanam receipts (PU1, PU2, PU3...)
      const puMatch = str.match(/^PU([0-9]+)$/i);
      if (puMatch) {
        const num = parseInt(puMatch[1], 10);
        if (isNaN(num) || num < 1 || String(num) !== puMatch[1].replace(/^0+/, '')) {
          return {
            valid: false,
            error: `Invalid physical Punarudharanam receipt number "${str}". Must be a sequential positive integer (e.g. PU1, PU2).`
          };
        }
        const formattedId = `PU${num}`;
        return {
          valid: true,
          type: 'PU',
          prefix: 'PU',
          number: num,
          formattedId: formattedId,
          fund: 'Punarudharanam Fund',
          category: 'Donation Income'
        };
      }

      // Type A — Physical puja receipts (P600 through P900)
      const pMatch = str.match(/^P([0-9]+)$/i);
      if (pMatch) {
        const num = parseInt(pMatch[1], 10);
        if (isNaN(num) || num < 600 || num > 900) {
          return {
            valid: false,
            error: `Physical puja receipt number "${str}" is out of valid range (P600 through P900).`
          };
        }
        const formattedId = `P${num}`;
        return {
          valid: true,
          type: 'P',
          prefix: 'P',
          number: num,
          formattedId: formattedId,
          fund: 'General Temple Fund',
          category: 'Pooja Income'
        };
      }

      // Check if string starts with P or PU but has malformed suffix or prefix (e.g. Pabc, PU-1, PX100, P 600, PU 1)
      if (/^P[\sA-Z0-9_\-\.]*$/i.test(str)) {
        return {
          valid: false,
          error: `Invalid physical receipt identifier format "${str}". Expected P600-P900 for Puja or PU1+ for Punarudharanam.`
        };
      }

      return null;
    }

    function onReceiptNoInput(input) {
      if (!input) return;
      const form = input.form || document.getElementById('receiptForm');
      if (!form) return;
      const val = (input.value || '').trim();
      const phys = parsePhysicalReceiptIdentifier(val);
      const hintEl = form.querySelector('.receipt-number-hint');

      if (phys && phys.valid) {
        if (hintEl) {
          if (phys.type === 'PU') {
            hintEl.innerHTML = `<span style="color:#7b1fa2;font-weight:600;">⚡ Physical Punarudharanam Receipt (${esc(phys.formattedId)}) detected.</span> Renovation Fund mapping applied.`;
          } else {
            hintEl.innerHTML = `<span style="color:#1976d2;font-weight:600;">⚡ Physical Puja Receipt (${esc(phys.formattedId)}) detected.</span> General Temple Fund / Puja mapping applied.`;
          }
        }
        const fundSel = form.querySelector('select[name="fund"]');
        const catSel = form.querySelector('select[name="category"]');
        if (phys.type === 'PU' && fundSel) {
          for (let i = 0; i < fundSel.options.length; i++) {
            if (fundSel.options[i].value === 'Punarudharanam Fund') {
              fundSel.selectedIndex = i;
              break;
            }
          }
          if (catSel) {
            for (let i = 0; i < catSel.options.length; i++) {
              if (catSel.options[i].value === 'Donation Income') {
                catSel.selectedIndex = i;
                break;
              }
            }
          }
        } else if (phys.type === 'P' && fundSel) {
          for (let i = 0; i < fundSel.options.length; i++) {
            if (fundSel.options[i].value === 'General Temple Fund') {
              fundSel.selectedIndex = i;
              break;
            }
          }
          if (catSel && (!catSel.value || catSel.value === 'Donation Income')) {
            for (let i = 0; i < catSel.options.length; i++) {
              if (catSel.options[i].value === 'Pooja Income' || catSel.options[i].value === 'Vazhipadu Income') {
                catSel.selectedIndex = i;
                break;
              }
            }
          }
        }
      } else if (phys && !phys.valid) {
        if (hintEl) {
          hintEl.innerHTML = `<span style="color:var(--red,#d32f2f);">${esc(phys.error)}</span>`;
        }
      } else {
        if (hintEl) {
          hintEl.innerHTML = `ℹ️ Enter a physical receipt identifier (P600–P900 for Puja, PU1+ for Punarudharanam), or leave blank for auto-allocated software sequence.`;
        }
      }
    }

      const receiptHeightMm = Math.min(Math.max(rawMm, 70), 500);

      if (dynamicStyle) {
        dynamicStyle.textContent = `@page { size: 80mm ${receiptHeightMm}mm; margin: 0; } @media print { html, body { width: 80mm !important; margin: 0 !important; padding: 0 !important; background: #fff !important; } }`;
      }

      if (window.addEventListener) {
        window.addEventListener('afterprint', finishPrint);
        window.addEventListener('focus', onFocusFallback, { once: true });
      }

      if (typeof window.print === 'function') {
        window.print();
      }
    }
    function amountInWords(n) {
      n = Math.round(parseFloat(n) || 0);
      if (n === 0) return 'Zero Rupees only';
      const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
      function two(x) { if (x < 20) return a[x]; return b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : ''); }
      function three(x) { if (x < 100) return two(x); return a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + two(x % 100) : ''); }
      let str = '';
      const crore = Math.floor(n / 10000000); n %= 10000000;
      const lakh = Math.floor(n / 100000); n %= 100000;
      const thousand = Math.floor(n / 1000); n %= 1000;
      const hundred = n;
      if (crore) str += three(crore) + ' Crore ';
      if (lakh) str += three(lakh) + ' Lakh ';
      if (thousand) str += three(thousand) + ' Thousand ';
      if (hundred) str += three(hundred);
      return (str.trim() || 'Zero') + ' Rupees only';
    }

    async function voidRecord(store, id) {
      if (window.isRecordVoiding) return;

      const user = getCurrentFirebaseUser();
      if (!user) { alert('Authentication required: please log in to perform this action.'); return; }

      let linkedBillInfo = null;
      let receiptRec = null;

      if (store === 'receipts') {
        receiptRec = await fsGetOneSafe('receipts', id);
        if (receiptRec) {
          if (receiptRec.voided) {
            alert(`Receipt ${receiptRec.receiptNo || id} is already voided.`);
            return;
          }
          if (receiptRec.source === 'billing' || receiptRec.billingFirestoreId || receiptRec.billingId || receiptRec.billingReceiptNo) {
            linkedBillInfo = {
              billDocId: receiptRec.billingFirestoreId || (receiptRec.billingId ? `bill_${receiptRec.billingId}` : null),
              billingReceiptNo: receiptRec.billingReceiptNo || (receiptRec.billingId ? `BILL-${String(receiptRec.billingId).padStart(4, '0')}` : 'linked bill')
            };
          }
        }
      }

      const promptMsg = linkedBillInfo
        ? `Void Receipt ${receiptRec.receiptNo || id}?\n\nThis receipt is linked to Bill ${linkedBillInfo.billingReceiptNo}.\nVoiding will atomically cancel BOTH the accounting receipt and its source bill while preserving audit history.\n\nReason for voiding:`
        : 'Reason for voiding this entry?';

      const reason = prompt(promptMsg);
      if (reason === null) return;
      const cleanReason = (reason && reason.trim()) ? reason.trim() : 'Voided by user';

      window.isRecordVoiding = true;
      try {
        if (store === 'receipts' && linkedBillInfo && linkedBillInfo.billDocId) {
          const rcptDocId = (receiptRec && receiptRec.firestoreId)
            ? receiptRec.firestoreId
            : ((typeof id === 'string' && id.startsWith('rcpt_')) ? id : `rcpt_${(receiptRec && receiptRec.id) || id}`);
          await fsVoidLinkedBillingAndReceipt(linkedBillInfo.billDocId, rcptDocId, cleanReason);
          console.log(`[Receipts Void] Atomically voided Receipt ${rcptDocId} and Bill ${linkedBillInfo.billDocId}.`);
        } else {
          const targetDocId = (receiptRec && receiptRec.firestoreId) ? receiptRec.firestoreId : id;
          await fsVoidRecordSafe(store, targetDocId, cleanReason);
        }
      } catch (err) {
        console.error('Failed to void record:', err);
        alert('Unable to void record in the cloud: ' + (err.message || err));
        return;
      } finally {

      // Variable donations / lump sum: do NOT multiply or auto-sync total
      if (totalInput && totalInput.dataset.itemMode === 'custom') {
        return parseInt(qtyInput.value, 10) || 1;
      }

      const selectedOpt = itemSel && itemSel.selectedIndex >= 0 ? itemSel.options[itemSel.selectedIndex] : null;
      const currentItem = selectedOpt ? selectedOpt.dataset.name : '';

      if (supportsSharedFamilyPuja(currentItem)) {
        // Shared family puja: retain operator's chosen quantity (e.g. 1 unit for family)

        return parseInt(qtyInput.value, 10) || 1;
      }

      const newQty = Math.max(1, devoteeCount);
      qtyInput.value = newQty;
      qtyInput.classList.remove('input-error');
      updatePrice();
      return newQty;
    }

    function updatePrice() {

        totalInput.value = '0';

      const isCustomVazhipadu = selectedOpt.dataset.customItem === 'true' || selectedOpt.dataset.name === 'കസ്റ്റം വഴിപാട്';
      const isCustom = selectedOpt.dataset.custom === 'true' || parseFloat(selectedOpt.value) === 0;
      const price = isCustom ? 0 : (parseFloat(selectedOpt.value) || 0);
      const rawQty = parseInt(qtyInput ? qtyInput.value : 1, 10);
      const qty = (!isNaN(rawQty) && rawQty > 0) ? rawQty : 1;
      const currentItemName = selectedOpt.dataset.name;
      const itemChanged = (itemSel.dataset.lastItem !== currentItemName);
      const devoteeCount = (typeof getDevoteeEntries === 'function') ? getDevoteeEntries().length : 1;

        totalInput.readOnly = true;

        totalInput.dataset.itemMode = 'custom_vazhipadu';

        const rawRate = customRateInp ? parseFloat(customRateInp.value) : 0;

        const calculatedTotal = Math.round(rate * qty * 100) / 100;
        totalInput.value = calculatedTotal;

        if (displayTotal) {
          displayTotal.textContent = '₹' + calculatedTotal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        if (helpText) {
          if (rate > 0) {
            helpText.textContent = `₹${rate} × ${qty} = ₹${calculatedTotal}`;
          } else {
            helpText.textContent = '💡 വഴിപാടിന്റെ പേരും നിരക്കും നൽകുക (Enter Vazhipadu name and rate per unit).';
          }

      } else {

        if (customItemRow) customItemRow.style.display = 'none';
        if (itemSel.dataset.lastItem === 'കസ്റ്റം വഴിപാട്') {

          totalInput.style.background = '#ffffff';

          const donationLabel = el('billingDonationLabel');
          if (cat === 'പുനരുദ്ധാരണം') {
            totalInput.placeholder = 'സംഭാവന തുക നൽകുക (Enter donation amount)';
            if (donationLabel) donationLabel.textContent = 'സംഭാവന തുക നൽകുക (Donation Amount ₹) *';
          } else {
            totalInput.placeholder = 'തുക നൽകുക (Enter custom amount)';
            if (donationLabel) donationLabel.textContent = `${currentItemName} — തുക നൽകുക (Custom Amount ₹) *`;
          }

          if (totalInput.dataset.itemMode === 'fixed' || totalInput.dataset.itemMode === 'custom_vazhipadu' || itemChanged) {
            totalInput.value = '';
          }
          totalInput.dataset.itemMode = 'custom';
          itemSel.dataset.lastItem = currentItemName;

          if (donationRow) donationRow.style.display = 'flex';
          if (qtyGroup) qtyGroup.style.opacity = '0.5';

          const currentVal = parseFloat(totalInput.value) || 0;
          if (helpText) {
            if (cat === 'പുനരുദ്ധാരണം') {
              helpText.textContent = '💡 സംഭാവന തുക ടൈപ്പ് ചെയ്യുക (Enter donation amount).';
            } else {
              helpText.textContent = `💡 ${currentItemName} — തുക ടൈപ്പ് ചെയ്യുക (Enter custom amount).`;
            }
          }
          if (displayTotal) {
            displayTotal.textContent = '₹' + currentVal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          }
        } else {
          // Fixed price mode (e.g. Archana, Raktapushpanjali, Kadumpayasam, Kootupayasam, etc.)
          totalInput.readOnly = true;
          totalInput.style.background = '#f4f2ec';
          totalInput.placeholder = '';
          const calculatedTotal = price * qty;
          totalInput.value = calculatedTotal;
          totalInput.dataset.itemMode = 'fixed';
          itemSel.dataset.lastItem = currentItemName;

          if (donationRow) donationRow.style.display = 'none';
          if (qtyGroup) qtyGroup.style.opacity = '1';
          if (helpText) {
            helpText.textContent = `₹${price} × ${qty} = ₹${calculatedTotal}`;
          }
          if (displayTotal) {
            displayTotal.textContent = '₹' + calculatedTotal.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          }
        }
      }
      syncItemChipsUI();
    }

    function renderThermalReceiptHTML(r, templeName, templeAddress) {
      const qty = (typeof r.quantity === 'number') ? r.quantity : (typeof r.qty === 'number' ? r.qty : 1);
      const unitPrice = (typeof r.unitPrice === 'number') ? r.unitPrice : 0;
      const total = (typeof r.totalAmount === 'number') ? r.totalAmount : (typeof r.total === 'number' ? r.total : 0);
      const category = r.category || r.cat || '';
      const item = r.item || '';
      const receiptNo = r.receiptNo || '';
      const date = r.date || '';
      const time = r.time || '';
      const paymentMode = r.paymentMode || 'Cash';
      const isVoided = !!r.voided;

      const deityLogoSrc = (typeof TEMPLE_DEITY_LOGO_B64 !== 'undefined' && TEMPLE_DEITY_LOGO_B64) ? TEMPLE_DEITY_LOGO_B64 : ((typeof window !== 'undefined' && window.TEMPLE_DEITY_LOGO_B64) ? window.TEMPLE_DEITY_LOGO_B64 : 'assets/temple_deity_logo_bw.png');
      const upiQrSrc = (typeof TEMPLE_UPI_QR_B64 !== 'undefined' && TEMPLE_UPI_QR_B64) ? TEMPLE_UPI_QR_B64 : ((typeof window !== 'undefined' && window.TEMPLE_UPI_QR_B64) ? window.TEMPLE_UPI_QR_B64 : 'assets/temple_upi_qr.png');

      // Full Devotee Roster with legacy fallback
      const rawDevotees = (Array.isArray(r.devotees) && r.devotees.length > 0)
        ? r.devotees
        : [{ name: r.devoteeName || r.name || '', star: r.star || '' }];
      const devotees = rawDevotees.filter(d => d && (d.name || d.star));
      const displayDevotees = devotees.length > 0 ? devotees : [{ name: r.devoteeName || r.name || '---', star: r.star || '' }];

      const unitPriceFormatted = unitPrice > 0
        ? `₹${unitPrice.toFixed(2)}`
        : (qty > 0 ? `₹${(total / qty).toFixed(2)}` : `₹${total.toFixed(2)}`);
      const totalFormatted = total.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      return `
    <div class="th-receipt ${isVoided ? 'th-voided-receipt' : ''}">
      <div class="th-logo-wrap">

        `).join('')}

        <span>Payment:</span>
        <span><b>${esc(paymentMode)}</b></span>

    function printBillingReceipt() {
      if (!currentBillingReceipt) {
        alert('ദയവായി ആദ്യം ഒരു ബിൽ ക്രിയേറ്റ് ചെയ്യുക! (Please create a bill first)');

      const templeAddress = s.address || 'ആശാരിവിളാകം, കേരളദിത്യപുരം';
      const r = currentBillingReceipt;

      const printArea = el('print-area');
      if (!printArea) return;

      // Clean up any lingering print state from an earlier print run
      if (window._billingPrintCleanup) {
        window._billingPrintCleanup();
      }

      // Populate print area with 80mm receipt markup
      printArea.className = 'billing-80mm';
      printArea.innerHTML = renderThermalReceiptHTML(r, templeName, templeAddress);

      document.body.classList.add('printing-billing-80mm');

      // Obtain or create dedicated dynamic 80mm stylesheet
      let dynamicStyle = document.getElementById('print-80mm-page-style');
      if (!dynamicStyle) {
        dynamicStyle = document.createElement('style');
        dynamicStyle.id = 'print-80mm-page-style';
        document.head.appendChild(dynamicStyle);
      }

      // Position #print-area off-screen in screen media so rendered height can be accurately measured
      // under the exact 80mm container width, box-sizing, padding, and typography rules
      dynamicStyle.textContent = '@media screen { body.printing-billing-80mm #print-area { display: block !important; position: absolute !important; left: -9999px !important; top: 0 !important; visibility: hidden !important; width: 80mm !important; max-width: 80mm !important; box-sizing: border-box !important; padding: 3mm 4mm 4mm 4mm !important; font-family: \'Consolas\', \'Courier New\', \'Noto Sans Malayalam\', \'Segoe UI\', monospace !important; font-size: 11.5px !important; line-height: 1.35 !important; background: #fff !important; color: #000 !important; } }';

      // Define idempotent cleanup handler
      let cleanedUp = false;
      let focusTimer = null;
      const finishPrint = () => {
        if (cleanedUp) return;
        cleanedUp = true;
        window._billingPrintCleanup = null;

        if (focusTimer) {
          clearTimeout(focusTimer);
          focusTimer = null;
        }
        if (window.removeEventListener) {
          window.removeEventListener('afterprint', finishPrint);
          window.removeEventListener('focus', onFocusFallback);
        }
        if (document.body && document.body.classList) {
          document.body.classList.remove('printing-billing-80mm');
        }
        const pageStyle = document.getElementById('print-80mm-page-style');
        if (pageStyle && pageStyle.parentNode) {
          pageStyle.parentNode.removeChild(pageStyle);
        }
      };

      const onFocusFallback = () => {
        // When print dialog/preview closes, the parent window regains focus.
        // Trigger cleanup with a small deferral so any active paint completes safely.
        focusTimer = setTimeout(finishPrint, 300);
      };

      window._billingPrintCleanup = finishPrint;

      // Measure rendered content after layout stabilization
      requestAnimationFrame(() => {
        if (cleanedUp) return;
        const measuredPx = Math.max(
          printArea.offsetHeight || 0,
          printArea.scrollHeight || 0,
          (printArea.getBoundingClientRect ? Math.ceil(printArea.getBoundingClientRect().height) : 0)
        );

        // Convert CSS pixels to millimeters: 1 inch = 96 px = 25.4 mm => mm = px * 25.4 / 96
        // Add 5 mm bottom allowance to prevent subpixel rounding overflow from spawning a blank second page
        const rawMm = measuredPx > 0 ? Math.ceil((measuredPx * 25.4) / 96) + 5 : 120;

        // Safety bounds: minimum 70 mm, maximum 500 mm
        const receiptHeightMm = Math.min(Math.max(rawMm, 70), 500);

        // Inject syntactically valid @page rule with explicit 80mm width and calculated content height
        dynamicStyle.textContent = `@page { size: 80mm ${receiptHeightMm}mm; margin: 0; } @media print { html, body { width: 80mm !important; margin: 0 !important; padding: 0 !important; background: #fff !important; } }`;

        if (window.addEventListener) {
          window.addEventListener('afterprint', finishPrint);
          // Non-timer fallback: cleans up when window regains focus after modal dismiss, cannot fire while modal is active
          window.addEventListener('focus', onFocusFallback, { once: true });
        }

        requestAnimationFrame(() => {
          if (typeof window.print === 'function') {
            window.print();
          }
        });
      });
    }

        if (names.includes('Pooja Income')) return 'Pooja Income';
      }
      if (cat === 'നേർച്ച' || cat === 'പുനരുദ്ധാരണം') {
        if (names.includes('Donation Income')) return 'Donation Income';
        if (names.includes('General Contribution')) return 'General Contribution';
      }
      // Last resort: first available category
      return names[0] || 'Other Income';
    }

    /**
     * Creates ONE accounting receipt from a billing record.
     * Implements duplicate prevention: checks billingRecord.accountingReceiptId first.
     * Also scans receipts store for any existing record sourced from same billing ID.
     * Returns { accountingReceiptId, accountingReceiptNo } on success, throws on failure.
     */
    async function createAccountingReceiptFromBilling(billingRecord) {
      // Duplicate prevention check 1: already linked
      if (billingRecord.accountingReceiptId && billingRecord.accountingReceiptNo) {
        console.log('[Billing→Accounting] Already linked:', billingRecord.accountingReceiptNo);
        return {
          accountingReceiptId: billingRecord.accountingReceiptId,
          accountingReceiptNo: billingRecord.accountingReceiptNo
        };
      }

      // Duplicate prevention check 2: search receipts store for existing link
      const existingReceipts = await allReceipts();
      const existing = existingReceipts.find(r =>
        r.source === 'billing' && r.billingId === billingRecord.id && !r.voided
      );
      if (existing) {
        console.log('[Billing→Accounting] Found existing accounting receipt:', existing.receiptNo);
        return {
          accountingReceiptId: existing.id,
          accountingReceiptNo: existing.receiptNo
        };
      }

      // Build the ISO date for the accounting receipt from billing record date
      const isoDate = getBillingRecordISODate(billingRecord) || todayISO();

      // Resolve fund and income category
      const fund = billingCategoryToFund(billingRecord.category);
      const incomeCat = await billingCategoryToIncomeCategory(billingRecord.category);

      // Build description from item + qty + star
      let description = String(billingRecord.item || '');
      if (billingRecord.quantity && billingRecord.quantity > 1) {
        description += ` (Qty: ${billingRecord.quantity})`;
      }
      if (billingRecord.star) {
        description += ` | Star: ${billingRecord.star}`;
      }

      // Resolve bank account for UPI payments
      let bankAccount = '';
      if (billingRecord.paymentMode === 'UPI') {
        const bankAccts = await allBankAccounts();
        const defaultBank = bankAccts.find(b => b.isDefault) || bankAccts[0];
        bankAccount = defaultBank ? defaultBank.name : '';
      }

      // Generate the next accounting receipt number
      await refreshSettings();
      const accReceiptNo = await nextReceiptNo();

      // Construct accounting receipt record (same schema as receipts store)
      const accReceipt = {
        receiptNo: accReceiptNo,
        date: isoDate,
        name: billingRecord.devoteeName || '',
        mobile: '',
        fund: fund,
        category: incomeCat,
        description: description,
        paymentMode: billingRecord.paymentMode,
        bankAccount: bankAccount,
        amount: billingRecord.totalAmount,
        remarks: `Billing Receipt: ${billingRecord.receiptNo}`,
        voided: false,
        createdAt: billingRecord.createdAt || Date.now(),
        source: 'billing',
        billingId: billingRecord.id
      };

      // Save to receipts store and bump counter
      const accId = await addRec('receipts', accReceipt);
      await bumpReceiptCounter();
      await refreshSettings();

      console.log('[Billing→Accounting] Created accounting receipt:', accReceiptNo, 'ID:', accId);
      return {
        accountingReceiptId: accId,
        accountingReceiptNo: accReceiptNo
      };
    }

    /* Validate manual bill number input in real-time (STEP 33.8A) */
    async function validateManualBillNoInput(input) {
      const feedback = el('manualBillNoFeedback');
      if (!feedback) return;
      const val = input.value.trim();
      if (!val) {
        feedback.style.display = 'none';
        feedback.textContent = '';
        return;
      }
      const parsed = parseGlobalNumber(val);
      if (!parsed) {
        feedback.style.display = 'block';
        feedback.style.background = '#fff3cd';
        feedback.style.color = '#856404';
        feedback.textContent = '⚠ Invalid format. Please enter a positive sequential number (e.g. 001, 002) or standard prefix BILL-001.';
        return;
      }
      try {
        const nextSeq = await getNextGlobalSequenceNo();
        if (parsed < nextSeq) {
          feedback.style.display = 'block';
          feedback.style.background = '#f8d7da';
          feedback.style.color = '#721c24';
          feedback.textContent = `❌ Number ${formatGlobalNumber(parsed, 'BILL-')} is already reserved/issued. Numbers cannot be reused.`;
        } else if (parsed > nextSeq) {
          feedback.style.display = 'block';
          feedback.style.background = '#f8d7da';
          feedback.style.color = '#721c24';
          feedback.textContent = `❌ Number ${formatGlobalNumber(parsed, 'BILL-')} is out of sequence. Next required number is ${formatGlobalNumber(nextSeq, 'BILL-')}.`;
        } else {
          feedback.style.display = 'block';
          feedback.style.background = '#e6f4ea';
          feedback.style.color = 'var(--green)';
          feedback.textContent = `✓ Valid next sequential number: ${formatGlobalNumber(parsed, 'BILL-')}`;
        }
      } catch (err) {
        feedback.style.display = 'block';
        feedback.style.background = '#e6f4ea';
        feedback.style.color = 'var(--green)';
        feedback.textContent = `Format parsed: ${formatGlobalNumber(parsed, 'BILL-')}`;
      }
    }

    async function billingSubmitForm() {
      if (window.isBillingSaving) {
        console.warn('[Billing] Save operation currently in progress. Ignoring duplicate click.');
        return;
      }

      const catSel = el('categorySelect');
      const itemSel = el('itemSelect');
      const fundSel = el('billingFund');
      const incCatSel = el('billingIncomeCategory');
      const nameInput = el('name');
      const starInput = el('star');
      const qtyInput = el('qty');
      const totalInput = el('total');
      const paymentModeSel = el('paymentMode');
      const feedbackArea = el('billingFeedback');
      const btn = el('btnCreateBill');
      const manualBillNoInput = el('manualBillNo');
      const customItemNameInp = el('billingCustomItemName');
      const customRateInp = el('billingCustomRate');

      // Reset visual validation errors
      if (nameInput) nameInput.classList.remove('input-error');
      if (qtyInput) qtyInput.classList.remove('input-error');
      if (totalInput) totalInput.classList.remove('input-error');
      if (customItemNameInp) customItemNameInp.classList.remove('input-error');

      const selectedFund = fundSel ? fundSel.value.trim() : '';
      const selectedIncomeCat = incCatSel ? incCatSel.value.trim() : '';
      const selectedOpt = (itemSel && itemSel.selectedIndex >= 0) ? itemSel.options[itemSel.selectedIndex] : null;
      const isCustomVazhipadu = !!(selectedOpt && (selectedOpt.dataset.customItem === 'true' || selectedOpt.dataset.name === 'കസ്റ്റം വഴിപാട്'));
      let itemName = selectedOpt ? selectedOpt.dataset.name : '';
      const qty = qtyInput ? parseInt(qtyInput.value, 10) : 1;
      let total = totalInput ? parseFloat(totalInput.value) : 0;
      const paymentMode = paymentModeSel ? paymentModeSel.value : 'Cash';
      const manualBillNo = manualBillNoInput ? manualBillNoInput.value.trim() : '';

      function showFeedback(type, message) {
        if (!feedbackArea) {
          alert(message.replace(/<[^>]*>/g, ''));
          return;
        }
        feedbackArea.className = `balance-banner ${type === 'ok' ? 'ok' : 'bad'}`;
        feedbackArea.innerHTML = message;
        feedbackArea.style.display = 'block';
        triggerMotionPop(feedbackArea);
        feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function showIntegrating() {
        if (feedbackArea) {
          feedbackArea.className = 'balance-banner';
          feedbackArea.setAttribute('data-motion', 'fadeIn');
          feedbackArea.innerHTML = '⏳ Saving bill and creating accounting receipt in cloud...';
          feedbackArea.style.display = 'block';
          activateMotionElement(feedbackArea);
        }
      }

      // 1. Validation UX
      if (!cat) {
        showFeedback('bad', '⚠️ ദയവായി ഒരു വിഭാഗം തിരഞ്ഞെടുക്കുക (Please select a category).');
        if (catSel) catSel.focus();
        return;
      }

      // Validate Fund (Mandatory for Billing)
      if (!selectedFund) {
        showFeedback('bad', '⚠️ ദയവായി ഒരു ഫണ്ട് തിരഞ്ഞെടുക്കുക (Please select a registered Fund).');
        if (fundSel) {
          fundSel.classList.add('input-error');
          fundSel.focus();
        }
        return;
      }

      let registeredFunds = [];
      try {
        registeredFunds = (typeof allFunds === 'function') ? await allFunds() : await fsGetAllSafe('funds');
      } catch (fErr) {
        console.error('[Billing] Failed to load funds master data:', fErr);
        showFeedback('bad', '⚠️ ഫണ്ട് വിവരങ്ങൾ പരിശോധിക്കാൻ കഴിഞ്ഞില്ല (Unable to verify registered funds. Please try again).');
        return;
      }
      if (!Array.isArray(registeredFunds) || registeredFunds.length === 0) {
        showFeedback('bad', '⚠️ രജിസ്റ്റർ ചെയ്ത ഫണ്ടുകൾ ലഭ്യമല്ല (No registered funds available).');
        return;
      }
      const fundExists = registeredFunds.some(f => f && (f.name || '').trim() === selectedFund);
      if (!fundExists) {
        showFeedback('bad', `⚠️ തിരഞ്ഞെടുത്ത ഫണ്ട് സാധുവല്ല (Selected fund "${selectedFund}" is invalid or no longer registered).`);
        if (fundSel) {
          fundSel.classList.add('input-error');
          fundSel.focus();
        }
        return;
      }

      // Validate Income Category (Optional; if non-empty, must exist in registered income categories)
      if (selectedIncomeCat) {
        let registeredIncomeCats = [];
        try {
          registeredIncomeCats = (typeof allIncomeCategories === 'function') ? await allIncomeCategories() : await fsGetAllSafe('incomeCategories');
        } catch (icErr) {
          console.warn('[Billing] Failed to load income categories:', icErr);
        }
        if (Array.isArray(registeredIncomeCats) && registeredIncomeCats.length > 0) {
          const catExists = registeredIncomeCats.some(c => c && (c.name || '').trim() === selectedIncomeCat);
          if (!catExists) {
            showFeedback('bad', `⚠️ തിരഞ്ഞെടുത്ത വരുമാന വിഭാഗം സാധുവല്ല (Selected income category "${selectedIncomeCat}" is invalid or no longer registered).`);
            if (incCatSel) {
              incCatSel.classList.add('input-error');
              incCatSel.focus();
            }
            return;
          }
        }
      }

      if (!selectedOpt || (!selectedOpt.dataset.name && !isCustomVazhipadu)) {
        showFeedback('bad', '⚠️ ദയവായി ഒരു വഴിപാട് / ഇനം തിരഞ്ഞെടുക്കുക (Please select an item/vazhipadu).');
        if (itemSel) itemSel.focus();
        return;
      }

      let validatedCustomRate = 0;
      if (isCustomVazhipadu) {
        const customName = customItemNameInp ? customItemNameInp.value.trim() : '';
        const rawRate = customRateInp ? parseFloat(customRateInp.value) : NaN;

        if (!customName) {
          showFeedback('bad', '⚠️ വഴിപാടിന്റെ പേര് നൽകുക (Please enter the custom Vazhipadu name).');
          if (customItemNameInp) {
            customItemNameInp.classList.add('input-error');
            customItemNameInp.focus();
          }
          return;
        }

        const lowerName = customName.toLowerCase();
        if (lowerName === 'custom' || lowerName === 'custom vazhipadu' || customName === 'കസ്റ്റം വഴിപാട്') {
          showFeedback('bad', '⚠️ ദയവായി യഥാർത്ഥ വഴിപാടിന്റെ പേര് നൽകുക (Please enter a specific puja/vazhipadu name, not generic "Custom").');
          if (customItemNameInp) {
            customItemNameInp.classList.add('input-error');
            customItemNameInp.focus();
          }
          return;
        }

        if (customName.length < 2 || customName.length > 80) {
          showFeedback('bad', '⚠️ വഴിപാടിന്റെ പേര് 2 മുതൽ 80 അക്ഷരങ്ങൾക്കുള്ളിൽ ആയിരിക്കണം (Name must be between 2 and 80 characters).');
          if (customItemNameInp) {
            customItemNameInp.classList.add('input-error');
            customItemNameInp.focus();
          }
          return;
        }

        if (isNaN(rawRate) || !isFinite(rawRate) || rawRate <= 0) {
          showFeedback('bad', '⚠️ സാധുവായ നിരക്ക് നൽകുക - 0 ൽ കൂടുതൽ (Please enter a valid rate greater than 0).');
          if (customRateInp) {
            customRateInp.classList.add('input-error');
            customRateInp.focus();
          }
          return;
        }

        if (rawRate > 100000) {
          showFeedback('bad', '⚠️ നിരക്ക് അനുവദനീയമായ പരിധിക്ക് മുകളിലാണ് - പരമാവധി ₹1,00,000 (Rate exceeds maximum limit of ₹1,00,000).');
          if (customRateInp) {
            customRateInp.classList.add('input-error');
            customRateInp.focus();
          }
          return;
        }

        validatedCustomRate = Math.round(rawRate * 100) / 100;
        itemName = customName;
      }

      const devoteeEntries = getDevoteeEntries();
      const invalidNameIdx = devoteeEntries.findIndex(d => !d.name || !d.name.trim());
      if (invalidNameIdx !== -1) {
        showFeedback('bad', `⚠️ ഭക്തന്റെ പേര് നൽകുക (Please enter the devotee name for row ${invalidNameIdx + 1}).`);
        const container = el('billingDevoteeRows');
        if (container) {
          const rows = container.querySelectorAll('.devotee-entry-row');
          if (rows[invalidNameIdx]) {
            const nameInp = rows[invalidNameIdx].querySelector('.devotee-name-input');
            if (nameInp) {
              nameInp.classList.add('input-error');
              nameInp.focus();
            }
          }
        } else if (nameInput) {
          nameInput.classList.add('input-error');
          nameInput.focus();
        }
        return;
      }

      const cleanedDevotees = devoteeEntries.map(d => ({
        name: d.name.trim(),
        star: (d.star || '').trim()
      }));
      const devoteeName = cleanedDevotees[0].name;
      const star = cleanedDevotees[0].star;
      const devoteeCount = cleanedDevotees.length;

      if (isNaN(qty) || qty < 1 || !Number.isInteger(qty) || qty > 500) {
        showFeedback('bad', '⚠️ സാധുവായ എണ്ണം നൽകുക - കുറഞ്ഞത് 1 (Please enter a valid integer quantity between 1 and 500).');
        if (qtyInput) {
          qtyInput.classList.add('input-error');
          qtyInput.focus();
        }
        return;
      }

      let unitPrice;
      if (isCustomVazhipadu) {
        unitPrice = validatedCustomRate;
        total = Math.round(validatedCustomRate * qty * 100) / 100;
        if (totalInput) totalInput.value = total;
      } else {
        total = totalInput ? parseFloat(totalInput.value) : 0;
        const rawPrice = (selectedOpt && selectedOpt.dataset.price !== undefined) ? parseFloat(selectedOpt.dataset.price) : 0;
        unitPrice = rawPrice > 0 ? rawPrice : (qty > 0 ? parseFloat((total / qty).toFixed(2)) : total);
      }

      if (isNaN(total) || total <= 0) {
        showFeedback('bad', '⚠️ ദയവായി കൃത്യമായ തുക നൽകുക (Please enter a valid amount greater than 0).');
        if (totalInput && !isCustomVazhipadu) {
          totalInput.classList.add('input-error');
          totalInput.focus();
        } else if (customRateInp) {
          customRateInp.classList.add('input-error');
          customRateInp.focus();
        }
        return;
      }

      // Validate quantity against devotee count for per-person offerings
      if (isStrictPerPersonPuja(itemName)) {
        if (qty !== devoteeCount) {
          showFeedback('bad', `⚠️ ${itemName} ഒരു വ്യക്തിഗത വഴിപാടാണ്. എണ്ണം (${qty}) ഭക്തരുടെ എണ്ണത്തിന് (${devoteeCount}) തുല്യമായിരിക്കണം. (Quantity must equal the number of devotees for per-person offerings).`);
          if (qtyInput) {
            qtyInput.value = devoteeCount;
            updatePrice();
            qtyInput.classList.add('input-error');
            qtyInput.focus();
          }
          return;
        }
      } else if (qty !== devoteeCount && totalInput && totalInput.dataset.itemMode !== 'custom') {
        // Shared family puja confirmation
        let confirmed = true;
        if (typeof window !== 'undefined' && typeof window.confirm === 'function') {
          confirmed = window.confirm(
            `Shared Puja Confirmation / കൂട്ടായ വഴിപാട് സ്ഥിരീകരണം:\n\n` +
            `You have entered ${devoteeCount} devotee(s) for ${qty} unit(s) of "${itemName}".\n` +
            `Total: ₹${total.toFixed(2)}\n\n` +
            `Quantity represents paid puja units, not necessarily the number of people.\n\n` +
            `Click OK to confirm this shared booking.`
          );
        }
        if (!confirmed) {
          return;
        }
      }

      if (!paymentMode) {
        showFeedback('bad', '⚠️ പേയ്‌മെന്റ് മോഡ് തിരഞ്ഞെടുക്കുക (Please select a payment mode).');
        if (paymentModeSel) paymentModeSel.focus();
        return;
      }

      // 1b. Validate manual bill number for duplicates and sequence if provided (STEP 33.12 Unified Numbering)
      if (manualBillNo) {
        const parsedManual = parseGlobalNumber(manualBillNo);
        if (!parsedManual) {
          showFeedback('bad', '⚠️ Invalid bill number format. Please enter a valid sequential number (e.g. 001, 002) or standard prefix BILL-001.');
          if (manualBillNoInput) manualBillNoInput.focus();
          return;
        }
        try {
          const nextSeq = await getNextGlobalSequenceNo();
          if (parsedManual < nextSeq) {
            showFeedback('bad', `⚠️ Bill number "<b>${esc(manualBillNo)}</b>" (${formatGlobalNumber(parsedManual, 'BILL-')}) has already been reserved or issued. Numbers cannot be reused.`);
            if (manualBillNoInput) manualBillNoInput.focus();
            return;
          }
          if (parsedManual > nextSeq) {
            showFeedback('bad', `⚠️ Bill number "<b>${esc(manualBillNo)}</b>" (${formatGlobalNumber(parsedManual, 'BILL-')}) is out of sequence. The next required sequence number is <b>${formatGlobalNumber(nextSeq, 'BILL-')}</b>.`);
            if (manualBillNoInput) manualBillNoInput.focus();
            return;
          }
        } catch (seqErr) {
          console.warn('[Billing] Pre-save sequence check warning:', seqErr);
        }
      }

      // 2. Authenticate current user
      const user = getCurrentFirebaseUser();
      if (!user) {
        showFeedback('bad', '⚠️ Authentication required: please sign in to record production transactions.');
        return;
      }

      // Double-submission protection & Loading State
      window.isBillingSaving = true;
      const originalBtnHtml = btn ? btn.innerHTML : '';
      if (btn && window.DynamicButton && btn._dynamicState) {
        btn.disabled = true;
        btn.classList.add('saving');
        window.DynamicButton.setState(btn, {
          text: 'Creating Bill…',
          icon: '⏳',
          stateKey: 'submitting'
        });
      } else if (btn) {
        btn.disabled = true;
        btn.classList.add('saving');
        btn.innerHTML = `<span class="billing-spinner">⏳</span> Creating Bill…`;
      }

      // STEP 33.24: Show native receipt printer overlay with Processing state
      if (window.ReceiptPrinter) {
        window.ReceiptPrinter.startProcessing({
          devoteeName,
          devotees: cleanedDevotees,
          devoteeCount,
          item: itemName,
          category: cat,
          totalAmount: total,
          paymentMode
        });
      }

      showIntegrating();

      const now = new Date();
      const dateStr = now.toLocaleDateString('en-GB'); // DD/MM/YYYY
      const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });

      // Resolve bank account for UPI payments
      let bankAccount = '';
      if (paymentMode === 'UPI') {
        const bankAccts = await allBankAccounts();
        const defaultBank = bankAccts.find(b => b.isDefault) || bankAccts[0];
        bankAccount = defaultBank ? defaultBank.name : '';
      }

      // Resolve or reuse stable operation ID for retry-safe billing
      const billingFpPayload = {
        date: dateStr,
        time: timeStr,
        category: String(cat),
        fund: String(selectedFund),
        incomeCategory: String(selectedIncomeCat),
        item: String(itemName),
        devoteeName: String(devoteeName),
        star: String(star || ''),
        devotees: cleanedDevotees,
        devoteeCount: devoteeCount,
        quantity: parseInt(qty, 10),
        unitPrice: parseFloat(unitPrice),
        totalAmount: parseFloat(total),
        paymentMode: String(paymentMode),
        bankAccount: bankAccount,
        manualBillNo: manualBillNo || null
      };
      const incomingBillingFp = computeBillingFingerprint(billingFpPayload);

      let billingOpId = null;
      try {
        const pendingRaw = localStorage.getItem('temple_pending_billing_op');
        if (pendingRaw) {
          const pending = JSON.parse(pendingRaw);
          const legacyBillingFp = typeof computeBillingFingerprintV1 === 'function'
            ? computeBillingFingerprintV1(billingFpPayload)
            : null;
          if (pending && (pending.fingerprint === incomingBillingFp || (legacyBillingFp && pending.fingerprint === legacyBillingFp)) && pending.operationId) {
            billingOpId = pending.operationId;
            console.log('[Billing] Reusing pending operation ID for retry:', billingOpId);
          }
        }
      } catch (storageErr) {
        console.warn('[Billing] Error reading pending billing op:', storageErr);
      }

      if (!billingOpId) {
        billingOpId = generateOperationId('op_bill');
        try {
          localStorage.setItem('temple_pending_billing_op', JSON.stringify({
            operationId: billingOpId,
            fingerprint: incomingBillingFp,
            createdAt: Date.now(),
            type: 'billing'
          }));
        } catch (storageErr) {
          console.warn('[Billing] Error persisting pending billing op:', storageErr);
        }
      }

      const billingInput = {
        date: dateStr,
        time: timeStr,
        category: String(cat),
        fund: String(selectedFund),
        incomeCategory: String(selectedIncomeCat),
        item: String(itemName),
        devoteeName: String(devoteeName),
        star: String(star),
        devotees: cleanedDevotees,
        devoteeCount: devoteeCount,
        quantity: parseInt(qty, 10),
        unitPrice: parseFloat(unitPrice),
        totalAmount: parseFloat(total),
        paymentMode: String(paymentMode),
        bankAccount: bankAccount,
        manualBillNo: manualBillNo || null,
        operationId: billingOpId,
        isCustomItem: !!isCustomVazhipadu
      };

      // 3. Atomically persist billing and accounting receipt to Cloud Firestore
      let result;

    /* Helper to extract YYYY-MM-DD from a billing record */
    function getBillingRecordISODate(r) {
      if (r.createdAt) {
        const d = new Date(r.createdAt);
        if (!isNaN(d.getTime())) {
          const yr = d.getFullYear();
          const mo = String(d.getMonth() + 1).padStart(2, '0');
          const da = String(d.getDate()).padStart(2, '0');
          return `${yr}-${mo}-${da}`;
        }
      }
      if (r.date) {
        const s = String(r.date).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        const parts = s.split('/');
        if (parts.length === 3) {
          return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        }
        const dashParts = s.split('-');
        if (dashParts.length === 3 && dashParts[0].length <= 2) {
          return `${dashParts[2]}-${dashParts[1].padStart(2, '0')}-${dashParts[0].padStart(2, '0')}`;
        }
      }
      return '';
    }

    /* Date Preset shortcuts for Billing History */
    function setBillingDatePreset(preset) {
      const fromInput = el('billingDateFrom');
      const toInput = el('billingDateTo');
      if (!fromInput || !toInput) return;

      const now = new Date();
      const formatISO = (d) => {
        const yr = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const da = String(d.getDate()).padStart(2, '0');
        return `${yr}-${mo}-${da}`;
      };

      const todayStr = formatISO(now);

      if (preset === 'today') {
        fromInput.value = todayStr;
        toInput.value = todayStr;
      } else if (preset === 'yesterday') {
        const yest = new Date(now);
        yest.setDate(yest.getDate() - 1);
        const yestStr = formatISO(yest);
        fromInput.value = yestStr;
        toInput.value = yestStr;
      } else if (preset === 'this_week') {
        const d = new Date(now);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(d.setDate(diff));
        fromInput.value = formatISO(monday);
        toInput.value = todayStr;
      } else if (preset === 'this_month') {
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
        fromInput.value = formatISO(firstDay);
        toInput.value = todayStr;
      }

      document.querySelectorAll('.date-preset-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.preset === preset);
      });

      applyBillingFilters();
    }

      const q = (searchInput ? searchInput.value : '').trim().toLowerCase();

            r.category || r.cat || '',
            r.star || '',

            r.voidReason || '',

        // 2. Date range filter
        if (fromDate || toDate) {
          const rDate = getBillingRecordISODate(r);
          if (fromDate && rDate && rDate < fromDate) return false;
          if (toDate && rDate && rDate > toDate) return false;
          if (!rDate && (fromDate || toDate)) return false;

    /* Export Voided Bills to CSV with UTF-8 BOM */
    function exportVoidedBillsCSV() {
      const all = (window.billingAllRecords || []).filter(r => !!r.voided);
      if (all.length === 0) {
        alert('No voided billing records to export.');
        return;
      }
      const headers = [
        'Receipt No',
        'Date',
        'Time',
        'Category',
        'Item',
        'Devotee Name',
        'Star',
        'Quantity',
        'Amount',
        'Payment Mode',
        'Linked Accounting Receipt',
        'Cancellation Reason',
        'Cancellation Date',
        'Status',
        'All Devotees'
      ];
      const rows = all.map(r => {
        const qty = (typeof r.quantity === 'number') ? r.quantity : (parseInt(r.qty, 10) || 1);
        const rawTotal = (typeof r.totalAmount === 'number') ? r.totalAmount : (parseFloat(r.totalAmount || r.total) || 0);
        const allDevoteesStr = (Array.isArray(r.devotees) && r.devotees.length > 0)
          ? r.devotees.map(d => `${d.name || ''}${d.star ? ` (${d.star})` : ''}`).join('; ')
          : (r.devoteeName || r.name || '');
        return [
          r.receiptNo || '',
          r.date || '',
          r.time || '',
          r.category || r.cat || '',
          r.item || '',
          r.devoteeName || r.name || '',
          r.star || '',
          qty,
          rawTotal,
          r.paymentMode || 'Cash',
          r.accountingReceiptNo || '',
          r.voidReason || 'Voided by user',
          r.voidDate || '',
          'VOIDED',
          allDevoteesStr
        ];
      });
      function escapeCSVCell(val) {
        if (val === null || val === undefined) return '';
        const str = String(val);
        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
          return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
      }
      const csvContent = '\uFEFF' + [headers, ...rows].map(row => row.map(escapeCSVCell).join(',')).join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Temple_Voided_Bills_${todayISO()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportBillingReportCSV() {
      const records = window.billingReportFilteredRecords || [];
      if (records.length === 0) {
        alert('No billing records match the current report filters to export.');
        return;

      const headers = [
        'Receipt No',

        'Category',

        const rawTotal = (typeof r.totalAmount === 'number') ? r.totalAmount : (parseFloat(r.totalAmount || r.total) || 0);
        const unitPrice = rawUnitPrice > 0 ? rawUnitPrice : (qty > 0 ? parseFloat((rawTotal / qty).toFixed(2)) : rawTotal);
        const allDevoteesStr = (Array.isArray(r.devotees) && r.devotees.length > 0)
          ? r.devotees.map(d => `${d.name || ''}${d.star ? ` (${d.star})` : ''}`).join('; ')
          : (r.devoteeName || r.name || '');
        return [
          r.receiptNo || '',
          r.date || '',
          r.time || '',
          r.category || r.cat || '',
          r.fund || '',
          r.incomeCategory || '',
          r.item || '',
          r.devoteeName || r.name || '',
          r.star || '',
          qty,
          unitPrice,
          rawTotal,
          r.paymentMode || 'Cash',
          r.voided ? 'Voided' : 'Active',
          r.accountingReceiptNo || '',
          r.voidReason || '',
          allDevoteesStr
        ];
      });

      function escapeCSVCell(val) {
        if (val === null || val === undefined) return '';
        const str = String(val);
        if (str.includes('"') || str.includes(',') || str.includes('\n') || str.includes('\r')) {
          return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
      }

      const csvContent = [
        headers.map(escapeCSVCell).join(','),
        ...rows.map(row => row.map(escapeCSVCell).join(','))
      ].join('\r\n');

      // UTF-8 BOM (\uFEFF) ensures Excel and spreadsheets open Malayalam properly without garbled characters
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const fromInput = el('billingReportDateFrom');
      const toInput = el('billingReportDateTo');
      const fromDate = fromInput ? fromInput.value.trim() : '';
      const toDate = toInput ? toInput.value.trim() : '';

      let filename = '';
      if (fromDate && toDate && fromDate === toDate) {
        filename = `temple-billing-${fromDate}.csv`;
      } else if (fromDate && toDate) {
        filename = `temple-billing-${fromDate}-to-${toDate}.csv`;
      } else if (fromDate) {
        filename = `temple-billing-from-${fromDate}.csv`;
      } else if (toDate) {
        filename = `temple-billing-to-${toDate}.csv`;
      } else {
        filename = `temple-billing-export-${todayISO()}.csv`;
      }

      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /* Reprint existing billing record without creating a new bill or incrementing counter */
    async function reprintBillingRecord(id) {
      const r = await getBillingRecord(id);
      if (!r) {
        alert('Billing record not found!');
        return;
      }
      currentBillingReceipt = r;
      renderBillingReceiptPreview(r);
      printBillingReceipt();
    }

    /* Audit-safe Void billing record with atomic bidirectional synchronization */
    async function voidBillingRecord(id, receiptNo) {
      if (window.isBillingVoiding) return;

      const billingRec = await getBillingRecord(id);
      if (!billingRec) {
        alert('Billing record not found.');
        return;
      }

      if (billingRec.voided) {
        alert(`Bill ${billingRec.receiptNo || id} is already voided.\nReason: ${billingRec.voidReason || 'N/A'}`);
        return;
      }

      const hasAccounting = !!(billingRec.accountingReceiptId || billingRec.accountingReceiptNo);
      const promptMsg = hasAccounting
        ? `Void Bill ${billingRec.receiptNo || id}?\n\nThis bill is linked to Accounting Receipt ${billingRec.accountingReceiptNo || billingRec.accountingReceiptId}.\nVoiding will atomically cancel BOTH records while preserving audit history.\n\nPlease enter cancellation reason:`
        : `Void Bill ${billingRec.receiptNo || id}?\n\nPlease enter cancellation reason:`;

      const reason = prompt(promptMsg);
      if (reason === null) return;
      const cleanReason = (reason && reason.trim()) ? reason.trim() : 'Voided by user from Billing';

      const user = getCurrentFirebaseUser();
      if (!user) {
        alert('Authentication required: please sign in to perform this action.');
        return;
      }

      window.isBillingVoiding = true;
      try {
        const billDocId = billingRec.firestoreId || ((typeof id === 'string' && id.startsWith('bill_')) ? id : `bill_${billingRec.id || id}`);

        if (hasAccounting) {
          const rcptDocId = (typeof billingRec.accountingReceiptId === 'string' && billingRec.accountingReceiptId.startsWith('rcpt_'))
            ? billingRec.accountingReceiptId
            : `rcpt_${billingRec.accountingReceiptId}`;
          await fsVoidLinkedBillingAndReceipt(billDocId, rcptDocId, cleanReason);
          console.log(`[Billing Void] Successfully voided Bill ${billDocId} and Receipt ${rcptDocId} atomically.`);
        } else {
          await fsVoidRecordSafe('billing', billDocId, cleanReason);
          console.log(`[Billing Void] Successfully voided unlinked Bill ${billDocId}.`);
        }

        if (currentBillingReceipt && (currentBillingReceipt.id === id || currentBillingReceipt.firestoreId === id)) {
          currentBillingReceipt.voided = true;
          currentBillingReceipt.voidReason = cleanReason;
          currentBillingReceipt.voidDate = todayISO();
          renderBillingReceiptPreview(currentBillingReceipt);
        }

        await refreshBillingHistory();
        alert(`Bill ${billingRec.receiptNo || id} has been successfully voided.`);
      } catch (err) {
        console.error('Failed to void billing record:', err);
        alert('Unable to void billing record in the cloud: ' + (err.message || err));
      } finally {
        window.isBillingVoiding = false;
      }
    }

    /* Backward-compatibility alias: redirects any delete calls to audit-safe void */
    async function deleteBillingRecord(id, receiptNo) {
      return await voidBillingRecord(id, receiptNo);
    }

    async function savePayment(print) {
      const form = el('paymentForm');
      const fd = new FormData(form);
      const amount = parseFloat(fd.get('amount'));
      const voucherNoInput = (fd.get('voucherNo') || '').trim();
      const rawEditId = fd.get('editId');
      const editId = rawEditId ? (/^\d+$/.test(rawEditId.trim()) ? parseInt(rawEditId.trim(), 10) : rawEditId.trim()) : null;
      if (!fd.get('paidTo') || !fd.get('date') || !fd.get('fund') || !fd.get('category') || !amount || amount <= 0) {
        alert('Please fill all required fields with a valid amount.'); return;
      }

      const user = getCurrentFirebaseUser();
      if (!user) {
        alert('Authentication required: please log in to record transactions.');
        return;
      }

      const rec = {
        date: fd.get('date'), fund: fd.get('fund'), category: fd.get('category'),
        description: fd.get('description') || '', paidTo: fd.get('paidTo'), paymentMode: fd.get('paymentMode'),
        bankAccount: fd.get('bankAccount') || '', amount, billNo: fd.get('billNo') || '', remarks: fd.get('remarks') || ''
      };

      let savedRec = null;
      try {
        if (editId) {
          const prior = await fsGetOneSafe('payments', editId);
          if (prior && prior.voided) {
            alert('Voided payments cannot be edited.');
            return;
          }
          rec.id = editId;
          rec.voucherNo = voucherNoInput || (prior ? prior.voucherNo : '');
          rec.voided = prior ? prior.voided : false;
          if (prior && prior.voidReason !== undefined) rec.voidReason = prior.voidReason;
          if (prior && prior.voidDate !== undefined) rec.voidDate = prior.voidDate;
          rec.createdAt = prior ? prior.createdAt : Date.now();
          rec.firestoreId = prior ? prior.firestoreId : ('pmt_' + editId);
          await fsUpdateRecordSafe('payments', rec.firestoreId || editId, rec);
          savedRec = rec;
        } else {
          // Allocate atomic voucher number from Firestore
          const allocatedNo = await fsNextVoucherNo();
          rec.voucherNo = allocatedNo;
          rec.voided = false;
          rec.createdAt = Date.now();
          const numMatch = allocatedNo.match(/\d+$/);
          if (numMatch) {
            rec.id = parseInt(numMatch[0], 10);
            rec.legacyId = rec.id;
          }
          rec.firestoreId = 'pmt_' + (rec.id || Date.now());
          await fsSaveRecordSafe('payments', rec, false);
          savedRec = rec;
        }
      } catch (err) {
        console.error('Error persisting payment to Firestore:', err);
        alert('Unable to save to the cloud. Please check your connection and try again.\n(' + (err.message || err) + ')');
        return;
      }

      if (window.GlobalEditState) window.GlobalEditState.clearEditing('payments');
      await refreshSettings();
      await navigate('payments');
      if (print && savedRec) printVoucher(savedRec);
    }
