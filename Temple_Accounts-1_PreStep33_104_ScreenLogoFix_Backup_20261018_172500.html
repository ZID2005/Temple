        idempotencyList.sort((a, b) => ((Number(a.seqNumber) || 0) - (Number(b.seqNumber) || 0)) || String(a.operationId || a._firestoreId).localeCompare(String(b.operationId || b._firestoreId)));

        console.log('[Backup] Counters read from Firestore:', countersData);
        console.log(`[Backup] System reservations: ${reservationsList.length} document(s) read.`);
        console.log(`[Backup] System idempotency records: ${idempotencyList.length} document(s) read.`);

        // --- Internal validation ---
        const missingCollections = BACKUP_COLLECTIONS.filter(c => !(c in collections));
        if (missingCollections.length > 0) {
          throw new Error(`Backup validation failed: missing collections in export: ${missingCollections.join(', ')}`);
        }

        // --- Verify document IDs are preserved ---
        let idPreservationOk = true;
        for (const colName of BACKUP_COLLECTIONS) {
          for (const doc of collections[colName]) {
            if (!doc._firestoreId) {
              console.warn(`[Backup] Document in '${colName}' missing _firestoreId — ID preservation issue.`);
              idPreservationOk = false;
            }
          }
        }
        for (const resDoc of reservationsList) {
          if (!resDoc._firestoreId) {
            console.warn('[Backup] Reservation document missing _firestoreId.');
            idPreservationOk = false;
          }
        }
        for (const opDoc of idempotencyList) {
          if (!opDoc._firestoreId) {
            console.warn('[Backup] Idempotency document missing _firestoreId.');
            idPreservationOk = false;
          }
        }
        if (!idPreservationOk) {
          console.warn('[Backup] Some documents may have missing Firestore IDs. Proceeding with partial ID data.');
        }

        const totalSystemDocs = (countersData ? 1 : 0) + reservationsList.length + idempotencyList.length + otherSystemDocs.length;
        const totalAllDocs = totalDocCount + totalSystemDocs;

        // --- Build the final backup object (Schema v23.2 with Reservations & Idempotency) ---
        const backupObj = {
          metadata: {
            source: 'firestore',
            firestoreProject: 'temple-f4f7d',
            exportedAt: exportTimestamp,
            exportedBy: user.email || user.uid,
            exportedByUid: user.uid,
            schemaVersion: '23.2',
            backupVersion: '4',
            note: 'Authoritative Firestore export with complete coverage including system reservations, idempotency records, and cryptographic integrity verification (Step 33.49).'
          },
          collections,
          counters: countersData,
          reservations: reservationsList,
          idempotency: idempotencyList,
          system: {
            counters: countersData,
            reservations: reservationsList,
            idempotency: idempotencyList,
            ...(otherSystemDocs.length > 0 ? { other: otherSystemDocs } : {})
          },
          summary: {
            totalDocuments: totalAllDocs,
            applicationDocuments: totalDocCount,
            collectionCounts: Object.fromEntries(
              BACKUP_COLLECTIONS.map(c => [c, (collections[c] || []).length])
            ),
            systemCounts: {
              counters: countersData ? 1 : 0,
              reservations: reservationsList.length,
              idempotency: idempotencyList.length,
              other: otherSystemDocs.length
            }
          }
        };

        // --- Compute Cryptographic Integrity Checksum (W-01) ---
        if (btn) btn.textContent = 'Computing integrity checksum…';
        const integrityPayload = _getBackupIntegrityPayload(backupObj);
        const canonicalPayload = _canonicalJsonStringify(integrityPayload);
        const integrityHash = await _computeSha256(canonicalPayload);
        backupObj.metadata.integrity = {
          algorithm: 'SHA-256',
          canonicalization: 'RFC8785-subset',
          hash: integrityHash,
          coveredSections: ['collections', 'counters', 'reservations', 'idempotency', 'system']
        };
        backupObj.metadata.sha256 = integrityHash;

        // --- Serialize to JSON and validate ---
        let jsonStr;
        try {
          jsonStr = JSON.stringify(backupObj, null, 2);
        } catch (serErr) {
          throw new Error(`Backup aborted: JSON serialization failed: ${serErr.message}`);
        }

        // Quick parse-back validation
        try {
          JSON.parse(jsonStr);
        } catch (parseErr) {
          throw new Error(`Backup aborted: output JSON is invalid (parse-back failed): ${parseErr.message}`);
        }

        // --- Generate deterministic filename (no colons or slashes, Windows-safe) ---
        const fileTs = exportTimestamp.replace(/:/g, '-').replace(/\..+$/, '');
        const filename = `Temple_Accounts_Backup_${fileTs}.json`;

        // --- Trigger download ---
        if (btn) btn.textContent = 'Preparing download…';
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        console.log(`[Backup] SUCCESS. File: ${filename}`);
        console.log(`[Backup] Total documents: ${totalAllDocs} (${totalDocCount} application + ${totalSystemDocs} system)`);
        console.log('[Backup] Collection counts:', backupObj.summary.collectionCounts);
        console.log('[Backup] System counts:', backupObj.summary.systemCounts);
        console.log('[Backup] Counters:', countersData);
        console.log('[Backup] Source: Firestore authoritative data. Backup does not depend on IndexedDB cache contents.');

      } catch (err) {
        console.error('[Backup] BACKUP FAILED:', err);
        alert(`Backup failed: ${err.message}\n\nNo backup file was downloaded.`);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
      }
    }
    /* ============================================================
     * STEP 23.2 — FIRESTORE-AWARE RESTORE (BUG-004 + BUG-005 FIX)
     *
     * RESTORE SEMANTICS: FULL REPLACEMENT
     *   - All documents in the backup are written to Firestore
     *     using their original _firestoreId.
     *   - Documents currently in Firestore that are NOT present
     *     in the backup are deleted (full replacement, not merge).
     *   - system/counters is overwritten with the backup values.
     *   - IndexedDB is re-synchronized via fsGetAllSafe() after
     *     a successful Firestore restore.
     *
     * SUPPORTED BACKUP FORMATS:
     *   Schema v23.1 — { metadata, collections, counters, summary }
     *   Legacy IndexedDB — { settings:[], funds:[], receipts:[], ... }
     *     (legacy format is detected and rejected with a clear message
     *      because it does not carry Firestore document IDs or counters)
     *
     * ATOMICITY NOTE:
     *   Firestore does not support single transactions spanning
     *   multiple collections or more than 500 documents. This
     *   implementation uses controlled batched writes (<=450 ops/batch)
     *   with explicit progress tracking. A pre-restore safety snapshot
     *   is always created BEFORE the first destructive Firestore write.
     *   If a batch fails mid-restore, the operation stops and the
     *   safety snapshot filename is displayed for manual recovery.
     * ============================================================ */
    async function restoreBackup() {
      // ── Helpers ──────────────────────────────────────────────────────
      const logEl = document.getElementById('restore-progress-log');
      const restoreBtn = document.getElementById('restore-btn');

      function rlog(msg, type) {
        console.log('[Restore]', msg);
        if (!logEl) return;
        const line = document.createElement('div');
        line.style.color = type === 'error' ? '#ff6b6b'
          : type === 'warn' ? '#ffd93d'
            : type === 'ok' ? '#6bcb77'
              : '#cdd6f4';
        line.textContent = msg;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function rlogSection(msg) {
        if (!logEl) return;
        const line = document.createElement('div');
        line.style.cssText = 'color:#89b4fa;font-weight:bold;margin-top:6px;border-top:1px solid #313244;padding-top:4px;';
        line.textContent = '▶ ' + msg;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function showLog() {
        if (logEl) { logEl.style.display = 'block'; logEl.innerHTML = ''; }
      }

      function disableRestoreBtn() {
        if (restoreBtn) { restoreBtn.disabled = true; restoreBtn.textContent = 'Restoring…'; }
      }

      function enableRestoreBtn() {
        if (restoreBtn) { restoreBtn.disabled = false; restoreBtn.textContent = 'RESTORE FROM FILE'; }
      }

      /** Deserialize a serialized Firestore Timestamp back to a real Timestamp. */
      function _deserializeTimestamp(val) {
        if (val && typeof val === 'object' && val.__type === 'Timestamp' &&
          typeof val.seconds === 'number' && typeof val.nanoseconds === 'number') {
          if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.Timestamp) {
            return new firebase.firestore.Timestamp(val.seconds, val.nanoseconds);
          }
          // Fallback: return a plain Date if Timestamp constructor not available
          return new Date(val.seconds * 1000 + Math.floor(val.nanoseconds / 1e6));
        }
        if (val && typeof val === 'object' && val.__type === 'Date' && val.iso) {
          return new Date(val.iso);
        }
        return val;
      }

      /** Recursively walk a document and deserialize all serialized timestamps. */
      function _deserializeDoc(doc) {
        if (doc === null || doc === undefined) return doc;
        if (Array.isArray(doc)) return doc.map(_deserializeDoc);
        if (typeof doc === 'object') {
          // If this object IS a serialized timestamp, return the timestamp
          if (doc.__type === 'Timestamp' || doc.__type === 'Date') {
            return _deserializeTimestamp(doc);
          }
          const out = {};
          for (const [k, v] of Object.entries(doc)) {
            out[k] = _deserializeDoc(v);
          }
          return out;
        }
        return doc;
      }

      /** Download a JSON object as a file (for safety snapshot). */
      function _downloadJson(obj, filename) {
        try {
          const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          console.warn('[Restore] Could not auto-download safety snapshot:', e);
        }
      }

      /** Write a batch of {docId, data} pairs to a Firestore collection (set/replace). */
      async function _batchSetCollection(db, collectionName, docPairs) {
        const BATCH_LIMIT = 450; // Firestore limit is 500; stay safe
        for (let i = 0; i < docPairs.length; i += BATCH_LIMIT) {
          const chunk = docPairs.slice(i, i + BATCH_LIMIT);
          const batch = db.batch();
          for (const { docId, data } of chunk) {
            const ref = db.collection(collectionName).doc(docId);
            batch.set(ref, data);
          }
          await batch.commit();
        }
      }

      /** Delete a list of Firestore document IDs from a collection using batched deletes. */
      async function _batchDeleteCollection(db, collectionName, docIds) {
        const BATCH_LIMIT = 450;
        for (let i = 0; i < docIds.length; i += BATCH_LIMIT) {
          const chunk = docIds.slice(i, i + BATCH_LIMIT);
          const batch = db.batch();
          for (const docId of chunk) {
            batch.delete(db.collection(collectionName).doc(docId));
          }
          await batch.commit();
        }
      }

      // ── RESTORE PROGRESS TRACKING HELPERS (SEC-03) ───────────────────
      async function _getRestoreProgress(db) {
        try {
          const snap = await db.collection('system').doc('_restoreProgress').get();
          if (snap.exists) return snap.data();
        } catch (e) {
          console.warn('[Restore] Failed to read system/_restoreProgress:', e.message);
        }
        return null;
      }

      async function _updateRestoreProgress(db, progressData) {
        if (!progressData) return;
        progressData.updatedAt = new Date().toISOString();
        try {
          await db.collection('system').doc('_restoreProgress').set(progressData, { merge: true });
        } catch (e) {
          console.error('[Restore] system/_restoreProgress write failed:', e);
          throw new Error(`Restore progress tracking failed (${e.code || e.message}). Restoration aborted for security and audit integrity.`);
        }
      }

      // ── PRODUCTION COLLECTIONS ───────────────────────────────────────
      const RESTORE_COLLECTIONS = [
        'settings', 'funds', 'incomeCategories', 'expenseCategories', 'bankAccounts',
        'billing', 'receipts', 'payments', 'transfers',
        'chittyMembers', 'chittyCollections', 'chittyPayouts', 'loans'
      ];

      // ── SENSITIVE KEY PATTERNS ──────────────────────────────────────
      const SENSITIVE_PATTERNS = [
        /password/i, /passwd/i, /secret/i, /privateKey/i, /private_key/i,
        /accessToken/i, /access_token/i, /refreshToken/i, /refresh_token/i,
        /serviceAccount/i, /service_account/i, /adminSdk/i, /admin_sdk/i,
        /apiKey/i, /api_key/i, /authToken/i, /auth_token/i,
        /credentials/i, /client_secret/i, /clientSecret/i
      ];

      // ── VALIDATE MONETARY VALUE ──────────────────────────────────────
      function isValidMonetary(v) {
        if (v === undefined || v === null || v === '') return true; // optional
        const n = parseFloat(v);
        return !isNaN(n) && isFinite(n) && n >= 0;
      }

      // ── SCAN FOR SENSITIVE FIELDS (recursive) ────────────────────────
      function hasSensitiveFields(obj, path) {
        if (obj === null || typeof obj !== 'object') return false;
        for (const [k, v] of Object.entries(obj)) {
          const fullKey = path ? `${path}.${k}` : k;
          if (SENSITIVE_PATTERNS.some(p => p.test(k))) return fullKey;
          if (typeof v === 'object' && v !== null) {
            const found = hasSensitiveFields(v, fullKey);
            if (found) return found;
          }
        }
        return false;
      }

      // ── ENTRY POINT ──────────────────────────────────────────────────
      const fileInput = el('restoreFile');
      if (!fileInput || !fileInput.files || !fileInput.files[0]) {
        alert('Choose a backup JSON file first.');
        return;
      }
      const file = fileInput.files[0];

      showLog();
      disableRestoreBtn();

      let restoreProgressRecord = null;
      let dbInstance = null;

      try {
        // ════════════════════════════════════════════════════════
        // PHASE 1 — AUTHENTICATION CHECK
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 1 — Authentication');
        const user = getCurrentFirebaseUser();
        if (!user) {
          rlog('ERROR: No authenticated user. Please log in before restoring.', 'error');
          throw new Error('Authentication required. Please log in before restoring.');
        }
        rlog(`Authenticated as: ${user.email || user.uid}`, 'ok');

        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        dbInstance = db;

        // ════════════════════════════════════════════════════════
        // PHASE 2 — PARSE & SCHEMA DETECTION
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 2 — Parse & Schema Detection');
        rlog('Reading backup file…');

        let rawText;
        try {
          rawText = await file.text();
        } catch (e) {
          throw new Error('Failed to read file: ' + e.message);
        }

        let parsed;
        try {
          parsed = JSON.parse(rawText);
        } catch (e) {
          throw new Error('Invalid JSON: ' + e.message);
        }
        rlog('JSON parse: OK');

        if (typeof parsed !== 'object' || Array.isArray(parsed) || parsed === null) {
          throw new Error('Backup root must be a JSON object.');
        }

        // Detect schema: v23.1 Firestore-aware vs. legacy IndexedDB
        const isFirestoreSchema = !!(parsed.metadata && parsed.collections && parsed.counters !== undefined);
        const isLegacySchema = !isFirestoreSchema && Array.isArray(parsed.settings || parsed.receipts || []);

        if (!isFirestoreSchema) {
          if (isLegacySchema || parsed.settings || parsed.receipts) {
            throw new Error(
              'Legacy IndexedDB backup format detected (schema version < 23.1). ' +
              'This backup does not contain Firestore document IDs or a counters section. ' +
              'Restore is only supported for Firestore-authoritative backups (schema v23.1+). ' +
              'Please create a new backup using the Download Backup button first.'
            );
          }
          throw new Error('Unknown backup format. Expected { metadata, collections, counters }.');
        }

        const meta = parsed.metadata || {};
        rlog(`Schema: v${meta.schemaVersion || '?'} | Source: ${meta.source || '?'} | Exported: ${meta.exportedAt || '?'}`);
        rlog(`Exported by: ${meta.exportedBy || 'unknown'}`);

        if (meta.source !== 'firestore') {
          throw new Error(`Backup source is '${meta.source}' — only 'firestore' source backups are supported for Firestore restore.`);
        }

        // ════════════════════════════════════════════════════════
        // PHASE 2B — CRYPTOGRAPHIC INTEGRITY VERIFICATION (W-01)
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 2B — Cryptographic Integrity Verification');
        const integrityMeta = meta.integrity || (meta.sha256 ? { hash: meta.sha256, algorithm: 'SHA-256' } : null);
        let isIntegrityVerified = false;

        if (integrityMeta && integrityMeta.hash) {
          rlog(`Integrity metadata present (${integrityMeta.algorithm || 'SHA-256'}). Verifying canonical payload…`);
          const payloadToVerify = _getBackupIntegrityPayload(parsed);
          const canonicalToVerify = _canonicalJsonStringify(payloadToVerify);
          const computedHash = await _computeSha256(canonicalToVerify);
          const expectedHash = String(integrityMeta.hash).trim().toUpperCase();

          if (computedHash !== expectedHash) {
            rlog(`INTEGRITY FAILURE: Checksum mismatch!`, 'error');
            rlog(`  Expected: ${expectedHash}`, 'error');
            rlog(`  Computed: ${computedHash}`, 'error');
            throw new Error(
              `Backup integrity check FAILED: Checksum mismatch!\n` +
              `Expected: ${expectedHash}\nComputed: ${computedHash}\n` +
              `The backup payload has been modified, corrupted, or tampered with. Restore aborted before any writes.`
            );
          }
          isIntegrityVerified = true;
          rlog(`Integrity verified: SHA-256 match (${computedHash})`, 'ok');
        } else {
          rlog('NOTICE: Legacy backup file without embedded integrity checksum. Proceeding with schema validation.', 'warn');
        }

        // Check for prior interrupted restore or concurrent restore (SEC-03)
        const currentBackupFingerprint = meta.integrity?.hash || meta.sha256 || meta.exportedAt || 'legacy';
        const existingProgress = await _getRestoreProgress(db);
        if (existingProgress && existingProgress.status === 'in_progress') {
          const lastActiveMs = Date.now() - new Date(existingProgress.updatedAt || existingProgress.startedAt || 0).getTime();
          // Concurrent active restore check: active within 15 minutes by different operator
          if (lastActiveMs < 15 * 60 * 1000 && existingProgress.sessionId && existingProgress.restoredBy && existingProgress.restoredBy !== user.uid) {
            throw new Error(
              `Concurrent restore conflict: An active restore session ("${existingProgress.sessionId}") by operator "${existingProgress.restoredBy}" ` +
              `is currently running (started: ${existingProgress.startedAt}, current phase: "${existingProgress.currentPhase}"). ` +
              `Concurrent restore operations are prohibited to prevent database corruption.`
            );
          }

          // Stale progress check: cannot resume a DIFFERENT backup
          if (existingProgress.backupFingerprint && existingProgress.backupFingerprint !== currentBackupFingerprint) {
            throw new Error(
              `Restore conflict: A prior restore operation was interrupted while restoring a DIFFERENT backup ` +
              `(prior fingerprint: "${existingProgress.backupFingerprint}", interrupted phase: "${existingProgress.currentPhase}"). ` +
              `Current backup fingerprint: "${currentBackupFingerprint}". ` +
              `Restoring a different backup on top of an interrupted restore is prohibited. ` +
              `Please recover using the safety snapshot (${existingProgress.safetySnapshotFilename || 'prior snapshot'}) ` +
              `or complete restoration of the original backup before applying a new file.`
            );
          }

          rlogSection('Interrupted Restore Recovery');
          rlog('WARNING: A prior restore operation for this backup was interrupted before completion!', 'warn');
          rlog(`  Prior Backup: ${existingProgress.backupFingerprint || 'unknown'}`);
          rlog(`  Interrupted Phase: ${existingProgress.currentPhase || 'unknown'}`);
          rlog(`  Started: ${existingProgress.startedAt || 'unknown'}`);
          if (existingProgress.safetySnapshotFilename) {
            rlog(`  Safety snapshot for recovery: ${existingProgress.safetySnapshotFilename}`, 'warn');
          }
          rlog('Recovery mechanism will safely idempotently merge records, preserving live data and reconciling counters.', 'ok');
        }

        // ════════════════════════════════════════════════════════
        // PHASE 3 — FULL BACKUP & RELATIONSHIP VALIDATION (W-02)
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 3 — Backup & Relationship Validation');
        const collections = parsed.collections;
        const countersRaw = parsed.counters;
        const validationErrors = [];

        // A. All required collections present
        for (const col of RESTORE_COLLECTIONS) {
          if (!(col in collections)) {
            validationErrors.push(`Missing collection: '${col}'`);
          } else if (!Array.isArray(collections[col])) {
            validationErrors.push(`Collection '${col}' is not an array`);
          }
        }

        // B. Validate all documents
        const seenIds = {};
        for (const col of RESTORE_COLLECTIONS) {
          if (!Array.isArray(collections[col])) continue;
          seenIds[col] = new Set();
          for (let i = 0; i < collections[col].length; i++) {
            const doc = collections[col][i];
            if (typeof doc !== 'object' || doc === null || Array.isArray(doc)) {
              validationErrors.push(`${col}[${i}]: not an object`);
              continue;
            }
            // F. Document ID required
            if (!doc._firestoreId || typeof doc._firestoreId !== 'string' || !doc._firestoreId.trim()) {
              validationErrors.push(`${col}[${i}]: missing or invalid _firestoreId`);
            } else {
              // G. Duplicate IDs
              if (seenIds[col].has(doc._firestoreId)) {
                validationErrors.push(`${col}: duplicate _firestoreId '${doc._firestoreId}'`);
              }
              seenIds[col].add(doc._firestoreId);
            }
            // H. Timestamps: validate serialized form
            for (const [k, v] of Object.entries(doc)) {
              if (v && typeof v === 'object' && v.__type === 'Timestamp') {
                if (typeof v.seconds !== 'number' || typeof v.nanoseconds !== 'number') {
                  validationErrors.push(`${col}[${i}].${k}: invalid serialized Timestamp (missing seconds/nanoseconds)`);
                }
              }
            }
            // I. Monetary values
            for (const mf of ['amount', 'totalAmount', 'unitPrice', 'loanReceived', 'repayment', 'amountReceived']) {
              if (mf in doc && !isValidMonetary(doc[mf])) {
                validationErrors.push(`${col}[${i}].${mf}: invalid monetary value '${doc[mf]}'`);
              }
            }
            // L. Security scan
            const sensitiveKey = hasSensitiveFields(doc, `${col}[${i}]`);
            if (sensitiveKey) {
              validationErrors.push(`SECURITY: sensitive field detected at '${sensitiveKey}' — backup rejected`);
            }
          }
        }

        // J. Billing/accounting structural integrity & cross-references (W-02)
        if (Array.isArray(collections.billing) && Array.isArray(collections.receipts)) {
          const receiptById = new Map();
          for (const r of collections.receipts) {
            if (r._firestoreId) receiptById.set(r._firestoreId, r);
            if (r.id !== undefined) receiptById.set(String(r.id), r);
          }
          for (const bill of collections.billing) {
            if (bill.accountingReceiptId !== undefined && bill.accountingReceiptId !== null) {
              const rcptId = bill.accountingReceiptId;
              const linkedReceipt = receiptById.get(String(rcptId)) ||
                collections.receipts.find(r => r.billingId === bill.id || r.billingId === bill._firestoreId);
              if (!linkedReceipt) {
                validationErrors.push(
                  `billing '${bill._firestoreId}': accountingReceiptId '${rcptId}' has no matching receipt in backup`);
              } else if (bill.id !== undefined && linkedReceipt.id !== undefined && Number(bill.id) !== Number(linkedReceipt.id)) {
                validationErrors.push(
                  `billing '${bill._firestoreId}' (seq ${bill.id}) and linked receipt '${linkedReceipt._firestoreId}' (seq ${linkedReceipt.id}) have conflicting sequence numbers`);
              }
            }
          }
        }

        // K. Counters validation
        if (!countersRaw || typeof countersRaw !== 'object') {
          validationErrors.push('counters section is missing or invalid');
        } else {
          const REQUIRED_COUNTER_FIELDS = ['billingReceiptCounter', 'receiptCounter', 'voucherCounter'];
          for (const f of REQUIRED_COUNTER_FIELDS) {
            const raw = countersRaw[f];
            const num = typeof raw === 'number' ? raw : parseFloat(raw);
            if (isNaN(num) || !isFinite(num) || num < 0) {
              validationErrors.push(`counters.${f}: invalid value '${raw}' (expected non-negative number)`);
            }
          }
          if (countersRaw.globalSequenceCounter !== undefined) {
            const gscNum = typeof countersRaw.globalSequenceCounter === 'number' ? countersRaw.globalSequenceCounter : parseFloat(countersRaw.globalSequenceCounter);
            if (isNaN(gscNum) || !isFinite(gscNum) || gscNum < 0) {
              validationErrors.push(`counters.globalSequenceCounter: invalid value '${countersRaw.globalSequenceCounter}' (expected non-negative number)`);
            }
          }
        }

        // L. Reservations validation & cross-references (W-02)
        const reservationsRaw = parsed.reservations || (parsed.system && parsed.system.reservations);
        if (reservationsRaw !== undefined && reservationsRaw !== null) {
          if (!Array.isArray(reservationsRaw)) {
            validationErrors.push('reservations section must be an array');
          } else {
            const seenResIds = new Set();
            const seenResSeqs = new Set();
            for (let i = 0; i < reservationsRaw.length; i++) {
              const resDoc = reservationsRaw[i];
              if (typeof resDoc !== 'object' || resDoc === null || Array.isArray(resDoc)) {
                validationErrors.push(`reservations[${i}]: not an object`);
                continue;
              }
              const resId = resDoc._firestoreId || (resDoc.seqNumber ? `res_${resDoc.seqNumber}` : null);
              if (!resId || typeof resId !== 'string' || !/^res_[0-9]+$/.test(resId)) {
                validationErrors.push(`reservations[${i}]: missing or invalid _firestoreId (expected res_N)`);
              } else {
                if (seenResIds.has(resId)) {
                  validationErrors.push(`reservations: duplicate ID '${resId}'`);
                }
                seenResIds.add(resId);
              }
              if (resDoc.seqNumber === undefined || isNaN(Number(resDoc.seqNumber)) || Number(resDoc.seqNumber) <= 0) {
                validationErrors.push(`reservations[${i}]: invalid seqNumber '${resDoc.seqNumber}'`);
              } else {
                const seq = Number(resDoc.seqNumber);
                if (resDoc._firestoreId && resDoc._firestoreId !== `res_${seq}`) {
                  validationErrors.push(`reservations[${i}]: ID '${resDoc._firestoreId}' does not match seqNumber '${seq}'`);
                }
                if (seenResSeqs.has(seq)) {
                  validationErrors.push(`reservations: duplicate sequence allocation for seqNumber '${seq}'`);
                }
                seenResSeqs.add(seq);
              }
              if (resDoc.voided !== undefined && typeof resDoc.voided !== 'boolean') {
                validationErrors.push(`reservations[${i}]: invalid voided flag (expected boolean)`);
              }

              // Cross-reference validation: billDocId and receiptDocId (W-02)
              if (resDoc.billDocId) {
                const billExists = Array.isArray(collections.billing) && collections.billing.some(b => b._firestoreId === resDoc.billDocId || String(b.id) === String(resDoc.billDocId));
                if (!billExists) {
                  validationErrors.push(`reservations[${i}] (${resId}): linked billDocId "${resDoc.billDocId}" not found in billing collection`);
                }
              }
              if (resDoc.receiptDocId) {
                const rcptExists = Array.isArray(collections.receipts) && collections.receipts.some(r => r._firestoreId === resDoc.receiptDocId || String(r.id) === String(resDoc.receiptDocId));
                if (!rcptExists) {
                  validationErrors.push(`reservations[${i}] (${resId}): linked receiptDocId "${resDoc.receiptDocId}" not found in receipts collection`);
                }
              }
              if (resDoc.operationId && Array.isArray(parsed.idempotency || (parsed.system && parsed.system.idempotency))) {
                const idempList = parsed.idempotency || (parsed.system && parsed.system.idempotency);
                const opExists = idempList.some(o => o._firestoreId === resDoc.operationId || o.operationId === resDoc.operationId);
                if (!opExists) {
                  validationErrors.push(`reservations[${i}] (${resId}): linked operationId "${resDoc.operationId}" not found in idempotency records`);
                }
              }

              const sensitiveResKey = hasSensitiveFields(resDoc, `reservations[${i}]`);
              if (sensitiveResKey) {
                validationErrors.push(`SECURITY: sensitive field detected at '${sensitiveResKey}' — backup rejected`);
              }
            }
          }
        }

        // M. Idempotency records validation & cross-references (W-02)
        const idempotencyRaw = parsed.idempotency || (parsed.system && parsed.system.idempotency);
        if (idempotencyRaw !== undefined && idempotencyRaw !== null) {
          if (!Array.isArray(idempotencyRaw)) {
            validationErrors.push('idempotency section must be an array');
          } else {
            const seenOpIds = new Set();
            for (let i = 0; i < idempotencyRaw.length; i++) {
              const opDoc = idempotencyRaw[i];
              if (typeof opDoc !== 'object' || opDoc === null || Array.isArray(opDoc)) {
                validationErrors.push(`idempotency[${i}]: not an object`);
                continue;
              }
              const opId = opDoc._firestoreId || opDoc.operationId;
              if (!opId || typeof opId !== 'string' || !/^op_[A-Za-z0-9_-]+$/.test(opId)) {
                validationErrors.push(`idempotency[${i}]: missing or invalid operationId / _firestoreId (expected op_*)`);
              } else {
                if (seenOpIds.has(opId)) {
                  validationErrors.push(`idempotency: duplicate ID '${opId}'`);
                }
                seenOpIds.add(opId);
              }
              if (!opDoc.fingerprint || typeof opDoc.fingerprint !== 'string' || !opDoc.fingerprint.trim()) {
                validationErrors.push(`idempotency[${i}]: missing or invalid fingerprint`);
              }

              // Cross-reference validation: resDocId, billDocId, receiptDocId (W-02)
              if (opDoc.resDocId && Array.isArray(reservationsRaw)) {
                const resExists = reservationsRaw.find(r => r._firestoreId === opDoc.resDocId || (r.seqNumber && `res_${r.seqNumber}` === opDoc.resDocId));
                if (!resExists) {
                  validationErrors.push(`idempotency[${i}] (${opId}): linked resDocId "${opDoc.resDocId}" not found in reservations`);
                } else if (opDoc.seqNumber !== undefined && resExists.seqNumber !== undefined && Number(opDoc.seqNumber) !== Number(resExists.seqNumber)) {
                  validationErrors.push(`idempotency[${i}] (${opId}): seqNumber (${opDoc.seqNumber}) conflicts with linked reservation (${resExists.seqNumber})`);
                }
              }
              if (opDoc.billDocId && Array.isArray(collections.billing)) {
                const billMatch = collections.billing.find(b => b._firestoreId === opDoc.billDocId || String(b.id) === String(opDoc.billDocId));
                if (!billMatch) {
                  validationErrors.push(`idempotency[${i}] (${opId}): linked billDocId "${opDoc.billDocId}" not found in billing collection`);
                } else if (opDoc.seqNumber !== undefined && billMatch.id !== undefined && Number(opDoc.seqNumber) !== Number(billMatch.id)) {
                  validationErrors.push(`idempotency[${i}] (${opId}): seqNumber (${opDoc.seqNumber}) conflicts with linked bill id (${billMatch.id})`);
                }
              }
              if (opDoc.receiptDocId && Array.isArray(collections.receipts)) {
                const rcptMatch = collections.receipts.find(r => r._firestoreId === opDoc.receiptDocId || String(r.id) === String(opDoc.receiptDocId));
                if (!rcptMatch) {
                  validationErrors.push(`idempotency[${i}] (${opId}): linked receiptDocId "${opDoc.receiptDocId}" not found in receipts collection`);
                } else if (opDoc.seqNumber !== undefined && rcptMatch.id !== undefined && Number(opDoc.seqNumber) !== Number(rcptMatch.id)) {
                  validationErrors.push(`idempotency[${i}] (${opId}): seqNumber (${opDoc.seqNumber}) conflicts with linked receipt id (${rcptMatch.id})`);
                }
              }

              const sensitiveOpKey = hasSensitiveFields(opDoc, `idempotency[${i}]`);
              if (sensitiveOpKey) {
                validationErrors.push(`SECURITY: sensitive field detected at '${sensitiveOpKey}' — backup rejected`);
              }
            }
          }
        }

        // N. Counter consistency check against reservations (W-02)
        if (countersRaw && typeof countersRaw === 'object' && Array.isArray(reservationsRaw) && reservationsRaw.length > 0) {
          let maxResSeqInBackup = 0;
          for (const r of reservationsRaw) {
            const s = Number(r.seqNumber) || 0;
            if (s > maxResSeqInBackup) maxResSeqInBackup = s;
          }
          const backupGsc = Number(countersRaw.globalSequenceCounter);
          if (!isNaN(backupGsc) && backupGsc < maxResSeqInBackup) {
            validationErrors.push(
              `counters.globalSequenceCounter (${backupGsc}) is less than highest reservation sequence number (${maxResSeqInBackup}) in backup`
            );
          }
        }

        if (validationErrors.length > 0) {
          rlog(`VALIDATION FAILED — ${validationErrors.length} error(s):`, 'error');
          for (const e of validationErrors) rlog('  ✗ ' + e, 'error');
          throw new Error(`Backup validation failed with ${validationErrors.length} error(s). No data was written to Firestore. See log above.`);
        }
        rlog(`Validation: PASSED — all relationships and ${RESTORE_COLLECTIONS.length} collections valid`, 'ok');

        // ════════════════════════════════════════════════════════
        // PHASE 4 — RESTORE PREVIEW & USER CONFIRMATION
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 4 — Restore Preview');

        const counts = {};
        for (const col of RESTORE_COLLECTIONS) counts[col] = (collections[col] || []).length;

        const backupReservations = Array.isArray(reservationsRaw) ? reservationsRaw : null;
        const backupIdempotency = Array.isArray(idempotencyRaw) ? idempotencyRaw : null;

        const previewLines = [
          `Backup source:    ${meta.source}`,
          `Backup timestamp: ${meta.exportedAt}`,
          `Schema version:   ${meta.schemaVersion || 'unknown'}`,
          `Exported by:      ${meta.exportedBy || 'unknown'}`,
          `Integrity:        ${isIntegrityVerified ? 'VERIFIED (SHA-256 match)' : 'LEGACY (Unsigned)'}`,
          ``,
          `Collection counts in backup:`,
          `  settings:          ${counts.settings}`,
          `  funds:             ${counts.funds}`,
          `  incomeCategories:  ${counts.incomeCategories}`,
          `  expenseCategories: ${counts.expenseCategories}`,
          `  bankAccounts:      ${counts.bankAccounts}`,
          `  billing:           ${counts.billing}`,
          `  receipts:          ${counts.receipts}`,
          `  payments:          ${counts.payments}`,
          `  transfers:         ${counts.transfers}`,
          `  chittyMembers:     ${counts.chittyMembers}`,
          `  chittyCollections: ${counts.chittyCollections}`,
          `  chittyPayouts:     ${counts.chittyPayouts}`,
          `  loans:             ${counts.loans}`,
          ``,
          `Counters in backup:`,
          `  billingReceiptCounter: ${countersRaw.billingReceiptCounter}`,
          `  receiptCounter:        ${countersRaw.receiptCounter}`,
          `  voucherCounter:        ${countersRaw.voucherCounter}`,
          `  globalSequenceCounter: ${countersRaw.globalSequenceCounter !== undefined ? countersRaw.globalSequenceCounter : 'N/A'}`,
          ``,
          `System records in backup:`,
          `  reservations (res_*):  ${backupReservations ? backupReservations.length : '0 (legacy format)'}`,
          `  idempotency (op_*):    ${backupIdempotency ? backupIdempotency.length : '0 (legacy format)'}`,
          ``,
          `Restore Mode: SAFE MERGE (Non-destructive).`,
          `Documents in Firestore absent from the backup will be PRESERVED.`,
          `Financial records (billing, receipts, payments) will NEVER be deleted.`,
          `Counters will be safely merged to prevent sequence regression.`,
          `A verified safety snapshot of current Firestore state will be`,
          `downloaded to your computer before any changes are made.`
        ].join('\n');

        const confirmed = window.confirm(
          `RESTORE PREVIEW\n\n${previewLines}\n\nProceed with restore?`
        );
        if (!confirmed) {
          rlog('Restore cancelled by user.', 'warn');
          enableRestoreBtn();
          return;
        }
        rlog('User confirmed restore.');

        // ════════════════════════════════════════════════════════
        // PHASE 5 — PRE-RESTORE SAFETY SNAPSHOT (Firestore)
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 5 — Pre-Restore Safety Snapshot');
        rlog('Reading current Firestore state for safety snapshot…');

        const snapshotTs = new Date().toISOString();
        const snapshotCollections = {};
        let snapshotCounters = null;
        const snapshotReservations = [];
        const snapshotIdempotency = [];
        let snapshotTotalDocs = 0;
        let snapshotSystemDocs = 0;

        for (const col of RESTORE_COLLECTIONS) {
          try {
            const snap = await db.collection(col).get();
            const docs = [];
            snap.forEach(docSnap => docs.push({ _firestoreId: docSnap.id, ...docSnap.data() }));
            snapshotCollections[col] = docs;
            snapshotTotalDocs += docs.length;
          } catch (snapErr) {
            rlog(`WARN: Could not snapshot '${col}': ${snapErr.message}`, 'warn');
            snapshotCollections[col] = [];
          }
        }
        try {
          const sSnap = await db.collection(FS_COUNTERS_COLLECTION).get();
          sSnap.forEach(dSnap => {
            const dId = dSnap.id;
            const dData = { _firestoreId: dId, ...dSnap.data() };
            if (dId === FS_COUNTERS_DOC_ID) {
              snapshotCounters = dData;
            } else if (dId.startsWith('res_')) {
              snapshotReservations.push(dData);
            } else if (dId.startsWith('op_')) {
              snapshotIdempotency.push(dData);
            }
            snapshotSystemDocs++;
          });
        } catch (sysErr) {
          rlog(`WARN: Could not snapshot system collection: ${sysErr.message}`, 'warn');
          try {
            const cSnap = await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).get();
            snapshotCounters = cSnap.exists ? { _firestoreId: FS_COUNTERS_DOC_ID, ...cSnap.data() } : null;
            if (snapshotCounters) snapshotSystemDocs++;
          } catch (cErr) {
            rlog(`WARN: Could not snapshot counters: ${cErr.message}`, 'warn');
          }
        }

        const safetySnapshotObj = {
          metadata: {
            source: 'firestore',
            type: 'PreRestoreSafetySnapshot',
            snapshotAt: snapshotTs,
            snapshotBy: user.email || user.uid,
            snapshotByUid: user.uid,
            schemaVersion: '23.2',
            backupVersion: '4',
            note: 'Automatically created and cryptographically verified by restoreBackup() immediately before restore writes (Step 33.49).'
          },
          collections: snapshotCollections,
          counters: snapshotCounters,
          reservations: snapshotReservations,
          idempotency: snapshotIdempotency,
          system: {
            counters: snapshotCounters,
            reservations: snapshotReservations,
            idempotency: snapshotIdempotency
          },
          summary: {
            totalDocuments: snapshotTotalDocs + snapshotSystemDocs,
            applicationDocuments: snapshotTotalDocs,
            collectionCounts: Object.fromEntries(
              RESTORE_COLLECTIONS.map(c => [c, (snapshotCollections[c] || []).length])
            ),
            systemCounts: {
              counters: snapshotCounters ? 1 : 0,
              reservations: snapshotReservations.length,
              idempotency: snapshotIdempotency.length
            }
          }
        };

        // Verify Safety Snapshot Integrity (W-01 / W-03)
        const snapshotPayload = _getBackupIntegrityPayload(safetySnapshotObj);
        const snapshotCanonical = _canonicalJsonStringify(snapshotPayload);
        const snapshotSha256 = await _computeSha256(snapshotCanonical);
        safetySnapshotObj.metadata.integrity = {
          algorithm: 'SHA-256',
          canonicalization: 'RFC8785-subset',
          hash: snapshotSha256,
          coveredSections: ['collections', 'counters', 'reservations', 'idempotency', 'system']
        };
        safetySnapshotObj.metadata.sha256 = snapshotSha256;

        // Verify snapshot JSON validity before download
        try {
          JSON.parse(JSON.stringify(safetySnapshotObj));
        } catch (snapJsonErr) {
          throw new Error(`Safety snapshot serialization failed: ${snapJsonErr.message}. Restore aborted before any writes.`);
        }

        const safetyFileTs = snapshotTs.replace(/:/g, '-').replace(/\.\S+$/, '');
        const safetyFilename = `Temple_Accounts_PreRestore_SafetyBackup_${safetyFileTs}.json`;
        _downloadJson(safetySnapshotObj, safetyFilename);
        rlog(`Safety snapshot created and verified: ${safetyFilename} (SHA-256: ${snapshotSha256})`, 'ok');
        rlog(`  Documents in current Firestore: ${snapshotTotalDocs + snapshotSystemDocs} (${snapshotTotalDocs} app + ${snapshotSystemDocs} system)`);

        let _safetyFilename = safetyFilename;

        // Track restore progress (W-03)
        const restoreSessionId = 'rst_' + Date.now();
        restoreProgressRecord = {
          sessionId: restoreSessionId,
          status: 'in_progress',
          backupFingerprint: meta.integrity?.hash || meta.sha256 || meta.exportedAt || 'legacy',
          backupTimestamp: meta.exportedAt || null,
          startedAt: new Date().toISOString(),
          currentPhase: 'Phase 6 — Application Collections',
          completedPhases: ['Phase 1 — Authentication', 'Phase 2 — Parse & Schema', 'Phase 3 — Validation', 'Phase 4 — Preview', 'Phase 5 — Safety Snapshot'],
          restoredBy: user.uid,
          safetySnapshotFilename: _safetyFilename
        };
        await _updateRestoreProgress(db, restoreProgressRecord);

        // ════════════════════════════════════════════════════════
        // PHASE 6 — FIRESTORE RESTORE (COLLECTION BY COLLECTION)
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 6 — Firestore Restore (Application Collections)');
        rlog('Starting Firestore restore. DO NOT close this tab.');
        let failedStage = null;

        for (const col of RESTORE_COLLECTIONS) {
          rlog(`Restoring ${col} (Safe Merge)…`);
          try {
            // 1. Build document pairs from backup (deserialize timestamps)
            const backupDocs = collections[col] || [];
            const docPairs = backupDocs.map(rawDoc => {
              const docId = rawDoc._firestoreId;
              // Remove internal backup metadata fields before writing to Firestore
              const { _firestoreId, _firestoreCollection, ...rest } = rawDoc;
              // Deserialize serialized timestamps recursively
              const data = _deserializeDoc(rest);
              // Stamp with restore audit metadata (does not alter document content)
              data._restoredAt = new Date().toISOString();
              data._restoredBy = user.uid;
              return { docId, data };
            });

            // 2. Read live Firestore state to perform safe non-destructive merge
            const currentSnap = await db.collection(col).get();
            const currentDocMap = new Map();
            currentSnap.forEach(d => currentDocMap.set(d.id, d.data()));

            let importedCount = 0;
            let updatedCount = 0;
            let skippedCount = 0;
            let conflictCount = 0;

            const docsToWrite = [];

            for (const { docId, data } of docPairs) {
              if (!currentDocMap.has(docId)) {
                // New record: import safely
                docsToWrite.push({ docId, data });
                importedCount++;
              } else {
                // Existing record: evaluate safe merge rules
                const currentDoc = currentDocMap.get(docId) || {};
                const isProtectedFinancial = (col === 'billing' || col === 'receipts' || col === 'payments' || col === 'settings');

                if (isProtectedFinancial) {
                  // Safety Rule 10: Preserve existing void metadata and audit trail
                  if (currentDoc.voided && !data.voided) {
                    data.voided = true;
                    if (currentDoc.voidReason) data.voidReason = currentDoc.voidReason;
                    if (currentDoc.voidDate) data.voidDate = currentDoc.voidDate;
                    if (currentDoc.voidedAt) data.voidedAt = currentDoc.voidedAt;
                    conflictCount++;
                  }

                  // Safety Rule 6: Do not silently overwrite newer financial records with older backup data
                  const currentTs = (currentDoc.updatedAt && currentDoc.updatedAt.toMillis ? currentDoc.updatedAt.toMillis() : (currentDoc.updatedAt || currentDoc.createdAt || 0));
                  const backupTs = (data.updatedAt && data.updatedAt.toMillis ? data.updatedAt.toMillis() : (data.updatedAt || data.createdAt || 0));
                  if (currentTs > backupTs && backupTs > 0) {
                    // Live record is newer: preserve live financial history
                    skippedCount++;
                    continue;
                  }
                }

                docsToWrite.push({ docId, data });
                updatedCount++;
              }
            }

            // 3. ZERO DELETIONS: In accordance with Phase D, ordinary restore never deletes
            // unbacked-up billing, receipts, payments, settings, or operational records.

            // 4. Batch-write resolved document records to Firestore
            if (docsToWrite.length > 0) {
              await _batchSetCollection(db, col, docsToWrite);
            }

            rlog(`  ${col}: ${importedCount} imported, ${updatedCount} updated, ${skippedCount} skipped (newer), ${conflictCount} conflicts preserved (0 deleted - safe merge)`, 'ok');
          } catch (colErr) {
            failedStage = `Restoring collection '${col}'`;
            rlog(`ERROR restoring '${col}': ${colErr.message}`, 'error');
            throw new Error(
              `Restore failed at stage: ${failedStage}.\n` +
              `Error: ${colErr.message}\n\n` +
              `The restore was STOPPED. Some collections may have been partially updated.\n` +
              `Safety snapshot for recovery: ${_safetyFilename}`
            );
          }
        }

        // ════════════════════════════════════════════════════════
        // PHASE 6B — RESTORE system/res_* (Safe Merge)
        // ════════════════════════════════════════════════════════
        if (backupReservations && backupReservations.length > 0) {
          rlogSection('Phase 6B — Restoring Reservations (system/res_*)');
          rlog(`Restoring ${backupReservations.length} reservation(s) (Safe Merge)…`);
          if (restoreProgressRecord) {
            restoreProgressRecord.currentPhase = 'Phase 6B — Reservations';
            restoreProgressRecord.completedPhases.push('Phase 6 — Collections');
            await _updateRestoreProgress(db, restoreProgressRecord);
          }
          try {
            const currentSystemSnap = await db.collection(FS_COUNTERS_COLLECTION).get();
            const liveResMap = new Map();
            currentSystemSnap.forEach(d => {
              if (d.id.startsWith('res_')) liveResMap.set(d.id, d.data());
            });

            let resImported = 0;
            let resUpdated = 0;
            let resSkipped = 0;
            let resConflicts = 0;
            const resToWrite = [];

            for (const rawRes of backupReservations) {
              const docId = rawRes._firestoreId || (rawRes.seqNumber ? `res_${rawRes.seqNumber}` : null);
              if (!docId) continue;

              const { _firestoreId, _firestoreCollection, ...rest } = rawRes;
              const data = _deserializeDoc(rest);
              data._restoredAt = new Date().toISOString();
              data._restoredBy = user.uid;

              if (!liveResMap.has(docId)) {
                // New reservation: import safely
                resToWrite.push({ docId, data });
                resImported++;
              } else {
                // Existing reservation: apply safe merge rules
                const liveDoc = liveResMap.get(docId) || {};

                // Unresolvable conflict detection: live reservation has conflicting active operationId (W-03)
                if (liveDoc.operationId && data.operationId && liveDoc.operationId !== data.operationId && !liveDoc.voided && !data.voided) {
                  throw new Error(
                    `Unresolvable reservation conflict on ${docId}: live reservation operationId ("${liveDoc.operationId}") ` +
                    `conflicts with backup operationId ("${data.operationId}"). Manual resolution required.`
                  );
                }

                // Safety Rule 10: Preserve existing void metadata & status
                if ((liveDoc.voided || liveDoc.status === 'voided') && (!data.voided || data.status !== 'voided')) {
                  data.voided = true;
                  data.status = 'voided';
                  if (liveDoc.voidReason) data.voidReason = liveDoc.voidReason;
                  if (liveDoc.voidDate) data.voidDate = liveDoc.voidDate;
                  if (liveDoc.voidedAt) data.voidedAt = liveDoc.voidedAt;
                  resConflicts++;
                }

                // Safety Rule 6: Preserve newer live reservation history
                const liveTs = (liveDoc.updatedAt && liveDoc.updatedAt.toMillis ? liveDoc.updatedAt.toMillis() : (liveDoc.updatedAt || liveDoc.createdAt || 0));
                const backupTs = (data.updatedAt && data.updatedAt.toMillis ? data.updatedAt.toMillis() : (data.updatedAt || data.createdAt || 0));
                if (liveTs > backupTs && backupTs > 0) {
                  resSkipped++;
                  continue;
                }

                // If identical active state, skip redundant write
                if (!liveDoc.voided && !data.voided && liveDoc.status === data.status && liveDoc.seqNumber === data.seqNumber) {
                  resSkipped++;
                  continue;
                }

                resToWrite.push({ docId, data });
                resUpdated++;
              }
            }

            if (resToWrite.length > 0) {
              await _batchSetCollection(db, FS_COUNTERS_COLLECTION, resToWrite);
            }

            rlog(`  reservations: ${resImported} imported, ${resUpdated} updated, ${resSkipped} skipped (newer/identical), ${resConflicts} void conflicts preserved (0 deleted - safe merge)`, 'ok');
          } catch (resErr) {
            failedStage = 'Restoring system reservations';
            rlog(`ERROR restoring reservations: ${resErr.message}`, 'error');
            throw new Error(
              `Restore failed at stage: ${failedStage}.\n` +
              `Error: ${resErr.message}\n\n` +
              `Safety snapshot for recovery: ${_safetyFilename}`
            );
          }
        } else {
          rlog('Phase 6B — Reservations: none in backup (legacy schema or empty). Existing reservations preserved.', 'ok');
        }

        // ════════════════════════════════════════════════════════
        // PHASE 6C — RESTORE system/op_* (Immutable Safe Import)
        // ════════════════════════════════════════════════════════
        if (backupIdempotency && backupIdempotency.length > 0) {
          rlogSection('Phase 6C — Restoring Idempotency Records (system/op_*)');
          rlog(`Restoring ${backupIdempotency.length} idempotency record(s) (Immutable Import)…`);
          if (restoreProgressRecord) {
            restoreProgressRecord.currentPhase = 'Phase 6C — Idempotency';
            restoreProgressRecord.completedPhases.push('Phase 6B — Reservations');
            await _updateRestoreProgress(db, restoreProgressRecord);
          }
          try {
            const currentSystemSnap = await db.collection(FS_COUNTERS_COLLECTION).get();
            const liveOpMap = new Map();
            currentSystemSnap.forEach(d => {
              if (d.id.startsWith('op_')) liveOpMap.set(d.id, d.data());
            });

            let opImported = 0;
            let opSkipped = 0;
            const opToWrite = [];

            for (const rawOp of backupIdempotency) {
              const docId = rawOp._firestoreId || (rawOp.operationId ? (rawOp.operationId.startsWith('op_') ? rawOp.operationId : `op_${rawOp.operationId}`) : null);
              if (!docId) continue;

              // Idempotency records are strictly immutable and write-once
              if (liveOpMap.has(docId)) {
                opSkipped++;
                continue;
              }

              const { _firestoreId, _firestoreCollection, ...rest } = rawOp;
              const data = _deserializeDoc(rest);
              data._restoredAt = new Date().toISOString();
              data._restoredBy = user.uid;

              opToWrite.push({ docId, data });
              opImported++;
            }

            if (opToWrite.length > 0) {
              await _batchSetCollection(db, FS_COUNTERS_COLLECTION, opToWrite);
            }

            rlog(`  idempotency: ${opImported} imported, ${opSkipped} skipped (already committed / immutable) (0 deleted - safe merge)`, 'ok');
          } catch (opErr) {
            failedStage = 'Restoring idempotency records';
            rlog(`ERROR restoring idempotency records: ${opErr.message}`, 'error');
            throw new Error(
              `Restore failed at stage: ${failedStage}.\n` +
              `Error: ${opErr.message}\n\n` +
              `Safety snapshot for recovery: ${_safetyFilename}`
            );
          }
        } else {
          rlog('Phase 6C — Idempotency: none in backup (legacy schema or empty). Existing idempotency records preserved.', 'ok');
        }

        // ════════════════════════════════════════════════════════
        // PHASE 7 — RESTORE system/counters (Monotonic Safe Merge)
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 7 — Restoring system/counters');
        rlog('Restoring system/counters document (preserving monotonic sequence)…');
        if (restoreProgressRecord) {
          restoreProgressRecord.currentPhase = 'Phase 7 — Counters';
          restoreProgressRecord.completedPhases.push('Phase 6C — Idempotency');
          await _updateRestoreProgress(db, restoreProgressRecord);
        }
        try {
          // Build the counter payload from backup — exclude backup-internal fields
          const { _firestoreId: _cId, _firestoreCollection: _cCol, ...restCounters } = countersRaw;
          const counterPayload = _deserializeDoc(restCounters);
          // Stamp restore audit fields
          counterPayload._restoredAt = new Date().toISOString();
          counterPayload._restoredBy = user.uid;

          // Read live counters to prevent sequence rollback/collisions
          const liveCSnap = await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).get();
          const liveCData = liveCSnap.exists ? liveCSnap.data() : {};

          // Compute max sequence number across live and backup reservations
          let maxResSeq = 0;
          if (backupReservations) {
            for (const r of backupReservations) {
              const s = Number(r.seqNumber) || 0;
              if (s > maxResSeq) maxResSeq = s;
            }
          }
          try {
            const sysSnap = await db.collection(FS_COUNTERS_COLLECTION).get();
            sysSnap.forEach(d => {
              if (d.id.startsWith('res_')) {
                const data = d.data() || {};
                const s = Number(data.seqNumber) || 0;
                if (s > maxResSeq) maxResSeq = s;
              }
            });
          } catch (e) { }

          const safeBrc = Math.max(
            typeof liveCData.billingReceiptCounter === 'number' ? liveCData.billingReceiptCounter : 0,
            typeof counterPayload.billingReceiptCounter === 'number' ? counterPayload.billingReceiptCounter : 0
          );
          const safeRc = Math.max(
            typeof liveCData.receiptCounter === 'number' ? liveCData.receiptCounter : 0,
            typeof counterPayload.receiptCounter === 'number' ? counterPayload.receiptCounter : 0
          );
          const safeVc = Math.max(
            typeof liveCData.voucherCounter === 'number' ? liveCData.voucherCounter : 0,
            typeof counterPayload.voucherCounter === 'number' ? counterPayload.voucherCounter : 0
          );

          const safeGsc = Math.max(
            typeof liveCData.globalSequenceCounter === 'number' ? liveCData.globalSequenceCounter : 0,
            typeof counterPayload.globalSequenceCounter === 'number' ? counterPayload.globalSequenceCounter : 0,
            maxResSeq
          );
          counterPayload.billingReceiptCounter = safeBrc;
          counterPayload.receiptCounter = safeRc;
          counterPayload.voucherCounter = safeVc;
          counterPayload.globalSequenceCounter = safeGsc;

          // Write using merge: true to avoid erasing unmodeled counter attributes
          await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).set(counterPayload, { merge: true });
          rlog(`system/counters written (monotonic merge):`, 'ok');
          rlog(`  globalSequenceCounter = ${safeGsc} (live: ${liveCData.globalSequenceCounter || 0}, backup: ${countersRaw.globalSequenceCounter || 0}, maxRes: ${maxResSeq})`);
          rlog(`  billingReceiptCounter = ${safeBrc} (live: ${liveCData.billingReceiptCounter || 0}, backup: ${countersRaw.billingReceiptCounter || 0})`);
          rlog(`  receiptCounter        = ${safeRc} (live: ${liveCData.receiptCounter || 0}, backup: ${countersRaw.receiptCounter || 0})`);
          rlog(`  voucherCounter        = ${safeVc} (live: ${liveCData.voucherCounter || 0}, backup: ${countersRaw.voucherCounter || 0})`);
        } catch (cErr) {
          failedStage = 'Restoring system/counters';
          rlog(`ERROR restoring counters: ${cErr.message}`, 'error');
          throw new Error(
            `Restore failed at stage: ${failedStage}.\n` +
            `Error: ${cErr.message}\n\n` +
            `Collection data was restored but counters could not be written.\n` +
            `Safety snapshot for recovery: ${_safetyFilename}`
          );
        }

        // ════════════════════════════════════════════════════════
        // PHASE 8 — POST-RESTORE FIRESTORE VALIDATION
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 8 — Post-Restore Validation');
        rlog('Re-reading Firestore to verify restore…');
        if (restoreProgressRecord) {
          restoreProgressRecord.currentPhase = 'Phase 8 — Verification';
          restoreProgressRecord.completedPhases.push('Phase 7 — Counters');
          await _updateRestoreProgress(db, restoreProgressRecord);
        }

        let allValid = true;
        for (const col of RESTORE_COLLECTIONS) {
          const expected = (collections[col] || []).length;
          try {
            const vSnap = await db.collection(col).get();
            const actual = vSnap.size;
            // In safe merge mode, actual count is at least the number of records present
            if (actual < expected) {
              rlog(`WARN: ${col}: expected at least ${expected} docs, got ${actual}`, 'warn');
              allValid = false;
            } else {
              rlog(`  ${col}: ${actual} docs in database (>= ${expected} from backup) ✓`, 'ok');
            }
          } catch (vErr) {
            rlog(`WARN: Could not verify '${col}': ${vErr.message}`, 'warn');
            allValid = false;
          }
        }

        // Verify counters
        try {
          const verSnap = await db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID).get();
          if (verSnap.exists) {
            const vData = verSnap.data();
            const brc = vData.billingReceiptCounter;
            const rc = vData.receiptCounter;
            const vc = vData.voucherCounter;
            const gsc = vData.globalSequenceCounter;
            rlog(`  system/counters: gsc=${gsc} billingReceiptCounter=${brc} receiptCounter=${rc} voucherCounter=${vc} ✓`, 'ok');
          } else {
            rlog('WARN: system/counters document not found after restore!', 'warn');
            allValid = false;
          }
        } catch (vCErr) {
          rlog(`WARN: Counter verification failed: ${vCErr.message}`, 'warn');
        }

        // Verify reservations if backed up
        if (backupReservations && backupReservations.length > 0) {
          try {
            const sysSnap = await db.collection(FS_COUNTERS_COLLECTION).get();
            let resCount = 0;
            sysSnap.forEach(d => { if (d.id.startsWith('res_')) resCount++; });
            if (resCount < backupReservations.length) {
              rlog(`WARN: system/res_*: expected at least ${backupReservations.length} docs, got ${resCount}`, 'warn');
              allValid = false;
            } else {
              rlog(`  system/res_*: ${resCount} docs in database (>= ${backupReservations.length} from backup) ✓`, 'ok');
            }
          } catch (rVErr) {
            rlog(`WARN: Reservation verification failed: ${rVErr.message}`, 'warn');
          }
        }

        // Verify idempotency records if backed up
        if (backupIdempotency && backupIdempotency.length > 0) {
          try {
            const sysSnap = await db.collection(FS_COUNTERS_COLLECTION).get();
            let opCount = 0;
            sysSnap.forEach(d => { if (d.id.startsWith('op_')) opCount++; });
            if (opCount < backupIdempotency.length) {
              rlog(`WARN: system/op_*: expected at least ${backupIdempotency.length} docs, got ${opCount}`, 'warn');
              allValid = false;
            } else {
              rlog(`  system/op_*: ${opCount} docs in database (>= ${backupIdempotency.length} from backup) ✓`, 'ok');
            }
          } catch (oVErr) {
            rlog(`WARN: Idempotency verification failed: ${oVErr.message}`, 'warn');
          }
        }

        if (!allValid) {
          rlog('Post-restore validation detected discrepancies (see warnings above).', 'warn');
        } else {
          rlog('Post-restore validation: ALL PASSED', 'ok');
        }

        // ════════════════════════════════════════════════════════
        // PHASE 9 — INDEXEDDB CACHE SYNCHRONIZATION
        // ════════════════════════════════════════════════════════
        rlogSection('Phase 9 — IndexedDB Cache Synchronization');
        rlog('Synchronizing IndexedDB cache via existing fsGetAllSafe() layer…');

        // fsGetAllSafe reads Firestore and automatically writes to IndexedDB cache.
        // This is the application's existing Firestore → IDB sync mechanism.
        let idbSyncErrors = 0;
        for (const col of RESTORE_COLLECTIONS) {
          try {
            await fsGetAllSafe(col);
            rlog(`  ${col}: IDB cache synchronized`, 'ok');
          } catch (idbErr) {
            rlog(`  WARN: IDB sync skipped for '${col}': ${idbErr.message}`, 'warn');
            idbSyncErrors++;
          }
        }

        // Sync settings into APP_SETTINGS
        try {
          await refreshSettings();
          rlog('  APP_SETTINGS refreshed from Firestore.', 'ok');
        } catch (sErr) {
          rlog(`  WARN: refreshSettings failed: ${sErr.message}`, 'warn');
        }

        if (idbSyncErrors === 0) {
          rlog('IndexedDB cache synchronization: COMPLETE', 'ok');
        } else {
          rlog(`IndexedDB cache synchronization: ${idbSyncErrors} collection(s) had warnings.`, 'warn');
        }

        // ════════════════════════════════════════════════════════
        // PHASE 10 — COMPLETE
        // ════════════════════════════════════════════════════════
        rlogSection('Restore Complete');
        rlog('✓ Firestore restore completed successfully.', 'ok');
        rlog(`  Safety snapshot: ${safetyFilename}`, 'ok');
        rlog('  Navigating to Dashboard…');

        if (restoreProgressRecord) {
          restoreProgressRecord.status = 'completed';
          restoreProgressRecord.currentPhase = 'Phase 10 — Complete';
          restoreProgressRecord.completedAt = new Date().toISOString();
          restoreProgressRecord.completedPhases.push('Phase 8 — Verification', 'Phase 9 — IDB Sync', 'Phase 10 — Complete');
          await _updateRestoreProgress(db, restoreProgressRecord);
        }

        if (typeof applyBrand === 'function') applyBrand();

        setTimeout(async () => {
          await navigate('dashboard');
        }, 1800);

      } catch (err) {
        console.error('[Restore] RESTORE FAILED:', err);
        rlog('', 'error');
        rlog('━━━ RESTORE FAILED ━━━', 'error');
        rlog(err.message, 'error');
        rlog('No further writes were attempted after this failure.', 'error');
        rlog('Check the safety snapshot file (if downloaded) for recovery.', 'warn');
        alert('Restore failed:\n\n' + err.message);
        enableRestoreBtn();

        if (restoreProgressRecord && dbInstance) {
          try {
            restoreProgressRecord.status = 'interrupted';
            restoreProgressRecord.error = err.message;
            restoreProgressRecord.interruptedAt = new Date().toISOString();
            await _updateRestoreProgress(dbInstance, restoreProgressRecord);
          } catch (progErr) {
            console.warn('[Restore] Could not update interrupted progress record:', progErr.message);
          }
        }
      }
    }

    function downloadCSV(rows, filenamePrefix) {
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      // UTF-8 BOM (\uFEFF) ensures Excel and spreadsheets open Malayalam properly without garbled characters
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${filenamePrefix}_${todayISO()}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function initNavTooltips() {
      const tooltip = el('nav-rail-tooltip');
      if (!tooltip) return;

      const showTooltip = (btn) => {
        const sidebar = el('sidebar');
        if (!sidebar || !sidebar.classList.contains('collapsed')) return;
        if (window.innerWidth <= 768) return;

        const text = btn.dataset.tooltip || btn.getAttribute('aria-label');
        if (!text) return;

        tooltip.textContent = text;
        tooltip.classList.add('visible');

        const rect = btn.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();
        const top = rect.top + (rect.height - tooltipRect.height) / 2;
        const left = rect.right + 10;

        tooltip.style.top = `${Math.max(8, top)}px`;
        tooltip.style.left = `${left}px`;
      };

      const hideTooltip = () => {
        tooltip.classList.remove('visible');
      };

      document.addEventListener('mouseover', (e) => {
        const btn = e.target.closest('#sidebar .nav-item[data-tooltip], #sidebar [data-tooltip]');
        if (btn) showTooltip(btn);
        else hideTooltip();
      });

      document.addEventListener('focusin', (e) => {
        const btn = e.target.closest('#sidebar .nav-item[data-tooltip], #sidebar [data-tooltip]');
        if (btn) showTooltip(btn);
      });

      document.addEventListener('focusout', hideTooltip);
      window.addEventListener('scroll', hideTooltip, true);
    }

    function initSidebarState() {
      const sidebar = el('sidebar');
      if (!sidebar) return;
      let stored = null;
      try {
        stored = localStorage.getItem('temple_nav_collapsed');
      } catch (e) { }

      const isTablet = window.innerWidth <= 1024 && window.innerWidth > 768;
      const shouldCollapse = stored !== null ? stored === 'true' : isTablet;
      if (shouldCollapse && window.innerWidth > 768) {
        sidebar.classList.add('collapsed');
      } else {
        sidebar.classList.remove('collapsed');
      }
      updateCollapseButtons(sidebar.classList.contains('collapsed'));
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-item');
      if (btn) {
        navigate(btn.dataset.view);
        if (window.innerWidth <= 768) {
          closeMobileNav();
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.innerWidth <= 768) {
        closeMobileNav();
      }
    });

    window.navigate = navigate;
    window.toggleSidebarCollapse = toggleSidebarCollapse;
    window.openMobileNav = openMobileNav;
    window.closeMobileNav = closeMobileNav;

    const DarkVeilBackground = (function () {

          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);

      }

      function checkAndProceed() {
        // If auth state is still pending resolution, wait safely until Firebase responds
        if (!authStateResolved) {
          return;
        }

        if (resolvedUser) {
          // User IS authenticated: Transition straight to App Shell without showing login
          transitionSplashToApp();
        } else {
          // User is NOT authenticated: Transition from Splash to Login
          if (currentStage === 'splash') {
            transitionSplashToLogin();
          }
        }
      }

      function transitionSplashToLogin() {
        currentStage = 'login';
        const splashStage = document.getElementById('splash-stage');
        const loginStage = document.getElementById('login-stage');
        if (!splashStage || !loginStage) return;

        // Splash fades & slides out (350ms)
        splashStage.classList.remove('active');
        splashStage.classList.add('stage-exit');

        setTimeout(() => {
          splashStage.style.display = 'none';
          loginStage.style.display = 'flex';
          void loginStage.offsetWidth; // Force reflow
          loginStage.classList.add('active');

          // Trigger login card motion entrance
          const loginCard = loginStage.querySelector('.login-card');
          if (loginCard) {
            loginCard.classList.add('motion-in-view');
            loginCard.querySelectorAll('[data-motion]').forEach(el => el.classList.add('motion-in-view'));
          }

          // Focus email input if not on mobile touch device
          const emailInput = document.getElementById('login-email');
          if (emailInput && !('ontouchstart' in window)) {
            setTimeout(() => emailInput.focus(), 150);
          }
        }, 350);
      }

      function transitionSplashToApp() {
        currentStage = 'app';
        const authExp = document.getElementById('auth-experience');
        const appShell = document.getElementById('app-shell');
        if (!authExp || !appShell) return;

        // Smooth fade out of auth experience
        authExp.classList.add('auth-hidden');

        // Show app shell
        appShell.style.display = 'flex';

        // Update topbar email
        const emailEl = document.getElementById('auth-user-email');
        if (emailEl && resolvedUser) emailEl.textContent = resolvedUser.email || '';

        setTimeout(() => {
          authExp.style.display = 'none';
          DarkVeilBackground.stop(); // Stop render loop to preserve system resources
        }, 450);

        // Boot application once per session
        if (!window._appBooted) {
          window._appBooted = true;
          if (typeof boot === 'function') {
            boot();
          }
        }
      }

      function transitionLoginToApp(user) {
        resolvedUser = user;
        currentStage = 'app';
        const authExp = document.getElementById('auth-experience');
        const appShell = document.getElementById('app-shell');
        if (!authExp || !appShell) return;

        authExp.classList.add('auth-hidden');
        appShell.style.display = 'flex';

        const emailEl = document.getElementById('auth-user-email');
        if (emailEl && resolvedUser) emailEl.textContent = resolvedUser.email || '';

        setTimeout(() => {
          authExp.style.display = 'none';
          DarkVeilBackground.stop();
        }, 450);

        if (!window._appBooted) {
          window._appBooted = true;
          if (typeof boot === 'function') {
            boot();
          }
        }
      }

      function showLoginOnLogout() {
        currentStage = 'login';
        resolvedUser = null;
        window._appBooted = false;

        const authExp = document.getElementById('auth-experience');
        const splashStage = document.getElementById('splash-stage');
        const loginStage = document.getElementById('login-stage');
        const appShell = document.getElementById('app-shell');

        // Hide app shell
        if (appShell) appShell.style.display = 'none';

        // Show auth experience in login stage immediately
        if (authExp) {
          authExp.style.display = 'flex';
          authExp.classList.remove('auth-hidden');
        }

        if (splashStage) {
          splashStage.style.display = 'none';
          splashStage.classList.remove('active', 'stage-exit');
        }

        if (loginStage) {
          loginStage.style.display = 'flex';
          loginStage.classList.add('active');
        }

        // Clear password & error for security
        const passInput = document.getElementById('login-password');
        if (passInput) passInput.value = '';
        const errEl = document.getElementById('login-error');
        if (errEl) errEl.textContent = '';

        // Wake up WebGL background loop
        DarkVeilBackground.start();

        const loginCard = loginStage ? loginStage.querySelector('.login-card') : null;
        if (loginCard) {
          loginCard.classList.add('motion-in-view');
          loginCard.querySelectorAll('[data-motion]').forEach(el => el.classList.add('motion-in-view'));
        }
      }

      return {
        init,
        onAuthStateChanged,
        transitionLoginToApp,
        showLoginOnLogout,
        get currentStage() { return currentStage; }
      };
    })();

    // Legacy helper compatibility
    function showAppShell() {
      const authExp = document.getElementById('auth-experience');
      if (authExp) authExp.style.display = 'none';
      const appShell = document.getElementById('app-shell');
      if (appShell) appShell.style.display = 'flex';
      DarkVeilBackground.stop();
    }

      AuthExperience.showLoginOnLogout();
    }
