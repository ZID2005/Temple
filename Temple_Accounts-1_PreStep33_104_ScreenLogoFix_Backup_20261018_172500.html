      // Splash screen acts as the loading screen in Step 22
    }

    // Firebase auth state listener — called whenever auth state changes
    async function handleAuthStateChanged(user) {
      if (user) {
        if (AuthExperience.currentStage === 'login') {
          AuthExperience.transitionLoginToApp(user);
        } else {
          AuthExperience.onAuthStateChanged(user);
        }
      } else {
        if (AuthExperience.currentStage === 'app') {
          AuthExperience.showLoginOnLogout();
        } else {
          AuthExperience.onAuthStateChanged(null);
        }
      }
    }

    // Handle login form submission
    async function handleLogin() {
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const loginBtn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');

      const email = (emailInput.value || '').trim();
      const password = passwordInput.value || '';

      // Basic client-side validation before hitting Firebase
      if (!email) { errorEl.textContent = 'Please enter your email address.'; emailInput.focus(); return; }
      if (!password) { errorEl.textContent = 'Please enter your password.'; passwordInput.focus(); return; }

      // Disable button and clear previous error
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';
      errorEl.textContent = '';

      try {
        const auth = firebase.auth();
        await auth.signInWithEmailAndPassword(email, password);
        // On success, onAuthStateChanged fires automatically
        passwordInput.value = '';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      } catch (err) {
        // Map Firebase error codes to user-friendly messages
        const code = err.code || '';
        let message;
        if (code === 'auth/invalid-email') {
          message = 'Invalid email address.';
        } else if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
          message = 'Incorrect email or password.';
        } else if (code === 'auth/too-many-requests') {
          message = 'Too many failed attempts. Please try again later.';
        } else if (code === 'auth/network-request-failed') {
          message = 'Network error. Please check your internet connection.';
        } else if (code === 'auth/user-disabled') {
          message = 'This account has been disabled.';
        } else {
          message = 'Authentication failed. Please try again.';
        }
        errorEl.textContent = message;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    // Handle logout
    async function handleLogout(force) {
      if (!force && typeof confirm === 'function' && !confirm('Sign out of Temple Accounts?')) return;
      try {
        await firebase.auth().signOut();
        // onAuthStateChanged will fire and show the login stage
      } catch (err) {
        console.error('Logout error:', err);
        alert('Logout failed. Please try again.');
      }
    }

    // Check for logout query or hash signal
    if (window.location.search.includes('logout=true') || window.location.hash === '#logout') {
      try {
        if (typeof firebase !== 'undefined' && firebase.auth) {
          firebase.auth().signOut();
        }
      } catch (e) { }
    }

    // Allow pressing Enter in password and email fields
    document.getElementById('login-password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('login-email').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('login-password').focus();
    });

    /* ===================== FIRESTORE INITIALIZATION =====================
       Task 1: Isolated Firestore initialization using existing Firebase app.
       Runs alongside IndexedDB without changing existing IndexedDB behavior.
       No production collections or documents are created automatically.
       ================================================================== */
    let firestoreDb = null;

    function initializeFirestore() {
      try {
        if (!firebase.apps || !firebase.apps.length) {
          if (typeof initializeFirebase === 'function') {
            initializeFirebase();
          }
        }
        if (!firestoreDb && typeof firebase !== 'undefined' && firebase.firestore) {
          firestoreDb = firebase.firestore();
          if (isEmulatorModeActive()) {
            try {
              firestoreDb.useEmulator('127.0.0.1', 8080);
              console.log('[Firestore] Connected to local Firestore emulator (127.0.0.1:8080)');
            } catch (e) {
              console.warn('[Firestore] Emulator connection notice:', e);
            }
          }
          console.log('[Firestore] Foundation initialized successfully alongside IndexedDB.');
        }
        return firestoreDb;
      } catch (err) {
        console.error('[Firestore] Initialization error:', err);
        return null;
      }
    }

    function getFirestoreDb() {
      if (!firestoreDb) {
        initializeFirestore();
      }
      return firestoreDb;
    }

    /* ===================== AUTHENTICATION CONTEXT =====================
       Task 3: Safe helpers to detect currently authenticated Firebase user.
       Does not change authentication flow, roles, or existing users.
       ================================================================= */
    function getCurrentFirebaseUser() {
      try {
        return (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth().currentUser : null;
      } catch (err) {
        console.warn('[Firestore Auth Context] Error retrieving current user:', err);
        return null;
      }
    }

    function getCurrentUserUid() {
      const user = getCurrentFirebaseUser();
      return user ? user.uid : null;
    }

    function getCurrentUserEmail() {
      const user = getCurrentFirebaseUser();
      return user ? user.email : null;
    }

    /* ===================== FIRESTORE PRODUCTION REPOSITORY & DATA ACCESS LAYER (STEP 15) =====================
       Authoritative Cloud Firestore Production Architecture:
       - Primary data store: Cloud Firestore (temple-f4f7d)
       - Cache / safety fallback: IndexedDB (temple_accounts_db, version 2)
       - Security: Authenticated requests only (request.auth != null)
       - Audit trail: createdBy, updatedBy (Firebase user UID), updatedAt (serverTimestamp)
       - Atomic transactions: Multi-user atomic counter & billing+accounting creation
       ======================================================================================================== */

    /**
     * Executes a function within an atomic Firestore transaction.
     * @param {Function} transactionFn
     * @returns {Promise<any>}
     */
    async function fsTransaction(transactionFn) {
      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');
      return await db.runTransaction(transactionFn);
    }

    /**
     * Creates a new Firestore write batch.
     * @returns {firebase.firestore.WriteBatch}
     */
    function fsBatch() {
      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');
      return db.batch();
    }

    /**
     * Standard deterministic document ID prefix for stores.
     */
    function getDeterministicDocPrefix(storeName) {
      const map = {
        settings: 'set_',
        funds: 'fund_',
        incomeCategories: 'incomeCat_',
        expenseCategories: 'expenseCat_',
        bankAccounts: 'bank_',
        billing: 'bill_',
        receipts: 'rcpt_',
        payments: 'pmt_',
        transfers: 'tx_',
        loans: 'loan_',
        chittyMembers: 'cm_',
        chittyCollections: 'cc_',
        chittyPayouts: 'cp_'
      };
      return map[storeName] || (storeName + '_');
    }

    /**
     * Fetch a single document by ID from a Firestore collection.
     * @param {string} collectionName
     * @param {string|number} docId
     * @returns {Promise<Object|null>} Document data with id, or null if not found
     */
    async function fsGet(collectionName, docId) {
      try {
        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        if (!collectionName || docId === undefined || docId === null) {
          throw new Error('Both collectionName and docId are required for fsGet.');
        }
        const snap = await db.collection(collectionName).doc(String(docId)).get();
        if (!snap.exists) return null;
        return { id: snap.id, ...snap.data() };
      } catch (err) {
        console.error(`[Firestore fsGet] Error reading ${collectionName}/${docId}:`, err);
        throw err;
      }
    }

    /**
     * Fetch all documents in a Firestore collection.
     * @param {string} collectionName
     * @returns {Promise<Array<Object>>} Array of document objects with IDs
     */
    async function fsGetAll(collectionName) {
      try {
        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        if (!collectionName) throw new Error('collectionName is required for fsGetAll.');
        const snap = await db.collection(collectionName).get();
        const records = [];
        snap.forEach(doc => {
          records.push({ id: doc.id, ...doc.data() });
        });
        return records;
      } catch (err) {
        console.error(`[Firestore fsGetAll] Error reading collection ${collectionName}:`, err);
        throw err;
      }
    }

    /**
     * Add a new document with an auto-generated or timestamped Firestore ID, injecting audit metadata.
     * @param {string} collectionName
     * @param {Object} data
     * @returns {Promise<string>} Generated document ID
     */
    async function fsAdd(collectionName, data) {
      try {
        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        if (!collectionName || !data) throw new Error('collectionName and data are required for fsAdd.');
        const user = getCurrentFirebaseUser();
        const uid = user ? user.uid : 'system';
        const payload = {
          ...data,
          source: data.source || 'firestore',
          createdBy: data.createdBy || uid,
          updatedBy: uid,
          createdAt: data.createdAt || Date.now()
        };
        if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
          payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        } else {
          payload.updatedAt = Date.now();
        }
        const docRef = await db.collection(collectionName).add(payload);
        return docRef.id;
      } catch (err) {
        console.error(`[Firestore fsAdd] Error adding to ${collectionName}:`, err);
        throw err;
      }
    }

    /**
     * Create or overwrite a document with a specific ID in Firestore, injecting audit metadata.
     * @param {string} collectionName
     * @param {string|number} docId
     * @param {Object} data
     * @param {boolean} [merge=false]
     * @returns {Promise<string>} Document ID
     */
    async function fsSet(collectionName, docId, data, merge = false) {
      try {
        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        if (!collectionName || docId === undefined || docId === null || !data) {
          throw new Error('collectionName, docId, and data are required for fsSet.');
        }
        const user = getCurrentFirebaseUser();
        const uid = user ? user.uid : 'system';
        const payload = {
          ...data,
          source: data.source || 'firestore',
          updatedBy: uid
        };
        if (!merge) {
          payload.createdBy = data.createdBy || uid;
          payload.createdAt = data.createdAt || Date.now();
        }
        if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
          payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        } else {
          payload.updatedAt = Date.now();
        }
        await db.collection(collectionName).doc(String(docId)).set(payload, { merge });
        return String(docId);
      } catch (err) {
        console.error(`[Firestore fsSet] Error writing ${collectionName}/${docId}:`, err);
        throw err;
      }
    }

    /**
     * Update specific fields in an existing document.
     * @param {string} collectionName
     * @param {string|number} docId
     * @param {Object} data
     * @returns {Promise<string>} Document ID
     */
    async function fsUpdate(collectionName, docId, data) {
      try {
        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        if (!collectionName || docId === undefined || docId === null || !data) {
          throw new Error('collectionName, docId, and data are required for fsUpdate.');
        }
        const user = getCurrentFirebaseUser();
        const uid = user ? user.uid : 'system';
        const payload = {
          ...data,
          updatedBy: uid
        };
        if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
          payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        } else {
          payload.updatedAt = Date.now();
        }
        await db.collection(collectionName).doc(String(docId)).update(payload);
        return String(docId);
      } catch (err) {
        console.error(`[Firestore fsUpdate] Error updating ${collectionName}/${docId}:`, err);
        throw err;
      }
    }

    /**
     * Delete a single document by ID from a Firestore collection.
     * @param {string} collectionName
     * @param {string|number} docId
     * @returns {Promise<boolean>} True on success
     */
    async function fsDelete(collectionName, docId) {
      try {
        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        if (!collectionName || docId === undefined || docId === null) {
          throw new Error('collectionName and docId are required for fsDelete.');
        }
        await db.collection(collectionName).doc(String(docId)).delete();
        return true;
      } catch (err) {
        console.error(`[Firestore fsDelete] Error deleting ${collectionName}/${docId}:`, err);
        throw err;
      }
    }

    /**
     * Execute a filtered/ordered query on a Firestore collection.
     * @param {string} collectionName
     * @param {Function} queryFn Function that takes a CollectionReference and returns a Query
     * @returns {Promise<Array<Object>>} Array of document objects with IDs
     */
    async function fsQuery(collectionName, queryFn) {
      try {
        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        if (!collectionName) throw new Error('collectionName is required for fsQuery.');
        let q = db.collection(collectionName);
        if (typeof queryFn === 'function') {
          q = queryFn(q) || q;
        }
        const snap = await q.get();
        const records = [];
        snap.forEach(doc => {
          records.push({ id: doc.id, ...doc.data() });
        });
        return records;
      } catch (err) {
        console.error(`[Firestore fsQuery] Error querying ${collectionName}:`, err);
        throw err;
      }
    }

    /* ===================== FIRESTORE TRANSACTION-SAFE COUNTERS =====================
       Atomic, multi-user transaction-safe counter increments.
       Counter document structure: system/counters
       Fields:
         receiptCounter: number (accounting receipts, e.g. R-1001)
         voucherCounter: number (payment vouchers, e.g. V-501 or V-1001)
         billingReceiptCounter: number (billing receipts, e.g. BILL-0001)
         receiptPrefix: string (default: 'R-')
         voucherPrefix: string (default: 'V-')
         billingPrefix: string (default: 'BILL-')
         updatedAt: timestamp
       ============================================================================== */

    const FS_COUNTERS_COLLECTION = 'system';
    const FS_COUNTERS_DOC_ID = 'counters';

    /**
     * Returns a DocumentReference to the counters document.
     */
    function getFsCountersDocRef() {
      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');
      return db.collection(FS_COUNTERS_COLLECTION).doc(FS_COUNTERS_DOC_ID);
    }

    /**
     * Core atomic counter allocator using Firestore runTransaction.
     */
    async function _fsAllocateCounter(field, defaultInitial, prefixField, defaultPrefix, padDigits = 0) {
      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');
      const counterRef = getFsCountersDocRef();

      return await db.runTransaction(async (tx) => {
        const snap = await tx.get(counterRef);
        const data = snap.exists ? snap.data() : {};

        const rawVal = data[field];
        const currentVal = (typeof rawVal === 'number')
          ? rawVal
          : (rawVal !== undefined && !isNaN(parseInt(rawVal, 10)) ? parseInt(rawVal, 10) : defaultInitial);

        let nextVal = currentVal + 1;
        const prefix = (data[prefixField] !== undefined && data[prefixField] !== null) ? data[prefixField] : defaultPrefix;

        // Collision safety: verify target document does not already exist
        if (field === 'receiptCounter') {
          let rRef = db.collection('receipts').doc(`rcpt_${nextVal}`);
          let rSnap = await tx.get(rRef);
          while (rSnap.exists) {
            nextVal++;
            rRef = db.collection('receipts').doc(`rcpt_${nextVal}`);
            rSnap = await tx.get(rRef);
          }
        } else if (field === 'voucherCounter') {
          let vRef = db.collection('payments').doc(`pay_${nextVal}`);
          let vSnap = await tx.get(vRef);
          while (vSnap.exists) {
            nextVal++;
            vRef = db.collection('payments').doc(`pay_${nextVal}`);
            vSnap = await tx.get(vRef);
          }
        }

        const formattedNo = padDigits > 0
          ? `${prefix}${String(nextVal).padStart(padDigits, '0')}`
          : `${prefix}${nextVal}`;

        const updatePayload = {
          [field]: nextVal
        };
        if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
          updatePayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        } else {
          updatePayload.updatedAt = Date.now();
        }

        tx.set(counterRef, updatePayload, { merge: true });
        return formattedNo;
      });
    }

    /**
     * Allocates next accounting receipt number preview or sequence string in Firestore.
     * STEP 33.12: Shares unified global sequence with Billing (e.g. R-001, R-002...).
     */
    async function fsNextReceiptNo() {
      try {
        const nextVal = await getNextGlobalSequenceNo();
        const c = await fsGetCounters();
        const prefix = (c && c.receiptPrefix) || 'R-';
        return `${prefix}${String(nextVal).padStart(3, '0')}`;
      } catch (err) {
        console.error('[Firestore fsNextReceiptNo] Sequence calculation failed:', err);
        return 'R-001';
      }
    }

    /**
     * Allocates next payment voucher number atomically in Firestore.
     * Format: V-XXXX (e.g., V-501, V-502...) - strictly independent.
     */
    async function fsNextVoucherNo() {
      try {
        return await _fsAllocateCounter('voucherCounter', 500, 'voucherPrefix', 'V-', 0);
      } catch (err) {
        console.error('[Firestore fsNextVoucherNo] Transaction allocation failed:', err);
        throw err;
      }
    }

    /**
     * Allocates next billing receipt number preview or sequence string in Firestore.
     * STEP 33.12: Shares unified global sequence with Receipts (e.g. BILL-001, BILL-002...).
     */
    async function fsNextBillingReceiptNo() {
      try {
        const nextVal = await getNextGlobalSequenceNo();
        const c = await fsGetCounters();
        const prefix = (c && (c.billingPrefix || c.billingReceiptPrefix)) || 'BILL-';
        return `${prefix}${String(nextVal).padStart(3, '0')}`;
      } catch (err) {
        console.error('[Firestore fsNextBillingReceiptNo] Sequence calculation failed:', err);
        return 'BILL-001';
      }
    }

    /**
     * Utility to inspect current Firestore counters document without incrementing.
     */
    async function fsGetCounters() {
      try {
        const db = getFirestoreDb();
        if (!db) return null;
        const snap = await getFsCountersDocRef().get();
        return snap.exists ? snap.data() : null;
      } catch (err) {
        console.warn('[Firestore fsGetCounters] Failed to read counters:', err);
        return null;
      }
    }

    /**
     * Utility to initialize Firestore counters document if needed.
     */
    async function fsInitCounters(initialValues = {}, overwrite = false) {
      try {
        const db = getFirestoreDb();
        if (!db) throw new Error('Firestore is not initialized.');
        const counterRef = getFsCountersDocRef();
        const snap = await counterRef.get();
        if (snap.exists && !overwrite) {
          console.log('[Firestore fsInitCounters] Counters already initialized:', snap.data());
          return snap.data();
        }
        const defaults = {
          globalSequenceCounter: 0,
          receiptCounter: 1000,
          voucherCounter: 500,
          billingReceiptCounter: 0,
          receiptPrefix: 'R-',
          voucherPrefix: 'V-',
          billingPrefix: 'BILL-',
          ...initialValues
        };
        if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
          defaults.initializedAt = firebase.firestore.FieldValue.serverTimestamp();
        } else {
          defaults.initializedAt = Date.now();
        }
        await counterRef.set(defaults, { merge: true });
        console.log('[Firestore fsInitCounters] Counters document initialized:', defaults);
        return defaults;
      } catch (err) {
        console.error('[Firestore fsInitCounters] Initialization failed:', err);

    /**

     */
    async function fsSaveRecordSafe(storeName, record, isEdit = false) {
      const user = getCurrentFirebaseUser();
      if (!user) throw new Error('Authentication required: please log in to record transactions.');

      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');

      if (!record || typeof record !== 'object') {

      const prefix = getDeterministicDocPrefix(storeName);
      let docId = record.firestoreId;
      if (!docId) {

          ? record.legacyId
          : (record.id !== undefined && record.id !== null ? record.id : Date.now());
        docId = `${prefix}${rawId}`;
        record.firestoreId = docId;
      }

      // Guard master data entities from direct overwrite bypasses (Fail-Closed)
      if (isMasterStore) {
        if (typeof isCoreMasterEntity !== 'function' || typeof checkMasterDataReferences !== 'function') {
          throw new Error('Save blocked: Master data integrity guards are unavailable. Mutation prohibited.');
        }

        let existingDoc = null;
        let docExists = false;
        try {
          const snap = await db.collection(storeName).doc(docId).get();
          if (snap && snap.exists) {
            docExists = true;
            existingDoc = { id: snap.id, ...snap.data() };
          } else {
            const hasExplicitId = (record.firestoreId !== undefined && record.firestoreId !== null) ||
              (record.id !== undefined && record.id !== null) ||
              (record.legacyId !== undefined && record.legacyId !== null);
            if (hasExplicitId || isEdit) {
              const lookupId = record.firestoreId || record.id || record.legacyId || docId;
              const found = await fsGetOneSafe(storeName, lookupId);
              if (found) {
                docExists = true;
                existingDoc = found;
              }
            }
          }
        } catch (checkErr) {
          throw new Error(`Integrity check failed: Unable to verify existing document for ${storeName}/${docId}: ${checkErr.message || checkErr}. Mutation aborted to protect integrity.`);
        }

        if (docExists && existingDoc) {
          // 1. Guard existing core entities from overwrite, rename, or identity mutation
          if (isCoreMasterEntity(storeName, existingDoc.name)) {
            if (record.name !== undefined && record.name !== existingDoc.name) {
              throw new Error(`Mutation blocked: "${existingDoc.name}" is a protected system core entity required for core operations.`);
            }
            throw new Error(`Mutation blocked: Cannot overwrite protected system core entity "${existingDoc.name}".`);
          }

          // 2. Guard renaming TO a core entity name
          if (record.name !== undefined && isCoreMasterEntity(storeName, record.name)) {
            throw new Error(`Renaming blocked: cannot rename to "${record.name}" because it is a protected system core entity.`);
          }

          // 3. Guard existing referenced custom entities against unsafe name overwrites
          if (record.name !== undefined && record.name !== existingDoc.name) {
            const refCheck = await checkMasterDataReferences(storeName, existingDoc.name, existingDoc);
            if (!refCheck || !refCheck.safe) {
              if (refCheck && refCheck.error) {
                throw new Error(`Reference check failed: ${refCheck.error}`);
              }
              const count = (refCheck && refCheck.count !== undefined) ? refCheck.count : 'existing';
              const isCaseOnly = (record.name.trim().toLowerCase() === existingDoc.name.trim().toLowerCase()) && (record.name.trim() !== existingDoc.name.trim());
              const isWhitespaceOnly = (typeof normalizeMasterEntityName === 'function' ? normalizeMasterEntityName(record.name) === normalizeMasterEntityName(existingDoc.name) : false) && !isCaseOnly;

              if (isCaseOnly) {
                throw new Error(`Mutation blocked: Casing-only rename of "${existingDoc.name}" to "${record.name}" is prohibited because historical accounting records rely on exact case-sensitive matching (${count} reference(s) found).`);
              } else if (isWhitespaceOnly) {
                throw new Error(`Mutation blocked: Whitespace modification of "${existingDoc.name}" to "${record.name}" is prohibited because historical transactions rely on exact string matching (${count} reference(s) found).`);
              } else {
                throw new Error(`Mutation blocked: "${existingDoc.name}" is referenced by ${count} transaction(s).`);
              }
            }
          }
        } else {
          // Document does not exist (new master entity creation)
          if (record.name !== undefined && isCoreMasterEntity(storeName, record.name)) {
            throw new Error(`Creation blocked: "${record.name}" is a protected system core entity name.`);
          }
        }
      }

      const payload = {
        ...record,
        firestoreId: docId,
        source: 'firestore',
        updatedBy: user.uid
      };
      if (!isEdit) {
        payload.createdBy = record.createdBy || user.uid;
        payload.createdAt = record.createdAt || Date.now();
      }
      if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
        payload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      } else {
        payload.updatedAt = Date.now();
      }

      // 1. Write to Firestore FIRST
      await db.collection(storeName).doc(docId).set(payload, { merge: true });

      // 2. On confirmed Firestore success, update IndexedDB cache
      if (typeof putRec === 'function') {
        try {
          await putRec(storeName, { ...payload, id: record.id || record.legacyId || docId });
        } catch (cacheErr) {
          console.warn(`[Repository] Warning caching to IndexedDB (${storeName}):`, cacheErr);
        }
      }

      return docId;
    }

        if (isCore) {

          }

          }
        }

        // 2. Guard renaming TO a core entity name (by exact name or case/whitespace variation)
        if (updates.name !== undefined && isCoreMasterEntity(storeName, updates.name)) {
          throw new Error(`Renaming blocked: cannot rename to "${updates.name}" because it is a protected system core entity.`);
        }

        // 3. Guard renaming of referenced master entities (including casing-only and whitespace changes)
        if (updates.name !== undefined && updates.name !== rec.name) {
          const refCheck = await checkMasterDataReferences(storeName, rec.name, rec);
          if (!refCheck || !refCheck.safe) {
            if (refCheck && refCheck.error) {
              throw new Error(`Reference check failed: ${refCheck.error}`);
            }
            const count = (refCheck && refCheck.count !== undefined) ? refCheck.count : 'existing';
            const isCaseOnly = (updates.name.trim().toLowerCase() === rec.name.trim().toLowerCase()) && (updates.name.trim() !== rec.name.trim());
            const isWhitespaceOnly = (typeof normalizeMasterEntityName === 'function' ? normalizeMasterEntityName(updates.name) === normalizeMasterEntityName(rec.name) : false) && !isCaseOnly;

            if (isCaseOnly) {

          }

      }

      let docId = (typeof id === 'string' && id.includes('_')) ? id : `${getDeterministicDocPrefix(storeName)}${id}`;
      const payload = {
        ...updates,

      // 1. Update in Firestore
      await db.collection(storeName).doc(docId).set(payload, { merge: true });

      // 2. Update IndexedDB cache
      if (typeof getOne === 'function' && typeof putRec === 'function') {

          await putRec(storeName, { ...cached, ...payload, id: id });
        } catch (cacheErr) {
          console.warn(`[Repository] Cache update warning for ${storeName}/${id}:`, cacheErr);
        }

    /**
     * Primary audit-safe void method (preserves document in Firestore with void metadata).
     */
    async function fsVoidRecordSafe(storeName, id, voidReason) {
      const user = getCurrentFirebaseUser();
      if (!user) throw new Error('Authentication required.');

      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');

      const prefix = getDeterministicDocPrefix(storeName);
      let docId = String(id);
      let directSnap = null;
      try {
        directSnap = await db.collection(storeName).doc(docId).get();
      } catch (e) { }
      if (!directSnap || !directSnap.exists) {
        let candidateId = docId.startsWith(prefix) ? docId : `${prefix}${id}`;
        if (storeName === 'receipts' && typeof parsePhysicalReceiptIdentifier === 'function') {
          const stripped = String(id).replace(/^rcpt_/, '').replace(/^phys_/, '');
          const parsedPhys = parsePhysicalReceiptIdentifier(stripped);
          if (parsedPhys && parsedPhys.valid) {
            candidateId = `rcpt_phys_${parsedPhys.formattedId}`;
          }
        }
        docId = candidateId;
      }

      const docRef = db.collection(storeName).doc(docId);
      let snap = directSnap;
      if (!snap || !snap.exists) {
        try {
          snap = await docRef.get();
        } catch (e) { }
      }
      const existingData = (snap && snap.exists) ? snap.data() : null;

      // Step 33.71: Preserve original audit history if already voided (prevent corruption on repeat void)
      const isAlreadyVoided = existingData && existingData.voided === true;
      const cleanReason = (isAlreadyVoided && existingData.voidReason)
        ? existingData.voidReason
        : (voidReason || 'Voided by user');
      const voidDateStr = (isAlreadyVoided && existingData.voidDate)
        ? existingData.voidDate
        : todayISO();
      const voidedAtTs = (isAlreadyVoided && existingData.voidedAt)
        ? existingData.voidedAt
        : Date.now();

      const voidPayload = {
        voided: true,
        voidReason: cleanReason,
        voidDate: voidDateStr,
        voidedAt: voidedAtTs,
        updatedBy: user.uid
      };
      if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
        voidPayload.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      } else {
        voidPayload.updatedAt = voidedAtTs;
      }

      // Step 33.71: Resolve secondary reservation/tracking document for receipts
      let resRef = null;
      if (storeName === 'receipts') {
        if (existingData && existingData.reservationDocId) {
          resRef = db.collection('system').doc(existingData.reservationDocId);
        } else if (docId.startsWith('rcpt_phys_') || (existingData && (existingData.isPhysical || existingData.source === 'physical'))) {
          const physKey = (existingData && (existingData.receiptNo || existingData.formattedNo))
            ? (existingData.receiptNo || existingData.formattedNo)
            : docId.replace(/^rcpt_phys_/, '');
          const parsedPhys = typeof parsePhysicalReceiptIdentifier === 'function' ? parsePhysicalReceiptIdentifier(physKey) : null;
          const canonicalPhysId = (parsedPhys && parsedPhys.valid) ? parsedPhys.formattedId : physKey;
          resRef = db.collection('system').doc(`res_phys_${canonicalPhysId}`);
        } else {
          const rcptNum = parseInt(String(docId).replace(/^rcpt_/, ''), 10);
          if (!isNaN(rcptNum) && rcptNum > 0) {
            resRef = db.collection('system').doc(`res_${rcptNum}`);
          }
        }
      }

      const resVoidPayload = resRef ? {
        voided: true,
        status: 'voided',
        voidReason: cleanReason,
        voidDate: voidDateStr,
        voidedAt: voidedAtTs,
        updatedBy: user.uid,
        updatedAt: voidPayload.updatedAt
      } : null;

      // 1. Safe Transaction / Atomic update: ensure receipt and reservation state are never partially updated
      if (resRef) {
        if (typeof db.runTransaction === 'function') {
          await db.runTransaction(async (tx) => {
            if (typeof tx.get === 'function') {
              await Promise.all([tx.get(docRef), tx.get(resRef)]);

            tx.set(docRef, voidPayload, { merge: true });
            tx.set(resRef, resVoidPayload, { merge: true });

        } else if (typeof db.batch === 'function') {
          const batch = db.batch();
          batch.set(docRef, voidPayload, { merge: true });
          batch.set(resRef, resVoidPayload, { merge: true });
          await batch.commit();
        } else {
          await docRef.set(voidPayload, { merge: true });
          await resRef.set(resVoidPayload, { merge: true });
        }
      } else {
        await docRef.set(voidPayload, { merge: true });
      }

      // 2. Update IndexedDB cache
      if (typeof getOne === 'function' && typeof putRec === 'function') {
        try {
          const numId = (typeof id === 'string' && id.includes('_')) ? parseInt(id.split('_')[1], 10) : parseInt(id, 10);
          const targetId = (!isNaN(numId) && numId > 0) ? numId : id;
          const cached = (await getOne(storeName, targetId)) || (await getOne(storeName, id)) || (await getOne(storeName, docId)) || {};
          const finalId = (cached && cached.id !== undefined) ? cached.id : (docId || targetId);
          await putRec(storeName, { ...cached, ...voidPayload, id: finalId });
          if (typeof id === 'string' && id !== String(finalId) && typeof deleteRec === 'function') {
            await deleteRec(storeName, id).catch(() => { });
          }
        } catch (cacheErr) {
          console.warn(`[Repository] Cache void warning for ${storeName}/${id}:`, cacheErr);
        }
      }

      return true;
    }

      if (seqNum) {

        }, { merge: true });
      }
      await batch.commit();

      console.log(`[Firestore Batch] Atomically voided Billing/${billDocId} and Receipts/${rcptDocId}.`);

      // 2. On confirmed Firestore success, update IndexedDB cache for both stores
      if (typeof getOne === 'function' && typeof putRec === 'function') {

          const updatedBill = {

            updatedAt: nowTs,
            id: (cachedBill && cachedBill.id !== undefined) ? cachedBill.id : targetBillKey
          };
          await putRec('billing', updatedBill);
          if (typeof deleteRec === 'function' && typeof billDocId === 'string' && billDocId !== String(targetBillKey)) {
            await deleteRec('billing', billDocId).catch(() => { });
          }

          // Update Receipts IDB cache
          const rcptNum = parseInt(rcptDocId.replace('rcpt_', ''), 10);
          const targetRcptKey = (!isNaN(rcptNum) && rcptNum > 0) ? rcptNum : rcptDocId;
          const cachedRcpt = (await getOne('receipts', targetRcptKey)) || (await getOne('receipts', rcptDocId)) || {};
          const updatedRcpt = {
            ...cachedRcpt,
            ...voidPayload,
            updatedAt: nowTs,
            id: (cachedRcpt && cachedRcpt.id !== undefined) ? cachedRcpt.id : targetRcptKey
          };
          await putRec('receipts', updatedRcpt);
          if (typeof deleteRec === 'function' && typeof rcptDocId === 'string' && rcptDocId !== String(targetRcptKey)) {
            await deleteRec('receipts', rcptDocId).catch(() => { });
          }
        } catch (cacheErr) {
          console.warn('[Repository] IDB cache synchronization warning after atomic void:', cacheErr);
        }
      }

      return true;
    }

    /**
     * Authoritative master data loader:
     * Reads settings/set_1 and all master configuration collections from Cloud Firestore.
     * Updates runtime memory (window.APP_SETTINGS) and syncs local IndexedDB cache.
     */
    async function loadAuthoritativeMasterData() {
      try {
        const db = getFirestoreDb();
        if (!db) {
          console.warn('[MasterData] Firestore not initialized, using local cache.');
          await seedIfNeeded();
          return;
        }

        // 1. Load authoritative settings from settings/set_1
        const fsSettings = await fsGet('settings', 'set_1');
        if (fsSettings) {
          window.APP_SETTINGS = {
            ...fsSettings,
            id: 1,
            legacyId: 1
          };
          if (typeof putRec === 'function') {
            try { await putRec('settings', window.APP_SETTINGS); } catch (e) { }
          }
          console.log('[MasterData] Authoritative settings loaded from Firestore settings/set_1.');
        } else {
          await seedIfNeeded();
        }

        // 2. Load authoritative master configuration collections
        const masterCollections = ['funds', 'incomeCategories', 'expenseCategories', 'bankAccounts'];
        for (const colName of masterCollections) {
          try {
            const snap = await db.collection(colName).get();
            if (!snap.empty && typeof putRec === 'function') {
              for (const doc of snap.docs) {
                const data = doc.data();
                const rec = {
                  ...data,
                  firestoreId: doc.id,
                  id: (data.legacyId !== undefined && data.legacyId !== null) ? data.legacyId : doc.id
                };
                try { await putRec(colName, rec); } catch (e) { }
              }
            }
          } catch (colErr) {
            console.warn(`[MasterData] Warning syncing ${colName} from Firestore:`, colErr);
          }
        }
      } catch (err) {
        console.warn('[MasterData] Master data fetch warning, falling back to local cache:', err);
        await seedIfNeeded();
      }
    }

    /**
     * STEP 33.15: Idempotency helpers & stable operation ID management
     */
    function generateOperationId(prefix = 'op') {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return `${prefix}_${crypto.randomUUID()}`;
      }
      return `${prefix}_${Date.now()}_${Math.random().toString(36).substring(2, 10)}`;
    }

    /**
     * STEP 33.22: Canonical Financial Fingerprints (V2) & Legacy Fingerprints (V1).
     * Comprehensive deterministic fingerprinting covering every materially relevant financial input:
     * - Billing: date, time, category, derived fund, income category, item, star, quantity, unit price, total amount, payment mode, bank account, devotee name, manual bill no.
     * - Receipt: date, fund, category, amount, payment mode, bank account, name, mobile, description, remarks, manual receipt no.
     */
    function computeBillingFingerprintV1(input) {
      if (!input) return '';
      return [
        input.category || '',
        input.item || '',
        String(input.quantity || 1),
        Number(input.unitPrice || 0).toFixed(2),
        Number(input.totalAmount !== undefined ? input.totalAmount : (Number(input.unitPrice || 0) * (parseInt(input.quantity, 10) || 1))).toFixed(2),
        input.paymentMode || '',
        input.devoteeName || '',
        input.manualBillNo || ''
      ].join('|');
    }

    function computeBillingFingerprint(input) {
      if (!input) return '';
      const date = String(input.date || '').trim();
      const time = String(input.time || '').trim();
      const category = String(input.category || '').trim();
      const fund = (input.fund !== undefined && input.fund !== null)
        ? String(input.fund).trim()
        : '';
      const incomeCat = (input.incomeCategory !== undefined && input.incomeCategory !== null)
        ? String(input.incomeCategory).trim()
        : (input.categoryMapping !== undefined && input.categoryMapping !== null ? String(input.categoryMapping).trim() : '');
      const item = String(input.item || '').trim();
      const star = String(input.star || '').trim();
      const qty = parseInt(input.quantity, 10) || 1;
      const unitPrice = Number(input.unitPrice || 0).toFixed(2);
      const totalAmount = Number(input.totalAmount !== undefined ? input.totalAmount : (Number(input.unitPrice || 0) * qty)).toFixed(2);
      const paymentMode = String(input.paymentMode || '').trim();
      const bankAccount = String(input.bankAccount || '').trim();
      const devoteeName = String(input.devoteeName || '').trim();
      const manualBillNo = String(input.manualBillNo || '').trim();
      const devoteesStr = Array.isArray(input.devotees) && input.devotees.length > 0
        ? input.devotees.map(d => `${(d.name || '').trim()}:${(d.star || '').trim()}`).join(';')
        : '';

      const parts = [
        'v2',
        date,
        time,
        category,
        fund,
        incomeCat,
        item,
        star,
        String(qty),
        unitPrice,
        totalAmount,
        paymentMode,
        bankAccount,
        devoteeName,
        manualBillNo
      ];
      if (devoteesStr) {
        parts.push(devoteesStr);
      }
      return parts.join('|');
    }

    function computeReceiptFingerprintV1(input) {
      if (!input) return '';
      const manNo = input.manualReceiptNo || input.receiptNoInput || '';
      return [
        input.fund || '',
        input.category || '',
        Number(input.amount || 0).toFixed(2),
        input.paymentMode || '',
        input.name || '',
        manNo
      ].join('|');
    }

    function computeReceiptFingerprint(input) {
      if (!input) return '';
      const date = String(input.date || '').trim();
      const fund = String(input.fund || '').trim();
      const category = (input.category != null) ? String(input.category).trim() : '';
      const amount = Number(input.amount || 0).toFixed(2);
      const paymentMode = String(input.paymentMode || '').trim();
      const bankAccount = String(input.bankAccount || '').trim();
      const name = String(input.name || '').trim();
      const mobile = String(input.mobile || '').trim();
      const description = String(input.description || '').trim();
      const remarks = String(input.remarks || '').trim();
      const manNo = String(input.manualReceiptNo || input.receiptNoInput || '').trim();

      return [
        'v2',
        date,
        fund,
        category,
        amount,
        paymentMode,
        bankAccount,
        name,
        mobile,
        description,
        remarks,
        manNo
      ].join('|');
    }

    async function fsReconcilePendingOperation(operationId, options = {}) {
      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');
      if (!operationId) throw new Error('operationId is required for reconciliation.');
      const user = getCurrentFirebaseUser();
      if (!user || !user.uid) throw new Error('Authentication required: please log in to reconcile transactions.');

      const opDocId = operationId.startsWith('op_') ? operationId : `op_${operationId}`;
      const opRef = db.collection('system').doc(opDocId);
      const opSnap = await opRef.get();
      if (!opSnap.exists) {
        return { committed: false, operationId };
      }
      const opData = opSnap.data() || {};
      if (typeof opData !== 'object') {
        throw new Error(`Idempotency integrity error: Operation record "${operationId}" is malformed.`);
      }

      // 1. Authenticated caller check (VULN-02 remediation)
      if (opData.createdBy && opData.createdBy !== user.uid) {
        throw new Error(`Idempotency authorization error: Operation "${operationId}" was created by another user ("${opData.createdBy}"). Cross-user reconciliation is strictly denied.`);
      }

      // 2. Operation ID check
      if (opData.operationId && opData.operationId !== operationId && opData.operationId !== opDocId) {
        throw new Error(`Idempotency integrity error: Stored operation ID "${opData.operationId}" does not match requested operation ID "${operationId}".`);
      }

      // 3. Required fields check
      if (!opData.status || (!opData.type && !opData.operationType) || opData.seqNumber === undefined) {
        throw new Error(`Idempotency integrity error: Operation record "${operationId}" is missing required fields.`);
      }

      // 4. Optional expected fingerprint check
      if (options && options.expectedFingerprint && opData.fingerprint && opData.fingerprint !== options.expectedFingerprint) {
        throw new Error(`Idempotency conflict: Operation "${operationId}" has different financial fingerprint than expected.`);
      }

      let billDoc = null;
      let rcptDoc = null;
      let resDoc = null;

      if (opData.billDocId) {
        const bSnap = await db.collection('billing').doc(opData.billDocId).get();
        if (!bSnap.exists) {
          throw new Error(`Idempotency integrity error: Committed billing document "${opData.billDocId}" not found during reconciliation.`);
        }
        billDoc = bSnap.data();
        if (billDoc.operationId && billDoc.operationId !== operationId && billDoc.operationId !== opDocId) {
          throw new Error(`Idempotency integrity error: Billing document operation ID mismatch during reconciliation.`);
        }
        if (billDoc.createdBy && billDoc.createdBy !== user.uid) {
          throw new Error(`Idempotency authorization error: Billing document belongs to another user during reconciliation.`);
        }
      }

      if (opData.receiptDocId) {
        const rSnap = await db.collection('receipts').doc(opData.receiptDocId).get();
        if (!rSnap.exists) {
          throw new Error(`Idempotency integrity error: Committed receipt document "${opData.receiptDocId}" not found during reconciliation.`);
        }
        rcptDoc = rSnap.data();
        if (rcptDoc.operationId && rcptDoc.operationId !== operationId && rcptDoc.operationId !== opDocId) {
          throw new Error(`Idempotency integrity error: Receipt document operation ID mismatch during reconciliation.`);
        }
        if (rcptDoc.createdBy && rcptDoc.createdBy !== user.uid) {
          throw new Error(`Idempotency authorization error: Receipt document belongs to another user during reconciliation.`);
        }
      }

      if (opData.resDocId) {
        const resSnap = await db.collection('system').doc(opData.resDocId).get();
        if (!resSnap.exists) {
          throw new Error(`Idempotency integrity error: Committed reservation document "${opData.resDocId}" not found during reconciliation.`);
        }
        resDoc = resSnap.data();
        if (resDoc.operationId && resDoc.operationId !== operationId && resDoc.operationId !== opDocId) {
          throw new Error(`Idempotency integrity error: Reservation document operation ID mismatch during reconciliation.`);
        }
        if (resDoc.createdBy && resDoc.createdBy !== user.uid) {
          throw new Error(`Idempotency authorization error: Reservation document belongs to another user during reconciliation.`);
        }
      }

      const isVoided = !!((billDoc && billDoc.voided) || (rcptDoc && rcptDoc.voided) || (resDoc && resDoc.voided) || (resDoc && resDoc.status === 'voided'));

      return {
        committed: true,
        operationId,
        operationData: opData,
        billingRecord: billDoc,
        receiptRecord: rcptDoc,
        reservationRecord: resDoc,
        isVoided
      };
    }

    /**
     * STEP 33.12 / STEP 33.15: Unified Sequential Billing Creation & Accounting Link Strategy
     * with Durable Idempotency (DEFECT-01 fix).
     * Executes inside an atomic Cloud Firestore transaction (runTransaction).
     * 1. Atomically reads system/counters (globalSequenceCounter) and idempotency record (system/op_${opId}).
     * 2. If operation ID already committed: returns original committed result with zero counter increments.
     * 3. Enforces sequential manual allocation or sequential automatic allocation.
     * 4. Atomically writes idempotency record in system/op_${opId}.
     * 5. Atomically writes reservation document in system/res_${N}.
     * 6. Atomically creates billing document in billing/bill_${N}.
     * 7. Atomically creates linked accounting receipt in receipts/rcpt_${N} with matching numeric identifier.
     * 8. Atomically updates system/counters (globalSequenceCounter).
     */
    async function fsCreateBillingWithAccounting(billingInput) {
      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');
      const user = getCurrentFirebaseUser();
      if (!user) throw new Error('Authentication required: please log in to record bills.');

      // Mandatory Fund Validation at transaction boundary (Fail-Closed)
      if (!billingInput || typeof billingInput !== 'object') {
        throw new Error('Billing transaction rejected: Invalid billing input.');
      }
      const rawFund = billingInput.fund;
      if (rawFund === undefined || rawFund === null || typeof rawFund !== 'string' || !rawFund.trim()) {
        throw new Error('Billing transaction rejected: Mandatory registered Fund is missing or empty.');
      }
      const fund = rawFund.trim();

      let registeredFunds = [];
      try {
        registeredFunds = (typeof allFunds === 'function') ? await allFunds() : await fsGetAllSafe('funds');
      } catch (fErr) {
        throw new Error('Billing transaction rejected: Unable to verify registered funds safely. ' + (fErr.message || fErr));
      }
      if (!Array.isArray(registeredFunds) || registeredFunds.length === 0) {
        throw new Error('Billing transaction rejected: No registered funds available in master data.');
      }
      const matchedFund = registeredFunds.find(f => f && (f.name || '').trim() === fund);
      if (!matchedFund) {
        throw new Error(`Billing transaction rejected: Fund "${fund}" is invalid or not registered in master data.`);
      }
      const fundDocId = matchedFund.firestoreId || (matchedFund.id ? `fund_${matchedFund.id}` : null);
      if (!fundDocId) {
        throw new Error(`Billing transaction rejected: Master record for fund "${fund}" lacks a valid Firestore identifier.`);
      }
      const fundDocRef = db.collection('funds').doc(fundDocId);

      const counterRef = getFsCountersDocRef();
      const customBillNo = billingInput.manualBillNo || null;
      const opId = billingInput.operationId || generateOperationId('op_bill');
      const opDocId = opId.startsWith('op_') ? opId : `op_${opId}`;
      const opDocRef = db.collection('system').doc(opDocId);

      return await db.runTransaction(async (tx) => {
        // 1. Read counters, idempotency record, and registered fund inside transaction (reads before writes)
        const [cSnap, opSnap, fundSnap] = await Promise.all([
          tx.get(counterRef),
          tx.get(opDocRef),
          tx.get(fundDocRef)
        ]);

        // Idempotent retry detection: return original committed result if already recorded
        if (opSnap.exists) {
          // 1. Authenticated caller check (VULN-02 remediation)
          if (!user || !user.uid) {
            throw new Error('Authentication required: please log in to access or replay transactions.');
          }

          const opData = opSnap.data() || {};

          // 2. Schema validation on operation record
          if (!opData.operationId || !opData.status || (!opData.type && !opData.operationType) || !opData.createdBy) {
            throw new Error(`Idempotency integrity error: Operation record "${opId}" is malformed or missing required audit fields.`);
          }

          // 3. Operation type check
          if (opData.type !== 'billing_linked' && opData.operationType !== 'billing_linked') {
            throw new Error(`Idempotency conflict: Operation "${opId}" was already committed as type "${opData.type || opData.operationType}", cannot reuse for "billing".`);
          }

          // 4. Operation ID match check
          if (opData.operationId !== opId && opData.operationId !== opDocId) {
            throw new Error(`Idempotency integrity error: Stored operation ID "${opData.operationId}" does not match requested operation ID "${opId}".`);
          }

          // 5. Caller identity validation: opData.createdBy must match caller.uid (VULN-02 remediation)
          if (opData.createdBy !== user.uid) {
            throw new Error(`Idempotency authorization error: Operation "${opId}" was created by another user ("${opData.createdBy}"). Cross-user replay is strictly denied.`);
          }

          // 6. Required document ID pointers
          if (!opData.billDocId || typeof opData.billDocId !== 'string') {
            throw new Error(`Idempotency integrity error: Operation record "${opId}" has invalid or missing billDocId.`);
          }
          if (!opData.receiptDocId || typeof opData.receiptDocId !== 'string') {
            throw new Error(`Idempotency integrity error: Operation record "${opId}" has invalid or missing receiptDocId.`);
          }
          if (!opData.resDocId || typeof opData.resDocId !== 'string') {
            throw new Error(`Idempotency integrity error: Operation record "${opId}" has invalid or missing resDocId.`);
          }

          // 7. Financial fingerprint verification (GAP-01 remediation)
          const incomingFp = computeBillingFingerprint(billingInput);
          const isV2Fp = opData.fingerprint && opData.fingerprint.startsWith('v2|');
          let fpMatches = false;
          if (isV2Fp) {
            fpMatches = (opData.fingerprint === incomingFp);
          } else {
            fpMatches = (opData.fingerprint === computeBillingFingerprintV1(billingInput));
          }
          if (!fpMatches) {
            throw new Error(`Idempotency conflict: Operation "${opId}" has already been committed with different financial details. A new operation ID is required.`);
          }

          // 8. Read linked documents atomically within transaction
          const origBillRef = db.collection('billing').doc(opData.billDocId);
          const origRcptRef = db.collection('receipts').doc(opData.receiptDocId);
          const origResRef = db.collection('system').doc(opData.resDocId);
          const [origBSnap, origRSnap, origResSnap] = await Promise.all([
            tx.get(origBillRef),
            tx.get(origRcptRef),
            tx.get(origResRef)
          ]);

          // 9. Document existence verification
          if (!origBSnap.exists) {
            throw new Error(`Idempotency integrity error: Committed billing document "${opData.billDocId}" for operation "${opId}" not found.`);
          }
          if (!origRSnap.exists) {
            throw new Error(`Idempotency integrity error: Committed accounting receipt document "${opData.receiptDocId}" for operation "${opId}" not found.`);
          }
          if (!origResSnap.exists) {
            throw new Error(`Idempotency integrity error: Committed reservation document "${opData.resDocId}" for operation "${opId}" not found.`);
          }

          const bData = origBSnap.data() || {};
          const rData = origRSnap.data() || {};
          const resData = origResSnap.data() || {};

          // 10. Document ownership verification (VULN-02 remediation)
          if (bData.createdBy && bData.createdBy !== user.uid) {
            throw new Error(`Idempotency authorization error: Billing document "${opData.billDocId}" was created by another user ("${bData.createdBy}").`);
          }
          if (rData.createdBy && rData.createdBy !== user.uid) {
            throw new Error(`Idempotency authorization error: Accounting receipt document "${opData.receiptDocId}" was created by another user ("${rData.createdBy}").`);
          }
          if (resData.createdBy && resData.createdBy !== user.uid) {
            throw new Error(`Idempotency authorization error: Reservation document "${opData.resDocId}" was created by another user ("${resData.createdBy}").`);
          }

          // 11. Operation ID cross-verification on linked documents
          if (bData.operationId && bData.operationId !== opId && bData.operationId !== opDocId) {
            throw new Error(`Idempotency integrity error: Operation ID mismatch on billing document "${opData.billDocId}".`);
          }
          if (rData.operationId && rData.operationId !== opId && rData.operationId !== opDocId) {
            throw new Error(`Idempotency integrity error: Operation ID mismatch on receipt document "${opData.receiptDocId}".`);
          }
          if (resData.operationId && resData.operationId !== opId && resData.operationId !== opDocId) {
            throw new Error(`Idempotency integrity error: Operation ID mismatch on reservation document "${opData.resDocId}".`);
          }

          // 12. Sequence number consistency
          const expectedSeq = opData.seqNumber;
          if (expectedSeq !== undefined) {
            if (bData.id !== expectedSeq || rData.id !== expectedSeq || resData.seqNumber !== expectedSeq) {
              throw new Error(`Idempotency integrity error: Sequence number mismatch among linked documents for operation "${opId}" (op: ${expectedSeq}, bill: ${bData.id}, receipt: ${rData.id}, res: ${resData.seqNumber}).`);
            }
          }

          // 13. Formatted identifier consistency
          if (opData.billReceiptNo && bData.receiptNo && opData.billReceiptNo !== bData.receiptNo) {
            throw new Error(`Idempotency integrity error: Formatted bill number mismatch between operation "${opData.billReceiptNo}" and billing document "${bData.receiptNo}".`);
          }
          if (opData.accountingReceiptNo && rData.receiptNo && opData.accountingReceiptNo !== rData.receiptNo) {
            throw new Error(`Idempotency integrity error: Formatted receipt number mismatch between operation "${opData.accountingReceiptNo}" and receipt document "${rData.receiptNo}".`);
          }
          if (resData.formattedNo && opData.formattedNo && resData.formattedNo !== opData.formattedNo) {
            throw new Error(`Idempotency integrity error: Formatted sequence identifier mismatch between reservation "${resData.formattedNo}" and operation "${opData.formattedNo}".`);
          }
          if (resData.billReceiptNo && opData.billReceiptNo && resData.billReceiptNo !== opData.billReceiptNo) {
            throw new Error(`Idempotency integrity error: Formatted bill receipt identifier mismatch between reservation and operation.`);
          }
          if (resData.receiptNo && (opData.accountingReceiptNo || opData.receiptNo) && resData.receiptNo !== (opData.accountingReceiptNo || opData.receiptNo)) {
            throw new Error(`Idempotency integrity error: Formatted receipt identifier mismatch between reservation and operation.`);
          }

          // 14. Cross-document reference validation
          if (resData.billDocId && resData.billDocId !== opData.billDocId) {
            throw new Error(`Idempotency integrity error: Reservation points to billing document "${resData.billDocId}" but operation points to "${opData.billDocId}".`);
          }
          if (resData.receiptDocId && resData.receiptDocId !== opData.receiptDocId) {
            throw new Error(`Idempotency integrity error: Reservation points to receipt document "${resData.receiptDocId}" but operation points to "${opData.receiptDocId}".`);
          }
          if (bData.reservationDocId && bData.reservationDocId !== opData.resDocId) {
            throw new Error(`Idempotency integrity error: Billing document points to reservation "${bData.reservationDocId}" but operation points to "${opData.resDocId}".`);
          }
          if (rData.reservationDocId && rData.reservationDocId !== opData.resDocId) {
            throw new Error(`Idempotency integrity error: Receipt document points to reservation "${rData.reservationDocId}" but operation points to "${opData.resDocId}".`);
          }
          if (bData.accountingReceiptId && bData.accountingReceiptId !== opData.receiptDocId) {
            throw new Error(`Idempotency integrity error: Billing document points to receipt "${bData.accountingReceiptId}" but operation points to "${opData.receiptDocId}".`);
          }
          if (rData.billingFirestoreId && rData.billingFirestoreId !== opData.billDocId) {
            throw new Error(`Idempotency integrity error: Receipt document points to billing "${rData.billingFirestoreId}" but operation points to "${opData.billDocId}".`);
          }

          // 15. Void check: Ensure voided transactions are NEVER replayed or silently reactivated
          if (bData.voided || rData.voided || resData.voided || resData.status === 'voided') {
            throw new Error(`Idempotency error: Operation "${opId}" has been voided. Voided financial transactions cannot be replayed or reactivated.`);
          }

          // 16. For legacy v1 operations: verify committed document values match input to prevent altered retry
          if (!isV2Fp) {
            if (bData.date && billingInput.date && bData.date !== billingInput.date) {
              throw new Error(`Idempotency conflict: Stored billing date "${bData.date}" differs from retried date "${billingInput.date}".`);
            }
            if (bData.star && billingInput.star && bData.star !== billingInput.star) {
              throw new Error(`Idempotency conflict: Stored devotee star "${bData.star}" differs from retried star "${billingInput.star}".`);
            }
            if (bData.bankAccount && billingInput.bankAccount && bData.bankAccount !== billingInput.bankAccount) {
              throw new Error(`Idempotency conflict: Stored bank account "${bData.bankAccount}" differs from retried bank account "${billingInput.bankAccount}".`);
            }
          }

          return {
            billingRecord: bData,
            accountingReceipt: rData,
            reservationRecord: resData,
            operationRecord: opData,
            isIdempotentReplay: true,
            operationId: opId
          };
        }

        // Authoritative transaction-level fund verification (Fail-Closed)
        if (!fundSnap.exists) {
          throw new Error(`Billing transaction aborted: Fund document "${fundDocId}" for fund "${fund}" does not exist in Firestore.`);
        }
        const fundDocData = fundSnap.data() || {};
        if ((fundDocData.name || '').trim() !== fund) {
          throw new Error(`Billing transaction aborted: Stale fund master data detected for "${fund}". Master record name is "${fundDocData.name}".`);
        }

        const cData = cSnap.exists ? cSnap.data() : {};

        const curSeq = (typeof cData.globalSequenceCounter === 'number')
          ? cData.globalSequenceCounter
          : 0;

        let nextBillNum;
        if (customBillNo) {
          const parsed = parseGlobalNumber(customBillNo);
          if (!parsed) {
            throw new Error(`Invalid manual bill number format "${customBillNo}". Must be a sequential positive integer (e.g. 001, 002) or standard prefix BILL-001.`);
          }
          if (parsed <= curSeq) {
            throw new Error(`Manual bill number "${customBillNo}" (numeric: ${parsed}) has already been reserved or issued. Numbers cannot be reused.`);
          }
          if (parsed > curSeq + 1) {
            throw new Error(`Manual bill number "${customBillNo}" (numeric: ${parsed}) is out of sequence. The next required sequence number is ${formatGlobalNumber(curSeq + 1, 'BILL-')}.`);
          }
          nextBillNum = parsed;
          const resRef = db.collection('system').doc(`res_${nextBillNum}`);
          const billRef = db.collection('billing').doc(`bill_${nextBillNum}`);
          const rcptRef = db.collection('receipts').doc(`rcpt_${nextBillNum}`);
          const [resSnap, bSnap, rSnap] = await Promise.all([tx.get(resRef), tx.get(billRef), tx.get(rcptRef)]);
          if (resSnap.exists || bSnap.exists || rSnap.exists) {
            throw new Error(`Sequence number ${nextBillNum} is already reserved by another transaction.`);
          }
        } else {
          nextBillNum = curSeq + 1;
          let resRef = db.collection('system').doc(`res_${nextBillNum}`);
          let billRef = db.collection('billing').doc(`bill_${nextBillNum}`);
          let rcptRef = db.collection('receipts').doc(`rcpt_${nextBillNum}`);
          let [resSnap, bSnap, rSnap] = await Promise.all([tx.get(resRef), tx.get(billRef), tx.get(rcptRef)]);
          while (resSnap.exists || bSnap.exists || rSnap.exists) {
            nextBillNum++;
            resRef = db.collection('system').doc(`res_${nextBillNum}`);
            billRef = db.collection('billing').doc(`bill_${nextBillNum}`);
            rcptRef = db.collection('receipts').doc(`rcpt_${nextBillNum}`);
            [resSnap, bSnap, rSnap] = await Promise.all([tx.get(resRef), tx.get(billRef), tx.get(rcptRef)]);
          }
        }

        const billPrefix = cData.billingPrefix || cData.billingReceiptPrefix || 'BILL-';
        const rcptPrefix = cData.receiptPrefix || 'R-';
        const formattedNo = String(nextBillNum).padStart(3, '0');
        const formattedBillNo = `${billPrefix}${formattedNo}`;
        const formattedRcptNo = `${rcptPrefix}${formattedNo}`;

        const billDocId = `bill_${nextBillNum}`;
        const rcptDocId = `rcpt_${nextBillNum}`;
        const resDocId = `res_${nextBillNum}`;

        const billingDocRef = db.collection('billing').doc(billDocId);
        const receiptDocRef = db.collection('receipts').doc(rcptDocId);
        const resDocRef = db.collection('system').doc(resDocId);

        const isoDate = getBillingRecordISODate(billingInput) || todayISO();
        const incomeCat = (billingInput.incomeCategory !== undefined && billingInput.incomeCategory !== null)
          ? String(billingInput.incomeCategory).trim()
          : '';

        let description = String(billingInput.item || '');
        if (billingInput.quantity && billingInput.quantity > 1) {

          ? billingInput.devotees

          ? firebase.firestore.FieldValue.serverTimestamp()

          billReceiptNo: formattedBillNo,
          receiptNo: formattedRcptNo,
          operationId: opId,
          createdBy: user.uid,
          createdAt: nowTimestamp,

          reservationDocId: resDocId,

          fund: fund,

          bankAccount: billingInput.bankAccount || '',
          amount: billingInput.totalAmount,
          remarks: `Billing Receipt: ${formattedBillNo}`,

        // 6. Construct Idempotency Operation Record

        };

        // 7. Write atomically within transaction
        tx.set(counterRef, {
          globalSequenceCounter: nextBillNum,
          billingReceiptCounter: nextBillNum,
          updatedAt: serverTs
        }, { merge: true });

        tx.set(resDocRef, resPayload);
        tx.set(billingDocRef, billingPayload);
        tx.set(receiptDocRef, receiptPayload);
        tx.set(opDocRef, opPayload);

        return {
          billingRecord: billingPayload,
          accountingReceipt: receiptPayload,
          reservationRecord: resPayload,
          operationRecord: opPayload,

          operationId: opId

    /**
     * STEP 33.12 / STEP 33.15: Unified Sequential Independent Receipt Creation Strategy
     * with Durable Idempotency (DEFECT-01 fix).
     * Executes inside an atomic Cloud Firestore transaction (runTransaction).
     * 1. Atomically reads system/counters (globalSequenceCounter) and idempotency record (system/op_${opId}).
     * 2. If operation ID already committed: returns original committed result with zero counter increments.
     * 3. Enforces sequential manual allocation or sequential automatic allocation.
     * 4. Atomically writes idempotency record in system/op_${opId}.
     * 5. Atomically writes reservation document in system/res_${N}.
     * 6. Atomically creates receipt document in receipts/rcpt_${N}.
     * 7. Atomically updates system/counters (globalSequenceCounter).
     */
    /** ===================== STEP 33.69: PHYSICAL RECEIPT STORAGE & ACCOUNTING ENGINE ===================== **/
    async function fsCreatePhysicalReceipt(receiptInput) {
      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');
      const user = getCurrentFirebaseUser();
      if (!user) throw new Error('Authentication required: please log in to record physical receipts.');

      const rawIdent = receiptInput.manualReceiptNo || receiptInput.receiptNoInput || receiptInput.receiptNo || '';
      const parsed = parsePhysicalReceiptIdentifier(rawIdent);
      if (!parsed || !parsed.valid) {
        throw new Error(parsed ? parsed.error : `Invalid physical receipt identifier "${rawIdent}".`);
      }

      const physId = parsed.formattedId; // e.g. 'P600' or 'PU1'
      const physType = parsed.type; // 'P' or 'PU'
      const rcptDocId = `rcpt_phys_${physId}`;
      const physResDocId = `res_phys_${physId}`;
      const opId = receiptInput.operationId || generateOperationId('op_phys_rcpt');
      const opDocId = opId.startsWith('op_') ? opId : `op_${opId}`;

      const rcptRef = db.collection('receipts').doc(rcptDocId);
      const physResRef = db.collection('system').doc(physResDocId);
      const opDocRef = db.collection('system').doc(opDocId);

      return await db.runTransaction(async (tx) => {
        // 1. Read existing records atomically
        const [rcptSnap, resSnap, opSnap] = await Promise.all([
          tx.get(rcptRef),
          tx.get(physResRef),
          tx.get(opDocRef)
        ]);

        // 2. Idempotent retry detection
        if (opSnap.exists) {
          if (!user || !user.uid) {
            throw new Error('Authentication required: please log in to access or replay transactions.');
          }
          const opData = opSnap.data() || {};
          if (opData.type !== 'physical_receipt' && opData.operationType !== 'physical_receipt') {
            throw new Error(`Idempotency conflict: Operation "${opId}" was already committed as type "${opData.type || opData.operationType}".`);
          }
          if (opData.createdBy !== user.uid) {
            throw new Error(`Idempotency authorization error: Operation "${opId}" was created by another user ("${opData.createdBy}"). Cross-user replay is strictly denied.`);
          }
          const incomingFp = computeReceiptFingerprint({ ...receiptInput, manualReceiptNo: physId });
          if (opData.fingerprint && opData.fingerprint !== incomingFp) {
            throw new Error(`Idempotency conflict: Operation "${opId}" has already been committed with different financial details.`);
          }
          if (!rcptSnap.exists) {
            throw new Error(`Idempotency integrity error: Committed physical receipt document "${rcptDocId}" for operation "${opId}" not found.`);
          }
          const rData = rcptSnap.data() || {};
          const resData = resSnap.exists ? resSnap.data() : null;
          if (rData.voided || (resData && (resData.voided || resData.status === 'voided'))) {
            throw new Error(`Idempotency error: Physical receipt "${physId}" has been voided. Voided financial transactions cannot be replayed or reactivated.`);
          }
          return {
            receiptRecord: rData,
            reservationRecord: resSnap.exists ? resSnap.data() : null,
            operationRecord: opData,
            isIdempotentReplay: true,
            operationId: opId
          };
        }

        // 3. Duplicate check: strictly reject existing physical receipt numbers
        if (rcptSnap.exists || resSnap.exists) {
          throw new Error(`Physical receipt "${physId}" has already been entered or issued. Duplicate physical receipt numbers are strictly prohibited.`);
        }

        const nowTimestamp = Date.now();
        const serverTs = (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue)
          ? firebase.firestore.FieldValue.serverTimestamp()
          : nowTimestamp;

        const incomingFp = computeReceiptFingerprint({ ...receiptInput, manualReceiptNo: physId });

        // 4. Resolve fund and category accounting mappings
        const resolvedFund = (parsed.type === 'PU')
          ? 'Punarudharanam Fund'
          : (parsed.type === 'P' ? 'General Temple Fund' : (receiptInput.fund || parsed.fund));
        const resolvedCategory = (parsed.type === 'PU')
          ? 'Donation Income'
          : ((receiptInput.category && receiptInput.category !== 'Donation Income') ? receiptInput.category : (parsed.category || 'Pooja Income'));

        // 5. Construct physical receipt document in 'receipts' collection
        const recPayload = {
          id: rcptDocId,
          firestoreId: rcptDocId,
          legacyId: rcptDocId,
          receiptNo: physId,
          originalReceiptNo: rawIdent.trim(),
          isPhysical: true,
          physicalType: physType,
          reservationDocId: physResDocId,
          date: receiptInput.date,
          name: receiptInput.name,
          star: receiptInput.star || '',
          mobile: receiptInput.mobile || '',
          fund: resolvedFund,
          category: resolvedCategory,
          description: receiptInput.description || '',
          paymentMode: receiptInput.paymentMode || 'Cash',
          bankAccount: receiptInput.bankAccount || '',
          amount: receiptInput.amount,
          remarks: receiptInput.remarks || '',
          voided: false,
          voidReason: '',
          voidDate: '',
          source: 'physical',
          createdAt: nowTimestamp,
          createdBy: user.uid,
          createdByName: user.displayName || user.email || 'Admin',
          operationId: opId,
          financialFingerprint: incomingFp
        };

        // 6. Construct physical tracking record in 'system'
        const resPayload = {
          seqNumber: null,
          formattedNo: physId,
          physicalId: physId,
          physicalType: physType,
          type: 'physical_receipt',
          status: 'active',
          voided: false,
          billDocId: null,
          receiptDocId: rcptDocId,
          billReceiptNo: null,
          receiptNo: physId,
          amount: receiptInput.amount,
          fund: resolvedFund,
          category: resolvedCategory,
          paymentMode: receiptInput.paymentMode || 'Cash',
          createdAt: serverTs,
          createdBy: user.uid,
          operationId: opId
        };

        // 7. Construct operation audit record in 'system'
        const opPayload = {
          operationId: opId,
          type: 'physical_receipt',
          status: 'committed',
          receiptDocId: rcptDocId,
          physicalId: physId,
          receiptNo: physId,
          amount: receiptInput.amount,
          fingerprint: incomingFp,
          createdAt: serverTs,
          createdBy: user.uid
        };

        // 8. Atomic transactional write
        // ISOLATION GUARANTEE: Never modifies system/counters, never modifies billing collection!
        tx.set(rcptRef, recPayload);
        tx.set(physResRef, resPayload);
        tx.set(opDocRef, opPayload);

        return {
          receiptRecord: recPayload,
          reservationRecord: resPayload,
          operationRecord: opPayload,
          isIdempotentReplay: false,
          operationId: opId
        };
      });
    }

    async function fsCreateIndependentReceipt(receiptInput) {
      const db = getFirestoreDb();
      if (!db) throw new Error('Firestore is not initialized.');
      const user = getCurrentFirebaseUser();
      if (!user) throw new Error('Authentication required: please log in to record receipts.');

      const counterRef = getFsCountersDocRef();

      if (customRcptNo) {
        const physDelegation = parsePhysicalReceiptIdentifier(customRcptNo);
        if (physDelegation) {
          if (physDelegation.valid) {
            return await fsCreatePhysicalReceipt(receiptInput);
          } else {
            throw new Error(physDelegation.error);
          }
        }
      }
      const opId = receiptInput.operationId || generateOperationId('op_rcpt');
      const opDocId = opId.startsWith('op_') ? opId : `op_${opId}`;
      const opDocRef = db.collection('system').doc(opDocId);

      return await db.runTransaction(async (tx) => {
        // 1. Read counters and idempotency record inside transaction
        const [cSnap, opSnap] = await Promise.all([
          tx.get(counterRef),
          tx.get(opDocRef)

          if (!user || !user.uid) {

          if (!opData.operationId || !opData.status || (!opData.type && !opData.operationType) || !opData.createdBy) {
            throw new Error(`Idempotency integrity error: Operation record "${opId}" is malformed or missing required audit fields.`);
          }

          }

            receiptRecord: rData,
            reservationRecord: resData,
            operationRecord: opData,
            isIdempotentReplay: true,
            operationId: opId

        const cData = cSnap.exists ? cSnap.data() : {};

        const curSeq = (typeof cData.globalSequenceCounter === 'number')
          ? cData.globalSequenceCounter
          : 0;

        let nextSeqNum;
        if (customRcptNo) {
          const parsed = parseGlobalNumber(customRcptNo);
          if (!parsed) {
            throw new Error(`Invalid manual receipt number format "${customRcptNo}". Must be a sequential positive integer (e.g. 001, 002) or standard prefix R-001.`);
          }

          }
